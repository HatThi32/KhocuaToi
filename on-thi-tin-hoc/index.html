a sẽ ngăn truy cập."},{"t":"Nên đặt quyền chỉ đọc cho thư mục DeThi để học sinh không sửa, xoá được.","d":true,"gt":"Phân quyền chia sẻ."},{"t":"Dữ liệu từ máy học sinh đến máy giáo viên được switch chuyển dựa trên địa chỉ MAC.","d":true,"gt":"Chức năng switch."}],"id":"12CB027"},{"lop":12,"cd":"G","md":"H","dh":"chung","dang":"TF","nguon":"Tin 12 - Bài 19, 20, 21","q":"Lớp 12A tổ chức hội thảo hướng nghiệp về nhóm nghề dịch vụ và quản trị thuộc ngành CNTT.","y":[{"t":"Nên mời chuyên gia đang làm nghề để chia sẻ thực tế công việc.","d":true,"gt":"Gợi ý trong SGK Bài 21."},{"t":"Người quản trị hệ thống cần hiểu biết cả phần cứng, phần mềm và mạng.","d":true,"gt":"Quản lí toàn bộ hệ thống thông tin."},{"t":"Nghề sửa chữa, bảo trì máy tính không cần kiến thức về mạng máy tính.","d":false,"gt":"SGK nêu cần kiến thức cơ bản về mạng."},{"t":"Kĩ năng quản lí thời gian là yêu cầu với người làm sửa chữa, bảo trì.","d":true,"gt":"Hoàn thành đúng hạn theo yêu cầu khách hàng."}],"id":"12CG007"},{"lop":12,"cd":"B","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 12 KHMT - Bài 24","q":"Theo SGK, thứ tự các bước thiết kế mạng là","o":["Khảo sát hiện trạng, phân tích nhu cầu → Thiết kế logic → Thiết kế vật lí → Chọn hệ điều hành mạng","Thiết kế vật lí → Khảo sát → Thiết kế logic → Chọn hệ điều hành mạng","Chọn hệ điều hành mạng → Thiết kế logic → Thiết kế vật lí → Khảo sát","Thiết kế logic → Chọn hệ điều hành mạng → Khảo sát → Thiết kế vật lí"],"a":0,"gt":"Bốn bước trong SGK Tin 12 KHMT Bài 24.","id":"12KB024"},{"lop":12,"cd":"B","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 12 KHMT - Bài 24","q":"Một văn phòng nhỏ 8 máy, không cần quản lí tập trung tài khoản người dùng. Mô hình kiểm soát mạng phù hợp theo SGK là","o":["Mô hình làm việc nhóm (workgroup)","Mô hình miền (domain) với máy chủ điều khiển","Không cần mô hình nào","Mạng diện rộng WAN"],"a":0,"gt":"Workgroup không có máy điều khiển, phù hợp mạng nhỏ; domain quản lí tài nguyên và người dùng tập trung bởi một máy chủ.","id":"12KB025"},{"lop":12,"cd":"B","md":"H","dh":"CS","dang":"MC","nguon":"Tin 12 KHMT - Bài 24","q":"Trong bước thiết kế logic của thiết kế mạng, công việc chính là","o":["xác định cấu trúc kết nối và mô hình tương tác (workgroup hay domain) của mạng","đi dây, lắp đặt ổ cắm mạng","mua máy tính cho người dùng","cài đặt phần mềm văn phòng"],"a":0,"gt":"Thiết kế vật lí mới là bố trí đường dây, thiết bị cụ thể.","id":"12KB026"},{"lop":12,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 12 KHMT - Bài 25","q":"Hệ thống lọc thư rác học từ hàng nghìn thư đã được người dùng đánh dấu \"rác\" hoặc \"không rác\". Khi người dùng tiếp tục đánh dấu thư mới, hệ thống ngày càng lọc tốt hơn. Điều này thể hiện","o":["bản chất của học máy: cải thiện hiệu quả nhờ học từ dữ liệu mới","hệ thống dùng luật cố định do lập trình viên viết","học không giám sát vì không có nhãn","mô phỏng hiện tượng vật lí"],"a":0,"gt":"Đây là học có giám sát, dữ liệu gán nhãn liên tục bổ sung giúp mô hình tốt hơn.","id":"12KF043"},{"lop":12,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 12 KHMT - Bài 26, 27","q":"Đặc điểm nào KHÔNG phải là lí do khiến khoa học dữ liệu cần máy tính mạnh?","o":["Dữ liệu chỉ gồm vài chục dòng trong bảng tính","Khối lượng dữ liệu rất lớn","Cần tính toán song song để rút ngắn thời gian","Dữ liệu đa dạng (văn bản, hình ảnh, cảm biến) cần xử lí phức tạp"],"a":0,"gt":"Dữ liệu lớn, đa dạng, phát sinh nhanh là lí do cần năng lực tính toán cao.","id":"12KF044"},{"lop":12,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 12 KHMT - Bài 29, 30","q":"Phần mềm mô phỏng nào sau đây phù hợp nhất để học sinh quan sát cấu trúc phân tử và liên kết hoá học trong không gian ba chiều?","o":["Avogadro","GeoGebra","Gplates","HeidiSQL"],"a":0,"gt":"SGK nêu các phần mềm mô phỏng: Avogadro (hoá học, phân tử), GeoGebra (toán), Gplates (địa chất, mảng kiến tạo), PhET, Yenka.","id":"12KF045"},{"lop":12,"cd":"B","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 12 KHMT - Bài 22, 23, 24","q":"Công ty nhỏ 15 nhân viên trong một tầng nhà; không có nhân viên IT chuyên trách; cần chia sẻ máy in, tệp và Wi-Fi cho khách.","y":[{"t":"Bước đầu tiên là khảo sát hiện trạng và phân tích nhu cầu sử dụng.","d":true,"gt":"Bước 1 theo SGK."},{"t":"Mô hình workgroup phù hợp hơn domain trong trường hợp này.","d":true,"gt":"Mạng nhỏ, không cần quản lí tập trung."},{"t":"Thiết kế vật lí phải thực hiện trước khi xác định cấu trúc kết nối logic.","d":false,"gt":"Thiết kế logic trước, vật lí sau."},{"t":"Nên tách mạng Wi-Fi cho khách khỏi mạng nội bộ của nhân viên.","d":true,"gt":"Bảo vệ tài nguyên nội bộ."}],"id":"12KB027"},{"lop":12,"cd":"F","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 12 KHMT - Bài 25, 26","q":"Ứng dụng âm nhạc gom người dùng thành các nhóm có sở thích nghe nhạc giống nhau mà không biết trước có những nhóm nào, sau đó gợi ý bài hát theo nhóm.","y":[{"t":"Bước gom nhóm là bài toán phân cụm.","d":true,"gt":"Không có nhãn sẵn."},{"t":"Đây là học không giám sát.","d":true,"gt":"Tự tìm cấu trúc trong dữ liệu."},{"t":"Phải gán nhãn thể loại cho từng người dùng trước khi phân cụm.","d":false,"gt":"Phân cụm không cần nhãn."},{"t":"Dữ liệu lịch sử nghe nhạc cần được làm sạch trước khi phân tích.","d":true,"gt":"Tiền xử lí dữ liệu."}],"id":"12KF046"},{"lop":12,"cd":"B","md":"V","dh":"ICT","dang":"MC","kho":1,"nguon":"Tin 12 THUD - Bài 22","q":"Theo SGK, so với cổng VGA, cổng HDMI có ưu điểm gì khi kết nối máy tính với tivi?","o":["Truyền tín hiệu số, chất lượng cao, truyền cả hình ảnh và âm thanh trên một cáp","Chỉ truyền âm thanh","Không cần cắm điện cho tivi","Truyền được xa hàng kilômét"],"a":0,"gt":"VGA là cổng tín hiệu tương tự, chỉ hình ảnh; HDMI truyền số cả hình và tiếng.","id":"12UB019"},{"lop":12,"cd":"B","md":"V","dh":"ICT","dang":"MC","kho":1,"nguon":"Tin 12 THUD - Bài 22","q":"Hệ thống nhà thông minh: khi cảm biến cửa phát hiện mở cửa lúc 23 giờ, đèn hành lang tự bật và điện thoại chủ nhà nhận cảnh báo. Để hệ thống hoạt <script>// Khuôn câu hỏi sinh tự động. Mỗi khuôn tạo ra câu hỏi mới từ tham số ngẫu nhiên,
// tự tính đáp án và lời giải. rng: hàm trả số ngẫu nhiên trong [0,1).
(function (root) {
  function ri(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function shuffle(rng, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  // Tạo câu 4 lựa chọn: đáp án đúng ở vị trí 0, các phương án nhiễu khác nhau
  function mc(correct, distract, fill) {
    const seen = new Set([String(correct)]); const o = [String(correct)];
    for (const d of distract) { const s = String(d); if (!seen.has(s)) { seen.add(s); o.push(s); } if (o.length === 4) break; }
    let k = 1;
    while (o.length < 4) { const s = String(fill(k++)); if (!seen.has(s)) { seen.add(s); o.push(s); } }
    return { o, a: 0 };
  }
  const bin = n => n.toString(2);
  const pyList = a => "[" + a.map(x => typeof x === "string" ? "'" + x + "'" : x).join(", ") + "]";

  const G = [];

  // ---------- A. Hệ đếm ----------
  G.push({ id: "G-HEDEM", ten: "Chuyển đổi hệ đếm", lop: 10, cd: "A", md: "H", dh: "chung", dang: "MC",
    make(rng) {
      const kind = ri(rng, 0, 2);
      if (kind === 0) {
        const n = ri(rng, 37, 250), b = bin(n);
        const parts = b.split("").map((c, i) => c === "1" ? "2^" + (b.length - 1 - i) : null).filter(Boolean);
        const r = mc(n, [n + 1, n - 1, parseInt(b.split("").reverse().join(""), 2), n + 2, n - 2, n * 2], k => n + 2 + k);
        return { q: "Số nhị phân " + b + "₂ có giá trị trong hệ thập phân là", ...r,
          gt: "Cộng các lũy thừa của 2 ứng với vị trí có chữ số 1: " + parts.join(" + ") + " = " + n + "." };
      }
      if (kind === 1) {
        const n = ri(rng, 20, 200), b = bin(n);
        const flip = i => b.substring(0, i) + (b[i] === "1" ? "0" : "1") + b.substring(i + 1);
        const steps = []; let x = n; while (x > 0) { steps.push(x + " : 2 = " + Math.floor(x / 2) + " dư " + (x % 2)); x = Math.floor(x / 2); }
        const r = mc(b, [flip(b.length - 1), flip(b.length - 2), b.split("").reverse().join(""), flip(1), "1" + b], k => flip(Math.min(k + 1, b.length - 1)) + "0".repeat(k));
        return { q: "Số " + n + " trong hệ thập phân được biểu diễn trong hệ nhị phân là", ...r,
          gt: "Chia liên tiếp cho 2 rồi viết các số dư theo thứ tự ngược lại: " + steps.join("; ") + ". Đọc ngược các số dư được " + b + "₂." };
      }
      const n = ri(rng, 26, 250), h = n.toString(16).toUpperCase();
      const d1 = parseInt(h[0], 16), d0 = n % 16;
      const r = mc(n, [d1 * 10 + d0, n + 16, n - 16, parseInt(h.split("").reverse().join(""), 16), n + 1], k => n + k * 3);
      return { q: "Số " + h + "₁₆ (hệ hexa) có giá trị trong hệ thập phân là", ...r,
        gt: (h.length === 2 ? h[0] + " × 16 + " + h[1] + " (" + d1 + " × 16 + " + d0 + ")" : h) + " = " + n + ". Lưu ý A = 10, B = 11, ..., F = 15." };
    } });

  // ---------- A. Đơn vị lưu trữ, dung lượng ảnh ----------
  G.push({ id: "G-DONVI", ten: "Đơn vị lưu trữ, dung lượng ảnh", lop: 10, cd: "A", md: "V", dh: "chung", dang: "MC",
    make(rng) {

const SAMPLE_IMPORT = "Câu: Thiết bị nào dùng để kết nối các mạng khác nhau?\nA. Switch\nB. Router\nC. Card mạng\nD. Cáp mạng\nĐáp án: B\nLời giải: Router kết nối các mạng và định tuyến gói tin.\nNhãn: lớp=12; chủ đề=B; mức độ=B; định hướng=chung\n\nCâu: Cho a = [2, 5, 8]. Xét các nhận định:\na) len(a) bằng 3\nb) a[0] bằng 5\nc) a[-1] bằng 8\nd) sum(a) bằng 16\nĐáp án: Đ S Đ S\nGiải thích a) Danh sách có 3 phần tử.\nGiải thích b) a[0] = 2.\nGiải thích c) a[-1] là phần tử cuối.\nGiải thích d) 2 + 5 + 8 = 15.\nNhãn: lớp=10; chủ đề=F; mức độ=H; định hướng=chung";
function parseImport(text) {
  const blocks = text.replace(/\r/g, "").split(/\n(?=Câu\s*\d*\s*[:.])/i).map(s => s.trim()).filter(Boolean); const out = [], errs = [];
  blocks.forEach((b, bi) => {
    const lines = b.split("\n"); let qtext = [], o = [], y = [], ans = null, gt = [], ygt = {}, tag = {}; let mode = "q";
    lines.forEach((ln, li) => {
      let m;
      if (li === 0) { qtext.push(ln.replace(/^Câu\s*\d*\s*[:.]\s*/i, "")); return; }
      if ((m = ln.match(/^([A-D])[.)]\s*(.*)$/)) && mode !== "gt") { o[LET.indexOf(m[1])] = m[2]; mode = "o"; return; }
      if ((m = ln.match(/^([a-d])\)\s*(.*)$/)) && mode !== "gt") { y[ylet.indexOf(m[1])] = m[2]; mode = "y"; return; }
      if ((m = ln.match(/^Đáp án\s*:\s*(.*)$/i))) { ans = m[1].trim(); mode = "x"; return; }
      if ((m = ln.match(/^Giải thích\s*([a-d])\)\s*(.*)$/i))) { ygt[m[1]] = m[2]; mode = "x"; return; }
      if ((m = ln.match(/^(Lời giải|Hướng dẫn giải)\s*:\s*(.*)$/i))) { gt.push(m[2]); mode = "gt"; return; }
      if ((m = ln.match(/^Nhãn\s*:\s*(.*)$/i))) { m[1].split(/[;,]/).forEach(p => { const [k, v] = p.split("=").map(s => (s || "").trim().toLowerCase()); if (k && v) tag[k] = v; }); mode = "x"; return; }
      if (mode === "q") qtext.push(ln); else if (mode === "gt") gt.push(ln);
    });
    const mdMap = { b: "B", "biết": "B", h: "H", "hiểu": "H", v: "V", vd: "V", "vận dụng": "V" };
    const q = { lop: +(tag["lớp"] || tag.lop || 12), cd: (tag["chủ đề"] || tag.cd || "A").toUpperCase(), md: mdMap[tag["mức độ"] || tag.md || "b"] || "B", dh: ({ chung: "chung", cs: "CS", ict: "ICT" })[tag["định hướng"] || tag.dh || "chung"] || "chung", q: qtext.join("\n").trim() };
    if (!CD[q.cd]) q.cd = "A";
    if (y.filter(Boolean).length === 4) {
      const v = (ans || "").toUpperCase().replace(/[^ĐDS]/g, "").replace(/D/g, "Đ").split("");
      if (v.length !== 4) { errs.push("Câu " + (bi + 1) + ": đáp án đúng/sai cần 4 ký hiệu Đ hoặc S."); return; }
      q.dang = "TF"; q.y = y.map((t, i) => ({ t, d: v[i] === "Đ", gt: ygt[ylet[i]] || "" }));
    } else if (o.filter(Boolean).length === 4) {
      const a = LET.indexOf((ans || "").toUpperCase().charAt(0)); if (a < 0) { errs.push("Câu " + (bi + 1) + ": thiếu đáp án A/B/C/D."); return; }
      q.dang = "MC"; q.o = o; q.a = a; q.gt = gt.join("\n").trim();
    } else { errs.push("Câu " + (bi + 1) + ": cần đủ 4 phương án A–D hoặc 4 ý a)–d)."); return; }
    out.push(q);
  });
  return { out, errs };
}

  const tot = () => Object.values(matrix.cells).reduce((s, r) => s + (+r.B || 0) + (+r.H || 0) + (+r.V || 0), 0);
  let h = '<div class="card"><h2>Ma trận đề — Phần I</h2><p class="muted small">Ma trận theo lớp, chủ đề và mức độ (tổng 24 câu). Chọn một mẫu dựng theo đề thi thật hoặc tự chỉnh. Số trong ngoặc là số câu đang có trong ngân hàng.</p>' +
    '<div class="row"><label class="f" style="flex:1;min-width:220px">Mẫu ma trận<select id="mPreset"><option value="">— Giữ ma trận hiện tại —</option><option value="tn2026">' + esc(PRESETS.tn2026.ten) + '</option><option value="tk2025">' + esc(PRESETS.tk2025.ten) + '</option></select></label>' +
    '<label class="f" style="flex:1;min-width:220px">Tên ma trận<input id="mName" value="' + esc(matrix.ten) + '"></label></div>' +
    '<div class="scroll" style="margin-top:8px"><table class="t"><tr><th class="l">Lớp · Chủ đề</th><th>Biết</th><th>Hiểu</th><th>Vận dụng</th><th>Cộng</th></tr>';
  let lastLop = "";
  for (const key of MROWS) {
    const r = matrix.cells[key] || { B: 0, H: 0, V: 0 };
    if (key.slice(0, 2) !== lastLop) { lastLop = key.slice(0, 2); h += '<tr><th class="l" colspan="5">Lớp ' + lastLop + ' <span class="muted lopsum" data-lop="' + lastLop + '"></span></th></tr>'; }
    h += '<tr><td class="l">' + key[2] + ". " + esc(CD[key[2]]) + "</td>" + ["B", "H", "V"].map(md => '<td><input type="number" min="0" max="24" data-k="' + key + '" data-md="' + md + '" value="' + (+r[md] || 0) + '"><div class="small muted">(' + (cnt[key + md] || 0) + ")</div></td>").join("") + '<td class="rowsum"></td></tr>';
  }
  h += '<tr><th class="l">Cộng</th>' + ["B", "H", "V"].map(md => '<th class="colsum" data-md="' + md + '"></th>').join("") + '<th id="mTot"></th></tr></table></div>' +
    '<h3 style="margin-top:14px">Phần II — 6 câu đúng/sai trên đề giấy</h3><p class="small muted">Thí sinh làm 4 câu: 2 câu chung và 2 câu theo định hướng đã chọn.</p><div class="scroll"><table class="t"><tr><th>Câu</th><th>Định hướng</th><th>Lớp</th><th>Chủ đề</th></tr>' +
    matrix.tf.map((sl, i) => "<tr><td>" + (i + 1) + "</td><td>" + DH[sl.dh] + '</td><td><select data-tfl="' + i + '">' + ["*", "10", "11", "12"].map(l => '<option value="' + l + '"' + ((sl.lop || "*") === l ? " selected" : "") + ">" + (l === "*" ? "Bất kỳ" : l) + "</option>").join("") + '</select></td><td><select data-tf="' + i + '"><option value="*">Bất kỳ</option>' + Object.keys(CD).map(k => '<option value="' + k + '"' + (sl.cd === k ? " selected" : "") + ">" + k + ". " + esc(CD[k]) + "</option>").join("") + "</select></td></tr>").join("") + "</table></div>" +
    '<div class="row" style="margin-top:12px"><button class="btn pri" id="mSave">Lưu ma trận</button><button class="btn" id="mReset">Khôi phục mẫu TN THPT 2026</button></div></div>';
  h += '<div class="card"><h2>Phân tích đề — xây dựng ma trận thực nghiệm</h2><p class="muted small">Gắn nhãn các câu Phần I của đề chính thức và đề thi thử đã thu thập, mỗi dòng một câu theo dạng: <code>Tên đề, Lớp, Chủ đề, Mức độ</code> (ví dụ <code>TN2026, 12, F, H</code>; mức độ: B, H hoặc V). Hệ thống thống kê tần suất và đề xuất ma trận 24 câu theo tỉ lệ thực tế.</p>' +
    '<textarea id="aT" placeholder="TN2026,12,F,H&#10;TN2026,10,A,B&#10;DeThiThu_SoA,11,F,V">' + esc(load("analysis", "")) + '</textarea><div class="row" style="margin-top:8px"><button class="btn" id="aGo">Phân tích</button></div><div id="aOut"></div></div>';
  h += '<div class="card"><h2>Xuất đề ra Word</h2><p class="muted small">Tạo nhiều mã đề cùng lúc theo ma trận đã lưu. Tệp Word gồm: đề thi từng mã, bảng đáp án, hướng dẫn giải chi tiết, ma trận và bảng đặc tả.</p><div class="grid">' +
    '<label class="f">Số mã đề<select id="xN"><option>1</option><option selected>2</option><option>4</option><option>6</option><option>8</option></select></label><label class="f">Mã đề bắt đầu<input id="xS" type="number" value="101"></label><label class="f">Tên trường / đơn vị<input id="xSch" value="' + esc(load("school", "TRƯỜNG THPT ...")) + '"></label><label class="f">Tên kỳ thi<input id="xExam" value="' + esc(load("examname", "ĐỀ ÔN THI TỐT NGHIỆP THPT")) + '"></label></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn pri" id="xGo">Tạo và tải tệp Word</button></div><div id="xMsg"></div></div>';
  app().innerHTML = h;
  const recalc = () => {
    document.querySelectorAll("input[data-k]").forEach(inp => { const k = inp.dataset.k; matrix.cells[k] = matrix.cells[k] || { B: 0, H: 0, V: 0 }; matrix.cells[k][inp.dataset.md] = Math.max(0, +inp.value || 0); });
    document.querySelectorAll("tr").forEach(tr => { const ins = tr.querySelectorAll("input[data-k]"); if (ins.length) tr.querySelector(".rowsum").textContent = [...ins].reduce((a, x) => a + (+x.value || 0), 0); });
    document.querySelectorAll(".colsum").forEach(th => th.textContent = Object.values(matrix.cells).reduce((a, r) => a + (+r[th.dataset.md] || 0), 0));
    document.querySelectorAll(".lopsum").forEach(sp => { const n = Object.entries(matrix.cells).filter(([k]) => k.startsWith(sp.dataset.lop)).reduce((a, [, r]) => a + (+r.B || 0) + (+r.H || 0) + (+r.V || 0), 0); sp.textContent = "— " + n + " câu"; });
    const t = tot(); $("#mTot").innerHTML = t === 24 ? t : '<span style="color:var(--bad)">' + t + "</span>";
  };
  app().oninput = e => { if (e.target.dataset.k) recalc(); };
  recalc();
  $("#mPreset").onchange = e => { const p = PRESETS[e.target.value]; if (!p) return; matrix = JSON.parse(JSON.stringify(p)); save("matrix", matrix); toast("Đã áp dụng: " + p.ten); viewMatrix(); };
  document.querySelectorAll("select[data-tf]").forEach(x => x.onchange = () => { matrix.tf[+x.dataset.tf].cd = x.value; });
  document.querySelectorAll("select[data-tfl]").forEach(x => x.onchange = () => { matrix.tf[+x.dataset.tfl].lop = x.value; });
  $("#mSave").onclick = () => { matrix.ten = $("#mName").value.trim() || "Ma trận"; if (tot() !== 24) toast("Lưu ý: tổng hiện là " + tot() + " câu (đề thật có 24 câu)."); save("matrix", matrix); toast("Đã lưu ma trận."); };
  $("#mReset").onclick = () => ask("Khôi phục mẫu ma trận TN THPT 2026?", "Khôi phục", () => { matrix = JSON.parse(JSON.stringify(DEFAULT_MATRIX)); save("matrix", matrix); viewMatrix(); });
  $("#aGo").onclick = () => {
    const txt = $("#aT").value; save("analysis", txt);
    const rows = txt.split("\n").map(l => l.split(",").map(x => x.trim())).map(r => r.length === 3 ? [r[0], "12", r[1], r[2]] : r)
      .filter(r => r.length >= 4 && ["10", "11", "12"].includes(r[1]) && CD[(r[2] || "").toUpperCase()] && MD[(r[3] || "").toUpperCase()]);
    if (!rows.length) { $("#aOut").innerHTML = '<div class="note">Chưa có dòng hợp lệ.</div>'; return; }
    const des = new Set(rows.map(r => r[0])); const cnt = {};
    rows.forEach(r => { const k = r[1] + r[2].toUpperCase(); cnt[k] = cnt[k] || { B: 0, H: 0, V: 0 }; cnt[k][r[3].toUpperCase()]++; });
    const cells = []; Object.keys(cnt).forEach(k => ["B", "H", "V"].forEach(m => cells.push({ k, m, raw: cnt[k][m] / rows.length * 24 })));
    cells.forEach(c => { c.n = Math.floor(c.raw); c.rem = c.raw - c.n; });
    const left = 24 - cells.reduce((a, c) => a + c.n, 0); cells.slice().sort((a, b) => b.rem - a.rem).slice(0, left).forEach(c => c.n++);
    const prop = {}; cells.forEach(c => { prop[c.k] = prop[c.k] || { B: 0, H: 0, V: 0 }; prop[c.k][c.m] = c.n; });
    let t = '<div class="okmsg">Đã phân tích ' + rows.length + " câu từ " + des.size + ' đề.</div><div class="scroll"><table class="t"><tr><th class="l">Lớp · Chủ đề</th><th>Biết</th><th>Hiểu</th><th>Vận dụng</th><th>Tỉ lệ</th></tr>';
    Object.keys(cnt).sort().reverse().forEach(k => { const n = cnt[k].B + cnt[k].H + cnt[k].V; t += '<tr><td class="l">' + esc(rowLabel(k)) + "</td>" + ["B", "H", "V"].map(m => "<td>" + cnt[k][m] + " → <b>" + prop[k][m] + "</b></td>").join("") + "<td>" + Math.round(n / rows.length * 100) + "%</td></tr>"; });
    t += '</table></div><p class="small muted">Số bên trái: số câu thống kê được; số in đậm: số câu đề xuất trong ma trận 24 câu.</p><button class="btn pri" id="aApply">Áp dụng làm ma trận hiện hành</button>';
    $("#aOut").innerHTML = t;
    $("#aApply").onclick = () => { matrix.cells = prop; matrix.ten = "Ma trận thực nghiệm (" + des.size + " đề, " + rows.length + " câu)"; save("matrix", matrix); toast("Đã áp dụng ma trận thực nghiệm."); viewMatrix(); };
  };
  $("#xGo").onclick = async () => {
    save("school", $("#xSch").value); save("examname", $("#xExam").value);
    const n = +$("#xN").value, s = +$("#xS").value || 101; const exams = [];
    for (let i = 0; i < n; i++) exams.push(buildExam(((Date.now() + i * 7919) ^ (s + i) * 2654435761) >>> 0, s + i));
    const w = [...new Set(exams.flatMap(e => e.warn))];
    $("#xMsg").innerHTML = w.length ? '<div class="note">' + w.map(esc).join("<br>") + "</div>" : "";
    try { const blob = await buildDocx(exams, $("#xSch").value, $("#xExam").value); saveFile("De_on_thi_Tin_hoc_" + s + ".docx", blob); }
    catch (e) { toast("Lỗi khi tạo tệp Word: " + e.message); }
  };
}

// ---------- Tạo tệp DOCX ----------
function xe(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function run(t, o) { o = o || {}; return "<w:r><w:rPr>" + (o.mono ? '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:cs="Consolas"/>' : '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>') + (o.b ? "<w:b/>" : "") + (o.i ? "<w:i/>" : "") + '<w:sz w:val="' + (o.sz || (o.mono ? 22 : 26)) + '"/></w:rPr><w:t xml:space="preserve">' + xe(t) + "</w:t></w:r>"; }
function para(runs, o) { o = o || {}; return "<w:p><w:pPr>" + (o.center ? '<w:jc w:val="center"/>' : "") + '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after == null ? 60 : o.after) + '"/>' + (o.ind ? '<w:ind w:left="' + o.ind + '"/>' : "") + (o.shade ? '<w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/>' : "") + "</w:pPr>" + (Array.isArray(runs) ? runs.join("") : runs) + "</w:p>"; }
const pageBreak = '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
function richPara(text, prefix, o) {
  const parts = String(text).split("```"); let x = ""; let first = true;
  parts.forEach((p, i) => {
    if (i % 2) p.replace(/^\n/, "").replace(/\n$/, "").split("\n").forEach(l => { x += para(run(l || " ", { mono: true }), { ind: 360, shade: true, after: 0 }); });
    else p.split("\n").forEach(l => { if (!l.trim() && !(first && prefix)) return; x += para((first && prefix ? [run(prefix, { b: true })] : []).concat([run(l, o)]), { after: 40 }); first = false; });
  });
  return x;
}
function table(rows, widths) {
  const tc = (c, hdr) => '<w:tc><w:tcPr><w:tcBorders>' + ["top", "left", "bottom", "right"].map(s => "<w:" + s + ' w:val="single" w:sz="4" w:color="999999"/>').join("") + "</w:tcBorders>" + (hdr ? '<w:shd w:val="clear" w:color="auto" w:fill="E7EEF8"/>' : "") + "</w:tcPr>" + para(run(String(c), { b: hdr, sz: 22 }), { center: true, after: 0 }) + "</w:tc>";
  return '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:jc w:val="center"/></w:tblPr>' + rows.map((r, i) => "<w:tr>" + r.map(c => tc(c, i === 0)).join("") + "</w:tr>").join("") + "</w:tbl>" + para(run(""), {});
}
async function buildDocx(exams, school, examName) {
  let b = "";
  const head = e => para([run(school, { b: true })], { center: true, after: 0 }) + para([run(examName + " — MÔN TIN HỌC", { b: true, sz: 28 })], { center: true, after: 0 }) +
    para([run("Thời gian làm bài: 50 phút, không kể thời gian phát đề", { i: true })], { center: true, after: 0 }) + para([run("Mã đề " + e.ma, { b: true })], { center: true, after: 120 }) +
    para([run("Họ và tên thí sinh: ........................................................  Số báo danh: ....................")], { after: 160 });
  exams.forEach((e, ei) => {
    if (ei) b += pageBreak;
    b += head(e) + para(run("PHẦN I. Câu trắc nghiệm nhiều phương án lựa chọn. Thí sinh trả lời từ câu 1 đến câu 24. Mỗi câu hỏi thí sinh chỉ chọn một phương án.", { b: true }), { before: 60 });
    e.partI.forEach((q, i) => { b += richPara(q.q, "Câu " + (i + 1) + ". "); q.o.forEach((o, j) => b += richPara(o, LET[j] + ". ")); });
    b += para(run("PHẦN II. Câu trắc nghiệm đúng sai. Thí sinh trả lời câu 1, câu 2; sau đó chọn trả lời câu 3, câu 4 (định hướng Khoa học máy tính) hoặc câu 5, câu 6 (định hướng Tin học ứng dụng). Trong mỗi ý a), b), c), d) ở mỗi câu, thí sinh chọn đúng hoặc sai.", { b: true }), { before: 120 });
    const all = e.partII.chung.concat(e.partII.CS, e.partII.ICT);
    all.forEach((q, i) => { const lab = i < 2 ? "" : i < 4 ? " (Khoa học máy tính)" : " (Tin học ứng dụng)"; b += richPara(q.q, "Câu " + (i + 1) + lab + ". "); q.y.forEach((y, j) => b += richPara(y.t, ylet[j] + ") ")); });
    b += para(run("--- HẾT ---", { b: true }), { center: true, before: 120 });
  });
  b += pageBreak + para(run("ĐÁP ÁN", { b: true, sz: 30 }), { center: true, after: 120 });
  exams.forEach(e => {
    b += para(run("Mã đề " + e.ma, { b: true }), { before: 120 });
    const r1 = [["Câu"].concat(e.partI.slice(0, 12).map((_, i) => i + 1)), ["Đáp án"].concat(e.partI.slice(0, 12).map(q => LET[q.a]))];
    const r2 = [["Câu"].concat(e.partI.slice(12).map((_, i) => i + 13)), ["Đáp án"].concat(e.partI.slice(12).map(q => LET[q.a]))];
    b += table(r1) + (e.partI.length > 12 ? table(r2) : "");
    const all = e.partII.chung.concat(e.partII.CS, e.partII.ICT);
    b += table([["Câu", "a)", "b)", "c)", "d)"]].concat(all.map((q, i) => [(i + 1) + (i < 2 ? "" : i < 4 ? " (CS)" : " (ICT)")].concat(q.y.map(y => y.d ? "Đ" : "S")))));
  });
  b += para(run("Cách tính điểm: Phần I mỗi câu đúng 0,25 điểm. Phần II mỗi câu: đúng 1 ý 0,1 điểm; 2 ý 0,25 điểm; 3 ý 0,5 điểm; 4 ý 1 điểm.", { i: true }), {});
  b += pageBreak + para(run("HƯỚNG DẪN GIẢI CHI TIẾT", { b: true, sz: 30 }), { center: true, after: 120 });
  exams.forEach(e => {
    b += para(run("Mã đề " + e.ma, { b: true, sz: 28 }), { before: 160 });
    e.partI.forEach((q, i) => { b += richPara(q.gt || "", "Câu " + (i + 1) + " (" + LET[q.a] + "). "); });
    const all = e.partII.chung.concat(e.partII.CS, e.partII.ICT);
    all.forEach((q, i) => { b += para(run("Phần II – Câu " + (i + 1) + ":", { b: true }), { before: 60 }); q.y.forEach((y, j) => b += richPara(y.gt || "", ylet[j] + ") " + (y.d ? "Đúng" : "Sai") + ". ")); });
  });
  b += pageBreak + para(run("MA TRẬN ĐỀ — PHẦN I (" + matrix.ten + ")", { b: true, sz: 28 }), { center: true, after: 120 });
  const mrows = [["Lớp · Chủ đề", "Biết", "Hiểu", "Vận dụng", "Cộng"]]; const sum = { B: 0, H: 0, V: 0 };
  Object.keys(matrix.cells).sort().reverse().forEach(k => { const r = matrix.cells[k] || {}; const n = (+r.B || 0) + (+r.H || 0) + (+r.V || 0); if (!n) return; ["B", "H", "V"].forEach(m => sum[m] += +r[m] || 0); mrows.push([rowLabel(k), +r.B || 0, +r.H || 0, +r.V || 0, n]); });
  mrows.push(["Cộng", sum.B, sum.H, sum.V, sum.B + sum.H + sum.V]); b += table(mrows);
  b += para(run("Phần II: 6 câu đúng/sai — câu 1, 2 chung; câu 3, 4 định hướng Khoa học máy tính; câu 5, 6 định hướng Tin học ứng dụng. " + matrix.tf.map((sl, i) => "Câu " + (i + 1) + ": lớp " + (sl.lop && sl.lop !== "*" ? sl.lop : "bất kỳ") + ", chủ đề " + (sl.cd === "*" ? "bất kỳ" : sl.cd)).join("; ") + ".", {}), {});
  exams.forEach(e => {
    b += para(run("BẢNG ĐẶC TẢ — MÃ ĐỀ " + e.ma, { b: true }), { before: 200 });
    const rows = [["Câu", "Lớp", "Chủ đề", "Mức độ", "Nguồn"]];
    e.partI.forEach((q, i) => rows.push(["I." + (i + 1), q.lop, q.cd, MD[q.md], q.gen ? "Khuôn " + q.key : "Ngân hàng " + q.key]));
    e.partII.chung.concat(e.partII.CS, e.partII.ICT).forEach((q, i) => rows.push(["II." + (i + 1), q.lop, q.cd, MD[q.md] + (q.dh !== "chung" ? " (" + q.dh + ")" : ""), q.gen ? "Khuôn " + q.key : "Ngân hàng " + q.key]));
    b += table(rows);
  });
  const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + b +
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1418" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const zip = new JSZip();
  zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml", doc);
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

function viewHelp() {
