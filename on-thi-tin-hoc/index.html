<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi tốt nghiệp THPT môn Tin học</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--muted:#5b6476;--line:#e2e5eb;--pri:#1f5fbf;--pri2:#e8f0fc;--ok:#15803d;--okbg:#e9f7ee;--bad:#b42318;--badbg:#fdecea;--warn:#a15c00;--warnbg:#fff4e0;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;max-width:1100px;margin:0 auto}
.brand b{font-size:17px}.brand small{color:var(--muted)}
.brand{border-left:0}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 8px;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--muted);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri)}
nav .sep{flex:none;width:1px;background:var(--line);margin:4px 6px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 4px}h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:140px}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:#c5cbd6}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:#eef0f4;color:var(--muted);margin:0 4px 4px 0}
.tag.cd{background:var(--pri2);color:var(--pri)}
.tag.hard{background:#fdecea;color:#b42318}
.tag.gen{background:var(--warnbg);color:var(--warn)}
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-child{border-top:0}
.qh{font-weight:600;margin-bottom:6px}
.qt{margin-bottom:8px}
pre{background:#f3f5f8;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:13px/1.5 ui-monospace,Consolas,"Courier New",monospace;margin:6px 0}
code{font-family:ui-monospace,Consolas,monospace;background:#f3f5f8;padding:0 4px;border-radius:4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.opt:hover{background:#fafbfc}
.opt input{margin-top:4px}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.tf{width:100%;border-collapse:collapse;margin-top:6px}
.tf td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
.tf td.c{width:60px;text-align:center;white-space:nowrap}
.tf tr.ok td{background:var(--okbg)}.tf tr.bad td{background:var(--badbg)}
.exp{background:#f8fafc;border-left:3px solid var(--pri);padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px;font-size:14px}
.exp b{color:var(--pri)}
.verdict{font-weight:600}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.timer{position:sticky;top:96px;z-index:10;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;margin-bottom:12px}
.timer b{font-variant-numeric:tabular-nums;font-size:18px}
.score{font-size:42px;font-weight:700;color:var(--pri);line-height:1}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.t th{background:#f3f5f8;font-weight:600}
table.t td.l,table.t th.l{text-align:left}
table.t input{width:56px;padding:4px;text-align:center}
.scroll{overflow-x:auto}
.bar{height:10px;background:#eef0f4;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.bar.lo i{background:var(--bad)}.bar.mid i{background:#d08700}.bar.hi i{background:var(--ok)}
.note{background:var(--warnbg);color:#6b3d00;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
.okmsg{background:var(--okbg);color:#0f5a2b;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;box-shadow:0 6px 20px #0003}
.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:90;padding:16px}
.modal .card{max-width:720px;width:100%;max-height:90vh;overflow:auto;margin:0}
.nav-q{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.nav-q a{width:34px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font-size:13px;text-decoration:none;color:var(--ink);background:#fff}
.nav-q a.done{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.hero{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.hero .card{margin:0;cursor:pointer}.hero .card:hover{border-color:var(--pri)}
.hero .go{margin-top:10px;font-size:13px;font-weight:600;color:var(--pri)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
@media (max-width:600px){main{padding:10px}.card{padding:12px}.timer{top:92px}.score{font-size:34px}}
@media print{header,.noprint{display:none!important}.card{border:0}}
</style>
</head>
<body>
<header>
  <div class="brand"><div><b>Ôn thi tốt nghiệp THPT môn Tin học</b><br><small>Ngân hàng câu hỏi gắn nhãn · Câu hỏi sinh tự động · Tạo đề theo ma trận</small></div></div>
  <nav>
    <button data-v="home">Trang chủ</button>
    <button data-v="exam">Luyện đề</button>
    <button data-v="practice">Luyện chủ đề</button>
    <button data-v="stats">Thống kê</button>
    <span class="sep"></span>
    <button data-v="bank">Ngân hàng câu hỏi</button>
    <button data-v="matrix">Ma trận &amp; xuất đề</button>
    <button data-v="help">Hướng dẫn</button>
  </nav>
</header>
<main id="app"></main>

q:"Đơn vị nhỏ nhất dùng để đo lượng thông tin là",

gt:"Bit là đơn vị nhỏ nhất, chỉ nhận một trong hai giá trị 0 hoặc 1. Byte gồm 8 bit, Kilobyte gồm 1024 byte nên đều lớn hơn bit. Hertz là đơn vị đo tần số, không dùng để đo lượng thông tin."},
{id:"A102",lop:10,cd:"A",md:"B",dh:"chung",dang:"MC",
q:"Phát biểu nào sau đây về thông tin và dữ liệu là đúng?",
o:["Xử lý dữ liệu có thể đem lại thông tin mới","Thông tin và dữ liệu là hai khái niệm hoàn toàn giống nhau","Thông tin chỉ tồn tại dưới dạng văn bản","Máy tính xử lý thông tin mà không cần biểu diễn thành dữ liệu"],a:0,
gt:"Dữ liệu là thông tin được biểu diễn để lưu trữ và xử lý; xử lý dữ liệu (tính toán, so sánh, tổng hợp) có thể cho ra thông tin mới. Hai khái niệm có liên quan nhưng không đồng nhất. Thông tin có nhiều dạng (âm thanh, hình ảnh, văn bản...). Máy tính chỉ xử lý được thông tin sau khi đã biểu diễn thành dữ liệu số."},
{id:"A103",lop:10,cd:"A",md:"H",dh:"chung",dang:"MC",
q:"Vì sao cần dùng bảng mã Unicode thay cho bảng mã ASCII khi soạn văn bản tiếng Việt?",
o:["Unicode biểu diễn được chữ Việt có dấu và ký tự của nhiều ngôn ngữ","Unicode luôn làm tệp văn bản có dung lượng nhỏ hơn ASCII","Bảng mã ASCII không có ký tự để biểu diễn các chữ số","Unicode chỉ hoạt động được trên hệ điều hành Windows"],a:0,
gt:"ASCII chỉ có 128 ký tự (256 với ASCII mở rộng), không đủ cho chữ Việt có dấu và nhiều ngôn ngữ khác. Unicode có thể biểu diễn ký tự của hầu hết các ngôn ngữ. Tệp Unicode không nhất thiết nhỏ hơn; ASCII vẫn có chữ số; Unicode dùng trên mọi hệ điều hành."},
{id:"A104",lop:10,cd:"A",md:"B",dh:"chung",dang:"MC",
q:"Phép toán logic AND cho kết quả bằng 1 khi nào?",
o:["Cả hai toán hạng đều bằng 1","Ít nhất một toán hạng bằng 1","Hai toán hạng khác nhau","Cả hai toán hạng đều bằng 0"],a:0,
gt:"AND (và) chỉ bằng 1 khi tất cả toán hạng bằng 1. \"Ít nhất một bằng 1\" là OR; \"hai toán hạng khác nhau\" là XOR."},
{id:"A105",lop:11,cd:"A",md:"B",dh:"chung",dang:"MC",
q:"Hệ điều hành nào sau đây là phần mềm nguồn mở?",
o:["Ubuntu","Windows 11","iOS","macOS"],a:0,
gt:"Ubuntu là một bản phân phối Linux, phát hành theo giấy phép nguồn mở nên người dùng được xem và sửa mã nguồn. Windows 11, iOS và macOS là phần mềm thương mại có bản quyền, mã nguồn không công khai."},
{id:"A106",lop:11,cd:"A",md:"B",dh:"chung",dang:"MC",
q:"Chức năng chính của hệ điều hành là",
o:["Quản lý tài nguyên máy tính, tạo môi trường cho phần mềm ứng dụng chạy","Soạn thảo văn bản, tính toán bảng tính và trình chiếu","Phát hiện và tiêu diệt toàn bộ virus trên máy tính","Thiết kế và xuất bản trang web lên mạng Internet"],a:0,
gt:"Hệ điều hành quản lý CPU, bộ nhớ, thiết bị, tệp và cung cấp môi trường để phần mềm ứng dụng chạy. Soạn thảo, diệt virus, thiết kế web là việc của phần mềm ứng dụng."},
{id:"A107",lop:11,cd:"A",md:"H",dh:"chung",dang:"MC",
q:"Đặc điểm nào sau đây đúng với bộ nhớ RAM?",
o:["Dữ liệu bị mất khi tắt nguồn điện","Dữ liệu được giữ nguyên vĩnh viễn khi tắt máy","Chỉ cho phép đọc, không cho phép ghi","Là bộ nhớ ngoài như ổ cứng"],a:0,
gt:"RAM là bộ nhớ trong, cho phép đọc và ghi, nhưng dữ liệu mất khi mất điện. Giữ dữ liệu khi tắt máy và chỉ đọc là đặc điểm của ROM; ổ cứng là bộ nhớ ngoài."},
{id:"A108",lop:11,cd:"A",md:"H",dh:"chung",dang:"MC",
q:"Cổng logic nào cho đầu ra bằng 1 khi và chỉ khi hai đầu vào khác nhau?",
o:["XOR","AND","OR","NOT"],a:0,
gt:"XOR (hoặc loại trừ) bằng 1 khi hai đầu vào khác nhau (0-1 hoặc 1-0). AND bằng 1 khi cả hai bằng 1; OR bằng 1 khi có ít nhất một đầu vào bằng 1 (kể cả 1-1); NOT chỉ có một đầu vào."},
{id:"A109",lop:11,cd:"A",md:"B",dh:"chung",dang:"MC",
q:"Bộ phận nào của máy tính thực hiện tính toán và điều khiển các hoạt động?",
o:["Bộ xử lý trung tâm (CPU)","Bộ nhớ truy cập ngẫu nhiên (RAM)","Ổ đĩa cứng (HDD/SSD)","Bộ nguồn cung cấp điện (PSU)"],a:0,
gt:"CPU gồm khối tính toán số học - logic và khối điều khiển. RAM và ổ đĩa cứng dùng để lưu dữ liệu; bộ nguồn cấp điện cho các linh kiện."},
{id:"A110",lop:12,cd:"A",md:"B",dh:"chung",dang:"MC",
q:"Trí tuệ nhân tạo (AI) là",
o:["Khả năng của máy tính thực hiện các công việc mang tính trí tuệ như học, suy luận","Một loại linh kiện phần cứng giúp máy tính xử lý nhanh hơn nhiều lần","Một ngôn ngữ lập trình mới chuyên dùng để tạo các trang web","Phần mềm diệt virus có khả năng tự cập nhật cơ sở dữ liệu mẫu"],a:0,
gt:"AI là lĩnh vực nghiên cứu giúp máy tính có các khả năng trí tuệ như học, suy luận, giải quyết vấn đề, nhận thức, hiểu ngôn ngữ. AI không phải phần cứng hay một ngôn ngữ lập trình cụ thể."},
{id:"A111",lop:12,cd:"A",md:"H",dh:"chung",dang:"MC",
q:"Hệ thống nào sau đây là ví dụ của AI hẹp (AI yếu)?",
o:["Phần mềm dịch tự động văn bản từ tiếng Anh sang tiếng Việt","Máy tính bỏ túi thực hiện phép cộng","Máy giặt hẹn giờ bằng núm vặn cơ","Một hệ thống làm được mọi việc trí tuệ như con người"],a:0,
gt:"AI hẹp được thiết kế cho một nhiệm vụ cụ thể như dịch máy, nhận dạng giọng nói. Máy tính bỏ túi và máy giặt cơ chỉ làm theo quy tắc cố định, không có khả năng học. Hệ thống làm được mọi việc như con người là AI tổng quát, hiện chưa tồn tại."},
{id:"A112",lop:12,cd:"A",md:"H",dh:"chung",dang:"MC",
q:"Xe tự lái nhận biết biển báo, vạch kẻ đường và người đi bộ chủ yếu nhờ lĩnh vực nào của AI?",
o:["Thị giác máy tính","Xử lý ngôn ngữ tự nhiên","Hệ quản trị cơ sở dữ liệu","Soạn thảo văn bản"],a:0,
gt:"Thị giác máy tính giúp máy \"nhìn\" và hiểu hình ảnh, video từ camera. Xử lý ngôn ngữ tự nhiên dùng cho văn bản, lời nói; hệ quản trị CSDL và soạn thảo văn bản không phải lĩnh vực của AI."},
{id:"A113",lop:12,cd:"A",md:"V",dh:"chung",dang:"MC",
q:"Lan nhận cuộc gọi video, hình ảnh và giọng nói giống hệt mẹ, nhờ chuyển gấp 20 triệu đồng vào một số tài khoản lạ. Cách xử lý phù hợp nhất là",
o:["Tạm dừng, gọi lại cho mẹ bằng số điện thoại quen thuộc để xác minh trước khi làm gì","Chuyển tiền ngay vì đã thấy rõ khuôn mặt và giọng nói của mẹ","Chuyển trước một nửa số tiền cho an toàn","Đăng thông tin tài khoản ngân hàng của mình lên mạng để mẹ dễ kiểm tra"],a:0,
gt:"Công nghệ deepfake dùng AI có thể giả mạo khuôn mặt và giọng nói rất giống thật. Cách an toàn là xác minh qua một kênh khác đáng tin cậy. Chuyển tiền (dù một phần) hay công khai thông tin tài khoản đều tạo cơ hội cho kẻ lừa đảo."},
{id:"A114",lop:12,cd:"A",md:"B",dh:"chung",dang:"MC",
q:"Khả năng nào sau đây KHÔNG phải là đặc trưng cơ bản của trí tuệ nhân tạo?",
o:["Lưu trữ được dung lượng dữ liệu rất lớn","Khả năng học từ dữ liệu và kinh nghiệm","Khả năng suy luận để đưa ra kết luận","Khả năng hiểu và xử lý ngôn ngữ tự nhiên"],a:0,
gt:"Học, suy luận, nhận thức, hiểu ngôn ngữ, giải quyết vấn đề là các đặc trưng của AI. Lưu trữ dữ liệu lớn là khả năng của thiết bị lưu trữ, một máy không có AI vẫn làm được."},
// ===================== CHỦ ĐỀ B =====================
{id:"B101",lop:10,cd:"B",md:"B",dh:"chung",dang:"MC",
q:"Internet vạn vật (IoT) là",
o:["Mạng kết nối các đồ vật có gắn cảm biến để thu thập, trao đổi dữ liệu qua Internet","Mạng nội bộ chỉ dùng để kết nối các máy tính để bàn trong một phòng","Phần mềm diệt virus dành riêng cho các thiết bị kết nối Internet","Loại cáp quang tốc độ cao dùng để truyền dữ liệu đi xa"],a:0,
gt:"IoT kết nối đồ vật (camera, cảm biến nhiệt độ, đồng hồ thông minh...) với Internet để thu thập, trao đổi dữ liệu và điều khiển từ xa. Nó không giới hạn ở máy tính và không phải phần mềm hay loại cáp."},
{id:"B102",lop:10,cd:"B",md:"H",dh:"chung",dang:"MC",
q:"Việc nào sau đây là sử dụng dịch vụ điện toán đám mây?",
o:["Lưu bài làm lên Google Drive để mở ở nhà và ở trường","Chép tệp từ máy tính sang USB","In bài làm bằng máy in nối trực tiếp với máy tính","Cài phần mềm soạn thảo vào ổ cứng"],a:0,
gt:"Điện toán đám mây cung cấp tài nguyên (lưu trữ, phần mềm, máy chủ) qua Internet. Google Drive lưu dữ liệu trên máy chủ của nhà cung cấp. Các lựa chọn còn lại chỉ dùng thiết bị cục bộ."},
{id:"B103",lop:12,cd:"B",md:"B",dh:"chung",dang:"MC",
q:"Thiết bị nào dùng để kết nối các mạng khác nhau và chọn đường đi cho gói tin?",
o:["Router (bộ định tuyến)","Switch (bộ chuyển mạch)","Card mạng","Cáp mạng"],a:0,
gt:"Router kết nối các mạng (ví dụ mạng LAN của trường với Internet) và định tuyến gói tin. Switch chỉ kết nối các thiết bị trong cùng một mạng LAN; card mạng và cáp mạng là thành phần kết nối của từng máy."},
{id:"B104",lop:12,cd:"B",md:"B",dh:"chung",dang:"MC",
q:"Trong mạng LAN, thiết bị nào nhận dữ liệu và chuyển đến đúng máy đích dựa vào địa chỉ MAC?",
o:["Switch","Modem","Router không dây dùng làm điểm phát sóng","Máy in mạng"],a:0,
gt:"Switch học địa chỉ MAC của các máy nối vào cổng của nó và chỉ chuyển khung dữ liệu tới cổng có máy đích. Modem chuyển đổi tín hiệu với nhà mạng; máy in là thiết bị đầu cuối."},
{id:"B105",lop:12,cd:"B",md:"B",dh:"chung",dang:"MC",
q:"Thiết bị nào phát sóng Wi-Fi để điện thoại, máy tính xách tay kết nối không dây vào mạng có dây?",
o:["Điểm truy cập không dây (Access Point)","Bộ chuyển mạch (Switch) có nhiều cổng mạng","Bộ lưu điện (UPS) cấp điện dự phòng","Ổ cứng mạng (NAS) dùng chung trong mạng"],a:0,
gt:"Access Point là cầu nối giữa thiết bị không dây và mạng có dây. Switch không phát Wi-Fi; UPS cấp điện dự phòng; ổ cứng mạng để lưu trữ."},
{id:"B106",lop:12,cd:"B",md:"H",dh:"chung",dang:"MC",
q:"Vai trò của modem trong kết nối Internet của gia đình là",
o:["Chuyển đổi giữa tín hiệu số và tín hiệu trên đường truyền của nhà mạng","Lưu trữ lại các trang web đã truy cập để mở nhanh hơn","Ngăn chặn mọi loại virus và mã độc từ Internet","Tăng tốc độ xử lý của bộ vi xử lý trong máy tính"],a:0,
gt:"Modem (điều chế - giải điều chế) chuyển tín hiệu số thành tín hiệu phù hợp đường truyền (cáp quang, cáp đồng...) và ngược lại. Modem không lưu trang web, không diệt virus và không ảnh hưởng tốc độ CPU."},
{id:"B107",lop:12,cd:"B",md:"B",dh:"chung",dang:"MC",
q:"Giao thức mạng là",
o:["Tập hợp các quy tắc để các thiết bị trao đổi dữ liệu với nhau","Một loại dây cáp dùng để nối các máy tính với nhau","Tên gọi của nhà cung cấp dịch vụ Internet","Phần mềm dùng để duyệt và hiển thị trang web"],a:0,
gt:"Giao thức quy định khuôn dạng, thứ tự và cách xử lý dữ liệu khi trao đổi (ví dụ TCP/IP, HTTP). Đây không phải thiết bị, tên nhà mạng hay phần mềm cụ thể."},
{id:"B108",lop:12,cd:"B",md:"H",dh:"chung",dang:"MC",
q:"Hệ thống tên miền (DNS) có chức năng",
o:["Chuyển tên miền như thpt.edu.vn thành địa chỉ IP tương ứng","Mã hóa toàn bộ dữ liệu được truyền đi trên mạng","Cấp phát điện năng cho các thiết bị mạng","Nén dữ liệu trước khi gửi để tiết kiệm băng thông"],a:0,
gt:"Máy tính liên lạc với nhau bằng địa chỉ IP; DNS giúp người dùng chỉ cần nhớ tên miền, còn hệ thống tự tra ra địa chỉ IP. DNS không mã hóa, cấp điện hay nén dữ liệu."},
{id:"B109",lop:12,cd:"B",md:"H",dh:"chung",dang:"MC",
q:"Trong bộ giao thức TCP/IP, giao thức nào đảm bảo dữ liệu đến nơi đầy đủ và đúng thứ tự?",
o:["TCP","IP","HTML","DNS"],a:0,
gt:"TCP chia dữ liệu thành gói, đánh số thứ tự, yêu cầu gửi lại gói bị mất và ghép lại đúng thứ tự. IP lo việc đánh địa chỉ và định tuyến gói tin. HTML là ngôn ngữ đánh dấu trang web; DNS phân giải tên miền."},
{id:"B110",lop:12,cd:"B",md:"B",dh:"chung",dang:"MC",
q:"Một địa chỉ IPv4 có độ dài bao nhiêu bit?",
o:["32 bit","16 bit","48 bit","128 bit"],a:0,
gt:"IPv4 gồm 32 bit, viết thành 4 số thập phân (mỗi số 8 bit) ngăn cách bởi dấu chấm. 48 bit là độ dài địa chỉ MAC; 128 bit là độ dài địa chỉ IPv6."},
{id:"B111",lop:12,cd:"B",md:"V",dh:"chung",dang:"MC",
q:"Máy của Nam vẫn kết nối mạng LAN, lệnh ping tới địa chỉ IP 8.8.8.8 thành công nhưng gõ tên trang web vào trình duyệt thì báo không tìm thấy máy chủ. Nguyên nhân có khả năng nhất là",
o:["Máy chưa cấu hình đúng máy chủ DNS","Cáp mạng nối vào máy bị đứt hoặc lỏng","Card mạng của máy bị hỏng hoàn toàn","Router của trường đã bị tắt nguồn"],a:0,
gt:"Ping tới một địa chỉ IP ngoài Internet thành công nghĩa là cáp, card mạng, router và đường truyền vẫn hoạt động. Không truy cập được bằng tên miền chứng tỏ khâu phân giải tên miền (DNS) gặp lỗi."},
{id:"B112",lop:12,cd:"B",md:"H",dh:"chung",dang:"MC",
q:"Phát biểu nào đúng về địa chỉ MAC?",
o:["Là địa chỉ vật lý gắn với card mạng, dài 48 bit","Được cấp mới mỗi lần máy kết nối Internet","Là tên miền của trang web","Dùng để định tuyến gói tin giữa các quốc gia"],a:0,
gt:"Địa chỉ MAC do nhà sản xuất gán cho card mạng, dài 48 bit, thường viết dạng 6 cặp số hexa. Địa chỉ được cấp khi kết nối là địa chỉ IP; định tuyến giữa các mạng dựa vào địa chỉ IP."},
// ===================== CHỦ ĐỀ C =====================
{id:"C101",lop:11,cd:"C",md:"B",dh:"chung",dang:"MC",
q:"Ưu điểm nổi bật của lưu trữ trực tuyến (lưu trữ đám mây) là",
o:["Truy cập, chia sẻ dữ liệu từ nhiều thiết bị ở nơi có Internet","Tài khoản không cần đặt mật khẩu bảo vệ dữ liệu","Truy cập được cả khi không có Internet và chưa đồng bộ","Dung lượng lưu trữ miễn phí không giới hạn"],a:0,
gt:"Lưu trữ đám mây cho phép truy cập, đồng bộ và chia sẻ dữ liệu qua Internet. Tài khoản luôn cần bảo mật bằng mật khẩu; tệp chưa đồng bộ cần Internet để truy cập; dung lượng miễn phí thường có giới hạn."},
{id:"C102",lop:11,cd:"C",md:"H",dh:"chung",dang:"MC",
q:"Để máy tìm kiếm trả về các trang chứa chính xác cụm từ \"chuyển đổi số\", em nên",
o:["Đặt cụm từ trong dấu nháy kép: \"chuyển đổi số\"","Viết toàn bộ cụm từ bằng chữ in hoa: CHUYỂN ĐỔI SỐ","Thêm dấu chấm than ở cuối cụm từ: chuyển đổi số!","Viết các từ cách nhau bằng dấu phẩy: chuyển, đổi, số"],a:0,
gt:"Dấu nháy kép yêu cầu máy tìm kiếm khớp chính xác cả cụm từ theo đúng thứ tự. Chữ hoa không làm thay đổi kết quả; dấu chấm than hay dấu phẩy không có tác dụng tìm chính xác."},
{id:"C103",lop:11,cd:"C",md:"H",dh:"chung",dang:"MC",
q:"Để chỉ tìm thông tin tuyển sinh trong trang web moet.gov.vn, em gõ vào máy tìm kiếm",
o:["tuyển sinh site:moet.gov.vn","tuyển sinh + moet.gov.vn","tuyển sinh link moet.gov.vn","site tuyển sinh moet.gov.vn"],a:0,
gt:"Toán tử site: giới hạn kết quả trong một tên miền. Cú pháp đúng là \"từ khóa site:tênmiền\", không có khoảng trắng sau dấu hai chấm. Các cách viết còn lại máy tìm kiếm chỉ coi là từ khóa thông thường."},
{id:"C104",lop:11,cd:"C",md:"B",dh:"chung",dang:"MC",
q:"Khi gửi thư điện tử, địa chỉ đặt ở ô BCC có đặc điểm gì?",
o:["Người đó nhận được thư nhưng người nhận khác không thấy địa chỉ này","Người đó không nhận được thư, chỉ người gửi giữ bản sao","Người đó bắt buộc phải trả lời thư cho tất cả mọi người","Thư gửi tới địa chỉ đó sẽ được mã hóa để bảo mật"],a:0,
gt:"BCC (Blind Carbon Copy) là gửi bản sao ẩn: người trong BCC vẫn nhận thư nhưng địa chỉ của họ bị ẩn với người nhận khác. BCC không liên quan đến việc bắt buộc trả lời hay mã hóa."},
{id:"C105",lop:11,cd:"C",md:"H",dh:"chung",dang:"MC",
q:"An chia sẻ một tệp trên Google Drive cho Bình với quyền \"Người xem\". Khi đó Bình",
o:["Mở và đọc được tệp nhưng không chỉnh sửa được","Chỉnh sửa và xóa được tệp","Không mở được tệp","Đổi được quyền chia sẻ của tệp cho người khác"],a:0,
gt:"Quyền \"Người xem\" chỉ cho xem nội dung. Muốn chỉnh sửa cần quyền \"Người chỉnh sửa\"; chỉ chủ sở hữu (hoặc người được cho phép) mới thay đổi quyền chia sẻ."},
// ===================== CHỦ ĐỀ D =====================
{id:"D101",lop:10,cd:"D",md:"B",dh:"chung",dang:"MC",
q:"Hành vi nào sau đây vi phạm bản quyền?",
o:["Sao chép phần mềm có bản quyền rồi bán lại cho người khác","Sử dụng phần mềm nguồn mở theo đúng giấy phép","Trích dẫn tài liệu có ghi rõ nguồn","Mua bản quyền phần mềm để sử dụng"],a:0,
gt:"Sao chép và kinh doanh phần mềm khi chưa được chủ sở hữu cho phép là vi phạm quyền tác giả. Các hành vi còn lại đều tôn trọng quyền của tác giả."},
{id:"D102",lop:10,cd:"D",md:"H",dh:"chung",dang:"MC",
q:"Với phần mềm nguồn mở, người dùng thường được phép",
o:["Xem, sửa đổi mã nguồn và phân phối lại theo điều khoản của giấy phép","Bỏ tên tác giả và đăng ký bản quyền cho mình","Sử dụng mà không phải tuân theo bất kỳ điều kiện nào","Chỉ được dùng thử miễn phí trong thời hạn 30 ngày"],a:0,
gt:"Phần mềm nguồn mở công khai mã nguồn và cho phép sửa, phân phối lại nhưng vẫn phải tuân theo giấy phép (ví dụ giữ thông tin tác giả). Dùng thử có thời hạn là đặc điểm của phần mềm dùng thử (trial)."},
{id:"D103",lop:11,cd:"D",md:"V",dh:"chung",dang:"MC",
q:"Hoa nhận tin nhắn: \"Tài khoản ngân hàng của bạn sắp bị khóa, hãy nhấn vào liên kết sau và nhập mật khẩu, mã OTP để xác minh\". Hoa nên làm gì?",
o:["Không nhấn liên kết, liên hệ ngân hàng qua tổng đài hoặc ứng dụng chính thức","Nhấn liên kết và nhập thông tin thật nhanh để tài khoản không bị khóa","Chuyển tiếp tin nhắn cho bạn bè để nhờ họ nhập thông tin giúp","Trả lời tin nhắn kèm số tài khoản và mã OTP để được hỗ trợ"],a:0,
gt:"Đây là dấu hiệu lừa đảo giả mạo (phishing): tạo cảm giác gấp gáp và đòi mật khẩu, mã OTP. Ngân hàng không bao giờ yêu cầu cung cấp OTP qua liên kết lạ. Cần xác minh qua kênh chính thức."},
{id:"D104",lop:12,cd:"D",md:"H",dh:"chung",dang:"MC",
q:"Phát biểu nào đúng về \"dấu chân số\" khi tham gia mạng xã hội?",
o:["Những gì đã đăng lên mạng có thể tồn tại lâu dài và khó xóa hoàn toàn","Bài đăng sẽ tự động biến mất hoàn toàn sau 24 giờ","Chỉ bạn bè trong danh sách mới có thể lưu lại bài đăng","Xóa tài khoản là xóa sạch mọi dấu vết đã đăng"],a:0,
gt:"Thông tin trên mạng có thể bị người khác chụp màn hình, chia sẻ, lưu bộ nhớ đệm nên rất khó xóa hoàn toàn. Vì vậy cần cân nhắc trước khi đăng."},
{id:"D105",lop:12,cd:"D",md:"V",dh:"chung",dang:"MC",
q:"Minh liên tục nhận bình luận chế giễu, đe dọa từ một tài khoản lạ trên mạng xã hội. Cách xử lý phù hợp là",
o:["Lưu bằng chứng, chặn và báo cáo tài khoản, kể với thầy cô hoặc cha mẹ","Đăng bài đáp trả thật gay gắt để mọi người thấy mình không sợ","Im lặng chịu đựng, không kể với ai để tránh phiền phức","Lập một tài khoản giả khác để trả đũa lại người đó"],a:0,
gt:"Khi bị bắt nạt trên mạng cần giữ bằng chứng, dùng chức năng chặn và báo cáo, đồng thời tìm sự hỗ trợ của người lớn đáng tin cậy. Đáp trả hay trả đũa có thể làm sự việc nghiêm trọng hơn."},
{id:"D106",lop:12,cd:"D",md:"B",dh:"chung",dang:"MC",
q:"Mật khẩu nào sau đây mạnh nhất?",
o:["Tr@nPhu#26!x","12345678abc","NguyenVanAn2008","matkhau123"],a:0,
gt:"Mật khẩu mạnh nên dài, kết hợp chữ hoa, chữ thường, chữ số và ký hiệu đặc biệt, không dùng thông tin dễ đoán như tên, năm sinh hay dãy số liên tiếp."},
{id:"D107",lop:11,cd:"D",md:"H",dh:"chung",dang:"MC",
q:"Hành vi nào sau đây vi phạm pháp luật khi sử dụng mạng?",
o:["Đăng tải thông tin sai sự thật, xúc phạm danh dự người khác","Chia sẻ bài viết học tập của thầy cô có ghi rõ nguồn","Báo cáo với nền tảng tài khoản có dấu hiệu lừa đảo","Dùng mật khẩu mạnh và khác nhau cho từng tài khoản"],a:0,
gt:"Pháp luật Việt Nam (Luật An ninh mạng, Bộ luật Dân sự...) nghiêm cấm đưa thông tin sai sự thật, xúc phạm danh dự, nhân phẩm người khác. Các hành vi còn lại là sử dụng mạng có trách nhiệm."},
{id:"D108",lop:12,cd:"D",md:"H",dh:"chung",dang:"MC",
q:"Bật xác thực hai yếu tố (2FA) cho tài khoản giúp",
o:["Kẻ gian biết mật khẩu vẫn khó đăng nhập vì cần thêm mã","Người dùng không cần đặt mật khẩu cho tài khoản nữa","Tài khoản sẽ không bao giờ nhận được thư rác","Tốc độ đăng nhập vào tài khoản nhanh hơn hai lần"],a:0,
gt:"2FA yêu cầu thêm một yếu tố (mã OTP, ứng dụng xác thực...) ngoài mật khẩu, nên lộ mật khẩu chưa đủ để chiếm tài khoản. 2FA không thay thế mật khẩu và không liên quan đến thư rác."},
// ===================== CHỦ ĐỀ E =====================
{id:"E101",lop:10,cd:"E",md:"B",dh:"chung",dang:"MC",
q:"Đặc điểm của ảnh vector (đồ họa vector) là",
o:["Phóng to nhiều lần mà không bị vỡ hình","Được tạo thành từ lưới các điểm ảnh","Chỉ có hai màu đen và trắng","Luôn có dung lượng lớn hơn ảnh chụp"],a:0,
gt:"Ảnh vector được mô tả bằng đối tượng hình học (đường, hình, đường cong) nên phóng to không bị vỡ. Lưới điểm ảnh là đặc điểm của ảnh bitmap. Ảnh vector có thể nhiều màu và thường có dung lượng nhỏ."},
{id:"E102",lop:10,cd:"E",md:"H",dh:"chung",dang:"MC",
q:"Thiết kế một logo cần in ở nhiều kích thước khác nhau, từ huy hiệu đến băng rôn, nên dùng phần mềm nào?",
o:["Inkscape (phần mềm đồ họa vector)","Paint (chỉnh sửa ảnh điểm ảnh đơn giản)","Notepad","Phần mềm nghe nhạc"],a:0,
gt:"Logo cần phóng to, thu nhỏ mà vẫn sắc nét nên vẽ bằng đồ họa vector như Inkscape. Paint làm việc với ảnh bitmap nên phóng to sẽ vỡ hình; Notepad và phần mềm nghe nhạc không dùng để thiết kế."},
{id:"E103",lop:10,cd:"E",md:"H",dh:"chung",dang:"MC",
q:"Định dạng ảnh nào sau đây là định dạng đồ họa vector?",
o:["SVG","JPEG","PNG","BMP"],a:0,
gt:"SVG (Scalable Vector Graphics) là định dạng vector, cũng là định dạng mặc định của Inkscape. JPEG, PNG, BMP đều là định dạng ảnh bitmap."},
{id:"E104",lop:11,cd:"E",md:"B",dh:"ICT",dang:"MC",
q:"Trong phần mềm chỉnh sửa ảnh, lớp (layer) giúp người dùng",
o:["Chỉnh sửa từng thành phần của ảnh mà không ảnh hưởng thành phần khác","Tăng độ phân giải thực của ảnh chụp từ máy ảnh","Nén ảnh thành tệp có dung lượng nhỏ hơn nhiều","Chuyển một ảnh tĩnh thành đoạn video ngắn"],a:0,
gt:"Mỗi lớp như một tấm trong suốt chồng lên nhau; sửa một lớp không làm thay đổi các lớp khác. Layer không thay đổi độ phân giải của máy ảnh và không dùng để nén hay chuyển định dạng."},
{id:"E105",lop:11,cd:"E",md:"B",dh:"ICT",dang:"MC",
q:"Trong phần mềm làm video, dòng thời gian (timeline) dùng để",
o:["Sắp xếp các đoạn video, hình ảnh, âm thanh theo thứ tự thời gian","Đếm số lượt người xem video sau khi đăng tải","Ghi âm lời bình trực tiếp từ micro của máy tính","Tải video đã hoàn thành lên mạng xã hội"],a:0,
gt:"Timeline là nơi đặt và sắp xếp các tư liệu theo thời gian, cắt ghép và chồng các track hình, tiếng. Các việc còn lại không phải chức năng của timeline."},
// ===================== CHỦ ĐỀ F - PYTHON (lớp 10) =====================
{id:"F101",lop:10,cd:"F",md:"B",dh:"chung",dang:"MC",
q:"Trong Python, hàm nào dùng để nhập dữ liệu từ bàn phím?",
o:["input()","print()","len()","range()"],a:0,
gt:"input() đọc dữ liệu người dùng gõ vào. print() in ra màn hình; len() trả về độ dài; range() tạo dãy số."},
{id:"F102",lop:10,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Cho đoạn chương trình:\n```\nn = input()\nprint(n + n)\n```\nNếu người dùng nhập 5 thì kết quả in ra là",
o:["55","10","5","Chương trình báo lỗi"],a:0,
gt:"input() luôn trả về xâu ký tự, nên n = \"5\". Phép + giữa hai xâu là ghép xâu: \"5\" + \"5\" = \"55\". Muốn được 10 phải viết n = int(input())."},
{id:"F103",lop:10,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Biểu thức 17 // 5 và 17 % 5 trong Python lần lượt có giá trị là",
o:["3 và 2","3.4 và 2","2 và 3","3 và 3.4"],a:0,
gt:"// là phép chia lấy phần nguyên: 17 // 5 = 3. % là phép chia lấy phần dư: 17 = 5 × 3 + 2 nên 17 % 5 = 2. 3.4 là kết quả của phép chia thường 17 / 5."},
{id:"F104",lop:10,cd:"F",md:"B",dh:"chung",dang:"MC",
q:"Tên biến nào sau đây hợp lệ trong Python?",
o:["so_hs","2lop","so-hs","for"],a:0,
gt:"Tên biến gồm chữ cái, chữ số, dấu gạch dưới và không bắt đầu bằng chữ số. \"2lop\" bắt đầu bằng số; \"so-hs\" chứa dấu trừ; \"for\" là từ khóa của Python."},
{id:"F105",lop:10,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Cho đoạn chương trình:\n```\ndef tong(a, b=2):\n    return a + b\nprint(tong(3) + tong(1, 4))\n```\nKết quả in ra là",
o:["10","9","5","Chương trình báo lỗi"],a:0,
gt:"tong(3) dùng giá trị mặc định b = 2 nên bằng 5; tong(1, 4) = 5. Tổng là 5 + 5 = 10."},
{id:"F106",lop:10,cd:"F",md:"V",dh:"chung",dang:"MC",
q:"Chương trình sau báo lỗi:\n```\nx = int(input())\nif x > 0\n    print(\"Số dương\")\n```\nCần sửa như thế nào?",
o:["Thêm dấu hai chấm sau điều kiện: if x > 0:","Đổi int thành float ở dòng thứ nhất","Bỏ thụt lề ở dòng lệnh print","Đổi dấu > thành dấu = trong điều kiện"],a:0,
gt:"Câu lệnh if trong Python phải kết thúc bằng dấu hai chấm. Thiếu dấu \":\" gây lỗi cú pháp (SyntaxError). Bỏ thụt lề sẽ gây thêm lỗi; đổi \">\" thành \"=\" là sai cú pháp so sánh."},
{id:"F107",lop:10,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Lệnh range(1, 10, 3) tạo ra dãy số nào?",
o:["1, 4, 7","1, 4, 7, 10","1, 3, 6, 9","3, 6, 9"],a:0,
gt:"range(start, stop, step) bắt đầu từ start, tăng step và dừng trước stop. Từ 1, tăng 3: 1, 4, 7; số tiếp theo là 10 không được lấy vì range không bao gồm giá trị stop."},
// ===================== CHỦ ĐỀ F - CSDL (lớp 11) =====================
{id:"F201",lop:11,cd:"F",md:"B",dh:"chung",dang:"MC",
q:"Khóa chính của một bảng trong cơ sở dữ liệu quan hệ là",
o:["Trường (hoặc nhóm trường) có giá trị xác định duy nhất mỗi bản ghi","Trường luôn được đặt ở vị trí đầu tiên của bảng","Trường bắt buộc phải có kiểu dữ liệu số nguyên","Trường được phép để trống khi nhập dữ liệu"],a:0,
gt:"Khóa chính phải có giá trị không trùng lặp và không để trống, dùng để phân biệt các bản ghi. Khóa chính không bắt buộc là trường đầu tiên hay có kiểu số."},
{id:"F202",lop:11,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Khóa ngoài (khóa ngoại) dùng để",
o:["Liên kết bảng này với khóa chính của một bảng khác","Mã hóa dữ liệu trong bảng để bảo mật","Sắp xếp các bản ghi của bảng tăng dần","Đặt mật khẩu bảo vệ cho cơ sở dữ liệu"],a:0,
gt:"Khóa ngoài là trường trong một bảng tham chiếu tới khóa chính của bảng khác, tạo liên kết giữa các bảng và đảm bảo tính toàn vẹn dữ liệu."},
{id:"F203",lop:11,cd:"F",md:"B",dh:"chung",dang:"MC",
q:"Phần mềm nào sau đây là hệ quản trị cơ sở dữ liệu?",
o:["MySQL","Microsoft Word","Inkscape","Google Chrome"],a:0,
gt:"MySQL là hệ quản trị cơ sở dữ liệu quan hệ. Word là phần mềm soạn thảo, Inkscape là phần mềm đồ họa, Chrome là trình duyệt web."},
{id:"F204",lop:11,cd:"F",md:"B",dh:"chung",dang:"MC",
q:"Câu lệnh SQL nào dùng để truy xuất (lấy) dữ liệu từ bảng?",
o:["SELECT","INSERT","UPDATE","DELETE"],a:0,
gt:"SELECT dùng để truy vấn dữ liệu. INSERT thêm bản ghi; UPDATE sửa dữ liệu; DELETE xóa bản ghi."},
{id:"F205",lop:11,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Bảng HOCSINH(MaHS, HoTen, NgaySinh, Lop). Trường nào thích hợp nhất để làm khóa chính?",
o:["MaHS","HoTen","NgaySinh","Lop"],a:0,
gt:"Mỗi học sinh có một mã riêng không trùng lặp. Họ tên và ngày sinh có thể trùng giữa các học sinh; nhiều học sinh học cùng một lớp."},
{id:"F206",lop:11,cd:"F",md:"V",dh:"chung",dang:"MC",
q:"Thực hiện câu lệnh sau trên bảng HOCSINH có 40 bản ghi:\n```\nUPDATE HOCSINH SET Lop = '12A1';\n```\nKết quả là",
o:["Tất cả 40 học sinh đều được chuyển sang lớp 12A1","Chỉ học sinh ở bản ghi đầu tiên được đổi lớp","Không có bản ghi nào bị thay đổi dữ liệu","Câu lệnh báo lỗi cú pháp vì thiếu mệnh đề WHERE"],a:0,
gt:"UPDATE không có mệnh đề WHERE sẽ áp dụng cho mọi bản ghi. Câu lệnh hợp lệ về cú pháp nên không báo lỗi; vì vậy khi cập nhật cần cẩn thận viết điều kiện WHERE."},
// ===================== CHỦ ĐỀ F - HTML/CSS (lớp 12) =====================
{id:"F301",lop:12,cd:"F",md:"B",dh:"chung",dang:"MC",
q:"Thẻ HTML nào dùng để tạo siêu liên kết?",
o:["<a href=\"...\">","<link>","<img src=\"...\">","<p>"],a:0,
gt:"Thẻ <a> với thuộc tính href tạo siêu liên kết. Thẻ <link> dùng trong <head> để liên kết tệp CSS; <img> chèn ảnh; <p> tạo đoạn văn."},
{id:"F302",lop:12,cd:"F",md:"B",dh:"chung",dang:"MC",
q:"Để chèn ảnh truong.jpg vào trang web, ta dùng",
o:["<img src=\"truong.jpg\">","<a href=\"truong.jpg\">Ảnh</a>","<image>truong.jpg</image>","<pic file=\"truong.jpg\">"],a:0,
gt:"Thẻ <img> với thuộc tính src (đường dẫn ảnh); nên thêm alt (văn bản thay thế). <a href> chỉ tạo liên kết tới ảnh; <image> và <pic> không phải thẻ HTML hợp lệ để chèn ảnh."},
{id:"F303",lop:12,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Thuộc tính CSS nào dùng để đổi màu chữ?",
o:["color","background-color","font-size","text-align"],a:0,
gt:"color quy định màu chữ. background-color là màu nền; font-size là cỡ chữ; text-align là căn lề."},
{id:"F304",lop:12,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Quy tắc CSS .noibat { font-weight: bold; } được áp dụng cho phần tử nào?",
o:["Các phần tử có class=\"noibat\"","Phần tử duy nhất có id=\"noibat\"","Mọi thẻ <b> trong trang web","Mọi thẻ <p> trong trang web"],a:0,
gt:"Bộ chọn bắt đầu bằng dấu chấm là bộ chọn lớp (class). Bộ chọn id dùng dấu #, ví dụ #noibat."},
{id:"F305",lop:12,cd:"F",md:"B",dh:"chung",dang:"MC",
q:"Thẻ nào tạo tiêu đề có cỡ chữ lớn nhất theo mặc định?",
o:["<h1>","<h6>","<title>","<head>"],a:0,
gt:"Các thẻ tiêu đề từ <h1> (lớn nhất) đến <h6> (nhỏ nhất). <title> là tiêu đề hiển thị trên tab trình duyệt; <head> chứa thông tin của trang."},
{id:"F306",lop:12,cd:"F",md:"V",dh:"chung",dang:"MC",
q:"Cho đoạn mã:\n```\n<style>\n  p  { color: blue; }\n  .a { color: green; }\n  #b { color: red; }\n</style>\n<p class=\"a\" id=\"b\">Xin chào</p>\n```\nDòng chữ \"Xin chào\" hiển thị màu gì?",
o:["Đỏ","Xanh dương","Xanh lá","Đen"],a:0,
gt:"Khi nhiều quy tắc cùng áp dụng, bộ chọn có độ ưu tiên cao hơn sẽ thắng: id (#b) > class (.a) > tên thẻ (p). Vì vậy chữ có màu đỏ."},
{id:"F307",lop:12,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Đoạn mã <ol><li>Toán</li><li>Tin</li></ol> hiển thị",
o:["Danh sách có đánh số thứ tự 1, 2","Danh sách có dấu chấm tròn đầu dòng","Một bảng hai cột","Hai tiêu đề lớn"],a:0,
gt:"<ol> (ordered list) là danh sách có thứ tự, mặc định đánh số 1, 2, 3... Danh sách dấu chấm tròn dùng <ul>; bảng dùng <table>."},
{id:"F308",lop:12,cd:"F",md:"H",dh:"chung",dang:"MC",
q:"Trong biểu mẫu HTML, thẻ nào tạo ô cho người dùng nhập một dòng văn bản?",
o:["<input type=\"text\">","<form type=\"text\">","<textline>","<select>"],a:0,
gt:"<input type=\"text\"> tạo ô nhập một dòng. <form> bao toàn bộ biểu mẫu; <select> tạo danh sách chọn; <textline> không phải thẻ HTML."},
// ===================== CHỦ ĐỀ G =====================
{id:"G101",lop:12,cd:"G",md:"B",dh:"chung",dang:"MC",
q:"Công việc chính của người làm nghề quản trị mạng là",
o:["Thiết lập, giám sát, bảo trì và bảo mật hệ thống mạng","Thiết kế giao diện và hình ảnh cho trang web","Biên tập, dựng phim và hiệu ứng cho truyền hình","Kinh doanh, phân phối thiết bị điện tử"],a:0,
gt:"Quản trị mạng chịu trách nhiệm cài đặt, vận hành, theo dõi, xử lý sự cố và bảo mật hệ thống mạng. Các công việc còn lại thuộc ngành nghề khác."},
{id:"G102",lop:12,cd:"G",md:"H",dh:"chung",dang:"MC",
q:"Ngành khoa học dữ liệu chủ yếu làm công việc gì?",
o:["Thu thập, phân tích dữ liệu để rút ra tri thức hỗ trợ ra quyết định","Sửa chữa, thay thế linh kiện phần cứng máy tính","Lắp đặt hệ thống cáp mạng trong các tòa nhà","Nhập liệu văn bản và số liệu vào máy tính"],a:0,
gt:"Nhà khoa học dữ liệu dùng thống kê, lập trình, học máy để phân tích dữ liệu và tìm ra quy luật, dự báo. Sửa chữa phần cứng, lắp cáp mạng, nhập liệu là các công việc khác."},
{id:"G103",lop:12,cd:"G",md:"B",dh:"chung",dang:"MC",
q:"Người viết mã, kiểm thử và bảo trì phần mềm thuộc nhóm nghề nào?",
o:["Phát triển phần mềm (lập trình viên)","Quản trị mạng (kỹ sư mạng)","Thiết kế đồ họa (nhà thiết kế)","Sửa chữa thiết bị điện tử"],a:0,
gt:"Lập trình viên phân tích yêu cầu, viết mã, kiểm thử và bảo trì phần mềm. Quản trị mạng làm việc với hệ thống mạng; thiết kế đồ họa tạo sản phẩm hình ảnh."},

// ===================== CÂU ĐÚNG/SAI - PHẦN CHUNG =====================
{id:"T101",lop:12,cd:"F",md:"H",dh:"chung",dang:"TF",
q:"Cho đoạn mã HTML sau:\n```\n<html><head><style>\n  h1 { color: navy; }\n  .ghichu { font-style: italic; }\n</style></head>\n<body>\n  <h1>Câu lạc bộ Tin học</h1>\n  <p class=\"ghichu\">Sinh hoạt vào thứ Bảy.</p>\n  <a href=\"dangky.html\">Đăng ký</a>\n</body></html>\n```",
y:[
{t:"Dòng \"Câu lạc bộ Tin học\" hiển thị màu xanh navy.",d:true,gt:"Quy tắc h1 { color: navy; } áp dụng cho thẻ <h1>."},
{t:"Đoạn \"Sinh hoạt vào thứ Bảy.\" hiển thị chữ in đậm.",d:false,gt:"Lớp .ghichu đặt font-style: italic, tức chữ in nghiêng, không phải in đậm (in đậm là font-weight: bold)."},
{t:"Nhấn vào chữ \"Đăng ký\" sẽ mở trang dangky.html.",d:true,gt:"Thẻ <a href=\"dangky.html\"> tạo liên kết tới trang dangky.html."},
{t:"Muốn liên kết \"Đăng ký\" mở ở thẻ (tab) mới, cần thêm thuộc tính target=\"_blank\" vào thẻ <a>.",d:true,gt:"target=\"_blank\" yêu cầu trình duyệt mở liên kết trong tab hoặc cửa sổ mới."}]},
{id:"T102",lop:12,cd:"B",md:"H",dh:"chung",dang:"TF",
q:"Phòng máy của trường có 30 máy tính nối vào một switch; switch nối với router; router nối với modem của nhà cung cấp dịch vụ Internet.",
y:[
{t:"Switch có nhiệm vụ chuyển dữ liệu giữa các máy tính trong phòng máy.",d:true,gt:"Switch kết nối các thiết bị trong cùng mạng LAN và chuyển dữ liệu tới đúng máy đích."},
{t:"Nếu router bị hỏng nhưng các máy đã có địa chỉ IP, các máy trong phòng vẫn có thể chia sẻ tệp cho nhau qua switch.",d:true,gt:"Trao đổi trong cùng mạng LAN chỉ cần switch. Router chỉ cần khi ra mạng khác (Internet)."},
{t:"Hai máy trong phòng có thể dùng chung một địa chỉ IP mà không gây lỗi.",d:false,gt:"Địa chỉ IP phải là duy nhất trong mạng; trùng IP sẽ gây xung đột, các máy không liên lạc ổn định được."},
{t:"Muốn cho điện thoại kết nối không dây vào mạng phòng máy, chỉ cần cắm thêm một switch.",d:false,gt:"Switch không phát sóng Wi-Fi. Cần thêm điểm truy cập không dây (Access Point) hoặc router có Wi-Fi."}]},
{id:"T103",lop:12,cd:"D",md:"V",dh:"chung",dang:"TF",
q:"Minh nhận được tin nhắn từ tài khoản mạng xã hội của bạn thân: \"Mình đang cần gấp 3 triệu, chuyển giúp vào số tài khoản này nhé, tối mình trả\". Số tài khoản mang tên một người lạ.",
y:[
{t:"Có khả năng tài khoản của bạn thân đã bị kẻ gian chiếm quyền.",d:true,gt:"Mượn tiền gấp, chuyển vào tài khoản người lạ là dấu hiệu điển hình của lừa đảo bằng tài khoản bị chiếm."},
{t:"Vì là bạn thân nên Minh nên chuyển tiền ngay.",d:false,gt:"Không được chuyển tiền khi chưa xác minh, dù tin nhắn đến từ tài khoản quen."},
{t:"Minh nên gọi điện trực tiếp cho bạn để xác minh.",d:true,gt:"Xác minh qua kênh khác (gọi điện, gặp trực tiếp) là cách an toàn nhất."},
{t:"Nếu xác định là lừa đảo, Minh nên báo cho bạn bè chung biết và báo cáo tài khoản với nền tảng mạng xã hội.",d:true,gt:"Cảnh báo giúp người khác không bị lừa; báo cáo giúp nền tảng khóa tài khoản bị chiếm."}]},
{id:"T104",lop:12,cd:"A",md:"H",dh:"chung",dang:"TF",
q:"Khi tìm hiểu về trí tuệ nhân tạo (AI), các bạn lớp 12A1 đưa ra những nhận định sau:",
y:[
{t:"Học máy là một lĩnh vực của AI, giúp máy tính tự cải thiện hiệu quả nhờ học từ dữ liệu.",d:true,gt:"Đây là định nghĩa cơ bản của học máy (machine learning)."},
{t:"Các chatbot AI luôn đưa ra thông tin chính xác tuyệt đối nên không cần kiểm chứng.",d:false,gt:"Chatbot có thể đưa ra thông tin sai hoặc bịa đặt; cần đối chiếu với nguồn tin cậy."},
{t:"Dùng AI làm hộ toàn bộ bài kiểm tra cá nhân rồi nộp như bài của mình là vi phạm liêm chính học tập.",d:true,gt:"Nộp sản phẩm không phải do mình làm như của mình là gian lận, bất kể công cụ là gì."},
{t:"AI tổng quát, có khả năng như con người trong mọi lĩnh vực, đã được sử dụng phổ biến trong đời sống.",d:false,gt:"Các hệ thống AI hiện nay là AI hẹp, giỏi trong nhiệm vụ cụ thể; AI tổng quát chưa tồn tại."}]},
{id:"T105",lop:11,cd:"F",md:"H",dh:"chung",dang:"TF",
q:"Cơ sở dữ liệu thư viện trường có hai bảng:\nSACH(MaSach, TenSach, TacGia, NamXB)\nMUON(MaMuon, MaSach, MaHS, NgayMuon)",
y:[
{t:"MaSach thích hợp làm khóa chính của bảng SACH.",d:true,gt:"Mỗi cuốn sách có một mã riêng, không trùng lặp."},
{t:"Trường MaSach trong bảng MUON là khóa ngoài tham chiếu tới bảng SACH.",d:true,gt:"MaSach ở bảng MUON dùng để liên kết tới khóa chính MaSach của bảng SACH."},
{t:"Câu lệnh SELECT TenSach FROM SACH WHERE NamXB > 2020; cho danh sách tên các sách xuất bản từ năm 2020 trở về sau, kể cả năm 2020.",d:false,gt:"Điều kiện > 2020 không lấy năm 2020; muốn lấy cả năm 2020 phải dùng >= 2020."},
{t:"Khi đã thiết lập ràng buộc khóa ngoài, vẫn có thể thêm vào bảng MUON một bản ghi có MaSach không tồn tại trong bảng SACH.",d:false,gt:"Ràng buộc khóa ngoài ngăn việc tham chiếu tới bản ghi không tồn tại, đảm bảo toàn vẹn dữ liệu."}]},
{id:"T106",lop:10,cd:"F",md:"V",dh:"chung",dang:"TF",
q:"Cho chương trình Python:\n```\ndef dem_chan(a):\n    d = 0\n    for x in a:\n        if x % 2 == 0:\n            d = d + 1\n    return d\n\nprint(dem_chan([3, 8, 10, 5, 6]))\n```",
y:[
{t:"Hàm dem_chan đếm số phần tử chẵn trong danh sách a.",d:true,gt:"x % 2 == 0 kiểm tra x chia hết cho 2, mỗi lần đúng thì d tăng 1."},
{t:"Kết quả in ra màn hình là 3.",d:true,gt:"Các số chẵn là 8, 10, 6 nên d = 3."},
{t:"Nếu thay điều kiện thành x % 2 == 1 thì kết quả in ra là 3.",d:false,gt:"Khi đó hàm đếm số lẻ: 3 và 5, kết quả là 2."},
{t:"Có thể dùng lệnh print(d) ở ngoài hàm để in giá trị của biến d.",d:false,gt:"d là biến cục bộ của hàm, ra ngoài hàm không truy cập được (gây lỗi NameError)."}]},

// ===================== CÂU ĐÚNG/SAI - ĐỊNH HƯỚNG CS =====================
{id:"S101",lop:11,cd:"F",md:"V",dh:"CS",dang:"TF",
q:"Sử dụng thuật toán sắp xếp nổi bọt (sắp xếp tăng dần, mỗi lượt duyệt từ đầu dãy và đổi chỗ hai phần tử kề nhau nếu sai thứ tự) cho dãy [5, 2, 4, 1].",
y:[
{t:"Sau lượt duyệt thứ nhất, phần tử 5 nằm ở cuối dãy.",d:true,gt:"Mỗi lượt nổi bọt đưa phần tử lớn nhất chưa xếp về cuối: 5 lần lượt đổi chỗ với 2, 4, 1."},
{t:"Sau lượt duyệt thứ nhất, dãy là [2, 4, 1, 5].",d:true,gt:"(5,2) đổi → [2,5,4,1]; (5,4) đổi → [2,4,5,1]; (5,1) đổi → [2,4,1,5]."},
{t:"Sau lượt duyệt thứ hai, dãy đã được sắp xếp hoàn toàn.",d:false,gt:"Lượt 2: (2,4) giữ; (4,1) đổi → [2,1,4,5]. Dãy chưa sắp xếp xong, cần thêm lượt 3."},
{t:"Độ phức tạp thời gian trong trường hợp xấu nhất của sắp xếp nổi bọt là O(n log n).",d:false,gt:"Sắp xếp nổi bọt có độ phức tạp trường hợp xấu nhất là O(n²)."}]},
{id:"S102",lop:11,cd:"F",md:"V",dh:"CS",dang:"TF",
q:"Dùng thuật toán tìm kiếm nhị phân để tìm giá trị 23 trong dãy đã sắp xếp tăng dần (chỉ số từ 0):\n[3, 7, 11, 15, 19, 23, 27]\nPhần tử giữa được chọn có chỉ số (trái + phải) // 2.",
y:[
{t:"Tìm kiếm nhị phân chỉ áp dụng được khi dãy đã được sắp xếp.",d:true,gt:"Thuật toán dựa vào thứ tự để loại bỏ một nửa dãy sau mỗi lần so sánh."},
{t:"Lần so sánh đầu tiên là với phần tử 15.",d:true,gt:"trái = 0, phải = 6, giữa = 3, phần tử là 15."},
{t:"Cần 3 lần so sánh mới tìm thấy giá trị 23.",d:false,gt:"Lần 1: 15 < 23 → trái = 4. Lần 2: giữa = (4+6)//2 = 5, phần tử 23 → tìm thấy. Chỉ cần 2 lần."},
{t:"Độ phức tạp thời gian của tìm kiếm nhị phân là O(log n).",d:true,gt:"Mỗi bước loại một nửa số phần tử nên số bước tỉ lệ với log₂ n."}]},
{id:"S103",lop:12,cd:"F",md:"H",dh:"CS",dang:"TF",
q:"Một nhóm học sinh xây dựng mô hình học máy để phân loại thư điện tử thành \"thư rác\" và \"thư bình thường\".",
y:[
{t:"Nếu dữ liệu huấn luyện gồm các thư đã được gán nhãn \"rác\"/\"bình thường\" thì đây là học có giám sát.",d:true,gt:"Học có giám sát dùng dữ liệu đã có nhãn (đáp án) để huấn luyện."},
{t:"Phân cụm (clustering) là một kỹ thuật học không giám sát.",d:true,gt:"Phân cụm tự nhóm dữ liệu theo độ tương đồng mà không cần nhãn."},
{t:"Dữ liệu huấn luyện càng nhiều lỗi gán nhãn thì mô hình càng chính xác.",d:false,gt:"Dữ liệu sai lệch làm mô hình học sai, giảm độ chính xác."},
{t:"Mô hình đạt độ chính xác 100% trên dữ liệu huấn luyện chắc chắn sẽ dự đoán tốt với thư mới.",d:false,gt:"Mô hình có thể bị quá khớp (overfitting); cần đánh giá trên dữ liệu kiểm tra riêng."}]},
{id:"S104",lop:12,cd:"F",md:"H",dh:"CS",dang:"TF",
q:"Về khoa học dữ liệu và mô phỏng trên máy tính:",
y:[
{t:"Mô phỏng giúp nghiên cứu những hiện tượng khó quan sát hoặc thí nghiệm thực tế tốn kém, nguy hiểm.",d:true,gt:"Ví dụ mô phỏng lan truyền dịch bệnh, va chạm xe, thời tiết."},
{t:"Kết quả mô phỏng luôn trùng khớp hoàn toàn với thực tế.",d:false,gt:"Mô hình mô phỏng là sự đơn giản hóa thực tế nên luôn có sai số."},
{t:"Khoa học dữ liệu kết hợp kiến thức toán thống kê, tin học và hiểu biết về lĩnh vực ứng dụng.",d:true,gt:"Đây là ba trụ cột của khoa học dữ liệu."},

{id:"S105",lop:11,cd:"F",md:"V",dh:"CS",dang:"TF",
q:"Cho đoạn chương trình Python (n là số nguyên dương):\n```\ns = 0\nfor i in range(n):\n    for j in range(n):\n        s = s + 1\nprint(s)\n```",
y:[
{t:"Với n = 4, chương trình in ra 16.",d:true,gt:"Vòng ngoài chạy 4 lần, mỗi lần vòng trong chạy 4 lần: 4 × 4 = 16."},
{t:"Độ phức tạp thời gian của đoạn chương trình là O(n²).",d:true,gt:"Số lần thực hiện lệnh s = s + 1 là n², nên độ phức tạp O(n²)."},
{t:"Nếu đổi vòng lặp trong thành for j in range(i): thì với n = 4 chương trình in ra 10.",d:false,gt:"Khi đó s = 0 + 1 + 2 + 3 = 6."},
{t:"Khi n tăng gấp đôi, thời gian chạy tăng khoảng 4 lần.",d:true,gt:"Với O(n²): (2n)² = 4n²."}]},

{id:"I101",lop:11,cd:"E",md:"H",dh:"ICT",dang:"TF",
q:"Lan dùng phần mềm chỉnh sửa ảnh (như GIMP) để làm áp phích cho câu lạc bộ, gồm ảnh nền, logo và dòng chữ tiêu đề.",
y:[

{t:"Công cụ cắt (crop) dùng để tăng độ sáng của ảnh.",d:false,gt:"Crop dùng để cắt bỏ phần thừa của ảnh; chỉnh độ sáng dùng công cụ Brightness/Contrast."},

{t:"Xuất ra tệp JPEG vẫn giữ nguyên các lớp riêng biệt.",d:false,gt:"JPEG là ảnh một lớp; khi xuất, các lớp được gộp lại."}]},
{id:"I102",lop:11,cd:"E",md:"H",dh:"ICT",dang:"TF",

{id:"I103",lop:12,cd:"B",md:"H",dh:"ICT",dang:"TF",

 1. Các phương án khác: AND (và): tất cả các toán hạng đều bằng 1; XOR (hoặc loại trừ): hai toán hạng có giá trị khác nhau; NOT (phủ định): toán hạng duy nhất bằng 0.","nguon":"Tin 10 - Bài 5: phép toán logic","coban":1,"id":"10CA026"},{"lop":10,"cd":"A","md":"H","dh":"chung","dang":"MC","q":"Phép toán logic OR (hoặc) cho kết quả bằng 1 khi","o":["có ít nhất một toán hạng bằng 1","tất cả các toán hạng đều bằng 1","toán hạng duy nhất bằng 0","hai toán hạng có giá trị khác nhau"],"a":0,"gt":"OR (hoặc): có ít nhất một toán hạng bằng 1. Các mô tả còn lại ứng với: tất cả các toán hạng đều bằng 1 → AND (và); toán hạng duy nhất bằng 0 → NOT (phủ định); hai toán hạng có giá trị khác nhau → XOR (hoặc loại trừ).","nguon":"Tin 10 - Bài 5: phép toán logic","coban":1,"id":"10CA027"},{"lop":10,"cd":"A","md":"B","dh":"chung","dang":"MC","q":"Phép toán logic nào cho kết quả bằng 1 khi hai toán hạng có giá trị khác nhau?","o":["XOR (hoặc loại trừ)","AND (và)","NOT (phủ định)","OR (hoặc)"],"a":0,"gt":"XOR (hoặc loại trừ): hai toán hạng có giá trị khác nhau. Các phương án khác: AND (và): tất cả các toán hạng đều bằng 1; NOT (phủ định): toán hạng duy nhất bằng 0; OR (hoặc): có ít nhất một toán hạng bằng 1.","nguon":"Tin 10 - Bài 5: phép toán logic","coban":1,"id":"10CA028"},{"lop":10,"cd":"A","md":"H","dh":"chung","dang":"MC","q":"Phép toán logic XOR (hoặc loại trừ) cho kết quả bằng 1 khi","o":["hai toán hạng có giá trị khác nhau","toán hạng duy nhất bằng 0","có ít nhất một toán hạng bằng 1","tất cả các toán hạng đều bằng 1"],"a":0,"gt":"XOR (hoặc loại trừ): hai toán hạng có giá trị khác nhau. Các mô tả còn lại ứng với: toán hạng duy nhất bằng 0 → NOT (phủ định); có ít nhất một toán hạng bằng 1 → OR (hoặc); tất cả các toán hạng đều bằng 1 → AND (và).","nguon":"Tin 10 - Bài 5: phép toán logic","coban":1,"id":"10CA029"},{"lop":10,"cd":"A","md":"B","dh":"chung","dang":"MC","q":"Phép toán logic nào cho kết quả bằng 1 khi toán hạng duy nhất bằng 0?","o":["NOT (phủ định)","XOR (hoặc loại trừ .clear()."}],"nguon":"Tin 10 - Bài 22-25: lệnh với danh sách và xâu","coban":1,"id":"10CF058"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"TF","q":"Xét các phát biểu sau về lệnh làm việc với danh sách và xâu kí tự:","y":[{"t":"Lệnh \" \".join(a) dùng để kiểm tra x có thuộc danh sách (hoặc xâu) a hay không.","d":false,"gt":"Sai: \" \".join(a): nối các xâu trong danh sách a thành một xâu, cách nhau bởi dấu cách; còn \"kiểm tra x có thuộc danh sách (hoặc xâu) a hay không\" là x in a."},{"t":"Lệnh x in a dùng để xoá phần tử có chỉ số k của danh sách a.","d":false,"gt":"Sai: x in a: kiểm tra x có thuộc danh sách (hoặc xâu) a hay không; còn \"xoá phần tử có chỉ số k của danh sách a\" là del a[k]."},{"t":"Lệnh s.split() dùng để chèn phần tử x vào vị trí chỉ số k của danh sách a.","d":false,"gt":"Sai: s.split(): tách xâu s thành danh sách các từ; còn \"chèn phần tử x vào vị trí chỉ số k của danh sách a\" là a.insert(k, x)."},{"t":"Lệnh s.lower() dùng để chuyển toàn bộ xâu s thành chữ thường.","d":true,"gt":"Đúng: s.lower(): chuyển toàn bộ xâu s thành chữ thường."}],"nguon":"Tin 10 - Bài 22-25: lệnh với danh sách và xâu","coban":1,"id":"10CF059"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"TF","q":"Xét các phát biểu sau về lệnh làm việc với danh sách và xâu kí tự:","y":[{"t":"Lệnh s.upper() dùng để chuyển toàn bộ xâu s thành chữ in hoa.","d":true,"gt":"Đúng: s.upper(): chuyển toàn bộ xâu s thành chữ in hoa."},{"t":"Lệnh a.clear() dùng để xoá toàn bộ các phần tử của danh sách a.","d":true,"gt":"Đúng: a.clear(): xoá toàn bộ các phần tử của danh sách a."},{"t":"Lệnh a.remove(x) dùng để xoá phần tử đầu tiên có giá trị x khỏi danh sách a.","d":true,"gt":"Đúng: a.remove(x): xoá phần tử đầu tiên có giá trị x khỏi danh sách a."},{"t":"Lệnh a.insert(k, x) dùng để chèn phần tử x vào vị trí chỉ số k của danh sách a.","d":true,"gt":"Đúng: a.insert(k, x): chèn phần tử x vào vị trí chỉ số k của danh sách a."}],"nguon":"Tin 10 - Bài 22-25: lệnh với danh sách và xâu","coban":1,"id":"10CF060"},{"lop":10,"cd":"F","md":"B","dh":"chung","dang":"MC","q":"Lỗi nào sau đây là lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if?","o":["SyntaxError","ZeroDivisionError","TypeError","ValueError"],"a":0,"gt":"SyntaxError: lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if. Các phương án khác: ZeroDivisionError: lỗi chia cho số 0; TypeError: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số; ValueError: lỗi giá trị không hợp lệ, như int(\"abc\").","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF061"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"MC","q":"Lỗi SyntaxError là","o":["lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if","lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu","lỗi chia cho số 0","lỗi giá trị không hợp lệ, như int(\"abc\")"],"a":0,"gt":"SyntaxError: lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if. Các mô tả còn lại ứng với: lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu → IndexError; lỗi chia cho số 0 → ZeroDivisionError; lỗi giá trị không hợp lệ, như int(\"abc\") → ValueError.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF062"},{"lop":10,"cd":"F","md":"B","dh":"chung","dang":"MC","q":"Lỗi nào sau đây là lỗi thụt lề không đúng quy định?","o":["IndentationError","ZeroDivisionError","NameError","TypeError"],"a":0,"gt":"IndentationError: lỗi thụt lề không đúng quy định. Các phương án khác: ZeroDivisionError: lỗi chia cho số 0; NameError: lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa; TypeError: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF063"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"MC","q":"Lỗi IndentationError là","o":["lỗi thụt lề không đúng quy định","lỗi chia cho số 0","lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu","lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if"],"a":0,"gt":"IndentationError: lỗi thụt lề không đúng quy định. Các mô tả còn lại ứng với: lỗi chia cho số 0 → ZeroDivisionError; lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu → IndexError; lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if → SyntaxError.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF064"},{"lop":10,"cd":"F","md":"B","dh":"chung","dang":"MC","q":"Lỗi nào sau đây là lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa?","o":["NameError","TypeError","ValueError","SyntaxError"],"a":0,"gt":"NameError: lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa. Các phương án khác: TypeError: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số; ValueError: lỗi giá trị không hợp lệ, như int(\"abc\"); SyntaxError: lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF065"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"MC","q":"Lỗi NameError là","o":["lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa","lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số","lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu","lỗi chia cho số 0"],"a":0,"gt":"NameError: lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa. Các mô tả còn lại ứng với: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số → TypeError; lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu → IndexError; lỗi chia cho số 0 → ZeroDivisionError.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF066"},{"lop":10,"cd":"F","md":"B","dh":"chung","dang":"MC","q":"Lỗi nào sau đây là lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số?","o":["TypeError","SyntaxError","ZeroDivisionError","IndexError"],"a":0,"gt":"TypeError: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số. Các phương án khác: SyntaxError: lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if; ZeroDivisionError: lỗi chia cho số 0; IndexError: lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF067"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"MC","q":"Lỗi TypeError là","o":["lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số","lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu","lỗi chia cho số 0","lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if"],"a":0,"gt":"TypeError: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số. Các mô tả còn lại ứng với: lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu → IndexError; lỗi chia cho số 0 → ZeroDivisionError; lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if → SyntaxError.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF068"},{"lop":10,"cd":"F","md":"B","dh":"chung","dang":"MC","q":"Lỗi nào sau đây là lỗi chia cho số 0?","o":["ZeroDivisionError","SyntaxError","TypeError","NameError"],"a":0,"gt":"ZeroDivisionError: lỗi chia cho số 0. Các phương án khác: SyntaxError: lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if; TypeError: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số; NameError: lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF069"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"MC","q":"Lỗi ZeroDivisionError là","o":["lỗi chia cho số 0","lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa","lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if","lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu"],"a":0,"gt":"ZeroDivisionError: lỗi chia cho số 0. Các mô tả còn lại ứng với: lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa → NameError; lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if → SyntaxError; lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu → IndexError.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF070"},{"lop":10,"cd":"F","md":"B","dh":"chung","dang":"MC","q":"Lỗi nào sau đây là lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu?","o":["IndexError","ZeroDivisionError","NameError","ValueError"],"a":0,"gt":"IndexError: lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu. Các phương án khác: ZeroDivisionError: lỗi chia cho số 0; NameError: lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa; ValueError: lỗi giá trị không hợp lệ, như int(\"abc\").","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF071"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"MC","q":"Lỗi IndexError là","o":["lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu","lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số","lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa","lỗi chia cho số 0"],"a":0,"gt":"IndexError: lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu. Các mô tả còn lại ứng với: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số → TypeError; lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa → NameError; lỗi chia cho số 0 → ZeroDivisionError.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF072"},{"lop":10,"cd":"F","md":"B","dh":"chung","dang":"MC","q":"Lỗi nào sau đây là lỗi giá trị không hợp lệ, như int(\"abc\")?","o":["ValueError","TypeError","IndexError","ZeroDivisionError"],"a":0,"gt":"ValueError: lỗi giá trị không hợp lệ, như int(\"abc\"). Các phương án khác: TypeError: lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số; IndexError: lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu; ZeroDivisionError: lỗi chia cho số 0.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF073"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"MC","q":"Lỗi ValueError là","o":["lỗi giá trị không hợp lệ, như int(\"abc\")","lỗi thụt lề không đúng quy định","lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số","lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa"],"a":0,"gt":"ValueError: lỗi giá trị không hợp lệ, như int(\"abc\"). Các mô tả còn lại ứng với: lỗi thụt lề không đúng quy định → IndentationError; lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số → TypeError; lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa → NameError.","nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF074"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"TF","q":"Xét các phát biểu sau về lỗi chương trình Python:","y":[{"t":"ValueError là lỗi thụt lề không đúng quy định.","d":false,"gt":"Sai: ValueError: lỗi giá trị không hợp lệ, như int(\"abc\"); còn \"lỗi thụt lề không đúng quy định\" là IndentationError."},{"t":"ZeroDivisionError là lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số.","d":false,"gt":"Sai: ZeroDivisionError: lỗi chia cho số 0; còn \"lỗi thực hiện phép toán trên các kiểu dữ liệu không phù hợp, như cộng xâu với số\" là TypeError."},{"t":"NameError là lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa.","d":true,"gt":"Đúng: NameError: lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa."},{"t":"IndexError là lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu.","d":true,"gt":"Đúng: IndexError: lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu."}],"nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF075"},{"lop":10,"cd":"F","md":"H","dh":"chung","dang":"TF","q":"Xét các phát biểu sau về lỗi chương trình Python:","y":[{"t":"ZeroDivisionError là lỗi chia cho số 0.","d":true,"gt":"Đúng: ZeroDivisionError: lỗi chia cho số 0."},{"t":"IndexError là lỗi giá trị không hợp lệ, như int(\"abc\").","d":false,"gt":"Sai: IndexError: lỗi truy cập chỉ số vượt ra ngoài phạm vi của danh sách hoặc xâu; còn \"lỗi giá trị không hợp lệ, như int(\"abc\")\" là ValueError."},{"t":"SyntaxError là lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if.","d":true,"gt":"Đúng: SyntaxError: lỗi cú pháp, ví dụ thiếu dấu hai chấm sau câu lệnh if."},{"t":"NameError là lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa.","d":true,"gt":"Đúng: NameError: lỗi dùng tên biến hoặc tên hàm chưa được định nghĩa."}],"nguon":"Tin 10 - Bài 29-30: lỗi chương trình","coban":1,"id":"10CF076"},{"lop":10,"cd":"E","md":"B","dh":"chung","dang":"MC","q":"Trong Inkscape, khái niệm (công cụ) nào là thuộc tính tô màu phần bên trong đối tượng?","o":["Fill (tô màu)","Stroke style","Intersection (giao)","Định dạng SVG"],"a":0,"gt":"Fill (tô màu): là thuộc tính tô màu phần bên trong đối tượng. Các phương án khác: Stroke style: dùng để thiết lập độ dày và kiểu nét của đường viền; Intersection (giao): tạo đối tượng mới là phần chung của các đối tượng được chọn; Định dạng SVG: là định dạng tệp mặc định của Inkscape, lưu ảnh dạng vector.","nguon":"Tin 10 - Bài 12-15: phần mềm thiết kế đồ hoạ Inkscape","coban":1,"id":"10CE001"},{"lop":10,"cd":"E","md":"B","dh":"chung","dang":"MC","q":"Trong Inkscape, Fill (tô màu)","o":["là thuộc tính tô màu phần bên trong đối tượng","giúp tổ chức các đối tượng thành các tầng chồng lên nhau","lấy đối tượng dưới trừ đi phần chồng lấn với đối tượng trên","tạo đối tượng mới là phần bao phủ của các đối tượng được chọn"],"a":0,"gt":"Fill (tô màu): là thuộc tính tô màu phần bên trong đối tượng. Các mô tả còn lại ứng với: giúp tổ chức các đối tượng thành các tầng chồng lên nhau → Layer (lớp); lấy đối tượng dưới trừ đi phần chồng lấn với đối tượng trên → Difference (hiệu); tạo đối tượng mới là phần bao phủ của các đối tượng được chọn → Union (hợp).","nguon":"Tin 10 - Bài 12-15: phần mềm thiết kế đồ hoạ Inkscape","coban":1,"id":"10CE002"},{"lop":10,"cd":"E","md":"B","dh":"chung","dang":"MC","q":"Trong Inkscape, khái niệm (công cụ) nào là thuộc tính tô màu đường viền của đối tượng?","o":["Stroke paint","Union (hợp)","Intersection (giao)","Stroke style"],"a":0,"gt":"Stroke paint: là thuộc tính tô màu đường viền của đối tượng. Các phương án khác: Union (hợp): tạo đối tượng mới là phần bao phủ của các đối tượng được chọn; Intersection (giao): tạo đối tượng mới là phần chung của các đối tượng được chọn; Stroke style: dùng để thiết lập độ dày và kiểu nét của đường viền.","nguon":"Tin 10 - Bài 12-15: phần mềm thiết kế đồ hoạ Inkscape","coban":1,"id":"10CE003"},{"lop":10,"cd":"E","md":"B","dh":"chung","dang":"MC","q":"Trong Inkscape, Stroke paint","o":["là thuộc tính tô màu đường viền của đối tượng","giúp tổ chức các đối tượng thành các tầng chồng lên nhau","tạo đối tượng mới là phần chung của các đối tượng được chọn","lấy đối tượng dưới trừ đi phần chồng lấn với đối tượng trên"],"a":0,"gt":"Stroke paint: là thuộc tính tô màu đường viền của đối tượng. Các mô tả còn lại ứng với: giúp tổ chức các đối tượng thành các tầng chồng lên nhau → Layer (lớp); tạo đối tượng mới là phần chung của các đối tượng được chọn → Intersection (giao); lấy đối tượng dưới trừ đi phần chồng lấn với đối tượng trên → Difference (hiệu).","nguon":"Tin 10 - Bài 12-15: phần mềm thiết kế đồ hoạ Inkscape","coban":1,"id":"10CE004"},{"lop":10,"cd":"E","md":"B","dh":"chung","dang":"MC","q":"Trong Inkscape, khái niệm (công cụ) nào dùng để thiết lập độ dày và kiểu nét của đường viền?","o":["Stroke style","Định dạng SVG","Công cụ Bezier (Pen)","Stroke paint"],"a":0,"gt":"Stroke style: dùng để thiết lập độ dày và kiểu nét của đường viền. Các phương án khác: Định dạng SVG: là định dạng tệp mặc định của Inkscape, lưu ảnh dạng vector; Công cụ Bezier (Pen): dùng để vẽ các đường thẳng và đường cong tự do; Stroke paint: là thuộc tính tô màu đường viền của đối tượng.","nguon":"Tin 10 - Bài 12-15: phần mềm thiết kế đồ hoạ Inkscape","coban":1,"id":"10CE005"},{"lop":10,"cd":"E","md":"B","dh":"chung","dang":"MC","q":"Trong Inkscape, Stroke style","o":["dùng để thiết lập độ dày và kiểu nét của đường viền","là định dạng tệp  đồ hoạ Inkscape:","y":[{"t":"Trong Inkscape, Fill (tô màu) là thuộc tính tô màu phần bên trong đối tượng.","d":true,"gt":"Đúng: Fill (tô màu): là thuộc tính tô màu phần bên trong đối tượng."},{"t":"Trong Inkscape, Công cụ Text là định dạng tệp mặc định của Inkscape, lưu ảnh dạng vector.","d":false,"gt":"Sai: Công cụ Text: dùng để tạo và chỉnh sửa văn bản trên bản vẽ; còn \"là định dạng tệp mặc định của Inkscape, lưu ảnh dạng vector\" là Định dạng SVG."},{"t":"Trong Inkscape, Stroke paint là thuộc tính tô màu đường viền của đối tượng.","d":true,"gt":"Đúng: Stroke paint: là thuộc tính tô màu đường viền của đối tượng."},{"t":"Trong Inkscape, Group (nhóm) gộp nhiều đối tượng để di chuyển, định dạng như một đối tượng.","d":true,"gt":"Đúng: Group (nhóm): gộp nhiều đối tượng để di chuyển, định dạng như một đối tượng."}],"nguon":"Tin 10 - Bài 12-15: phần mềm thiết kế đồ hoạ Inkscape","coban":1,"id":"10CE025"},{"lop":10,"cd":"D","md":"B","dh":"chung","dang":"MC","q":"Thuật ngữ nào chỉ đoạn mã độc gắn vào chương trình khác, tự lây lan khi chương trình đó chạy?","o":["Virus máy tính","Mã độc tống tiền (ransomware)","Tường lửa (firewall)","Phần mềm gián điệp (spyware)"],"a":0,"gt":"Virus máy tính: đoạn mã độc gắn vào chương trình khác, tự lây lan khi chương trình đó chạy. Các phương án khác: Mã độc tống tiền (ransomware): phần mềm mã hoá dữ liệu của nạn nhân rồi đòi tiền chuộc; Tường lửa (firewall): phần mềm hoặc thiết bị kiểm soát, ngăn chặn truy cập trái phép từ bên ngoài; Phần mềm gián điệp (spyware): phần mềm bí mật thu thập thông tin của người dùng.","nguon":"Tin 10 - Bài 9, 11: an toàn và ứng xử trên không gian mạng","coban":1,"id":"10CD001"},{"lop":10,"cd":"D","md":"H","dh":"chung","dang":"MC","q":"Virus máy tính là","o":["đoạn mã độc gắn vào chương trình khác, tự lây lan khi chương trình đó chạy","phần mềm bí mật thu thập thông tin của người dùng","dùng mạng xã hội, tin nhắn để đe doạ, quấy rối, bêu xấu người khác","phần mềm độc hại ngụy trang thành phần mềm hữu ích để ặn truy cập trái phép từ bên ngoài.","d":true,"gt":"Đúng: Tường lửa (firewall): phần mềm hoặc thiết bị kiểm soát, ngăn chặn truy cập trái phép từ bên ngoài."},{"t":"Lừa đảo giả mạo (phishing) là giả danh tổ chức uy tín để lừa người dùng cung cấp mật khẩu, thông tin tài chính.","d":true,"gt":"Đúng: Lừa đảo giả mạo (phishing): giả danh tổ chức uy tín để lừa người dùng cung cấp mật khẩu, thông tin tài chính."}],"nguon":"Tin 10 - Bài 9, 11: an toàn và ứng xử trên không gian mạng","coban":1,"id":"10CD018"},{"lop":11,"cd":"F","md":"B","dh":"CS","dang":"MC","q":"Khái niệm (thuật toán) nào dãy hữu hạn các phần tử cùng kiểu, truy cập theo chỉ số?","o":["Mảng một chiều","Sắp xếp nổi bọt","Sắp xếp chèn","Độ phức tạp thời gian"],"a":0,"gt":"Mảng một chiều: dãy hữu hạn các phần tử cùng kiểu, truy cập theo chỉ số. Các phương án khác: Sắp xếp nổi bọt: đổi chỗ liên tiếp các cặp phần tử kề nhau sai thứ tự, đưa phần tử lớn dần về cuối dãy; Sắp xếp chèn: lần lượt chèn từng phần tử vào đúng vị trí trong đoạn đầu dãy đã được sắp xếp; Độ phức tạp thời gian: ước lượng số phép tính cơ bản theo kích thước dữ liệu vào n.","nguon":"Tin 11 KHMT - Bài 17-25: thuật toán và độ phức tạp","coban":1,"id":"11KF001"},{"lop":11,"cd":"F","md":"H","dh":"CS","dang":"MC","q":"Phát biểu nào đúng về Mảng một chiều?","o":["dãy hữu hạn các phần tử cùng kiểu, truy cập theo chỉ số","mỗi bước so sánh với phần tử giữa và loại một nửa dãy, chỉ áp dụng cho dãy đã sắp xếp, độ phức tạp O(log n)","lần lượt chèn từng phần tử vào đúng vị trí trong đoạn đầu dãy đã được sắp xếp","đổi chỗ liên tiếp các cặp phần tử kề nhau sai thứ tự, đưa phần tử lớn dần về cuối dãy"],"a":0,"gt":"Mảng một chiều: dãy hữu hạn các phần tử cùng kiểu, truy cập theo chỉ số. Các mô tả còn lại ứng với: mỗi bước so sánh với phần tử giữa và loại một nửa dãy, chỉ áp dụng cho dãy đã sắp xếp, độ phức tạp O(log n) → Tìm kiếm nhị phân; lần lượt chèn từng phần tử vào đúng vị trí trong đoạn đầu dãy đã được sắp xếp → Sắp xếp chèn; đổi chỗ liên tiếp các cặp phần tử kề nhau sai thứ tự, đưa phần tử lớn dần về cuối dãy → Sắp xếp nổi bọt.","nguon":"Tin 11 KHMT - Bài 17-25: thuật toán và độ phức tạp","coban":1,"id":"11KF002"},{"lop":11,"cd":"F","md":"B","dh":"CS","dang":"MC","q":"Khái niệm (thuật toán) nào dữ liệu dạng bảng, mỗi phần tử xác định bởi chỉ số hàng và chỉ số cột?","o":["Mảng hai chiều","Thư viện chương trình","Kí pháp O lớn","Mảng một chiều"],"a":0,"gt":"Mảng hai chiều: dữ liệu dạng bảng, mỗi phần tử xác định bởi chỉ số hàng và chỉ số cột. Các phương án khác: Thư viện chương trình: tập hợp các hàm, mô đun viết sẵn được dùng lại trong nhiều chương trình; Kí pháp O lớn: cách biểu diễn tốc độ tăng của thời gian chạy khi n tăng, bỏ qua hằng số; Mảng một chiều: dãy hữu hạn các phần tử cùng kiểu, truy cập theo chỉ số.","nguon":"Tin 11 KHMT - Bài 17-25: thuật toán và độ phức tạp","coban":1,"id":"11KF003"},{"lop":11,"cd":"F","md":"H","dh":"CS","dang":"MC","q":"Phát biểu nào đúng về Mảng hai chiều?","o":["dữ liệu dạng bảng, mỗi phần tử xác định bởi chỉ số hàng và chỉ số cột","cách biểu diễn tốc độ tăng của thời gian chạy khi n tăng, bỏ qua hằng số","chia chương trình thành các mô đun (hàm) độc lập, mỗi mô đun thực hiện một nhiệm vụ","lần lượt chèn từng phần tử vào đúng vị trí trong đoạn đầu dãy đã được sắp xếp"],"a":0,"gt":"Mảng hai chiều: dữ liệu dạng bảng, mỗi phần tử xác định bởi chỉ số hàng và chỉ số cột. Các mô tả còn lại ứng với: cách biểu diễn tốc độ tăng của thời gian chạy khi n tăng, bỏ qua hằng số → Kí pháp O lớn; chia chương trình thành các mô đun (hàm) độc lập, mỗi mô đun thực hiện một nhiệm vụ → Thiết kế theo mô đun; lần lượt chèn từng phần tử vào đúng vị trí trong đoạn đầu dãy đã được sắp xếp → Sắp xếp chèn.","nguon":"Tin 11 KHMT - Bài 17-25: thuật toán và độ phức tạp","coban":1,"id":"11KF004"},{"lop":11,"cd":"F","md":"B","dh":"CS","dang":"MC","q":"Khái niệm (thuật toán) nào duyệt lần lượt từng phần tử từ đầu dãy, áp dụng cho dãy bất kì, độ phức tạp O(n)?","o":["Tìm kiếm tuần tự","Sắp xếp nổi bọt","Kí pháp O lớn","Kiểm thử chương trình"],"a":0,"gt":"Tìm kiếm tuần tự: duyệt lần lượt từng phần tử từ đầu dãy, áp dụng cho dãy bất kì, độ phức tạp O(n). Các phương án khác: Sắp xếp nổi bọt: đổi chỗ liên tiếp các cặp phần tử kề nhau sai thứ tự, đưa phần tử lớn dần về cuối dãy; Kí pháp O lớn: cách biểu diễn tốc độ tăng của thời gian chạy khi n tăng, bỏ qua hằng số; Kiểm thử chương trình: chạy chương trình với các bộ dữ liệu để phát hiện lỗi.","nguon":"Tin 11 KHMT - Bài 17-25: thuật toán và độ phức tạp","coban":1,"id":"11KF005"},{"lop":11,"cd":"F","md":"H","dh":"CS","dang":"MC","q":"Phát biểu nào đúng về Tìm kiếm tuần tự?","o":["duyệt lần lượt từng phần tử từ đầu dãy, áp dụng cho dãy bất kì, độ phức tạp O(n)","cách biểu diễn tốc độ tăng của thời gian chạy khi n tăng, bỏ qua hằng số","lần lượt chèn từng phần tử vào đúng vị trí trong đoạn đầu dãy đã được sắp xếp","mỗi bước so sánh với phần tử giữa và loại một nửa dãy, chỉ áp dụng cho dãy đã sắp xếp, độ phức tạp O(log n)"],"a":0,"gt":"Tìm kiếm tuần tự: duyệt lần lượt từng phần tử từ đầu dãy, áp dụng cho dãy bất kì, độ phức tạp O(n). Các mô tả còn lại ứng với: cách biểu diễn tốc độ tăng của thời gian chạy khi n tăng, bỏ qua hằng số → Kí pháp O lớn; lần lượt chèn từng phần tử vào đúng vị trí trong đoạn đầu dãy đã được sắp xếp → Sắp xếp chèn; mỗi bước so sánh với phần tử giữa và loại một nửa dãy, chỉ áp dụng cho dãy đã sắp xếp, độ phức tạp O(log n) → Tìm kiếm nhị phân.","nguon":"Tin 11 KHMT - Bài 17-25: thuật toán và độ phức tạp","coban":1,"id":"11KF006"},{"lop":11,"cd":"F","md":"B","dh":"CS","dang":"MC","q":"Khái niệm (thuật toán) nào mỗi bước so sánh với phần tử giữa và loại một nửa dãy, chỉ áp dụng cho dãy đã sắp xếp, độ phức tạp O(log n)?","o":["Tìm kiếm nhị phân","Sắp xếp nổi bọt","Mảng một chiều","Độ phức tạp thời gian"],"a":0,"gt":"Tìm kiếm nhị phân: mỗi bước so sánh với phần tử giữa và loại một nửa dãy, chỉ áp dụng cho dãy đã sắp xếp, độ phức tạp O(log n). Các phương án khác: Sắp xếp nổi bọt: đổi chỗ liên tiếp các cặp phần tử ể cải thiện khả năng thực hiện nhiệm vụ. Các phương án khác: Khai phá dữ liệu: quá trình tìm ra mẫu, quy luật hữu ích ẩn trong dữ liệu; Mô hình toán học: cách mô tả hiện tượng bằng biến số, công thức, phương trình; Dữ liệu kiểm tra: dữ liệu riêng dùng để đánh giá mô hình sau khi huấn luyện.","nguon":"Tin 12 KHMT - Bài 25-30: học máy, khoa học dữ liệu, mô phỏng","coban":1,"id":"12KF001"},{"lop":12,"cd":"F","md":"H","dh":"CS","dang":"MC","q":"Học máy là","o":["lĩnh vực giúp máy tính tự học từ dữ liệu để cải thiện khả năng thực hiện nhiệm vụ","biểu diễn dữ liệu bằng biểu đồ, hình ảnh để dễ nhận ra xu hướng","quá trình tìm ra mẫu, quy luật hữu ích ẩn trong dữ liệu","bài toán chia dữ liệu thành các nhóm có đặc điểm giống nhau mà không cần nhãn"],"a":0,"gt":"Học máy: lĩnh vực giúp máy tính tự học từ dữ liệu để cải thiện khả năng thực hiện nhiệm vụ. Các mô tả còn lại ứng với: biểu diễn dữ liệu bằng biểu đồ, hình ảnh để dễ nhận ra xu hướng → Trực quan hoá dữ liệu; quá trình tìm ra mẫu, quy luật hữu ích ẩn trong dữ liệu → Khai phá dữ liệu; bài toán chia dữ liệu thành các nhóm có đặc điểm giống nhau mà không cần nhãn → Phân cụm.","nguon":"Tin 12 KHMT - Bài 25-30: học máy, khoa học dữ liệu, mô phỏng","coban":1,"id":"12KF002"},{"lop":12,"cd":"F","md":"B","dh":"CS","dang":"MC","q":"Khái niệm nào chỉ học từ dữ liệu đã được gán nhãn (biết trước kết quả đúng)?","o":["Học có giám sát","Trực quan hoá dữ liệu","Học không giám sát","Phân loại"],"a":0,"gt":"Học có giám sát: học từ dữ liệu đã được gán nhãn (biết trước kết quả đúng). Các phương án khác: Trực quan hoá dữ liệu: biểu diễn dữ liệu bằng biểu đồ, hình ảnh để dễ nhận ra xu hướng; Học không giám sát: học từ dữ liệu chưa gán nhãn để tự tìm ra cấu trúc, nhóm trong dữ liệu; Phân loại: bài toán dự đoán nhãn (lớp) của đối tượng mới, ví dụ thư rác hay không.","nguon":"Tin 12 KHMT - Bài 25-30: học máy, khoa học dữ liệu, mô phỏng","coban":1,"id":"12KF003"},{"lop":12,"cd":"F","md":"H","dh":"CS","dang":"MC","q":"Học có giám sát là","o":["h n":"Tin 12 KHMT - Bài 25-30: học máy, khoa học dữ liệu, mô phỏng","coban":1,"id":"12KF024"},{"lop":12,"cd":"F","md":"B","dh":"CS","dang":"MC","q":"Khái niệm nào chỉ cách mô tả hiện tượng bằng biến số, công thức, phương trình?","o":["Mô hình toán học","Khai phá dữ liệu","Dữ liệu huấn luyện","Dữ liệu kiểm tra"],"a":0,"gt":"Mô hình toán học: cách mô tả hiện tượng bằng biến số, công thức, phương trình. Các phương án khác: Khai phá dữ liệu: quá trình tìm ra mẫu, quy luật hữu ích ẩn trong dữ liệu; Dữ liệu huấn luyện: dữ liệu dùng để mô hình học máy học ra quy luật; Dữ liệu kiểm tra: dữ liệu riêng dùng để đánh giá mô hình sau khi huấn luyện.","nguon":"Tin 12 KHMT - Bài 25-30: học máy, khoa học dữ liệu, mô phỏng","coban":1,"id":"12KF025"},{"lop":12,"cd":"F","md":"H","dh":"CS","dang":"MC","q":"Mô hình toán học là","o":["cách mô tả hiện tượng bằng biến số, công thức, phương trình","học từ dữ liệu đã được gán nhãn (biết trước kết quả đúng)","dữ liệu dùng để mô hình học máy học ra quy luật","bài toán chia dữ liệu thành các nhóm có đặc điểm giống nhau mà không cần nhãn"],"a":0,"gt":"Mô hình toán học: cách mô tả hiện tượng bằng biến số, công thức, phương trình. Các mô tả còn lại ứng với: học từ dữ liệu đã được gán nhãn (biết trước kết quả đúng) → Học có giám sát; dữ liệu dùng để mô hình học máy học ra quy luật → Dữ liệu huấn luyện; bài toán chia dữ liệu thành các nhóm có đặc điểm giống nhau mà không cần nhãn → Phân cụm.","nguon":"Tin 12 KHMT - Bài 25-30: học máy, khoa học dữ liệu, mô phỏng","coban":1,"id":"12KF026"},{"lop":12,"cd":"F","md":"H","dh":"CS","dang":"TF","q":"Xét các phát biểu sau về học máy, khoa học dữ liệu và mô phỏng:","y":[{"t":"Dữ liệu kiểm tra là tập dữ liệu có khối lượng rất lớn, đa dạng, tốc độ phát sinh nhanh.","d":false,"gt":"Sai: Dữ liệu kiểm tra: dữ liệu riêng dùng để đánh giá mô hình sau khi huấn luyện; còn \"tập dữ liệu có khối lượng rất lớn, đa dạng, tốc độ phát sinh nhanh\" là Dữ liệu lớn (Big Data)."},{"t":"Học có giám sát là học từ dữ liệu chưa gán n
