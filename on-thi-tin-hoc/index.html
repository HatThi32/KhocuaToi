":"Xét các phát biểu sau về học máy, khoa học dữ liệu và mô phỏng:","y":[{"t":"Phân cụm là dùng mô hình máy tính tái hiện hoạt động của hệ thống, hiện tượng thực tế.","d":false,"gt":"Sai: Phân cụm: bài toán chia dữ liệu thành các nhóm có đặc điểm giống nhau mà không cần nhãn; còn \"dùng mô hình máy tính tái hiện hoạt động của hệ thống, hiện tượng thực tế\" là Mô phỏng."},{"t":"Mô phỏng là dùng mô hình máy tính tái hiện hoạt động của hệ thống, hiện tượng thực tế.","d":true,"gt":"Đúng: Mô phỏng: dùng mô hình máy tính tái hiện hoạt động của hệ thống, hiện tượng thực tế."},{"t":"Học máy là học từ dữ liệu đã được gán nhãn (biết trước kết quả đúng).","d":false,"gt":"Sai: Học máy: lĩnh vực giúp máy tính tự học từ dữ liệu để cải thiện khả năng thực hiện nhiệm vụ; còn \"học từ dữ liệu đã được gán nhãn (biết trước kết quả đúng)\" là Học có giám sát."},{"t":"Mô hình toán học là cách mô tả hiện tượng bằng biến số, công thức, phương trình.","d":true,"gt":"Đúng: Mô hình toán học: cách mô tả hiện tượng bằng biến số, công thức, phương trình."}],"nguon":"Tin 12 KHMT - Bài 25-30: học máy, khoa học dữ liệu, mô phỏng","coban":1,"id":"12KF029"},{"lop":12,"cd":"F","md":"H","dh":"CS","dang":"TF","q":"Xét các phát biểu sau về học máy, khoa học dữ liệu và mô phỏng:","y":[{"t":"Dữ liệu kiểm tra là bài toán dự đoán nhãn (lớp) của đối tượng mới, ví dụ thư rác hay không.","d":false,"gt":"Sai: Dữ liệu kiểm tra: dữ liệu riêng dùng để đánh giá mô hình sau khi huấn luyện; còn \"bài toán dự đoán nhãn (lớp) của đối tượng mới, ví dụ thư rác hay không\" là Phân loại."},{"t":"Khoa học dữ liệu là học từ dữ liệu chưa gán nhãn để tự tìm ra cấu trúc, nhóm trong dữ liệu.","d":false,"gt":"Sai: Khoa học dữ liệu: lĩnh vực kết hợp toán thống kê, tin học và tri thức chuyên ngành để rút tri thức từ dữ liệu; còn \"học từ dữ liệu chưa gán nhãn để tự tìm ra cấu trúc, nhóm trong dữ liệu\" là Học không giám sát."},{"t":"Mô phỏng là dùng mô hình máy tính tái hiện hoạt động của hệ thống, hiện tượng thực tế.","d":true,"gt":"Đúng: Mô phỏng: dùng mô hình máy tính tái hiện hoạt động của hệ thống, hiện tượng thực tế."},{"t":"Học có giám sát là lĩnh vực giúp máy tính tự học từ dữ liệu để cải thiện khả năng thực hiện nhiệm vụ.","d":false,"gt":"Sai: Học có giám sát: học từ dữ liệu đã được gán nhãn (biết trước kết quả đúng); còn \"lĩnh vực giúp máy tính tự học từ dữ liệu để cải thiện khả năng thực hiện nhiệm vụ\" là Học máy."}],"nguon":"Tin 12 KHMT - Bài 25-30: học máy, khoa học dữ liệu, mô phỏng","coban":1,"id":"12KF030"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, công cụ (chức năng) nào dùng để cắt bỏ phần thừa, giữ lại vùng ảnh được chọn?","o":["Crop (cắt)","Bucket Fill","Export As","Ellipse Select"],"a":0,"gt":"Crop (cắt): cắt bỏ phần thừa, giữ lại vùng ảnh được chọn. Các phương án khác: Bucket Fill: tô màu cho vùng có màu tương tự; Export As: xuất ảnh ra định dạng thông dụng như PNG, JPEG, GIF; Ellipse Select: chọn một vùng ảnh hình elip.","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE001"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, Crop (cắt) dùng để","o":["cắt bỏ phần thừa, giữ lại vùng ảnh được chọn","sao chép điểm ảnh từ vùng nguồn sang vùng khác, dùng để xoá vết","chọn vùng điểm ảnh liền kề có màu tương tự","xoay ảnh hoặc lớp theo một góc"],"a":0,"gt":"Crop (cắt): cắt bỏ phần thừa, giữ lại vùng ảnh được chọn. Các mô tả còn lại ứng với: sao chép điểm ảnh từ vùng nguồn sang vùng khác, dùng để xoá vết → Clone; chọn vùng điểm ảnh liền kề có màu tương tự → Fuzzy Select (Magic Wand); xoay ảnh hoặc lớp theo một góc → Rotate (xoay).","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE002"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, công cụ (chức năng) nào dùng để xoay ảnh hoặc lớp theo một góc?","o":["Rotate (xoay)","Paintbrush","Fuzzy Select (Magic Wand)","Ellipse Select"],"a":0,"gt":"Rotate (xoay): xoay ảnh hoặc lớp theo một góc. Các phương án khác: Paintbrush: vẽ nét cọ mềm bằng màu tiền cảnh; Fuzzy Select (Magic Wand): chọn vùng điểm ảnh liền kề có màu tương tự; Ellipse Select: chọn một vùng ảnh hình elip.","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE003"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, Rotate (xoay) dùng để","o":["xoay ảnh hoặc lớp theo một góc","tách các thành phần ảnh để chỉnh sửa độc lập","điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu","chọn vùng ảnh có đường biên tự do"],"a":0,"gt":"Rotate (xoay): xoay ảnh hoặc lớp theo một góc. Các mô tả còn lại ứng với: tách các thành phần ảnh để chỉnh sửa độc lập → Layer (lớp); điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu → Levels; chọn vùng ảnh có đường biên tự do → Free Select (Lasso).","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE004"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, công cụ (chức năng) nào dùng để thay đổi kích thước ảnh hoặc lớp?","o":["Scale (co giãn)","Hue-Saturation","Clone","Rotate (xoay)"],"a":0,"gt":"Scale (co giãn): thay đổi kích thước ảnh hoặc lớp. Các phương án khác: Hue-Saturation: thay đổi sắc độ và độ bão hoà màu; Clone: sao chép điểm ảnh từ vùng nguồn sang vùng khác, dùng để xoá vết; Rotate (xoay): xoay ảnh hoặc lớp theo một góc.","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE005"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, Scale (co giãn) dùng để","o":["thay đổi kích thước ảnh hoặc lớp","tinh chỉnh độ sáng, màu sắc bằng đường cong","tẩy xoá điểm ảnh trên lớp","chọn vùng ảnh có đường biên tự do"],"a":0,"gt":"Scale (co giãn): thay đổi kích thước ảnh hoặc lớp. Các mô tả còn lại ứng với: tinh chỉnh độ sáng, màu sắc bằng đường cong → Curves; tẩy xoá điểm ảnh trên lớp → Eraser; chọn vùng ảnh có đường biên tự do → Free Select (Lasso).","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE006"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, công cụ (chức năng) nào dùng để điều chỉnh độ sáng và độ tương phản của ảnh?","o":["Brightness-Contrast","Scale (co giãn)","Curves","Eraser"],"a":0,"gt":"Brightness-Contrast: điều chỉnh độ sáng và độ tương phản của ảnh. Các phương án khác: Scale (co giãn): thay đổi kích thước ảnh hoặc lớp; Curves: tinh chỉnh độ sáng, màu sắc bằng đường cong; Eraser: tẩy xoá điểm ảnh trên lớp.","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE007"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, Brightness-Contrast dùng để","o":["điều chỉnh độ sáng và độ tương phản của ảnh","thay đổi sắc độ và độ bão hoà màu","điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu","tinh chỉnh độ sáng, màu sắc bằng đường cong"],"a":0,"gt":"Brightness-Contrast: điều chỉnh độ sáng và độ tương phản của ảnh. Các mô tả còn lại ứng với: thay đổi sắc độ và độ bão hoà màu → Hue-Saturation; điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu → Levels; tinh chỉnh độ sáng, màu sắc bằng đường cong → Curves.","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE008"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, công cụ (chức năng) nào dùng để điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu?","o":["Levels","Paintbrush","Free Select (Lasso)","Bucket Fill"],"a":0,"gt":"Levels: điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu. Các phương án khác: Paintbrush: vẽ nét cọ mềm bằng màu tiền cảnh; Free Select (Lasso): chọn vùng ảnh có đường biên tự do; Bucket Fill: tô màu cho vùng có màu tương tự.","nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE009"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Trong GIMP, Levels dùng để","o":["điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu","thay đổi sắc độ và độ bão hoà màu","cắt bỏ phần thừa, giữ lại vùng ảnh được chọn","chọn ộ tương phản của ảnh; còn \"chọn một vùng ảnh hình elip\" là Ellipse Select."},{"t":"Trong GIMP, Levels dùng để điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu.","d":true,"gt":"Đúng: Levels: điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu."},{"t":"Trong GIMP, Ellipse Select dùng để cắt bỏ phần thừa, giữ lại vùng ảnh được chọn.","d":false,"gt":"Sai: Ellipse Select: chọn một vùng ảnh hình elip; còn \"cắt bỏ phần thừa, giữ lại vùng ảnh được chọn\" là Crop (cắt)."}],"nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE041"},{"lop":11,"cd":"E","md":"H","dh":"ICT","dang":"TF","q":"Xét các phát biểu sau về phần mềm chỉnh sửa ảnh GIMP:","y":[{"t":"Trong GIMP, Brightness-Contrast dùng để điều chỉnh độ sáng và độ tương phản của ảnh.","d":true,"gt":"Đúng: Brightness-Contrast: điều chỉnh độ sáng và độ tương phản của ảnh."},{"t":"Trong GIMP, Levels dùng để điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu.","d":true,"gt":"Đúng: Levels: điều chỉnh mức sáng tối của các vùng ảnh theo biểu đồ màu."},{"t":"Trong GIMP, Scale (co giãn) dùng để tách các thành phần ảnh để chỉnh sửa độc lập.","d":false,"gt":"Sai: Scale (co giãn): thay đổi kích thước ảnh hoặc lớp; còn \"tách các thành phần ảnh để chỉnh sửa độc lập\" là Layer (lớp)."},{"t":"Trong GIMP, Hue-Saturation dùng để xoay ảnh hoặc lớp theo một góc.","d":false,"gt":"Sai: Hue-Saturation: thay đổi sắc độ và độ bão hoà màu; còn \"xoay ảnh hoặc lớp theo một góc\" là Rotate (xoay)."}],"nguon":"Tin 11 THUD - Bài 25-28: phần mềm chỉnh sửa ảnh GIMP","coban":1,"id":"11UE042"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Thuật ngữ nào chỉ ảnh gồm nhiều khung hình hiển thị lần lượt tạo cảm giác chuyển động?","o":["Ảnh động GIF","Hiệu ứng chuyển cảnh (transition)","Xuất phim (render/export)","Khung hình (frame)"],"a":0,"gt":"Ảnh động GIF: ảnh gồm nhiều khung hình hiển thị lần lượt tạo cảm giác chuyển động. Các phương án khác: Hiệu ứng chuyển cảnh (transition): hiệu ứng đặt giữa hai đoạn phim để việc chuyển cảnh mượt mà; Xuất phim (render/export): tạo tệp video hoàn chỉnh như MP4 từ dự án đang biên tập; Khung hình (frame): một ảnh tĩnh trong chuỗi ảnh tạo nên chuyển động.","nguon":"Tin 11 THUD - Bài 28-31: ảnh động và làm phim","coban":1,"id":"11UE043"},{"lop":11,"cd":"E","md":"H","dh":"ICT","dang":"MC","q":"Trong làm phim (ảnh động), Ảnh động GIF là","o":["ảnh gồm nhiều khung hình hiển thị lần lượt tạo cảm giác chuyển động","tạo tệp video hoàn chỉnh như MP4 từ dự án đang biên tập","tách hoặc bỏ bớt phần đầu, phần cuối của đoạn phim","một ảnh tĩnh trong chuỗi ảnh tạo nên chuyển động"],"a":0,"gt":"Ảnh động GIF: ảnh gồm nhiều khung hình hiển thị lần lượt tạo cảm giác chuyển động. Các mô tả còn lại ứng với: tạo tệp video hoàn chỉnh như MP4 từ dự án đang biên tập → Xuất phim (render/export); tách hoặc bỏ bớt phần đầu, phần cuối của đoạn phim → Cắt đoạn (split/trim); một ảnh tĩnh trong chuỗi ảnh tạo nên chuyển động → Khung hình (frame).","nguon":"Tin 11 THUD - Bài 28-31: ảnh động và làm phim","coban":1,"id":"11UE044"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Thuật ngữ nào chỉ một ảnh tĩnh trong chuỗi ảnh tạo nên chuyển động?","o":["Khung hình (frame)","Kịch bản phim","Xuất phim (render/export)","Tệp dự án"],"a":0,"gt":"Khung hình (frame): một ảnh tĩnh trong chuỗi ảnh tạo nên chuyển động. Các phương án khác: Kịch bản phim: bản mô tả nội dung, trình tự các cảnh, lời thoại trước khi dựng phim; Xuất phim (render/export): tạo tệp video hoàn chỉnh như MP4 từ dự án đang biên tập; Tệp dự án: tệp lưu cách sắp xếp tư liệu để tiếp tục chỉnh sửa, chưa phải tệp video.","nguon":"Tin 11 THUD - Bài 28-31: ảnh động và làm phim","coban":1,"id":"11UE045"},{"lop":11,"cd":"E","md":"H","dh":"ICT","dang":"MC","q":"Trong làm phim (ảnh động), Khung hình (frame) là","o":["một ảnh tĩnh trong chuỗi ảnh tạo nên chuyển động","tách hoặc bỏ bớt phần đầu, phần cuối của đoạn phim","bản mô tả nội dung, trình tự các cảnh, lời thoại trước khi dựng phim","hiệu ứng đặt giữa hai đoạn phim để việc chuyển cảnh mượt mà"],"a":0,"gt":"Khung hình (frame): một ảnh tĩnh trong chuỗi ảnh tạo nên chuyển động. Các mô tả còn lại ứng với: tách hoặc bỏ bớt phần đầu, phần cuối của đoạn phim → Cắt đoạn (split/trim); bản mô tả nội dung, trình tự các cảnh, lời thoại trước khi dựng phim → Kịch bản phim; hiệu ứng đặt giữa hai đoạn phim để việc chuyển cảnh mượt mà → Hiệu ứng chuyển cảnh (transition).","nguon":"Tin 11 THUD - Bài 28-31: ảnh động và làm phim","coban":1,"id":"11UE046"},{"lop":11,"cd":"E","md":"B","dh":"ICT","dang":"MC","q":"Thuật ngữ nào chỉ khu vực sắp xếp các đoạn phim, âm thanh theo thứ tự thời gian?","o":["Dòng thời gian (timeline)","Xuất phim (render/export)","Tệp dự án","Kịch bản phim"],"a":0,"gt":"Dòng thời gian (timeline): khu vực sắp xếp các đoạn phim, âm thanh theo thứ tự thời gian. Các phương án khác: Xuất phim (render/export): tạo tệp video hoàn chỉnh như MP4 từ dự án đang biên tập; Tệp dự án: tệp lưu cách sắp xếp tư liệu để tiếp tục chỉnh sửa, chưa phải tệp video; Kịch bản phim: bản mô tả nội dung, trình tự các cảnh, lời thoại trước khi dựng phim.","nguon":"Tin 11 THUD - Bài 28-31: ảnh động và làm phim","coban":1,"id":"11UE047"},{"lop":11,"cd":"E","md":"H","dh":"ICT","dang":"MC","q":"Trong làm phim (ảnh động), Dòng thời gian (timeline) là","o":["khu vực sắp xếp các đoạn phim, âm thanh theo thứ tự thời gian","tạo tệp video hoàn chỉnh như MP4 từ dự án đang biên tập","tách hoặc bỏ bớt phần đầu, phần cuối của đoạn phim","bản mô tả nội dung, trình tự các cảnh, lời thoại trước khi dựng phim"],"a":0,"gt":"Dòng thời gian (timeline): khu vực sắp xếp các đoạn phim, âm thanh theo thứ tự thời gian. Các mô tả còn lại ứng với: tạo tệp video hoàn chỉnh như MP4 từ dự án đang biên tập → Xuất phim (render/export); tách hoặc bỏ bớt phần đầu, phần cuối của đoạn phim → Cắt đoạn (split/trim); bản mô tả nội dung, trình tự các cảnh, lời thoại trước khi dựng phim → Kịch bản phim.","nguon":"Tin 11 THUD - Bài 28-31: ảnh động và làm phim","coban":1,"id" ``\ndef sx(a):\n    n = len(a)\n    for i in range(n - 1):\n        m = i\n        for j in range(i + 1, n):\n            if a[j] < a[m]:\n                m = j\n        a[i], a[m] = a[m], a[i]\n```","y":[{"t":"Đây là thuật toán sắp xếp chọn.","d":true,"gt":"Mỗi lượt chọn phần tử nhỏ nhất của phần chưa sắp."},{"t":"Dãy được sắp xếp tăng dần.","d":true,"gt":"Phần tử nhỏ nhất được đưa về đầu."},{"t":"Với a = [7, 3, 9, 1], sau lượt i = 0 dãy là [3, 7, 9, 1].","d":false,"gt":"Phần tử nhỏ nhất là 1, đổi với 7: [1, 3, 9, 7]."},{"t":"Độ phức tạp thời gian là O(n²).","d":true,"gt":"Hai vòng lặp lồng nhau."}],"id":"11KF055"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"TF","nguon":"Tin 11 KHMT - Bài 24","q":"Cho đoạn chương trình (n là số nguyên dương):\n```\nd = 0\nfor i in range(n):\n    for j in range(i, n):\n        d = d + 1\nprint(d)\n```","y":[{"t":"Với n = 3, chương trình in ra 6.","d":true,"gt":"3 + 2 + 1 = 6."},{"t":"Độ phức tạp thời gian là O(n).","d":false,"gt":"Số lần lặp n(n+1)/2 nên O(n²)."},{"t":"Khi n tăng 10 lần, thời gian chạy tăng khoảng 100 lần.","d":true,"gt":"O(n²)."},{"t":"Lệnh d = d + 1 được thực hiện đúng n² lần.","d":false,"gt":"Chỉ n(n+1)/2 lần."}],"id":"11KF056"},{"lop":11,"cd":"F","md":"H","dh":"CS","dang":"TF","nguon":"Tin 11 KHMT - Bài 23-28","q":"Về kiểm thử và thiết kế chương trình:","y":[{"t":"Kiểm thử cần cả dữ liệu thông thường và dữ liệu biên, đặc biệt.","d":true,"gt":"Lỗi thường xuất hiện ở trường hợp biên."},{"t":"Một chương trình chạy đúng với 3 bộ test chắc chắn không còn lỗi.","d":false,"gt":"Kiểm thử không chứng minh được hết lỗi."},{"t":"Làm mịn dần là chia bài toán thành các bài toán con rồi chi tiết hoá dần.","d":true,"gt":"Phương pháp thiết kế từ trên xuống."},{"t":"Mỗi mô đun nên thực hiện một nhiệm vụ rõ ràng.","d":true,"gt":"Giúp dễ kiểm thử và tái sử dụng."}],"id":"11KF057"},{"lop":12,"cd":"B","md":"H","dh":"CS","dang":"TF","nguon":"Tin 12 KHMT - Bài 22-24","q":"Trường THPT A thiết kế lại mạng: các phòng máy dùng cáp xoắn ","o":["24","28","12","6"],"a":0,"gt":"Ước của 12: 1, 2, 3, 4, 6, 12. Các ước chẵn: 2, 4, 6, 12, tổng 24.","id":"10CF083"},{"lop":10,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 21","q":"Cho đoạn chương trình:\n```\na, b = 48, 18\nwhile b != 0:\n    a, b = b, a % b\nprint(a)\n```\nKết quả in ra và ý nghĩa của chương trình là","o":["6, tìm ước chung lớn nhất của 48 và 18","18, tìm số nhỏ hơn","144, tìm bội chung nhỏ nhất","0, tìm số dư cuối cùng"],"a":0,"gt":"(48,18) → (18,12) → (12,6) → (6,0). In ra 6; đây là thuật toán Euclid tìm ƯCLN.","id":"10CF084"},{"lop":10,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 22, 23","q":"Cho đoạn chương trình:\n```\na = [5, 2, 8, 2, 9]\nb = a\nb.append(1)\na.remove(2)\nprint(len(b), a.count(2), b[1])\n```\nKết quả in ra là","o":["5 1 8","6 1 2","5 2 8","6 2 2"],"a":0,"gt":"b = a tham chiếu cùng một danh sách. Sau append: [5,2,8,2,9,1]; remove(2) xoá số 2 đầu tiên: [5,8,2,9,1]. len = 5, còn một số 2, b[1] = 8.","id":"10CF085"},{"lop":10,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 24, 25","q":"Cho đoạn chương trình:\n```\ns = \"Ha Noi mua thu\"\nt = \"\"\nfor tu in s.split():\n    t = t + tu[0].upper()\nprint(t, s.find(\"o\"), s[-3:])\n```\nKết quả in ra là","o":["HNMT 4 thu","HNMT 5 thu","hnmt 4 hu","HNMT 4 thu thu"],"a":0,"gt":"Ghép chữ cái đầu viết hoa: HNMT. Kí tự \"o\" đầu tiên ở chỉ số 4 (\"Ha Noi\": H0 a1 dấu cách 2 N3 o4). s[-3:] là \"thu\".","id":"10CF086"},{"lop":10,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 26, 27, 28","q":"Cho đoạn chương trình:\n```\ndef f(a, b=3):\n    a = a * b\n    return a + 1\nx = 2\ny = f(x) + f(x, 1)\nprint(x, y)\n```\nKết quả in ra là","o":["2 10","6 10","2 9","6 7"],"a":0,"gt":"f(2) = 2×3 + 1 = 7; f(2, 1) = 2×1 + 1 = 3; y = 10. Biến a là cục bộ nên x vẫn bằng 2.","id":"10CF087"},{"lop":10,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 29, 30","q":"Chương trình sau dùng để tính trung bình các số dương được nhập (nhập 0 để dừng). Khi chạy, chương trình báo lỗi với một bộ dữ liệu. Lỗi xảy ra với bộ dữ liệu nào?\n```\ns = 0\nd = 0\nx = int(input())\nwhile x != 0:\n    if x > 0:\n        s = s + x\n        d = d + 1\n    x = int(input())\nprint(s / d)\n```","o":["Nhập -3, -5, 0","Nhập 4, 6, 0","Nhập 7, -2, 0","Nhập 1, 0"],"a":0,"gt":"Khi không có số dương nào, d = 0 nên s / d gây lỗi ZeroDivisionError lúc chạy. Cần kiểm tra d > 0 trước khi chia.","id":"10CF088"},{"lop":10,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 4, 5","q":"Cho x = 0101 1100₂ và y = 0011 1010₂. Kết quả của phép x AND y theo từng bit là","o":["0001 1000₂","0111 1110₂","0110 0110₂","1000 0001₂"],"a":0,"gt":"AND từng cặp bit: 0&0,1&0,0&1,1&1 = 0001; 1&1,1&0,0&1,0&0 = 1000. Kết quả 0001 1000₂.","id":"10CA037"},{"lop":10,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 6","q":"Một đoạn âm thanh dài 10 giây được số hoá với tần số lấy mẫu 8 000 lần/giây, mỗi mẫu 8 bit, một kênh. Dung lượng (không nén) là","o":["80 000 byte","640 000 byte","80 byte","10 000 byte"],"a":0,"gt":"10 × 8 000 = 80 000 mẫu, mỗi mẫu 8 bit = 1 byte, nên 80 000 byte.","id":"10CA038"},{"lop":10,"cd":"D","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 9","q":"Bạn Hùng dùng chung một mật khẩu cho email, mạng xã hội và tài khoản game; một trang game bị lộ dữ liệu. Nguy cơ lớn nhất và biện pháp phù hợp là","o":["Kẻ gian dùng mật khẩu đó đăng nhập các tài khoản khác; cần đổi mật khẩu riêng cho từng tài khoản và bật xác thực hai lớp","Máy tính bị nhiễm virus ngay lập tức; cần cài lại hệ điều hành","Tài khoản game bị xoá; cần tạo tài khoản mới","Không có nguy cơ vì chỉ trang game bị lộ"],"a":0,"gt":"Dùng chung mật khẩu khiến một vụ lộ dữ liệu ảnh hưởng mọi tài khoản.","id":"10CD020"},{"lop":11,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 11 - Bài 4","q":"Mạch logic có đầu ra Z = NOT(A AND B) OR (B XOR C). Với A = 1, B = 1, C = 1 thì Z bằng","o":["0","1","Không xác định","2"],"a":0,"gt":"A AND B = 1, NOT = 0; B XOR C = 0; 0 OR 0 = 0.","id":"11CA011"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 11 - Bài 13","q":"Bảng MUON(MaHS, MaSach, NgayMuon) ghi việc mượn sách; một học sinh có thể mượn cùng một cuốn sách nhiều lần ở các ngày khác nhau. Khoá chính phù hợp nhất là","o":["(MaHS, MaSach, NgayMuon)","(MaHS, MaSach)","MaHS","MaSach"],"a":0,"gt":"Cặp (MaHS, MaSach) có thể lặp lại ở các ngày khác nhau nên cần thêm NgayMuon để xác định duy nhất mỗi lần mượn.","id":"11CF009"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 11 - Bài 14","q":"Bảng DIEM(MaHS, Mon, Diem) có dữ liệu:\n```\nHS1 Tin 8 | HS1 Toan 6 | HS2 Tin 9 | HS2 Toan 7 | HS3 Tin 5\n```\nCâu truy vấn SELECT MaHS FROM DIEM WHERE Mon = 'Tin' AND Diem > 7 ORDER BY Diem DESC; trả về","o":["HS2, HS1","HS1, HS2","HS2, HS1, HS3","HS2"],"a":0,"gt":"Điểm Tin > 7: HS1 (8), HS2 (9). Sắp giảm dần theo điểm: HS2 rồi HS1.","id":"11CF010"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 11 - Bài 14","q":"Bảng LOP(MaLop, TenLop) có 3 lớp; bảng HOCSINH(MaHS, HoTen, MaLop) có 10 học sinh, trong đó 2 học sinh có MaLop không có trong bảng LOP (dữ liệu nhập lỗi khi chưa đặt ràng buộc). Truy vấn HOCSINH INNER JOIN LOP ON HOCSINH.MaLop = LOP.MaLop trả về bao nhiêu dòng?","o":["8","10","30","3"],"a":0,"gt":"INNER JOIN chỉ giữ các cặp thoả điều kiện kết nối; 2 học sinh không khớp lớp nào bị loại.","id":"11CF011"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 11 - Bài 14","q":"Câu lệnh nào tăng 0,5 điểm Tin cho các học sinh lớp 11A2 có điểm dưới 5?","o":["UPDATE HOCSINH SET DiemTin = DiemTin + 0.5 WHERE Lop = '11A2' AND DiemTin < 5;","UPDATE HOCSINH SET DiemTin = DiemTin + 0.5 WHERE Lop = '11A2' OR DiemTin < 5;","UPDATE HOCSINH SET DiemTin = 0.5 WHERE Lop = '11A2' AND DiemTin < 5;","INSERT INTO HOCSINH (DiemTin) VALUES (DiemTin + 0.5);"],"a":0,"gt":"Phải kết hợp hai điều kiện bằng AND; OR sẽ cộng điểm cho cả lớp 11A2 và mọi học sinh dưới 5 điểm.","id":"11CF012"},{"lop":11,"cd":"F","md":"H","dh":"chung","dang":"MC","nguon":"Tin 11 - Bài 12, 15","q":"Hệ quản trị CSDL kiểm soát truy cập đồng thời nhằm","o":["tránh xung đột khi nhiều người cùng cập nhật một dữ liệu, đảm bảo dữ liệu nhất quán","cho phép mọi người sửa dữ liệu mà không cần mật khẩu","tăng dung lượng ổ cứng","tự động xoá dữ liệu cũ"],"a":0,"gt":"Ví dụ hai người cùng đặt một chỗ ngồi; hệ quản trị đảm bảo chỉ một giao dịch thành công.","id":"11CF013"},{"lop":11,"cd":"C","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 11 - Bài 7","q":"Em cần tìm các bài báo về \"trí tuệ nhân tạo\" nhưng không lấy kết quả về \"ChatGPT\", chỉ trong trang vnexpress.net. Câu truy vấn phù hợp là","o":["\"trí tuệ nhân tạo\" -ChatGPT site:vnexpress.net","trí tuệ nhân tạo +ChatGPT vnexpress","\"trí tuệ nhân tạo\" ChatGPT site vnexpress.net","trí tuệ nhân tạo NOT site:vnexpress.net"],"a":0,"gt":"Nháy kép tìm chính xác cụm từ; dấu trừ loại từ khoá; site: giới hạn trang.","id":"11CC005"},{"lop":10,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 10 - Bài 22-27","q":"Cho chương trình:\n```\ndef dem(a, k):\n    c = 0\n    for x in a:\n        if x >= k:\n            c += 1\n    return c\n\na = [7, 3, 9, 3, 10]\na.sort()\nprint(a[1], dem(a, 7), a.index(9))\n```","y":[{"t":"Sau lệnh a.sort(), danh sách là [3, 3, 7, 9, 10].","d":true,"gt":"sort() sắp tăng dần."},{"t":"Chương trình in ra \"3 2 3\".","d":false,"gt":"dem(a, 7) đếm 7, 9, 10 nên bằng 3; kết quả \"3 3 3\"."},{"t":"a.index(9) cho giá trị 3.","d":true,"gt":"9 ở chỉ số 3 sau khi sắp xếp."},{"t":"Nếu thay x >= k bằng x > k thì dem(a, 7) bằng 2.","d":true,"gt":"Chỉ còn 9 và 10."}],"id":"10CF089"},{"lop":10,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 10 - Bài 24, 25","q":"Cho chương trình:\n```\ns = input()            # người dùng nhập: abcba\nt = s[::-1]\nprint(t == s, s.count(\"b\"), s.upper()[1:3])\n```","y":[{"t":"t là xâu đảo ngược của s.","d":true,"gt":"Cắt xâu với bước -1."},{"t":"Biểu thức t == s cho giá trị True.","d":true,"gt":"\"abcba\" đọc xuôi ngược như nhau."},{"t":"s.count(\"b\") bằng 1.","d":false,"gt":"Có hai kí tự b."},{"t":"s.upper()[1:3] cho kết quả \"BCB\".","d":false,"gt":"Lấy chỉ số 1 và 2: \"BC\"."}],"id":"10CF090"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 11 - Bài 13, 14, 15","q":"CSDL quản lí thư viện: SACH(MaSach, TenSach, SoLuong), DOCGIA(MaDG, HoTen, Lop), MUON(MaDG, MaSach, NgayMuon, NgayTra). MaDG và MaSach của MUON là khoá ngoài.","y":[{"t":"Truy vấn liệt kê tên sách mà học sinh mã DG05 đã mượn cần kết nối MUON với SACH.","d":true,"gt":"Tên sách nằm ở SACH."},{"t":"Lệnh DELETE FROM DOCGIA WHERE MaDG = 'DG05'; luôn thực hiện thành công kể cả khi DG05 còn phiếu mượn.","d":false,"gt":"Vi phạm ràng buộc khoá ngoài."},{"t":"Câu lệnh SELECT MaDG FROM MUON WHERE NgayTra IS NULL; liệt kê độc giả đang mượn chưa trả.","d":true,"gt":"NgayTra trống nghĩa là chưa trả."},{"t":"Để chỉ thủ thư được sửa SoLuong, cách tốt nhất là ghi chú lên bảng.","d":false,"gt":"Cần phân quyền người dùng trong hệ quản trị CSDL."}],"id":"11CF014"},{"lop":11,"cd":"A","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 11 - Bài 1, 4, 5","q":"Máy tính của phòng thư viện khởi động rất chậm, hay treo khi mở nhiều tab trình duyệt; máy có 4 GB RAM, ổ HDD.","y":[{"t":"Thiếu RAM có thể khiến hệ điều hành phải dùng ổ đĩa làm bộ nhớ tạm, làm máy chậm.","d":true,"gt":"Bộ nhớ ảo trên ổ đĩa chậm hơn RAM nhiều."},{"t":"Thay ổ HDD bằng SSD giúp khởi động nhanh hơn.","d":true,"gt":"SSD đọc ghi nhanh hơn."},{"t":"Tăng độ phân giải màn hình sẽ giúp máy chạy nhanh hơn.","d":false,"gt":"Không liên quan, thậm chí tốn tài nguyên hơn."},{"t":"Dùng trình quản lí tác vụ để xem chương trình nào chiếm nhiều CPU, RAM.","d":true,"gt":"Task Manager."}],"id":"11CA012"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 11 KHMT - Bài 17, 18","q":"Cho đoạn chương trình:\n```\na = [[1, 2, 3],\n     [4, 5, 6],\n     [7, 8, 9]]\ns = 0\nfor i in range(3):\n    s = s + a[i][2 - i]\nprint(s)\n```\nKết quả in ra là","o":["15","12","18","24"],"a":0,"gt":"Duyệt đường chéo phụ: a[0][2] = 3, a[1][1] = 5, a[2][0] = 7; tổng 15.","id":"11KF058"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 11 KHMT - Bài 19","q":"Áp dụng tìm kiếm nhị phân (giữa = (trái + phải) // 2) tìm k = 4 trong dãy [1, 3, 5, 7, 9, 11, 13]. Số lần so sánh a[giữa] với k trước khi kết luận không tìm thấy là","o":["3","2","4","7"],"a":0,"gt":"Lần 1: giữa 3 (7) > 4 → phải = 2. Lần 2: giữa 1 (3) < 4 → trái = 2. Lần 3: giữa 2 (5) > 4 → phải = 1 < trái, dừng.","id":"11KF059"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 11 KHMT - Bài 21","q":"Sắp xếp nổi bọt dãy [3, 1, 4, 1, 5] (tăng dần, mỗi lượt duyệt từ đầu đến cuối phần chưa sắp xếp). Tổng số lần đổi chỗ cho đến khi dãy được sắp xếp là","o":["3","2","4","5"],"a":0,"gt":"Lượt 1: (3,1) đổi → [1,3,4,1,5]; (4,1) đổi → [1,3,1,4,5]. Lượt 2: (3,1) đổi → [1,1,3,4,5]. Tổng 3 lần; số lần đổi chỗ bằng số cặp nghịch thế.","id":"11KF060"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 11 KHMT - Bài 24","q":"Đoạn chương trình nào có độ phức tạp thời gian O(n log n)?","o":["for i in range(n): (bên trong) j = 1; while j < n: j = j * 2","for i in range(n): for j in range(n): s += 1","for i in range(n): s += i","i = n; while i > 1: i = i // 2"],"a":0,"gt":"Vòng ngoài n lần, vòng trong nhân đôi j nên khoảng log n lần: tổng O(n log n). Hai phương án kế là O(n²), O(n); phương án cuối là O(log n).","id":"11KF061"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 11 KHMT - Bài 21, 24","q":"Cho thuật toán sắp xếp chèn:\n```\ndef chen(a):\n    for i in range(1, len(a)):\n        x = a[i]; j = i - 1\n        while j >= 0 and a[j] > x:\n            a[j + 1] = a[j]; j -= 1\n        a[j + 1] = x\n```\nÁp dụng cho a = [5, 2, 4, 6, 1].","y":[{"t":"Sau khi xử lí xong i = 2, dãy là [2, 4, 5, 6, 1].","d":true,"gt":"i=1 chèn 2: [2,5,4,6,1]; i=2 chèn 4: [2,4,5,6,1]."},{"t":"Khi i = 3, phần tử 6 phải dịch chuyển 3 vị trí.","d":false,"gt":"6 lớn hơn mọi phần tử trước nên không dịch chuyển."},{"t":"Khi i = 4, vòng while thực hiện 4 lần dịch chuyển.","d":true,"gt":"1 nhỏ hơn cả 2, 4, 5, 6."},{"t":"Với dãy đã sắp xếp tăng dần, sắp xếp chèn vẫn có độ phức tạp O(n²).","d":false,"gt":"Trường hợp tốt nhất chỉ O(n) vì vòng while không chạy."}],"id":"11KF062"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 11 KHMT - Bài 23, 26, 28","q":"Nhóm học sinh viết chương trình quản lí điểm theo phương pháp làm mịn dần và thiết kế mô đun: hàm nhap(), tinh_tb(ds), xep_loai(tb), in_ket_qua().","y":[{"t":"Mỗi hàm có thể được kiểm thử riêng trước khi ghép lại.","d":true,"gt":"Ưu điểm của thiết kế mô đun."},{"t":"Bộ test cho xep_loai nên có các giá trị biên như 4.9, 5.0, 6.5, 8.0.","d":true,"gt":"Lỗi thường ở điểm biên."},{"t":"tinh_tb([]) trả về kết quả đúng mà không cần xử lí gì thêm.","d":false,"gt":"Danh sách rỗng gây chia cho 0; cần xử lí riêng."},{"t":"Có thể đưa các hàm vào một mô đun riêng để dùng lại bằng lệnh import.","d":true,"gt":"Thiết lập thư viện chương trình."}],"id":"11KF063"},{"lop":12,"cd":"B","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 12 KHMT - Bài 22, 23, 24","q":"Trường cần mạng cho 3 toà nhà (A, B cách nhau 80 m; A, C cách nhau 600 m), mỗi toà có 1 phòng máy 40 máy và cần Wi-Fi ở sân trường.","y":[{"t":"Nối A với C nên dùng cáp quang.","d":true,"gt":"600 m vượt giới hạn khoảng 100 m của cáp xoắn đôi."},{"t":"Trong mỗi phòng máy, các máy nối tới switch bằng cáp xoắn đôi là hợp lí.","d":true,"gt":"Khoảng cách ngắn, chi phí thấp."},{"t":"Để phủ sóng sân trường chỉ cần tăng số cổng của switch.","d":false,"gt":"Cần điểm truy cập không dây (WAP)."},{"t":"Cần có router để kết nối mạng của trường ra Internet.","d":true,"gt":"Định tuyến giữa LAN và Internet."}],"id":"12KB023"},{"lop":12,"cd":"F","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 12 KHMT - Bài 25","q":"Bệnh viện xây dựng mô hình học máy sàng lọc bệnh tim từ hồ sơ 5 000 bệnh nhân (tuổi, huyết áp, cholesterol...) đã được bác sĩ kết luận có bệnh hoặc không.","y":[{"t":"Đây là bài toán phân loại theo học có giám sát.","d":true,"gt":"Dữ liệu có nhãn có/không bệnh."},{"t":"Nên dùng toàn bộ 5 000 hồ sơ để huấn luyện rồi đánh giá trên chính các hồ sơ đó.","d":false,"gt":"Cần tách dữ liệu kiểm tra riêng để đánh giá khách quan."},{"t":"Nếu dữ liệu chủ yếu từ một nhóm tuổi, mô hình có thể dự đoán kém với nhóm khác.","d":true,"gt":"Dữ liệu thiếu đại diện gây sai lệch."},{"t":"Mô hình đạt độ chính xác cao thì có thể thay bác sĩ kết luận chẩn đoán.","d":false,"gt":"Chỉ hỗ trợ; bác sĩ chịu trách nhiệm quyết định."}],"id":"12KF040"},{"lop":12,"cd":"F","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 12 KHMT - Bài 26, 27, 28","q":"Công ty xe khách phân tích dữ liệu bán vé 3 năm (hàng triệu bản ghi) để dự báo nhu cầu đi lại dịp Tết.","y":[{"t":"Cần làm sạch dữ liệu như bỏ bản ghi trùng, xử lí giá trị trống trước khi phân tích.","d":true,"gt":"Tiền xử lí dữ liệu."},{"t":"Máy tính có năng lực tính toán song song giúp xử lí khối lượng dữ liệu lớn nhanh hơn.","d":true,"gt":"Vai trò của máy tính trong khoa học dữ liệu."},{"t":"Biểu đồ số vé theo ngày không giúp ích gì cho việc dự báo.","d":false,"gt":"Trực quan hoá giúp phát hiện xu hướng, mùa vụ."},{"t":"Nếu số vé tăng cùng lúc với lượng mưa thì có thể kết luận mưa là nguyên nhân làm tăng số vé.","d":false,"gt":"Tương quan không phải nhân quả."}],"id":"12KF041"},{"lop":12,"cd":"F","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 12 KHMT - Bài 29, 30","q":"Giáo viên Vật lí dùng phần mềm mô phỏng (như PhET) để học sinh khảo sát chuyển động của con lắc đơn.","y":[{"t":"Học sinh có thể thay đổi chiều dài dây, khối lượng để quan sát ảnh hưởng tới chu kì.","d":true,"gt":"Thí nghiệm trên mô hình."},{"t":"Mô phỏng giúp quan sát cả những điều kiện khó tạo ra trong thực tế như không có lực cản.","d":true,"gt":"Ưu điểm của mô phỏng."},{"t":"Kết quả mô phỏng hoàn toàn trùng với mọi phép đo thực tế.","d":false,"gt":"Mô hình là đơn giản hoá nên có sai số."},{"t":"Mô phỏng dựa trên mô hình toán học mô tả hiện tượng.","d":true,"gt":"Cơ sở của mô phỏng."}],"id":"12KF042"},{"lop":11,"cd":"E","md":"V","dh":"ICT","dang":"MC","kho":1,"nguon":"Tin 11 THUD - Bài 26","q":"Trong GIMP, ảnh chụp có một người lạ ở góc trên nền trời xanh đồng màu. Quy trình xoá người lạ hợp lí nhất là","o":["Dùng Clone lấy mẫu vùng trời bên cạnh rồi tô đè lên người lạ, sau đó dùng Heal làm mịn vùng chuyển tiếp","Dùng Eraser xoá người lạ rồi lưu JPEG","Dùng Crop cắt bỏ toàn bộ nửa trên ảnh","Dùng Bucket Fill tô đen người lạ"],"a":0,"gt":"Clone sao chép điểm ảnh từ vùng nguồn; Heal hoà màu với xung quanh. Eraser tạo vùng trống.","id":"11UE076"},{"lop":11,"cd":"E","md":"V","dh":"ICT","dang":"MC","kho":1,"nguon":"Tin 11 THUD - Bài 26","q":"Muốn chỉ làm sáng khuôn mặt mà không làm thay đổi phông nền, trong GIMP cần","o":["Tạo vùng chọn quanh khuôn mặt (ví dụ Free Select) rồi mới dùng Curves hoặc Levels","Dùng Curves cho toàn ảnh rồi dùng Crop","Tăng Brightness cho toàn ảnh","Dùng Rotate xoay ảnh"],"a":0,"gt":"Các công cụ chỉnh màu chỉ tác động trong vùng chọn nếu có vùng chọn.","id":"11UE077"},{"lop":11,"cd":"F","md":"V","dh":"ICT","dang":"MC","kho":1,"nguon":"Tin 11 THUD - Bài 19, 20","q":"Khi tạo bảng HOCSINH trong HeidiSQL với trường MaHS kiểu INT AUTO_INCREMENT làm khoá chính, và MaLop là khoá ngoài tới LOP(MaLop). Thêm bản ghi ('Lan', '12A9') báo lỗi. Nguyên nhân có khả năng nhất là","o":["Bảng LOP chưa có lớp '12A9' nên vi phạm ràng buộc khoá ngoài","Chưa nhập giá trị MaHS","HoTen không được chứa chữ có dấu","AUTO_INCREMENT chỉ dùng cho kiểu VARCHAR"],"a":0,"gt":"MaHS tự tăng nên không cần nhập; giá trị khoá ngoài phải tồn tại ở bảng được tham chiếu.","id":"11UF028"},{"lop":11,"cd":"E","md":"V","dh":"ICT","dang":"TF","kho":1,"nguon":"Tin 11 THUD - Bài 25-28","q":"Mai làm thiệp chúc mừng 20/11 bằng GIMP: ảnh nền hoa, ảnh lớp học được tách khỏi phông, dòng chữ và một ảnh động lấp lánh.","y":[{"t":"Để tách ảnh lớp học có phông nền đồng màu, có thể dùng Fuzzy Select rồi đảo vùng chọn.","d":true,"gt":"Chọn phông theo màu rồi đảo để lấy đối tượng."},{"t":"Dòng chữ chèn bằng Text Tool sẽ tự gộp vào lớp ảnh nền.","d":false,"gt":"Text Tool tạo một lớp văn bản riêng."},{"t":"Để ảnh động lấp lánh, mỗi khung hình đặt trên một lớp và xuất GIF ở chế độ ảnh động.","d":true,"gt":"Tạo ảnh động trong GIMP."},{"t":"Lưu thiệp ở định dạng PNG vẫn giữ được các lớp để chỉnh sửa năm sau.","d":false,"gt":"Chỉ XCF giữ lớp."}],"id":"11UE078"},{"lop":11,"cd":"E","md":"V","dh":"ICT","dang":"TF","kho":1,"nguon":"Tin 11 THUD - Bài 29, 30, 31","q":"Nhóm Hùng dựng phim 3 phút giới thiệu CLB bằng VideoPad: 5 đoạn quay, ảnh chụp, nhạc nền và lời dẫn.","y":[{"t":"Nhạc nền và lời dẫn nên đặt trên các đường âm thanh khác nhau để chỉnh âm lượng riêng.","d":true,"gt":"Mỗi track độc lập."},{"t":"Hiệu ứng Fade giúp phần đầu và cuối phim xuất hiện, biến mất nhẹ nhàng.","d":true,"gt":"Hiệu ứng mờ dần."},{"t":"Muốn phim dài đúng 3 phút chỉ có cách tăng tốc độ phát các đoạn quay.","d":false,"gt":"Có thể cắt bớt đoạn (split, trim)."},{"t":"Tệp dự án VideoPad có thể gửi cho bạn để xem trên điện thoại như một video.","d":false,"gt":"Phải xuất (export) ra tệp video."}],"id":"11UE079"},{"lop":12,"cd":"F","md":"V","dh":"ICT","dang":"TF","kho":1,"nguon":"Tin 12 THUD - Bài 23-28","q":"Bệnh viện huyện nhờ học sinh làm website giới thiệu bằng Google Sites với các trang: Giới thiệu, Chuyên khoa, Lịch khám (nhúng Google Calendar), Đặt lịch (biểu mẫu Google Forms), Liên hệ (bản đồ).","y":[{"t":"Lịch khám có thể nhúng trực tiếp lịch Google để tự cập nhật khi bệnh viện sửa lịch.","d":true,"gt":"Chức năng Chèn/nhúng."},{"t":"Trang Đặt lịch dùng Google Forms, câu trả lời được lưu vào trang tính.","d":true,"gt":"Thu thập dữ liệu."},{"t":"Sau khi bệnh viện đổi số điện thoại ở chân trang, người xem thấy ngay mà không cần xuất bản lại.","d":false,"gt":"Cần xuất bản lại."},{"t":"Biểu mẫu đặt lịch nên yêu cầu nhập số căn cước và tiền sử bệnh chi tiết của mọi người truy cập.","d":false,"gt":"Chỉ thu thập dữ liệu cần thiết, bảo vệ thông tin cá nhân."}],"id":"12UF033"},{"lop":12,"cd":"F","md":"V","dh":"ICT","dang":"TF","kho":1,"nguon":"Tin 12 THUD - Bài 24, 25, 26","q":"Khi dựng website trường bằng Google Sites:","y":[{"t":"Thanh điều hướng được tạo tự động từ danh sách các trang trong mục Trang (Pages).","d":true,"gt":"Thêm trang là thêm vào điều hướng."},{"t":"Có thể ẩn một trang khỏi thanh điều hướng mà vẫn truy cập được qua liên kết.","d":true,"gt":"Tuỳ chọn ẩn khỏi điều hướng."},{"t":"Muốn đổi phông chữ của toàn website phải sửa từng hộp văn bản.","d":false,"gt":"Đổi trong Giao diện (Themes)."},{"t":"Ảnh tiêu đề trang (header) nên có độ phân giải đủ lớn để không bị vỡ khi hiển thị toàn chiều rộng.","d":true,"gt":"Header hiển thị rộng."}],"id":"12UF034"},{"lop":12,"cd":"A","md":"B","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 1","q":"Năm 1950, nhà khoa học nào đưa ra một phép thử để đánh giá khả năng của máy tính trong việc thể hiện hành vi thông minh?","o":["Alan Turing","John von Neumann","Tim Berners-Lee","Bill Gates"],"a":0,"gt":"Theo SGK, năm 1950 Alan Turing đưa ra \"phép thử Turing\". Năm 1956, Hội thảo Dartmouth (Mỹ) mới đánh dấu sự ra đời của lĩnh vực AI.","id":"12CA010"},{"lop":12,"cd":"A","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 1","q":"MYCIN, phát triển tại Đại học Stanford từ năm 1972, là ví dụ tiêu biểu của loại hệ thống AI nào?","o":["Hệ chuyên gia dựa trên luật suy diễn, hỗ trợ chẩn đoán bệnh nhiễm khuẩn","AI tổng quát có khả năng làm mọi việc như con người","Robot tự hành trong nhà máy","Hệ thống nhận dạng khuôn mặt bằng camera"],"a":0,"gt":"MYCIN có khoảng 600 luật suy diễn, hỏi bác sĩ về triệu chứng rồi đưa ra danh sách vi khuẩn có thể gây bệnh. Đây là AI hẹp thuộc loại hệ chuyên gia.","id":"12CA011"},{"lop":12,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 1","q":"Xét bốn hệ thống: (1) đèn hành lang tự bật khi cảm biến phát hiện chuyển động; (2) ứng dụng nghe nhạc đề xuất bài hát dựa trên thói quen nghe; (3) camera bãi xe đọc biển số; (4) máy giặt chạy theo chương trình cài sẵn. Những hệ thống nào thể hiện đặc trưng của AI?","o":["(2) và (3)","(1) và (4)","(1), (2) và (3)","Cả bốn hệ thống"],"a":0,"gt":"(2) học từ dữ liệu thói quen (khả năng học); (3) nhận thức hình ảnh (thị giác máy tính). (1) và (4) chỉ tự động hoá theo quy tắc cố định. SGK nhấn mạnh: không phải hệ thống tự động hoá nào cũng là AI.","id":"12CA012"},{"lop":12,"cd":"A","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 2","q":"Theo SGK, nhiều ứng dụng AI hiện nay là các \"hộp đen\". Điều này dẫn tới nguy cơ nào?","o":["Khó hiểu được quyết định được đưa ra như thế nào, dẫn đến thiếu minh bạch và trách nhiệm giải trình","Máy tính bị quá nhiệt khi chạy AI","Dữ liệu không thể lưu trữ trên đám mây","AI không thể kết nối Internet"],"a":0,"gt":"Bốn cảnh báo trong SGK: áp lực thất nghiệp; ảnh hưởng quyền riêng tư; khả năng thiếu minh bạch (hộp đen); rủi ro về an ninh, an toàn.","id":"12CA013"},{"lop":12,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 2","q":"Kẻ xấu xâm nhập hệ thống AI chẩn đoán hình ảnh y tế trực tuyến và sửa đổi dữ liệu huấn luyện khiến hệ thống chẩn đoán sai. Tình huống này minh hoạ cho cảnh báo nào trong SGK?","o":["Rủi ro về an ninh, an toàn","Áp lực thất nghiệp","Ảnh hưởng quyền riêng tư","Khả năng thiếu minh bạch"],"a":0,"gt":"SGK nêu ứng dụng AI triển khai trực tuyến có thể bị tấn công thay đổi dữ liệu và mô hình, dẫn tới quyết định sai gây nguy hại trực tiếp cho con người (ví dụ chẩn đoán sai bệnh).","id":"12CA014"},{"lop":12,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 2","q":"Một ứng dụng chỉnh ảnh miễn phí yêu cầu quyền truy cập toàn bộ ảnh, danh bạ và vị trí, rồi dùng dữ liệu đó để huấn luyện AI. Nguy cơ nổi bật nhất theo các cảnh báo trong SGK là","o":["ảnh hưởng quyền riêng tư do thu thập lượng lớn dữ liệu cá nhân","áp lực thất nghiệp với thợ chụp ảnh","ảnh chỉnh xong có dung lượng lớn","khả năng thiếu minh bạch về giá"],"a":0,"gt":"Ứng dụng AI dựa vào thu thập dữ liệu cá nhân làm tăng nguy cơ quyền riêng tư bị lạm dụng.","id":"12CA015"},{"lop":12,"cd":"B","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 3","q":"Vì sao mạng gia đình ít thiết bị vẫn có thể dùng hub thay cho switch?","o":["Vì ít thiết bị nên ít xảy ra xung đột tín hiệu, trong khi hub rẻ hơn nhiều so với switch cùng số cổng","Vì hub tự động định tuyến ra Internet","Vì hub có tốc độ cao hơn switch","Vì hub mã hoá dữ liệu"],"a":0,"gt":"Hub gửi tín hiệu tới mọi cổng nên dễ xung đột khi nhiều máy cùng truyền; mạng nhỏ chấp nhận được để tiết kiệm chi phí.","id":"12CB014"},{"lop":12,"cd":"B","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 3, 4","q":"Trong mạng LAN dùng switch, máy A gửi dữ liệu cho máy C. Switch dựa vào thông tin nào để chỉ chuyển dữ liệu tới cổng nối với máy C, và máy B (cùng LAN) xử lí thế nào?","o":["Dựa vào địa chỉ MAC của máy nhận; máy B không nhận được khung dữ liệu đó","Dựa vào tên miền; máy B nhận rồi tự xoá","Dựa vào địa chỉ IP của router; máy B chuyển tiếp cho C","Dựa vào cổng WAN; mọi máy đều nhận được"],"a":0,"gt":"Switch chuyển khung dữ liệu theo địa chỉ MAC tới đúng cổng. Với hub, mọi máy đều nhận nhưng chỉ máy có MAC trùng mới xử lí.","id":"12CB015"},{"lop":12,"cd":"B","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 4","q":"Phát biểu nào đúng khi so sánh địa chỉ MAC và địa chỉ IP (IPv4)?","o":["MAC dài 6 byte gắn với phần cứng; IP dài 4 byte được gán cho thiết bị và có thể thay đổi","MAC dài 4 byte; IP dài 6 byte","Cả hai đều do người dùng tự đặt tùy ý","MAC dùng để định tuyến giữa các mạng trên Internet"],"a":0,"gt":"SGK: MAC là địa chỉ 6 byte gắn với phần cứng; IP là địa chỉ 4 byte gán cho thiết bị, có thể thay đổi. Định tuyến dựa trên địa chỉ IP.","id":"12CB016"},{"lop":12,"cd":"B","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 4","q":"Một router có bảng định tuyến tĩnh:\n```\nĐịa chỉ        Cổng\n126.13.*.*     1   (cổng mặc định)\n172.18.*.*     2\n113.23.12.*    3\n230.17.*.*     4\n```\nGói tin gửi tới địa chỉ 113.23.15.8 sẽ được chuyển qua cổng nào?","o":["Cổng 1","Cổng 3","Cổng 2","Gói tin bị huỷ"],"a":0,"gt":"113.23.15.8 không khớp 113.23.12.* (byte thứ ba là 15, không phải 12) và không khớp các dòng khác, nên gói được gửi theo cổng mặc định là cổng 1.","id":"12CB017"},{"lop":12,"cd":"B","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 4","q":"Khi gọi điện qua Internet, hàng trăm cuộc gọi có thể dùng chung một đường truyền vật lí, còn điện thoại bàn truyền thống thì mỗi cuộc gọi chiếm riêng kênh truyền. Điều này có được nhờ","o":["dữ liệu được chia thành các gói nhỏ, cho phép nhiều cuộc truyền xen kẽ trên cùng đường truyền","mỗi cuộc gọi Internet có một cáp quang riêng","địa chỉ MAC của điện thoại thay đổi liên tục","giao thức SMTP nén giọng nói"],"a":0,"gt":"SGK Bài 4: tách dữ liệu thành nhiều gói cho phép nhiều cuộc truyền thực hiện xen kẽ, tận dụng đường truyền.","id":"12CB018"},{"lop":12,"cd":"B","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 4","q":"Đang xem video trực tuyến và tải tệp cùng lúc trên một máy, dữ liệu của hai ứng dụng không bị lẫn vào nhau là nhờ quy định nào của TCP?","o":["Mỗi ứng dụng được cấp một số hiệu cổng ứng dụng, các gói dữ liệu được gán nhãn cổng","Mỗi ứng dụng dùng một địa chỉ MAC riêng","Router chặn một trong hai ứng dụng","Gói tin của ứng dụng sau luôn đến sau"],"a":0,"gt":"TCP gán nhãn cổng ứng dụng cho các gói, đánh số gói theo từng ứng dụng để ráp lại đúng thứ tự.","id":"12CB019"},{"lop":12,"cd":"B","md":"V","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 4","q":"Các gói tin của một tệp có thể đi theo các đường khác nhau và tới đích không theo thứ tự gửi. Máy nhận vẫn ghép đúng tệp là nhờ","o":["TCP đánh số các gói tin để ráp lại đúng thứ tự","IP gửi lại toàn bộ tệp nhiều lần","Router chỉ cho đi một đường duy nhất","Ethernet sắp xếp các gói theo địa chỉ MAC"],"a":0,"gt":"Gói gửi sau có thể đến trước; TCP đánh số gói và có cơ chế xác nhận, yêu cầu gửi lại gói lỗi hoặc thất lạc.","id":"12CB020"},{"lop":12,"cd":"B","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 5","q":"Trong Windows, để các máy khác trong mạng cục bộ nhìn thấy và truy cập thư mục chia sẻ, cần thiết lập mạng ở chế độ nào và bật tính năng gì?","o":["Mạng riêng (Private), bật cho phép phát hiện (discoverable) và chia sẻ tệp, máy in","Mạng công cộng (Public), tắt tường lửa vĩnh viễn","Chế độ máy bay, bật Bluetooth","Mạng khách (Guest), xoá mật khẩu tài khoản"],"a":0,"gt":"SGK Bài 5: Windows 10 trở đi cho phép đặt mạng riêng (độ tin cậy cao) và bật discoverable, file and printer sharing.","id":"12CB021"},{"lop":12,"cd":"D","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 6","q":"Trong nhóm lớp, một bạn chia sẻ bài viết \"Sắp có bão lớn, trường cho nghỉ học 1 tuần\" từ một trang không rõ nguồn. Ứng xử thể hiện tính nhân văn và trách nhiệm nhất là","o":["Không chia sẻ tiếp, kiểm tra trên trang chính thức của trường, nhắc nhẹ nhàng trong nhóm về nguồn tin","Chia sẻ ngay để mọi người kịp chuẩn bị","Bình luận chế giễu bạn đăng tin sai","Rời khỏi nhóm lớp"],"a":0,"gt":"Ứng xử nhân văn: tôn trọng người khác, không lan truyền tin chưa kiểm chứng, góp ý tế nhị.","id":"12CD005"},{"lop":12,"cd":"F","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 7","q":"Phần tử HTML được hiểu là","o":["thành phần gồm thẻ mở, nội dung và thẻ đóng (với thẻ đôi), có thể kèm thuộc tính","chỉ riêng tên thẻ đặt trong dấu < >","tệp CSS đi kèm trang web","đường dẫn tới trang web"],"a":0,"gt":"Ví dụ <p class=\"a\">Xin chào</p> là một phần tử p gồm thẻ mở có thuộc tính, nội dung và thẻ đóng.","id":"12CF034"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 7, 8","q":"Trình duyệt hiển thị đoạn mã sau thành bao nhiêu dòng văn bản?\n```\n<p>Tin học    là\nmôn học\nthú vị</p><p>Em thích<br>lập trình</p>\n```","o":["3 dòng: \"Tin học là môn học thú vị\", \"Em thích\", \"lập trình\"","5 dòng như trong mã nguồn","2 dòng, mỗi đoạn một dòng","4 dòng vì có 4 khoảng trắng liên tiếp"],"a":0,"gt":"Xuống dòng và nhiều dấu cách trong mã được gộp thành một dấu cách; chỉ <p> tạo đoạn mới và <br> ngắt dòng.","id":"12CF035"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 9","q":"Bảng sau hiển thị có mấy cột (tính theo ô rộng nhất)?\n```\n<table border=\"1\">\n  <tr><th rowspan=\"2\">STT</th><th colspan=\"3\">Điểm</th></tr>\n  <tr><th>Toán</th><th>Văn</th><th>Tin</th></tr>\n  <tr><td>1</td><td>8</td><td>7</td><td>9</td></tr>\n</table>\n```","o":["4 cột","3 cột","5 cột","6 cột"],"a":0,"gt":"Hàng 1: ô STT (gộp 2 hàng) + ô \"Điểm\" gộp 3 cột = 4 cột. Hàng 2 có 3 ô nằm dưới \"Điểm\" (cột 1 bị ô STT chiếm). Hàng 3 có 4 ô.","id":"12CF036"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 9","q":"Đoạn mã nào tạo danh sách có thứ tự gồm \"Mạng\" và \"Web\", trong đó mục \"Web\" có danh sách con không thứ tự gồm \"HTML\", \"CSS\"?","o":["<ol><li>Mạng</li><li>Web<ul><li>HTML</li><li>CSS</li></ul></li></ol>","<ol><li>Mạng</li><li>Web</li></ol><ul><li>HTML</li><li>CSS</li></ul>","<ul><li>Mạng</li><li>Web<ol><li>HTML</li><li>CSS</li></ol></li></ul>","<ol><li>Mạng<li>Web</ol><ul>HTML CSS</ul>"],"a":0,"gt":"Danh sách lồng nhau: đặt danh sách con bên trong phần tử <li> của mục cha.","id":"12CF037"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 10","q":"Website có cấu trúc: thư mục gốc chứa index.html và thư mục tintuc; tintuc chứa bai1.html và thư mục anh (chứa logo.png). Trong bai1.html, đường dẫn tương đối đúng tới index.html và tới logo.png lần lượt là","o":["../index.html và anh/logo.png","index.html và tintuc/anh/logo.png","/index.html và ../anh/logo.png","../../index.html và logo.png"],"a":0,"gt":"bai1.html nằm trong tintuc: lên một cấp bằng \"..\" để tới index.html; logo.png nằm trong thư mục con anh của tintuc.","id":"12CF038"},{"lop":12,"cd":"F","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 10","q":"Theo SGK, khi liên kết tới một tài liệu nằm trên máy chủ khác trên Internet, cần dùng","o":["đường dẫn tuyệt đối gồm giao thức, tên miền và đường dẫn chi tiết","đường dẫn tương đối bắt đầu bằng ../","thuộc tính src thay cho href","thẻ <link> trong phần head"],"a":0,"gt":"Tài liệu không nằm trên máy chủ của mình phải dùng đường dẫn tuyệt đối, ví dụ https://...","id":"12CF039"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 11","q":"Muốn trình duyệt chọn tệp video phù hợp nhất trong hai tệp phim.webm và phim.mp4, đồng thời hiển thị nút điều khiển, đoạn mã đúng là","o":["<video controls><source src=\"phim.webm\" type=\"video/webm\"><source src=\"phim.mp4\" type=\"video/mp4\"></video>","<video src=\"phim.webm, phim.mp4\" controls></video>","<video controls><img src=\"phim.webm\"><img src=\"phim.mp4\"></video>","<source controls><video src=\"phim.webm\"><video src=\"phim.mp4\"></source>"],"a":0,"gt":"SGK Bài 11: dùng nhiều thẻ <source> trong <video>; trình duyệt chọn tệp đầu tiên mà nó hỗ trợ.","id":"12CF040"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 12","q":"Biểu mẫu khảo sát có câu \"Em dùng thiết bị nào để học trực tuyến?\" cho chọn nhiều thiết bị và câu \"Khối lớp\" chọn một trong 10, 11, 12 dưới dạng danh sách thả xuống. Cách tạo đúng là","o":["Câu 1 dùng các <input type=\"checkbox\">; câu 2 dùng <select> với các <option>","Câu 1 dùng <input type=\"radio\">; câu 2 dùng <textarea>","Câu 1 dùng <select>; câu 2 dùng các <input type=\"checkbox\">","Cả hai dùng <input type=\"text\">"],"a":0,"gt":"Checkbox cho chọn nhiều; select tạo danh sách thả xuống chọn một lựa chọn.","id":"12CF041"},{"lop":12,"cd":"F","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 13","q":"Theo SGK, CSS (Cascading Style Sheets) có tính \"cascading\". Khi có hai mẫu CSS cùng trọng số áp dụng cho một phần tử và mâu thuẫn nhau thì","o":["mẫu được viết sau cùng được áp dụng","mẫu được viết đầu tiên được áp dụng","trình duyệt báo lỗi","cả hai mẫu bị bỏ qua"],"a":0,"gt":"Nguyên tắc thứ tự cuối cùng (rule order): cùng trọng số thì mẫu ở vị trí cuối cùng được áp dụng.","id":"12CF042"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 14","q":"Cho mã:\n```\n<style>\n  body { color: blue; }\n  h1 { color: red; text-align: center; }\n  h1 { text-align: left; }\n</style>\n<body><h1>CSS</h1><p>Kế thừa</p></body>\n```\nPhát biểu nào đúng?","o":["h1 màu đỏ, căn trái; đoạn p màu xanh do kế thừa từ body","h1 màu đỏ, căn giữa; đoạn p màu đen","h1 màu xanh, căn trái; đoạn p màu xanh","h1 màu đỏ, căn giữa; đoạn p màu đỏ"],"a":0,"gt":"Hai mẫu h1 cùng trọng số nên text-align lấy mẫu cuối (left); color của h1 vẫn là red. p không có mẫu riêng nên kế thừa màu xanh từ body (ví dụ trong SGK Bài 14).","id":"12CF043"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 14","q":"Cho mẫu CSS:\n```\n* { color: blue; text-indent: 1em; }\np { color: red; }\nh1 { text-align: center !important; }\nh1 { text-align: left; }\n```\nPhát biểu nào đúng?","o":["h1 căn giữa; đoạn p màu đỏ; các phần tử không có mẫu riêng có màu xanh","h1 căn trái vì mẫu viết sau cùng","đoạn p màu xanh vì * áp dụng cho mọi phần tử","mọi phần tử đều căn giữa"],"a":0,"gt":"!important có mức ưu tiên cao nhất nên h1 căn giữa; * có mức ưu tiên thấp nhất nên p theo mẫu p (đỏ).","id":"12CF044"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 14","q":"Đoạn văn có cỡ chữ 16px được đặt p { line-height: 2; text-indent: 2em; }. Chiều cao mỗi dòng và độ thụt lề dòng đầu lần lượt là","o":["32px và 32px","2px và 2px","16px và 32px","32px và 16px"],"a":0,"gt":"line-height: 2 là 2 lần cỡ chữ hiện thời (32px); 1em bằng cỡ chữ hiện thời nên 2em = 32px.","id":"12CF045"},{"lop":12,"cd":"F","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 14","q":"Thuộc tính nào sau đây KHÔNG có tính kế thừa (phần tử con không tự nhận giá trị từ phần tử cha)?","o":["border","color","font-family","background-color"],"a":0,"gt":"SGK: màu chữ và màu nền có tính kế thừa, riêng border (và các thuộc tính khung như padding, margin, width) không có tính kế thừa; text-decoration cũng không kế thừa.","id":"12CF046"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 15","q":"Màu nào sau đây là màu xám (các thành phần đỏ, xanh lá, xanh dương bằng nhau)?","o":["rgb(128, 128, 128) và #808080","rgb(128, 0, 128) và #800080","rgb(0, 128, 0) và #008000","hsl(0, 100%, 50%)"],"a":0,"gt":"Màu xám có r = g = b. 128 = 80 trong hệ hexa. hsl(h, 0%, x%) cũng là màu xám (độ bão hoà 0%); hsl(0,100%,50%) là đỏ.","id":"12CF047"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 15","q":"Giá trị hexa nào biểu diễn màu rgb(255, 165, 0)?","o":["#FFA500","#FF1650","#A5FF00","#FFA050"],"a":0,"gt":"255 = FF, 165 = 10×16 + 5 = A5, 0 = 00.","id":"12CF048"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 16","q":"Cho CSS: div { width: 300px; padding: 15px; border: 3px solid; margin: 10px; } (cách tính mặc định). Tổng chiều rộng khối div chiếm trên trang (kể cả lề) là","o":["356px","336px","300px","328px"],"a":0,"gt":"300 + 2×15 (padding) + 2×3 (viền) + 2×10 (margin) = 356px. Không tính margin thì 336px.","id":"12CF049"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 16","q":"Đặt span { width: 200px; } cho phần tử <span> nhưng chiều rộng không thay đổi. Nguyên nhân và cách khắc phục là","o":["width chỉ áp dụng cho phần tử khối; cần thêm display: block; cho span","span không nhận CSS; phải đổi thành <p>","thiếu đơn vị px","cần dùng margin thay cho width"],"a":0,"gt":"SGK Bảng 16.2: width, height chỉ áp dụng cho phần tử dạng khối; span mặc định là inline.","id":"12CF050"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 17","q":"Theo cách tính trọng số trong SGK (id: 100; lớp, lớp giả: 10; phần tử, phần tử giả: 1), bộ chọn #menu a:hover có trọng số là","o":["111","102","120","201"],"a":0,"gt":"#menu = 100; a = 1; :hover (lớp giả) = 10. Tổng 111.","id":"12CF051"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 17","q":"Cho CSS và HTML:\n```\n<style>\n  div p { color: green; }\n  .tin { color: red; }\n  p.tin { color: blue; }\n</style>\n<div><p class=\"tin\">Tin học 12</p></div>\n```\nDòng chữ hiển thị màu gì?","o":["Xanh dương","Xanh lá","Đỏ","Đen"],"a":0,"gt":"Trọng số: div p = 2; .tin = 10; p.tin = 11. p.tin lớn nhất nên áp dụng màu xanh dương.","id":"12CF052"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 17","q":"Theo Bảng 17.3 SGK, thứ tự mức ưu tiên từ cao xuống thấp nào đúng?","o":["!important → CSS trực tiếp (inline) → CSS theo kích thước thiết bị (media) → trọng số → thứ tự cuối cùng → kế thừa → mặc định trình duyệt","CSS trực tiếp → !important → trọng số → kế thừa → thứ tự cuối cùng","kế thừa → trọng số → !important → CSS trực tiếp","mặc định trình duyệt → kế thừa → trọng số → !important"],"a":0,"gt":"Đây là thứ tự trong Bảng 17.3; kế thừa và thứ tự cuối cùng xếp dưới trọng số.","id":"12CF053"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 17","q":"Muốn chữ cái đầu tiên của mọi đoạn văn có cỡ gấp đôi, và dòng đầu tiên của đoạn có class \"test\" dùng phông monospace, ta viết","o":["p::first-letter { font-size: 200%; } và p.test::first-line { font-family: monospace; }","p:first-letter-size { 200%; } và p.test:line { monospace; }","p::first-line { font-size: 200%; } và p.test::first-letter { font-family: monospace; }","p.first-letter { font-size: 200%; } và p#test::first-line { font-family: monospace; }"],"a":0,"gt":"Phần tử giả viết sau dấu \"::\" (first-letter: chữ cái đầu; first-line: dòng đầu).","id":"12CF054"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 17","q":"Cho CSS:\n```\na:link { color: red; }\na:visited { color: green; }\na:hover { color: magenta; }\n```\nMột liên kết đã được truy cập, khi di chuột lên sẽ có màu gì?","o":["Màu hồng tím (magenta)","Màu xanh lá","Màu đỏ","Màu xanh dương mặc định"],"a":0,"gt":"Các lớp giả cùng trọng số (a + lớp giả = 11); a:hover viết sau cùng nên được áp dụng khi di chuột.","id":"12CF055"},{"lop":12,"cd":"G","md":"H","dh":"chung","dang":"MC","nguon":"Tin 12 - Bài 19","q":"Theo SGK, để duy trì máy tính hoạt động ổn định, người làm nghề sửa chữa, bảo trì cần chú ý điều kiện nào ngoài phần cứng và phần mềm?","o":["Môi trường sử dụng phù hợp như nhiệt độ, độ ẩm, bụi bẩn, nguồn điện","Màu sắc của vỏ máy","Số lượng tài khoản mạng xã hội của người dùng","Thương hiệu của bàn phím"],"a":0,"gt":"Máy tính chỉ hoạt động tốt trong điều kiện môi trường phù hợp; bảo trì gồm vệ sinh, kiểm tra nguồn, nhiệt độ.","id":"12CG004"},{"lop":12,"cd":"G","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 12 - Bài 20","q":"Công ty bị mã độc mã hoá dữ liệu khách hàng và đòi tiền chuộc. Ba việc: (1) cô lập máy nhiễm khỏi mạng; (2) phục hồi dữ liệu từ bản sao lưu; (3) vá lỗ hổng và rà soát chính sách bảo mật lần lượt thuộc trách nhiệm chủ yếu của","o":["quản trị mạng; quản trị cơ sở dữ liệu (hoặc hệ thống); chuyên gia an ninh mạng, quản trị hệ thống","thiết kế đồ hoạ; lập trình viên; kế toán","sửa chữa máy tính; thiết kế web; nhân viên bán hàng","khoa học dữ liệu; biên tập viên; quản lí nhân sự"],"a":0,"gt":"Nhóm nghề quản trị của ngành CNTT phối hợp: quản trị mạng xử lí sự cố mạng, quản trị CSDL/hệ thống sao lưu phục hồi, an ninh mạng phòng chống tấn công.","id":"12CG005"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 12 - Bài 14, 17","q":"Cho đoạn mã:\n```\n<style>\n  body { color: navy; font-family: Arial; }\n  p { color: gray; }\n  .nb { color: orange; }\n  #k1 { color: green; }\n  p.nb { border: 1px solid; }\n</style>\n<body>\n  <h2>Thông báo</h2>\n  <p class=\"nb\" id=\"k1\">Nghỉ học thứ Bảy</p>\n  <p class=\"nb\">Họp phụ huynh <em>Chủ nhật</em></p>\n</body>\n```","y":[{"t":"Tiêu đề \"Thông báo\" có màu xanh navy do kế thừa từ body.","d":true,"gt":"h2 không có mẫu riêng nên kế thừa color từ body."},{"t":"Đoạn \"Nghỉ học thứ Bảy\" có màu cam vì lớp .nb được viết sau p.","d":false,"gt":"#k1 (trọng số 100) lớn hơn .nb (10) nên màu xanh lá."},{"t":"Chữ \"Chủ nhật\" có màu cam.","d":true,"gt":"em kế thừa màu từ phần tử cha p.nb, mà p.nb có màu cam theo .nb (10 > p là 1)."},{"t":"Phần tử em bên trong đoạn thứ hai cũng có viền riêng do kế thừa border từ p.nb.","d":false,"gt":"border không có tính kế thừa."}],"id":"12CF056"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 12 - Bài 16","q":"Cho CSS: .hop { width: 200px; padding: 10px 20px; border: 2px dashed red; margin: 5px; display: inline; } áp dụng cho một phần tử <div class=\"hop\">.","y":[{"t":"Phần tử vẫn hiển thị dạng khối, bắt đầu trên dòng mới.","d":false,"gt":"display: inline đổi div thành phần tử nội tuyến."},{"t":"Thuộc tính width không còn tác dụng với phần tử này.","d":true,"gt":"width chỉ áp dụng cho phần tử dạng khối."},{"t":"Viền là nét đứt, màu đỏ, dày 2px.","d":true,"gt":"dashed là nét đứt."},{"t":"Nếu đổi lại display: block thì phần tử chiếm chiều rộng 224px không kể lề.","d":false,"gt":"200 + 2×20 (padding trái phải) + 2×2 = 244px."}],"id":"12CF057"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 12 - Bài 9, 10, 11","q":"Cho đoạn mã trong tệp tintuc/bai2.html:\n```\n<h1 id=\"dau\">Tin tức</h1>\n<img src=\"../anh/truong.jpg\" alt=\"Ảnh trường\" width=\"300\">\n<a href=\"#cuoi\">Xuống cuối trang</a>\n<iframe src=\"https://www.google.com/maps/embed?pb=...\" width=\"400\"></iframe>\n<p id=\"cuoi\"><a href=\"../index.html\">Trang chủ</a></p>\n```","y":[{"t":"Ảnh truong.jpg nằm trong thư mục anh, ngang cấp với thư mục tintuc.","d":true,"gt":"../ lên thư mục gốc rồi vào anh."},{"t":"Nháy \"Xuống cuối trang\" sẽ chuyển tới đoạn có id=\"cuoi\" trong cùng trang.","d":true,"gt":"Liên kết nội bộ dùng #id."},{"t":"Thẻ <iframe> ở đây dùng để chèn ảnh tĩnh của bản đồ.","d":false,"gt":"iframe nhúng cả trang bản đồ tương tác (khung nội tuyến)."},{"t":"Liên kết \"Trang chủ\" là liên kết ngoài vì dùng đường dẫn có dấu ../","d":false,"gt":"Liên kết tới trang trong cùng website là liên kết nội bộ; đường dẫn tương đối."}],"id":"12CF058"},{"lop":12,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 12 - Bài 12","q":"Cho biểu mẫu:\n```\n<form>\n  <input type=\"text\" name=\"ten\" placeholder=\"Họ tên\">\n  <input type=\"radio\" name=\"gt\" value=\"nam\"> Nam\n  <input type=\"radio\" name=\"gioitinh\" value=\"nu\"> Nữ\n  <select name=\"lop\"><option>12A1</option><option>12A2</option></select>\n  <textarea name=\"ykien\"></textarea>\n  <input type=\"submit\" value=\"Gửi\">\n</form>\n```","y":[{"t":"Ô \"Họ tên\" hiển thị chữ gợi ý mờ khi chưa nhập.","d":true,"gt":"Thuộc tính placeholder."},{"t":"Người dùng chỉ chọn được một trong hai nút Nam, Nữ.","d":false,"gt":"Hai nút radio có name khác nhau (gt, gioitinh) nên chọn được cả hai."},{"t":"Danh sách lớp hiển thị dạng thả xuống.","d":true,"gt":"Phần tử select."},{"t":"Ô \"ykien\" cho phép nhập văn bản nhiều dòng.","d":true,"gt":"textarea."}],"id":"12CF059"},{"lop":12,"cd":"B","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 12 - Bài 3, 4","q":"Router của một trường có bảng định tuyến tĩnh: 126.13.*.* → cổng 1 (mặc định); 172.18.*.* → cổng 2; 113.23.12.* → cổng 3; 230.17.*.* → cổng 4.","y":[{"t":"Gói tin tới 172.18.5.20 được gửi ra cổng 2.","d":true,"gt":"Khớp nhóm 172.18.*.*."},{"t":"Gói tin tới 113.23.13.7 được gửi ra cổng 3.","d":false,"gt":"Byte thứ ba là 13 nên không khớp 113.23.12.*; đi theo cổng mặc định 1."},{"t":"Gói tin tới địa chỉ không có trong bảng sẽ đi theo cổng 1.","d":true,"gt":"Cổng mặc định."},{"t":"Trong định tuyến động, bảng định tuyến không bao giờ thay đổi.","d":false,"gt":"Định tuyến động cho phép thay đổi cổng gửi tuỳ tình trạng mạng."}],"id":"12CB022"},{"lop":12,"cd":"B","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 12 - Bài 3, 4","q":"Văn phòng có 8 máy tính nối vào một hub; khi nhiều máy cùng gửi dữ liệu, mạng rất chậm. Kĩ thuật viên đề xuất thay hub bằng switch và giữ nguyên router nối Internet.","y":[{"t":"Mạng chậm có thể do xung đột tín hiệu khi nhiều máy cùng truyền qua hub.","d":true,"gt":"Hub chuyển tín hiệu tới tất cả cổng."},{"t":"Switch chuyển dữ liệu tới đúng cổng của máy nhận dựa trên địa chỉ MAC.","d":true,"gt":"Giảm xung đột."},{"t":"Sau khi thay switch, các máy không cần địa chỉ IP nữa.","d":false,"gt":"Vẫn cần IP để giao tiếp theo TCP/IP và ra Internet."},{"t":"Switch thay thế được vai trò của router trong việc chọn đường ra Internet.","d":false,"gt":"Định tuyến là chức năng của router."}],"id":"12CB023"},{"lop":12,"cd":"B","md":"H","dh":"chung","dang":"TF","nguon":"Tin 12 - Bài 4","q":"Về bộ giao thức TCP/IP được trình bày trong SGK:","y":[{"t":"IP có hai nội dung chính là đánh địa chỉ và định tuyến.","d":true,"gt":"SGK Bài 4."},{"t":"TCP có cơ chế xác nhận để nơi gửi biết gói tin bị lỗi, thất lạc và gửi lại.","d":true,"gt":"Đảm bảo tin cậy."},{"t":"Mỗi cuộc truyền qua Internet luôn độc chiếm toàn bộ đường truyền vật lí.","d":false,"gt":"Chia gói cho phép nhiều cuộc truyền xen kẽ."},{"t":"HTTP là giao thức quy định cách trao đổi các trang web.","d":true,"gt":"Giao thức của dịch vụ web."}],"id":"12CB024"},{"lop":12,"cd":"A","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 12 - Bài 1, 2","q":"Bệnh viện ứng dụng AI phân tích ảnh X-quang phổi để gợi ý chẩn đoán cho bác sĩ.","y":[{"t":"Hệ thống thể hiện khả năng nhận thức của AI (xử lí hình ảnh).","d":true,"gt":"Thị giác máy tính."},{"t":"Đây là AI hẹp vì được thiết kế cho một nhiệm vụ cụ thể.","d":true,"gt":"Không phải AI tổng quát."},{"t":"Do AI rất chính xác nên bác sĩ không cần kiểm tra lại kết quả.","d":false,"gt":"AI có thể sai; quyết định cuối cùng thuộc về bác sĩ."},{"t":"Nếu không giải thích được vì sao AI đưa ra chẩn đoán, đó là nguy cơ thiếu minh bạch (\"hộp đen\").","d":true,"gt":"Cảnh báo trong SGK Bài 2."}],"id":"12CA016"},{"lop":12,"cd":"D","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 12 - Bài 6","q":"Nhóm học tập của lớp dùng một ứng dụng nhắn tin để thảo luận bài; gần đây có bạn thường gửi tin lúc nửa đêm, dùng từ ngữ gay gắt khi bất đồng ý kiến.","y":[{"t":"Giao tiếp trực tuyến giúp nhóm trao đổi mọi lúc, mọi nơi, tiết kiệm thời gian đi lại.","d":true,"gt":"Ưu điểm của giao tiếp trực tuyến."},{"t":"Vì là nhóm kín nên dùng từ ngữ gay gắt không ảnh hưởng gì.","d":false,"gt":"Vẫn gây tổn thương, mâu thuẫn; cần tôn trọng."},{"t":"Nên thống nhất quy tắc nhóm như khung giờ nhắn tin và cách góp ý.","d":true,"gt":"Ứng xử có văn hoá."},{"t":"Thiếu tín hiệu nét mặt, giọng nói khiến tin nhắn dễ bị hiểu sai cảm xúc.","d":true,"gt":"Hạn chế của giao tiếp trên không gian mạng."}],"id":"12CD006"},{"lop":10,"cd":"A","md":"H","dh":"chung","dang":"MC","nguon":"Tin 10 - Bài 3","q":"Theo quy định Việt Nam áp dụng, khi mã hoá tiếng Việt bằng UTF-8, chữ \"a\" và chữ \"ấ\" lần lượt cần bao nhiêu byte?","o":["1 byte và 2 byte","1 byte và 1 byte","2 byte và 2 byte","2 byte và 4 byte"],"a":0,"gt":"SGK Tin 10 Bài 3: UTF-8 dùng 1 byte cho kí tự La tinh không dấu, 2 byte cho nguyên âm có dấu và đ, Đ, 3 byte cho một số rất ít kí tự đặc biệt.","id":"10CA039"},{"lop":10,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 3","q":"Xâu \"Đà Lạt\" (6 kí tự, gồm cả dấu cách) mã hoá bằng UTF-8 theo quy định trong SGK chiếm bao nhiêu byte?","o":["9 byte","6 byte","12 byte","7 byte"],"a":0,"gt":"Đ (2), à (2), dấu cách (1), L (1), ạ (2), t (1): tổng 9 byte.","id":"10CA040"},{"lop":10,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 4","q":"Theo SGK, số -19 biểu diễn bằng 8 bit có mã thuận là 10010011. Mã bù 2 của -19 là","o":["11101101","11101100","00010011","10010011"],"a":0,"gt":"Mã bù 1: giữ bit dấu, đảo các bit còn lại → 11101100. Mã bù 2 = mã bù 1 cộng 1 → 11101101.","id":"10CA041"},{"lop":10,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 4","q":"Kết quả phép nhân hai số nhị phân 101₂ × 11₂ là","o":["1111₂","1000₂","11011₂","1110₂"],"a":0,"gt":"101₂ = 5, 11₂ = 3, tích 15 = 1111₂. Có thể nhân như thập phân: 101 + 1010 = 1111.","id":"10CA042"},{"lop":10,"cd":"A","md":"H","dh":"chung","dang":"MC","nguon":"Tin 10 - Bài 4","q":"Số nguyên lớn nhất biểu diễn được bằng 1 byte không dấu và số nguyên nhỏ nhất biểu diễn được bằng 1 byte theo mã bù 2 lần lượt là","o":["255 và -128","256 và -127","255 và -255","128 và -256"],"a":0,"gt":"8 bit không dấu: 0..255. Mã bù 2 với 8 bit biểu diễn -128..127.","id":"10CA043"},{"lop":10,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 5","q":"Hệ thống báo cháy bật chuông (Z = 1) khi cảm biến khói phát hiện khói (K = 1) HOẶC cảm biến nhiệt báo quá nóng (N = 1), NHƯNG không bật khi đang ở chế độ bảo trì (B = 1). Biểu thức đúng là","o":["Z = (K OR N) AND (NOT B)","Z = K OR N OR B","Z = (K AND N) OR (NOT B)","Z = NOT (K OR N) AND B"],"a":0,"gt":"Cần một trong hai cảm biến (K OR N) và đồng thời không ở chế độ bảo trì (NOT B).","id":"10CA044"},{"lop":10,"cd":"A","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 10 - Bài 6","q":"Một ảnh 800 × 600 điểm ảnh với độ sâu màu 24 bit (RGB, mỗi màu 8 bit). Nếu chuyển thành ảnh đen trắng thang độ xám 8 bit thì dung lượng giảm còn","o":["1/3 dung lượng ban đầu","1/8 dung lượng ban đầu","1/24 dung lượng ban đầu","1/2 dung lượng ban đầu"],"a":0,"gt":"Mỗi điểm ảnh giảm từ 24 bit còn 8 bit nên dung lượng còn 8/24 = 1/3.","id":"10CA045"},{"lop":10,"cd":"A","md":"H","dh":"chung","dang":"MC","nguon":"Tin 10 - Bài 6","q":"Khi số hoá âm thanh, khoả XB <= 2000 AND SoLuong == 0;"],"a":0,"gt":"DELETE FROM ... WHERE kết hợp hai điều kiện bằng AND; SQL dùng \"=\" để so sánh; DROP TABLE xoá cả bảng.","id":"11CF019"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 11 - Bài 14","q":"Bảng HS(MaHS, Lop) có dữ liệu: (1,'A'), (2,'B'), (3,'A'), (4,'C'), (5,'A'). Truy vấn SELECT COUNT(*) FROM HS WHERE Lop = 'A' OR MaHS > 3; trả về","o":["4","3","5","2"],"a":0,"gt":"Thoả điều kiện: MaHS 1, 3, 5 (lớp A) và MaHS 4 (> 3); mã 5 đã đếm. Tổng 4.","id":"11CF020"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"MC","kho":1,"nguon":"Tin 11 - Bài 15","q":"Để nhân viên thư viện chỉ xem được bảng SACH mà không sửa được, quản trị viên CSDL nên","o":["cấp cho tài khoản nhân viên quyền SELECT trên bảng SACH, không cấp quyền UPDATE, DELETE","chia sẻ tài khoản quản trị cho nhân viên","xoá bảng SACH sau giờ làm việc","in bảng SACH ra giấy thay cho CSDL"],"a":0,"gt":"Phân quyền (GRANT) là biện pháp bảo mật cơ bản của hệ CSDL.","id":"11CF021"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 11 - Bài 10-15","q":"Một trường dùng CSDL quản lí học sinh trên máy chủ, giáo viên truy cập qua mạng nội bộ để nhập điểm.","y":[{"t":"Mỗi giáo viên chỉ nên được quyền nhập điểm cho môn mình dạy.","d":true,"gt":"Phân quyền theo vai trò."},{"t":"Cần sao lưu CSDL định kì và lưu bản sao ở nơi khác.","d":true,"gt":"Phòng sự cố mất dữ liệu."},{"t":"Lưu điểm mỗi môn ở một tệp bảng tính riêng sẽ đảm bảo tính nhất quán tốt hơn CSDL.","d":false,"gt":"Dữ liệu rời rạc dễ dư thừa, mâu thuẫn."},{"t":"Ràng buộc điểm từ 0 đến 10 là một ràng buộc toàn vẹn.","d":true,"gt":"Điều kiện dữ liệu phải thoả mãn."}],"id":"11CF022"},{"lop":11,"cd":"F","md":"V","dh":"chung","dang":"TF","kho":1,"nguon":"Tin 11 - Bài 14","q":"Bảng LOP(MaLop, TenLop, GVCN) và HOCSINH(MaHS, HoTen, MaLop, DiemTB). Xét các câu lệnh:\n(1) SELECT HoTen FROM HOCSINH WHERE DiemTB >= 8 ORDER BY HoTen;\n(2) SELECT HoTen, GVCN FROM HOCSINH INNER JOIN LOP ON HOCSINH.MaLop = LOP.MaLop;\n(3) UPDATE LOP SET GVCN = 'Cô Lan' WHERE MaLop = '11A1';","y":[{"t":"Câu (1) liệt kê học sinh có điểm trung bình từ 8 trở lên, sắp theo họ tên.","d":true,"gt":"ORDER BY HoTen tăng dần."},{"t":"Câu (2) cần kết nối hai bảng vì GVCN nằm ở bảng LOP.","d":true,"gt":"Lấy dữ liệu từ hai bảng."},{"t":"Sau câu (3), phải sửa GVCN trong từng bản ghi HOCSINH của lớp 11A1.","d":false,"gt":"GVCN chỉ lưu ở LOP nên tự đúng khi kết nối."},{"t":"Câu (1) viết lại thành SELECT HoTen FROM HOCSINH ORDER BY HoTen WHERE DiemTB >= 8; vẫn đúng cú pháp.","d":false,"gt":"WHERE phải đứng trước ORDER BY."}],"id":"11CF023"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 11 KHMT - Bài 18","q":"Cho đoạn chương trình:\n```\na = [3, 8, 1, 9, 4]\nm = 0\nfor i in range(1, len(a)):\n    if a[i] > a[m]:\n        m = i\na[0], a[m] = a[m], a[0]\nprint(a)\n```\nKết quả in ra là","o":["[9, 8, 1, 3, 4]","[3, 8, 1, 9, 4]","[9, 3, 8, 1, 4]","[1, 8, 3, 9, 4]"],"a":0,"gt":"m là chỉ số phần tử lớn nhất (9 ở chỉ số 3); đổi chỗ a[0] và a[3].","id":"11KF064"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 11 KHMT - Bài 19, 24","q":"Dãy 1 000 000 phần tử đã sắp xếp. Tìm tuần tự trong trường hợp xấu nhất và tìm nhị phân cần số lần so sánh xấp xỉ","o":["1 000 000 lần và 20 lần","1 000 lần và 20 lần","500 000 lần và 1 000 lần","1 000 000 lần và 1 000 lần"],"a":0,"gt":"Tìm tuần tự O(n); nhị phân O(log₂ n), 2²⁰ ≈ 1 048 576 nên khoảng 20 lần.","id":"11KF065"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"MC","kho":1,"nguon":"Tin 11 KHMT - Bài 23","q":"Hàm kiem_tra_nam_nhuan(n) trả về True nếu n chia hết cho 4 và không chia hết cho 100, hoặc chia hết cho 400. Bộ test nào phát hiện được chương trình chỉ kiểm tra \"n chia hết cho 4\"?","o":["1900 và 2000","2024 và 2023","2020 và 2021","4 và 8"],"a":0,"gt":"Với 1900, chương trình sai trả về True (đúng phải là False); 2000 kiểm tra nhánh chia hết cho 400.","id":"11KF066"},{"lop":11,"cd":"F","md":"V","dh":"CS","dang":"TF","kho":1,"nguon":"Tin 11 KHMT - Bài 17-22","q":"Cho chương trình:\n```\ndef dem_tang(a):\n    d = 0\n    for i in range(1, len(a)):\n        if a[i] > a[i - 1]:\n            d += 1\n    return d\n\nb = [[1, 4, 2], [5, 5, 6], [9, 7, 8]]\nt = [dem_tang(h) for h in b]\nprint(t, sum(t))\n```","y":[{"t":"dem_tang([1, 4, 2]) bằng 1.","d":true,"gt":"Chỉ cặp (1, 4) tăng."},{"t":"t là [1, 2, 1].","d":false,"gt":"[5,5,6] chỉ có (5,6) tăng → 1; t = [1, 1, 1]."},{"t":"Chương trình in ra tổng bằng 3.","d":true,"gt":"1 + 1 + 1."},{"t":"Độ phức tạp của dem_tang với danh sách n phần tử là O(n).","d":true,"gt":"Một vòng lặp."}],"id":"11KF067"},{"lop":11,"cd":"E","md":"V","dh":"ICT","dang":"MC","kho":1,"nguon":"Tin 11 THUD - Bài 28","q":"Ảnh động GIF trong GIMP gồm 8 lớp, mỗi lớp hiển thị 125 ms, phát lặp. Một vòng lặp của ảnh động kéo dài","o":["1 giây","8 giây","125 giây","0,125 giây"],"a":0,"gt":"8 × 125 ms = 1 000 ms = 1 giây.","id":"11UE080"},{"lop":11,"cd":"E","md":"V","dh":"ICT","dang":"MC","kho":1,"nguon":"Tin 11 THUD - Bài 30","q":"Phim 3 phút có 6 đoạn video dài bằng nhau nối liền, giữa mỗi hai đoạn có hiệu ứng chuyển cảnh chồng lấp 2 giây (rút ngắn tổng thời lượng). Tổng thời lượng phim sau khi thêm hiệu ứng là","o":["170 giây","180 giây","190 giây","168 giây"],"a":0,"gt":"6 đoạn có 5 chỗ chuyển cảnh; mỗi chỗ chồng lấp 2 giây nên giảm 10 giây: 180 − 10 = 170 giây.","id":"11UE081"},{"lop":11,"cd":"F","md":"V","dh":"ICT","dang":"TF","kho":1,"nguon":"Tin 11 THUD - Bài 17-23","q":"Thực hành với HeidiSQL, Nam tạo bảng:\n```\nCREATE TABLE lop (malop CHAR(5) PRIMARY KEY, tenlop VARCHAR(20));\nCREATE TABLE hocsinh (\n  mahs INT AUTO_INCREMENT PRIMARY KEY,\n  hoten VARCHAR(50) NOT NULL,\n  malop CHAR(5),\n  FOREIGN KEY (malop) REFERENCES lop(malop));\n```","y":[{"t":"Phải tạo bảng lop trước bảng hocsinh.","d":true,"gt":"Bảng được tham chiếu phải có trước."},{"t":"Có thể thêm học sinh có malop để trống (NULL).","d":true,"gt":"malop không có ràng buộc NOT NULL."},{"t":"Lệnh INSERT INTO hocsinh (hoten, malop) VALUES ('An', '12A1'); luôn thành công.","d":false,"gt":"Chỉ thành công khi lớp 12A1 đã có trong bảng lop."},{"t":"Trường malop lưu được giá trị '12A10'.","d":true,"gt":"'12A10' có đúng 5 kí tự, vừa với CHAR(5)."}],"id":"11UF029"},{"lop":11,"cd":"A","md":"B","dh":"chung","dang":"MC","nguon":"Tin 11 - Bài 1","q":"Một số thiết bị như máy giặt, lò vi sóng chạy chương trình ghi sẵn trong ROM, bật lên là chạy mà không cần hệ điều hành. Ngược lại, máy tính cá nhân cần hệ điều hành vì","o":["phải quản lí nhiều tài nguyên và cho phép chạy nhiều phần mềm ứng dụng khác nhau","không có bộ nhớ ROM","chỉ chạy được một chương trình cố định","không kết nối được thiết bị ngoại vi"],"a":0,"gt":"SGK Bài 1 so sánh thiết bị có chương trình nhúng trong ROM với máy tính cá nhân cần hệ điều hành.","id":"11CA018"},{"lop":11,"cd":"A","md":"B","dh":"chung","dang":"MC","nguon":"Tin 11 - Bài 1","q":"Hệ điều hành nào sau đây dùng cho máy tính cá nhân?","o":["Windows, macOS, Linux","Android, iOS, HarmonyOS","MySQL, Oracle, SQL Server","Word, Excel, PowerPoint"],"a":0,"gt":"Android, iOS là hệ điều hành di động; MySQL, Oracle là hệ quản trị CSDL; Word, Excel là phần mềm ứng dụng.","id":"11CA019"},{"lop":11,"cd":"A","md":"H","dh":"chung","dang":"MC","nguon":"Tin 11 - Bài 1","q":"Giao diện đồ hoạ (GUI) của hệ điều hành có ưu điểm gì so với giao diện dòng lệnh?","o":["Thao tác trực quan bằng chuột, biểu tượng, cửa sổ nên dễ dùng với người không chuyên","Luôn chạy nhanh hơn giao diện dòng lệnh","Không cần phần cứng đồ hoạ","Không cho phép chạy nhiều chương trình"],"a":0,"gt":"MS-DOS dùng dòng lệnh, người dùng phải nhớ lệnh; Windows, macOS có giao diện đồ hoạ.","id":"11CA020"},{"lop":11,"cd":"A","md":"H","dh":"chung","dang":"MC","nguon":"Tin 11 - Bài 2","q":"Theo SGK, công cụ chống phân mảnh đĩa (Defragment) giúp tăng tốc độ truy cập ổ đĩa cứng vì","o":["sắp xếp các phần của tệp được ghi liên tục, giảm di chuyển đầu từ khi đọc","nén tệp để giảm dung lượng","xoá các
