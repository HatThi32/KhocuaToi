; align-items căn theo trục phụ (cross axis). Khi flex-direction: column hai trục đổi vai.","src":"hand","mono":false,"cl":262},{"id":"web-css-38","topic":"web","level":3,"tags":["css"],"type":"mcq","stem":"Một phần tử con có position: absolute sẽ định vị tương đối theo phần tử nào?","options":["Phần tử anh em đứng ngay trước nó trong cùng một phần tử cha","Luôn luôn là thẻ <body>, bất kể cấu trúc của các phần tử cha","Phần tử cha trực tiếp của nó, bất kể giá trị position của cha","Tổ tiên gần nhất có position khác static, nếu không có thì theo viewport"],"key":3,"optWhy":["","","",""],"why":"absolute tìm tổ tiên đã được định vị (relative, absolute, fixed, sticky). Vì vậy thường đặt position: relative cho phần tử cha.","src":"hand","mono":false,"cl":263},{"id":"web-css-39","topic":"web","level":3,"tags":["css"],"type":"mcq","stem":"Với position: fixed, phần tử:","options":["Cố định theo khung nhìn (viewport), không cuộn cùng nội dung trang","Cố định theo vị trí của phần tử cha gần nhất chứa nó trong trang","Cuộn cùng trang rồi dính lại ở mép trên khi cuộn đến vị trí đó","Vẫn nằm trong luồng bình thường và chiếm chỗ như phần tử khối"],"key":0,"optWhy":["","","",""],"why":"fixed lấy khung nhìn làm mốc và bị lấy ra khỏi luồng; sticky mới là dạng dính khi cuộn.","src":"hand","mono":false,"cl":264},{"id":"web-css-40","topic":"web","level":2,"tags":["css"],"type":"mcq","stem":"Quy tắc @media (max-width: 600px) { ... } có tác dụng:","options":["Giới hạn chiều rộng của mọi phần tử bên trong tối đa là 600px","Chỉ áp dụng các quy tắc bên trong khi người dùng in trang web ra","Áp dụng quy tắc bên trong khi khung nhìn rộng từ 600px trở lên","Áp dụng quy tắc bên trong khi khung nhìn rộng không quá 600px"],"key":3,"optWhy":["","","",""],"why":"max-width là giới hạn trên của điều kiện; đây là công cụ cốt lõi của thiết kế đáp ứng (responsive).","src":"hand","mono":false,"cl":265},{"id":"web-css-41","topic":"web","level":3,"tags":["css"],"type":"mcq","stem":"Hai thẻ <div> liền kề có margin-bottom: 30px (thẻ trên) và margin-top: 20px (thẻ dưới) theo luồng bình thường. Khoảng cách dọc giữa chúng là:","options":["30px (hai lề dọc \"gộp\" lấy giá trị lớn hơn)","20px","10px","50px (hai lề cộng dồn)"],"key":0,"optWhy":["","","",""],"why":"Hiện tượng margin collapsing: lề dọc liền kề của các khối trong luồng thường gộp, kết quả là giá trị lớn nhất.","src":"hand","mono":false,"cl":266},{"id":"web-html-42","topic":"web","level":2,"tags":["html"],"type":"mcq","stem":"Thẻ nào dùng để chứa nội dung điều hướng chính của trang theo ngữ nghĩa HTML5?","options":["<header>","<nav>","<section>","<aside>"],"key":1,"optWhy":["","","",""],"why":"<nav> đánh dấu nhóm liên kết điều hướng; <header> là phần đầu, <aside> là nội dung phụ.","src":"hand","mono":false,"cl":267},{"id":"web-html-43","topic":"web","level":2,"tags":["html"],"type":"mcq","stem":"Để ảnh có văn bản thay thế cho người dùng trình đọc màn hình và khi ảnh lỗi, dùng thuộc tính nào?","options":["longdesc","title","src","alt"],"key":3,"optWhy":["","","",""],"why":"alt là văn bản thay thế quan trọng cho khả năng truy cập (accessibility) và SEO.","src":"hand","mono":false,"cl":268},{"id":"web-html-44","topic":"web","level":3,"tags":["html"],"type":"mcq","stem":"Phát biểu nào đúng về thuộc tính id trong HTML?","options":["id luôn phải viết hoa toàn bộ chữ cái để trình duyệt nhận ra","id nên duy nhất trong trang và có thể làm mỏ neo liên kết #id","id chỉ dùng được trong JavaScript mà không dùng được trong CSS","Nhiều phần tử có thể dùng chung một id để định dạng giống nhau"],"key":1,"optWhy":["","","",""],"why":"Dùng class cho nhóm phần tử; id cho phần tử duy nhất, tạo được liên kết nội trang href=\"#id\".","src":"hand","mono":false,"cl":269},{"id":"web-js-45","topic":"web","level":3,"tags":["js"],"type":"mcq","stem":"Sự kiện nào của JavaScript xảy ra khi người dùng thay đổi giá trị một ô <input> và rời khỏi ô đó (mất tiêu điểm)?","options":["keydown","change","click","input"],"key":1,"optWhy":["","","",""],"why":"input xảy ra ở từng thay đổi; change xảy ra khi giá trị thay đổi và ô mất tiêu điểm.","src":"hand","mono":false,"ext":true,"cl":270},{"id":"web-js-46","topic":"web","level":3,"tags":["js"],"type":"mcq","stem":"Phương thức nào chọn phần tử ĐẦU TIÊN khớp với bộ chọn CSS?","options":["document.getElementsByClassName()","document.querySelectorAll()","document.getElementById(\"a b\")","document.querySelector()"],"key":3,"optWhy":["","","",""],"why":"querySelector trả về phần tử đầu tiên; querySelectorAll trả về NodeList (tất cả); getElementsByClassName trả về HTMLCollection.","src":"hand","mono":false,"ext":true,"cl":271},{"id":"web-js-47","topic":"web","level":3,"tags":["js"],"type":"mcq","stem":"Trong trình duyệt, đối tượng nào chứa các hàm localStorage.setItem và getItem lưu dữ liệu giữa các lần mở trang?","options":["Cookie luôn gửi kèm mọi yêu cầu tới máy chủ, do localStorage","Tệp tin nằm trên máy chủ","Cơ sở dữ liệu quan hệ SQL trên trình duyệt","Web Storage API, dữ liệu dạng chuỗi khoá - giá trị"],"key":3,"optWhy":["","","",""],"why":"localStorage lưu cặp khoá - giá trị kiểu chuỗi trong trình duyệt, không tự gửi lên máy chủ (khác cookie).","src":"hand","mono":false,"ext":true,"cl":272},{"id":"web-net-48","topic":"web","level":3,"tags":["net"],"type":"mcq","stem":"Khi trình duyệt gửi yêu cầu HTTP và nhận mã trạng thái 404, điều đó có nghĩa:","options":["Máy chủ hoạt động bình thường nhưng không tìm thấy tài nguyên được yêu cầu","Người dùng chưa đăng nhập nên máy chủ yêu cầu xác thực danh tính","Yêu cầu đã được máy chủ xử lí thành công và trả về nội dung đầy đủ","Máy chủ gặp lỗi nội bộ nên không thể xử lí được yêu cầu nhận được"],"key":0,"optWhy":["","","",""],"why":"404 Not Found (lỗi phía yêu cầu); 500 là lỗi máy chủ; 401 cần xác thực; 200 thành công.","src":"hand","mono":false,"cl":273},{"id":"web-tf-49","topic":"web","level":3,"tags":["css-selector"],"type":"tf","stem":"Cho đoạn HTML và các bộ chọn CSS. Xét các phát biểu:","code":"<div id=\"m\" class=\"box\">\n  <ul class=\"menu\">\n    <li class=\"it on\">A<\/li>\n    <li class=\"it\">B<\/li>\n    <li class=\"it on\">C <a href=\"#\" class=\"lk\">x<\/a><\/li>\n    <li>D<\/li>\n  <\/ul>\n  <p class=\"it\">E<\/p>\n  <p>F <span class=\"lk on\">y<\/span><\/p>\n<\/div>","items":[{"t":"Bộ chọn li.on chọn được 2 phần tử.","v":true,"why":"Có 2 thẻ li có class on."},{"t":"Bộ chọn .it chọn được 4 phần tử, trong đó có cả thẻ p.","v":true,"why":"4 phần tử có class it (3 thẻ li và 1 thẻ p)."},{"t":"Bộ chọn ul > li:last-child chọn thẻ li chứa chữ C.","v":false,"why":"Phần tử cuối là li chứa chữ D."},{"t":"Bộ chọn div span chọn được thẻ span, nhưng div > span thì không chọn được gì.","v":true,"why":"span nằm trong p nên là con cháu của div nhưng không phải con trực tiếp."}],"why":"","src":"hand","optWhy":[],"cl":366},{"id":"web-tf-50","topic":"web","level":3,"tags":["css-specificity"],"type":"tf","stem":"Cho khối mã CSS và HTML sau. Xét các phát biểu:","code":"<style>\n.a { color: red; }\n#b { color: blue; }\np { color: green !important; }\n<\/style>\n<p id=\"b\" class=\"a\" style=\"color: black\">Xin chào<\/p>","items":[{"t":"Màu chữ cuối cùng của đoạn văn là xanh lá (green).","v":true,"why":"!important thắng cả style trực tiếp và id; thứ tự ưu tiên: !important > style nội tuyến > id > class > thẻ."},{"t":"Nếu bỏ !important thì màu chữ là đen (black).","v":true,"why":"Thuộc tính style nội tuyến thắng id, class và thẻ khi không có !important."},{"t":"Nếu bỏ cả !important và style nội tuyến thì màu chữ là đỏ (red) vì class .a nằm trước.","v":false,"why":"Khi đó id #b (đặc hiệu cao hơn) thắng, màu xanh dương; thứ tự viết chỉ quyết định khi đặc hiệu bằng nhau."},{"t":"Thêm quy tắc #b.a { color: purple; } sau cùng và bỏ !important, style nội tuyến thì màu chữ là tím.","v":true,"why":"Đặc hiệu (1,1,0) cao hơn #b (1,0,0)."}],"why":"","src":"hand","optWhy":[],"cl":367},{"id":"web-tf-51","topic":"web","level":2,"tags":["forms"],"type":"tf","stem":"Cho đoạn mã biểu mẫu sau. Xét các phát biểu:","code":"<form action=\"/dk\" method=\"post\">\n  <input type=\"text\" name=\"ten\" required>\n  <input type=\"text\" name=\"ma\" value=\"HS01\" readonly>\n  <input type=\"text\" name=\"lop\" value=\"12A\" disabled>\n  <input type=\"checkbox\" name=\"dk\" value=\"1\">\n  <button type=\"submit\">Gửi<\/button>\n<\/form>","items":[{"t":"Nếu người dùng để trống ô «ten», trình duyệt sẽ chặn việc gửi form.","v":true,"why":"Thuộc tính required."},{"t":"Dữ liệu gửi đi có cặp ma=HS01.","v":true,"why":"readonly vẫn gửi giá trị."},{"t":"Dữ liệu gửi đi có cặp lop=12A.","v":false,"why":"Ô disabled không được gửi."},{"t":"Nếu hộp kiểm «dk» không được chọn thì dữ liệu gửi đi vẫn có dk=1.","v":false,"why":"Checkbox chỉ gửi khi được chọn."}],"why":"","src":"hand","optWhy":[],"cl":368},{"id":"web-tf-52","topic":"web","level":3,"tags":["javascript"],"type":"tf","stem":"Cho hai khối mã JavaScript. Xét các phát biểu:","code":"// (1)\nlet a = [1,2,3];\nlet b = a;\nb.push(4);\n// (2)\nconst s = \"abc\";\ns.toUpperCase();","items":[{"t":"Sau (1), a.length bằng 4.","v":true,"why":"a và b cùng tham chiếu đến một mảng."},{"t":"Sau (2), s có giá trị \"ABC\".","v":false,"why":"Chuỗi là bất biến; toUpperCase trả chuỗi mới mà không đổi s."},{"t":"Khai báo const b = a ở (1) sẽ ngăn b.push(4) hoạt động.","v":false,"why":"const chỉ cấm gán lại biến, không cấm thay đổi nội dung đối tượng."},{"t":"Biểu thức typeof a ở (1) cho kết quả \"array\".","v":false,"why":"typeof mảng là \"object\"; dùng Array.isArray để kiểm tra."}],"why":"","src":"hand","optWhy":[],"ext":true,"cl":369},{"id":"ksm-6.01","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Phát biểu nào sau đây về server là đúng?","options":["Mọi mạng máy tính đều bắt buộc phải có ít nhất một server làm trung tâm.","Server luôn là một máy tính vật lí cấu hình cao, đặt riêng trong phòng máy.","Server là hệ thống phần cứng và phần mềm cung cấp dịch vụ cho các máy khách.","Server chỉ là một phần mềm chạy trên máy, không liên quan gì đến phần cứng."],"key":2,"optWhy":["","","",""],"why":"Sách (Bài 22): server là hệ thống gồm cả phần mềm và phần cứng. Mạng có thể không có server (ví dụ mạng gia đình), nhưng server thì thường nằm trong một mạng.","src":"sgk-khmt","cl":380},{"id":"ksm-6.02","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Máy chủ tên miền (DNS) có chức năng nào sau đây?","options":["Quản trị cơ sở dữ liệu của tổ chức và trả lời các truy vấn dữ liệu.","Thẩm định quyền hạn của người dùng khi họ đăng nhập vào mạng nội bộ.","Cho biết địa chỉ IP ứng với một tên miền để người dùng khỏi nhớ số.","Lưu trữ các tệp dùng chung và cho phép các máy khách tải về sử dụng."],"key":2,"optWhy":["","","",""],"why":"Phương án B là máy chủ xác thực (authentication server), C là file server, D là database server.","src":"sgk-khmt","cl":381},{"id":"ksm-6.03","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Trong một mạng có nhiều máy tính, việc thay hub bằng switch mang lại lợi ích chính nào sau đây?","options":["Mạng tự động nối được với Internet mà không cần có router nữa.","Chuyển tín hiệu điện thành tín hiệu ánh sáng để truyền đi xa hơn.","Tăng khoảng cách truyền của cáp xoắn lên hơn 100 m so với hub.","Chia nhỏ các miền xung đột nên truyền dữ liệu hiệu quả hơn."],"key":3,"optWhy":["","","",""],"why":"Hub phát tín hiệu ra mọi cổng nên mọi máy nối vào hub cùng một miền xung đột. Switch chỉ nối tạm thời hai cổng đang truyền nên mỗi cổng là một miền xung đột riêng.","src":"sgk-khmt","cl":382},{"id":"ksm-6.04","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Dấu hiệu nào giúp nhận biết một thiết bị là router chứ không phải switch?","options":["Có cổng WAN để nối ra ngoài mạng cục bộ.","Có đèn tín hiệu ở mỗi cổng.","Có nhiều cổng RJ45.","Có thể nối nhiều máy tính bằng cáp xoắn."],"key":0,"optWhy":["","","",""],"why":"Router phân biệt cổng WAN (nối ra ngoài, thường ghi Internet) và cổng LAN; hub/switch chỉ có cổng như nhau. Chức năng cơ bản nhất của router là chọn đường.","src":"sgk-khmt","cl":383},{"id":"ksm-6.05","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Một đoạn cáp xoắn dài 100 m đã đạt khoảng cách hiệu quả tối đa. Để kéo dài thêm 100 m nữa mà không đổi loại cáp, cách nào sau đây phù hợp?","options":["Giảm tốc độ đường truyền xuống còn 1 Mb/s để tín hiệu đi xa hơn.","Thay cả đoạn bằng một hub vì hub khuếch đại lại được tín hiệu.","Đặt một repeater ở cuối đoạn đầu rồi nối thêm đoạn cáp xoắn nữa.","Thêm một máy chủ DNS vào giữa đường truyền để nối dài tín hiệu."],"key":2,"optWhy":["","","",""],"why":"Repeater nhận tín hiệu đã yếu, chỉnh sửa rồi phát lại. Không thể dùng liên tiếp quá nhiều repeater (xem quy tắc 5-4-3 ở Bài 24).","src":"sgk-khmt","cl":384},{"id":"ksm-6.06","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Phát biểu nào sau đây về cáp quang là SAI?","options":["Có thể truyền xa hơn cáp điện vì tín hiệu ít bị suy hao hơn nhiều.","Khó bị lấy trộm tín hiệu trên đường truyền hơn so với cáp đồng.","Có thể nối thẳng từng máy tính vào switch mà không cần thiết bị nào khác.","Tín hiệu ổn định vì không bị ảnh hưởng bởi nhiễu điện từ xung quanh."],"key":2,"optWhy":["","","",""],"why":"Máy tính trong mạng cục bộ dùng tín hiệu điện nên không thay trực tiếp cáp xoắn bằng cáp quang; khi dùng cáp quang phải có bộ chuyển đổi quang – điện. Cáp quang thường dùng nối các khu vực xa nhau (toà nhà, khoa của bệnh viện) hoặc nối máy chủ với NAS.","src":"sgk-khmt","cl":385},{"id":"ksm-6.07","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Một học sinh cần kết nối tai nghe không dây với điện thoại ở khoảng cách khoảng 2 m. Công nghệ không dây nào phù hợp nhất?","options":["Mạng vệ tinh.","Mạng thông tin di động 5G.","Cáp quang.","Bluetooth."],"key":3,"optWhy":["","","",""],"why":"Bluetooth tốc độ khoảng 1 Mb/s, phạm vi khoảng 10 m, thường nối hai thiết bị cá nhân với nhau. Cáp quang không phải công nghệ không dây.","src":"sgk-khmt","cl":386},{"id":"ksm-6.08","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Chuẩn Wi-Fi nào sau đây sử dụng dải tần 60 GHz?","options":["802.11n.","802.11g.","802.11b.","802.11ad."],"key":3,"optWhy":["","","",""],"why":"Theo Bài 23: 802.11b – 11 Mb/s; 802.11a, g – 54 Mb/s; 802.11n – 450 Mb/s; 802.11ac – tối đa 1,3 Gb/s; 802.11ad – dải 60 GHz, tối đa 4,6 Gb/s.","src":"sgk-khmt","cl":387},{"id":"ksm-6.09","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Nội dung nào sau đây xếp đúng thứ tự tốc độ truyền dữ liệu tối đa TĂNG dần của các thế hệ mạng di động theo sách giáo khoa?","options":["4G (1,5 Gb/s) → 3G (40 Mb/s) → 5G (10 Gb/s).","3G (40 Mb/s) → 5G (10 Gb/s) → 4G (1,5 Gb/s).","3G (40 Mb/s) → 4G (1,5 Gb/s) → 5G (10 Gb/s).","5G (10 Gb/s) → 4G (1,5 Gb/s) → 3G (40 Mb/s)."],"key":2,"optWhy":["","","",""],"why":"Chỉ có 3G trở lên mới truyền được dữ liệu số nói chung; 2G chỉ nghe gọi và SMS. 5G còn có độ trễ rất thấp, hỗ trợ nhiều thiết bị kết nối, phù hợp với IoT.","src":"sgk-khmt","cl":388},{"id":"ksm-6.10","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Công việc nào sau đây thuộc bước THIẾT KẾ LOGIC khi thiết kế mạng?","options":["Chọn loại switch 24 cổng và dùng cáp CAT6 cho các đường nối chính.","Xác định cấu trúc kết nối (sao, phân cấp) và mô hình workgroup hay domain.","Chọn vị trí đặt từng thiết bị mạng cụ thể trong các phòng của toà nhà.","Khảo sát số máy tính cần nối mạng ở mỗi toà nhà của cơ quan."],"key":1,"optWhy":["","","",""],"why":"Các bước: (1) khảo sát và phân tích nhu cầu; (2) thiết kế logic: cấu trúc kết nối, mô hình tương tác, giao thức; (3) thiết kế vật lí: chọn thiết bị, điểm đặt, cáp; (4) chọn hệ điều hành mạng.","src":"sgk-khmt","cl":389},{"id":"ksm-6.11","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Một trường có 3 phòng thực hành, mỗi máy dùng một tài khoản ghi sẵn trên thân máy, học sinh không có tài khoản riêng. Mô hình kiểm soát mạng nào phù hợp và đơn giản nhất?","options":["Không cần mô hình nào vì mạng nhỏ không cần quản trị.","Mô hình dạng vòng với máy chủ tên miền.","Mô hình miền (domain) với máy chủ kiểm soát miền cấp tài khoản cho từng học sinh.","Mô hình làm việc nhóm (workgroup), không cần máy chủ kiểm soát miền."],"key":3,"optWhy":["","","",""],"why":"Workgroup: không máy nào điều khiển máy nào, người dùng đăng nhập theo từng máy. Domain: tài khoản và tài nguyên quản lí tập trung bởi Domain Controller, đăng nhập từ máy nào cũng được.","src":"sgk-khmt","cl":390},{"id":"ksm-6.12","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Cấu trúc kết nối nào hiện được dùng trong hầu hết các mạng cục bộ?","options":["Cấu trúc hình sao (cấu trúc phân cấp là hình sao của các hình sao).","Cấu trúc dạng tuyến chạy qua một repeater duy nhất cho toàn mạng.","Cấu trúc dạng tuyến dùng cáp đồng trục nối trực tiếp từng máy tính.","Cấu trúc dạng vòng nối trực tiếp các máy tính thành một vòng kín."],"key":0,"optWhy":["","","",""],"why":"Hình sao dễ thi công, dễ mở rộng, rẻ và tin cậy. Dạng tuyến nay chủ yếu còn làm đường trục nối các toà nhà; dạng vòng hầu như không dùng để nối trực tiếp máy tính.","src":"sgk-khmt","cl":391},{"id":"ksm-6.13","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Theo quy tắc 5-4-3, trong cùng một vùng xung đột, số repeater tối đa được dùng là bao nhiêu?","options":["5 repeater.","4 repeater.","2 repeater.","3 repeater."],"key":1,"optWhy":["","","",""],"why":"Quy tắc 5-4-3: không quá 5 phân đoạn mạng, không quá 4 repeater và không quá 3 phân đoạn có máy tính. (Với 5 phân đoạn nối nhau thì cần đúng 4 repeater.)","src":"sgk-khmt","cl":392},{"id":"ksm-6.14","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Phát biểu nào sau đây về thiết kế mạng là SAI?","options":["Quy mô địa lí của tổ chức ảnh hưởng đến việc chọn thiết bị và đường truyền.","Tính mĩ thuật chỉ là vấn đề thứ yếu, không thuộc nội dung kĩ thuật của thiết kế.","Xác định các ứng dụng sẽ cài đặt trên mạng cũng là một bước thiết kế mạng.","Kinh phí đầu tư chỉ có thể tính được sau khi đã có bản thiết kế mạng."],"key":2,"optWhy":["","","",""],"why":"Sách nêu rõ: xác định các ứng dụng sẽ cài đặt không phải công việc thiết kế mạng, nhưng nó ảnh hưởng tới việc chọn mô hình mạng và tính năng thiết bị.","src":"sgk-khmt","cl":385},{"id":"ksm-6.15","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Mục đích nào sau đây KHÔNG phải của việc phân đoạn mạng?","options":["Giới hạn phạm vi xung đột tín hiệu, tăng hiệu quả truyền dữ liệu.","Đặt máy chủ dữ liệu quan trọng vào phân đoạn riêng, kiểm soát truy cập bằng router và tường lửa.","Tăng số lượng máy chủ có trong mạng.","Cô lập một phân đoạn khi có sự cố để khắc phục mà không ảnh hưởng phân đoạn khác."],"key":2,"optWhy":["","","",""],"why":"Ba mục đích của sách: giới hạn xung đột, bảo vệ dữ liệu quan trọng và cô lập sự cố.","src":"sgk-khmt","cl":393},{"id":"ksm-6.16","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Một công ty có 4 phòng. Mỗi phòng có 20 máy tính, 1 access point và 1 máy in mạng, tất cả nối vào một switch của phòng; mỗi switch phòng dùng 1 cổng nối lên switch tổng; switch tổng có 1 cổng nối với router. Các switch chỉ có loại 8, 16, 24 hoặc 32 cổng. Phương án nào dùng ít cổng nhất mà vẫn đủ?","options":["5 switch loại 32 cổng.","4 switch loại 24 cổng (mỗi phòng) và 1 switch loại 16 cổng (switch tổng).","4 switch loại 24 cổng (mỗi phòng) và 1 switch loại 8 cổng (switch tổng).","4 switch loại 16 cổng (mỗi phòng) và 1 switch loại 8 cổng (switch tổng)."],"key":2,"optWhy":["","","",""],"why":"Mỗi phòng cần 20 + 1 + 1 + 1 (cổng lên) = 23 cổng nên chọn loại 24. Switch tổng cần 4 + 1 = 5 cổng nên chọn loại 8. Loại 16 cổng ở mỗi phòng không đủ (23 > 16).","src":"sgk-khmt","cl":394},{"id":"ksm-6.17","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Một tệp dài 450 MB được truyền qua đường truyền có tốc độ ổn định 100 Mb/s (bỏ qua mọi hao phí). Thời gian truyền gần nhất với giá trị nào? (1 byte = 8 bit)","options":["45 giây.","36 giây.","4,5 giây.","360 giây."],"key":1,"optWhy":["","","",""],"why":"450 MB = 450 × 8 = 3600 Mb; 3600 Mb ÷ 100 Mb/s = 36 s. Bẫy thường gặp: nhầm MB (megabyte) với Mb (megabit).","src":"sgk-khmt","cl":395},{"id":"ksm-6.18","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Trong trường, 40 học sinh cùng xem video đồng thời, mỗi luồng video cần tối đa 3 Mb/s. Đường truyền tối thiểu nên chọn là gì?","options":["Chuẩn Gigabit, vì tổng nhu cầu 120 Mb/s vượt 100 Mb/s của Fast Ethernet.","Chuẩn Fast Ethernet 100 Mb/s, vì mỗi luồng video chỉ cần có 3 Mb/s.","Chuẩn 10BASE-T 10 Mb/s, vì video chỉ cần băng thông thấp là đủ.","Dùng Bluetooth, vì tốc độ khoảng 1 Mb/s là đủ cho mỗi luồng video."],"key":0,"optWhy":["","","",""],"why":"Tổng nhu cầu = 40 × 3 = 120 Mb/s lớn hơn 100 Mb/s. Sách gợi ý với vài chục người xem video đồng thời thì chọn băng thông Gigabit (tốt hơn Fast Ethernet).","src":"sgk-khmt","cl":396},{"id":"ksm-6.19","topic":"mang","level":2,"tags":["khmt12"],"type":"mcq","stem":"Trong mạng nội bộ của một văn phòng, Hà có máy in nối với máy tính của mình bằng cáp USB. Minh ở phòng khác muốn in trên máy in đó. Điều kiện nào sau đây là đầy đủ và hợp lí?","options":["Chỉ cần đặt một repeater ở giữa hai phòng để tín hiệu in đi xa hơn.","Hà chia sẻ máy in, hai máy cùng mạng nội bộ, Minh cài driver máy in.","Chỉ cần hai máy cùng truy cập được Internet, không cần chung mạng nội bộ.","Chỉ cần Minh cài driver máy in, còn Hà không cần thiết lập thêm gì."],"key":1,"optWhy":["","","",""],"why":"Ba điều kiện cùng lúc: máy in được chia sẻ, hai máy thông nhau trong mạng nội bộ, máy dùng in có driver. Đây là cách đọc phương án như câu 16 của đề: chỉ chọn phương án thoả đủ mọi điều kiện.","src":"sgk-khmt","cl":397},{"id":"ksm-7.01","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Học máy là gì?","options":["Việc thu thập càng nhiều dữ liệu càng tốt, bất kể có dùng để huấn luyện hay không.","Chương trình ra quyết định dựa trên các quy tắc do lập trình viên viết sẵn từ trước.","Lĩnh vực của AI cho phép máy học từ dữ liệu để dự đoán mà không lập trình từng trường hợp.","Việc con người dạy máy từng quy tắc bằng cách viết nhiều câu lệnh if – else cụ thể."],"key":2,"optWhy":["","","",""],"why":"Điểm mấu chốt: máy tính tự học từ dữ liệu, không lập trình rõ ràng các quy tắc cụ thể.","src":"sgk-khmt","cl":435},{"id":"ksm-7.02","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Thứ tự năm bước cơ bản của quy trình xây dựng ứng dụng học máy là gì?","options":["Thu thập dữ liệu → Huấn luyện mô hình → Chuẩn bị dữ liệu → Đánh giá mô hình → Sử dụng mô hình.","Huấn luyện mô hình → Thu thập dữ liệu → Chuẩn bị dữ liệu → Sử dụng mô hình → Đánh giá mô hình.","Chuẩn bị dữ liệu → Thu thập dữ liệu → Đánh giá mô hình → Huấn luyện mô hình → Sử dụng mô hình.","Thu thập dữ liệu → Chuẩn bị dữ liệu → Huấn luyện mô hình → Đánh giá mô hình → Sử dụng mô hình."],"key":3,"optWhy":["","","",""],"why":"Hình 25.2 của sách. Hai bước đầu (thu thập và chuẩn bị dữ liệu) chiếm nhiều thời gian và công sức nhất.","src":"sgk-khmt","cl":436},{"id":"ksm-7.03","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Việc 'chuẩn bị dữ liệu' (làm sạch dữ liệu) trong học máy KHÔNG bao gồm công việc nào sau đây?","options":["Loại bỏ các dữ liệu nhiễu khỏi tập dữ liệu thu thập được ban đầu.","Dùng dữ liệu kiểm thử để điều chỉnh mô hình cho đạt kết quả tốt nhất.","Bổ sung các giá trị còn thiếu trong tập dữ liệu thu thập được ban đầu.","Chuyển dữ liệu sang định dạng phù hợp với yêu cầu của thuật toán học."],"key":1,"optWhy":["","","",""],"why":"Chuẩn bị dữ liệu gồm: loại bỏ nhiễu, bổ sung giá trị thiếu, chuyển định dạng, giảm kích thước dữ liệu nếu cần. Dữ liệu kiểm thử dùng ở bước đánh giá, không dùng để huấn luyện.","src":"sgk-khmt","cl":437},{"id":"ksm-7.04","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Một tập dữ liệu có 2500 mẫu được chia với 80% làm dữ liệu huấn luyện, phần còn lại làm dữ liệu kiểm thử. Số mẫu mỗi phần lần lượt là:","options":["500 mẫu huấn luyện và 2000 mẫu kiểm thử.","1750 mẫu huấn luyện và 750 mẫu kiểm thử.","2000 mẫu huấn luyện và 500 mẫu kiểm thử.","2250 mẫu huấn luyện và 250 mẫu kiểm thử."],"key":2,"optWhy":["","","",""],"why":"2500 × 0,8 = 2000; 2500 − 2000 = 500. Sách nêu dữ liệu huấn luyện thường chiếm khoảng 70% đến 80%.","src":"sgk-khmt","cl":438},{"id":"ksm-7.05","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Tại sao cần chia dữ liệu thành tập huấn luyện và tập kiểm thử?","options":["Để mô hình học thuộc lòng toàn bộ dữ liệu đã có trong tập dữ liệu.","Để dùng tập kiểm thử chưa từng thấy đánh giá khả năng dự đoán dữ liệu mới.","Để giảm một nửa dung lượng lưu trữ của tập dữ liệu thu thập được.","Để loại bỏ hết các mẫu dữ liệu đã có nhãn ra khỏi tập dữ liệu."],"key":1,"optWhy":["","","",""],"why":"Nếu đánh giá bằng chính dữ liệu đã dùng để huấn luyện thì kết quả không phản ánh khả năng tổng quát hoá của mô hình trên dữ liệu mới.","src":"sgk-khmt","cl":439},{"id":"ksm-7.06","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Bài toán nào sau đây phù hợp nhất với học KHÔNG giám sát?","options":["Dự đoán một ảnh là con ngựa hay không phải ngựa từ tập ảnh đã gán nhãn.","Nhận dạng chữ viết tay khi có hàng nghìn ảnh đã được gán nhãn là chữ số từ 0 đến 9.","Chia khách hàng thành các nhóm có hành vi mua sắm tương tự khi chưa có nhóm nào được định nghĩa sẵn.","Phân loại thư điện tử thành thư rác hoặc thư thường dựa trên các thư đã được người dùng đánh dấu."],"key":2,"optWhy":["","","",""],"why":"Học không giám sát dùng dữ liệu không có nhãn, tìm cấu trúc ẩn như nhóm (phân cụm). Ba phương án còn lại đều có nhãn nên là học có giám sát.","src":"sgk-khmt","cl":440},{"id":"ksm-7.07","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Điểm khác biệt cơ bản giữa học có giám sát và học không giám sát là gì?","options":["Học có giám sát chỉ dùng cho văn bản, còn học không giám sát chỉ dùng cho ảnh.","Học có giám sát dùng dữ liệu đã gán nhãn, không giám sát dùng dữ liệu chưa gán nhãn.","Học có giám sát không cần dữ liệu huấn luyện, còn không giám sát thì cần dữ liệu.","Học có giám sát cần máy tính mạnh, còn học không giám sát chạy trên mọi máy."],"key":1,"optWhy":["","","",""],"why":"Việc gán nhãn thường làm thủ công, tốn công sức; dữ liệu có nhãn đúng và đa dạng quyết định chất lượng mô hình có giám sát.","src":"sgk-khmt","cl":441},{"id":"ksm-7.08","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Trong các ứng dụng sau, ứng dụng nào KHÔNG được sách giáo khoa nêu là ví dụ về vai trò của học máy?","options":["Điều khiển động cơ máy bay bằng cách tính lực nâng theo công thức vật lí cố định.","Lọc thư rác tự động dựa trên các đặc điểm học được từ nhiều thư mẫu đã có.","Nhận dạng tiếng nói của người dùng dựa trên mô hình học từ dữ liệu âm thanh.","Chẩn đoán bệnh dựa trên mô hình học từ dữ liệu của nhiều bệnh nhân trước đó."],"key":0,"optWhy":["","","",""],"why":"Sách nêu: lọc thư rác, chẩn đoán bệnh, phân tích thị trường, nhận dạng tiếng nói, nhận dạng chữ viết, dịch tự động.","src":"sgk-khmt","cl":442},{"id":"ksm-7.09","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Khoa học dữ liệu KHÔNG bao gồm công việc nào sau đây?","options":["Phát triển các phương pháp thu thập và quản lí dữ liệu một cách hiệu quả.","Khai phá thông tin và tri thức từ dữ liệu để nâng cao hiệu quả quản lí.","Nhận biết các mẫu hình, quan hệ và xu hướng có trong dữ liệu thu thập.","Kinh doanh, phân phối dữ liệu thu thập được cho các cá nhân và tổ chức."],"key":3,"optWhy":["","","",""],"why":"Đây là câu khởi động của Bài 26. Khoa học dữ liệu nghiên cứu và khai phá dữ liệu để rút ra tri thức, không phải là việc buôn bán dữ liệu.","src":"sgk-khmt","cl":443},{"id":"ksm-7.10","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Khoa học dữ liệu là lĩnh vực liên ngành kết hợp các công cụ của những lĩnh vực nào?","options":["Chỉ thống kê và kế toán, không cần thêm lĩnh vực nào khác.","Chỉ khoa học máy tính và mạng máy tính, không cần toán học.","Chỉ trí tuệ nhân tạo và robot, không cần kiến thức thống kê.","Khoa học máy tính, toán học – thống kê và tri thức chuyên ngành."],"key":3,"optWhy":["","","",""],"why":"Tri thức chuyên ngành giúp hiểu ngữ cảnh, đánh giá chất lượng dữ liệu và diễn giải kết quả.","src":"sgk-khmt","cl":444},{"id":"ksm-7.11","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Mục tiêu cụ thể cao nhất của khoa học dữ liệu là gì?","options":["Khám phá tri thức: tìm quan hệ ẩn trong dữ liệu để tạo tri thức mới.","Lưu trữ toàn bộ dữ liệu của tổ chức trên đám mây một cách an toàn.","Tổ chức và quản lí dữ liệu một cách tập trung tại một nơi duy nhất.","Trực quan hoá dữ liệu bằng các biểu đồ đẹp và dễ hiểu cho người xem."],"key":0,"optWhy":["","","",""],"why":"Năm mục tiêu cụ thể: tổ chức và quản lí dữ liệu; phân tích dữ liệu; trực quan hoá; tối ưu hoá quyết định; khám phá tri thức (cao nhất).","src":"sgk-khmt","cl":445},{"id":"ksm-7.12","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Theo sách giáo khoa, 'năm chữ V' đặc trưng của dữ liệu lớn gồm những yếu tố nào?","options":["Khối lượng, vận tốc, đa dạng, giá trị, tính riêng tư.","Khối lượng, vận tốc, đa dạng, giá trị, tính xác thực.","Khối lượng, vận tốc, đa dạng, giá cả, tính an toàn.","Khối lượng, vị trí, đa dạng, giá trị, tính xác thực."],"key":1,"optWhy":["","","",""],"why":"Volume, Velocity, Variety, Value, Veracity. Veracity (tính xác thực) nhắc rằng dữ liệu lớn thường có nhiễu hoặc sai số.","src":"sgk-khmt","cl":446},{"id":"ksm-7.13","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Vai trò nào sau đây KHÔNG phải của máy tính đối với khoa học dữ liệu theo Bài 27?","options":["Cung cấp tài nguyên tính toán qua điện toán đám mây cho dự án.","Thay thế hoàn toàn nhà khoa học dữ liệu khi diễn giải kết quả.","Tự động hoá các tác vụ lặp lại như làm sạch dữ liệu, huấn luyện.","Xử lí và lưu trữ khối lượng dữ liệu lớn với tốc độ cao hơn nhiều."],"key":1,"optWhy":["","","",""],"why":"Máy tính hỗ trợ ở mọi giai đoạn nhưng tri thức chuyên ngành của con người vẫn cần để diễn giải kết quả.","src":"sgk-khmt","cl":447},{"id":"ksm-7.14","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Dự án Hệ gene người cho thấy tính ưu việt của máy tính và thuật toán hiệu quả khi xử lí dữ liệu lớn ở khía cạnh nào?","options":["Rút ngắn thời gian, tăng độ chính xác, xử lí song song dữ liệu rất lớn.","Làm dữ liệu nhỏ lại để vừa với máy tính cá nhân thông thường dùng.","Chỉ giúp lưu trữ dữ liệu mà không giúp ích gì cho việc phân tích.","Không cần thuật toán hiệu quả mà chỉ cần tăng dung lượng ổ đĩa."],"key":0,"optWhy":["","","",""],"why":"Hệ gene người là chuỗi khoảng 3 tỉ kí tự A, C, G, T; dự án cần hàng trăm GB dữ liệu thô và mạng lưới siêu máy tính, không thể làm bằng máy tính cá nhân thông thường.","src":"sgk-khmt","cl":448},{"id":"ksm-7.16","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Dùng quy ước của Bài 28 (Thấp: thu nhập ≤ 25 000; Trung bình: trên 25 000 đến 50 000; Khá: trên 50 000 đến dưới 75 000; Cao: từ 75 000 trở lên). Khách hàng có thu nhập năm 52 000 USD và 21 tuổi (nhóm tuổi: <21; 21–30; 31–40; 41–50; >50) thuộc nhóm nào?","options":["Mức thu nhập Khá, nhóm tuổi 21–30.","Mức thu nhập Khá, nhóm tuổi <21.","Mức thu nhập Cao, nhóm tuổi 31–40.","Mức thu nhập Trung bình, nhóm tuổi 21–30."],"key":0,"optWhy":["","","",""],"why":"52 000 nằm trong khoảng trên 50 000 đến dưới 75 000 nên là Khá; 21 tuổi thuộc nhóm 21–30 (nhóm <21 chỉ gồm tuổi nhỏ hơn 21).","src":"sgk-khmt","cl":450},{"id":"ksm-7.18","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Phát biểu nào sau đây về mô phỏng là SAI?","options":["Mô phỏng hỗ trợ đào tạo trong môi trường an toàn và được kiểm soát.","Việc đầu tư xây dựng hệ thống mô phỏng luôn tiết kiệm chi phí hơn việc tạo mẫu hoặc thử nghiệm thực tế.","Mô phỏng có thể cho kết quả trong vài giây hoặc vài phút trong khi thử nghiệm thật có thể mất nhiều giờ.","Mô phỏng giúp giảm rủi ro vì mọi thử nghiệm được thực hiện trên mô hình ảo."],"key":1,"optWhy":["","","",""],"why":"Sách dùng từ 'có thể ít tốn kém hơn', không phải 'luôn'. Trong câu hỏi của đề, các từ tuyệt đối như 'luôn', 'chỉ', 'tất cả' thường là dấu hiệu của phương án sai.","src":"sgk-khmt","cl":452},{"id":"ksm-7.19","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Trường hợp nào sau đây NÊN ưu tiên dùng mô phỏng?","options":["Kiểm tra một dãy 5 số đã được sắp xếp đúng thứ tự hay chưa.","Sao chép một tệp từ máy tính này sang một máy tính khác trong mạng.","Soạn một văn bản ngắn bằng phần mềm soạn thảo văn bản thông dụng.","Huấn luyện học viên lái máy bay trong cabin vì thử thật tốn kém, rủi ro."],"key":3,"optWhy":["","","",""],"why":"Nên nghĩ tới mô phỏng khi thử nghiệm thật tốn kém, phức tạp, khó đo lường, rủi ro cao, không thể làm thật hoặc sản phẩm đang trong giai đoạn thiết kế.","src":"sgk-khmt","cl":453},{"id":"ksm-7.20","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Phần mềm nào sau đây là phần mềm mô phỏng động học địa chất, cho phép mô phỏng sự biến đổi của các lục địa, địa mạo trên toàn cầu?","options":["Yenka.","GPlates.","GeoGebra.","Avogadro."],"key":1,"optWhy":["","","",""],"why":"Avogadro: mô phỏng và thiết kế phân tử hoá học. GPlates: động học địa chất. PhET: bộ mô phỏng tương tác Vật lí, Hoá học, Toán, Khoa học Trái Đất, Sinh học. Yenka: thí nghiệm Toán, Vật lí, Hoá học, Điện tử. GeoGebra: Toán học.","src":"sgk-khmt","cl":454},{"id":"ksm-7.21","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Một học sinh muốn quan sát trực quan sự chuyển hoá giữa các dạng năng lượng và lực hấp dẫn của vệ tinh trên máy tính mà không cần dụng cụ thí nghiệm. Bộ công cụ nào phù hợp nhất với sách giáo khoa?","options":["Power Query.","PhET (mô phỏng tương tác trực tuyến đa lĩnh vực).","PivotTable.","Máy chủ DNS."],"key":1,"optWhy":["","","",""],"why":"Hình 30.4 và 30.5 của sách lấy ví dụ từ mô phỏng 'các dạng năng lượng và sự chuyển hoá năng lượng' và 'lực hấp dẫn và quỹ đạo của vệ tinh'.","src":"sgk-khmt","cl":455},{"id":"ksm-7.22","topic":"ai","level":2,"tags":["khmt12"],"type":"mcq","stem":"Trong Bài 26, hệ khuyến nghị gợi ý video trên YouTube dựa trên lịch sử xem của người dùng là ví dụ của thành tựu nào của khoa học dữ liệu?","options":["Phân đoạn mạng để giảm lưu lượng truyền tải trong mạng cục bộ.","Cá nhân hoá dịch vụ, cải thiện trải nghiệm của từng khách hàng.","Mô phỏng thí nghiệm hoá học để thay thế cho thí nghiệm thật.","Giải trình tự gene để phát hiện các bệnh di truyền ở bệnh nhân."],"key":1,"optWhy":["","","",""],"why":"Ba nhóm thành tựu cụ thể: đổi mới quá trình ra quyết định; tự động hoá và thúc đẩy đổi mới sáng tạo; cá nhân hoá dịch vụ và cải thiện trải nghiệm khách hàng.","src":"sgk-khmt","cl":456},{"id":"ksm-M1","topic":"mang","level":3,"tags":["khmt12"],"type":"mcq","stem":"Phương án nào sau đây đúng khi nói về thiết bị mạng?","options":["Switch nối tạm hai cổng đang truyền nên giảm xung đột, hub phát ra mọi cổng.","Router chỉ có các cổng LAN để nối máy tính mà không có cổng WAN.","Hub và switch đều chọn đường đi cho gói tin giữa các mạng khác nhau.","Repeater làm tăng tốc độ truyền của đường truyền khi nối vào mạng."],"key":0,"optWhy":["","","",""],"why":"Chọn đường là chức năng cơ bản của router. Repeater chỉ chỉnh lại tín hiệu để truyền xa hơn, không tăng tốc độ.","src":"sgk-khmt","cl":398},{"id":"ksm-M2","topic":"mang","level":3,"tags":["khmt12"],"type":"mcq","stem":"Một phòng máy có 30 máy tính, 1 access point và 1 cổng nối lên switch tổng. Dùng switch loại 8, 16, 24 hoặc 32 cổng. Loại nhỏ nhất đủ cổng là:","options":["Loại 8 cổng.","Loại 32 cổng.","Loại 24 cổng.","Loại 16 cổng."],"key":1,"optWhy":["","","",""],"why":"30 + 1 + 1 = 32 cổng nên chọn loại 32 cổng (vừa đủ, không còn cổng dự phòng). Với thực tế nên chọn dư cổng dự phòng.","src":"sgk-khmt","cl":399},{"id":"ksm-M3","topic":"mang","level":3,"tags":["khmt12"],"type":"mcq","stem":"Khi thiết kế mạng, bước 'chọn hệ điều hành mạng' đứng ở vị trí nào?","options":["Bước cuối cùng, sau thiết kế vật lí.","Bước đầu tiên, trước khi khảo sát.","Đồng thời với thiết kế logic.","Giữa khảo sát và thiết kế logic."],"key":0,"optWhy":["","","",""],"why":"Thứ tự: khảo sát → thiết kế logic → thiết kế vật lí → chọn hệ điều hành mạng.","src":"sgk-khmt","cl":400},{"id":"ksm-M4","topic":"mang","level":3,"tags":["khmt12"],"type":"mcq","stem":"Mạng thông tin di động nào có thể truyền tải dữ liệu với tốc độ tối đa tới 10 Gb/s, độ trễ rất thấp và phù hợp với các ứng dụng IoT?","options":["2G.","3G.","4G.","5G."],"key":3,"optWhy":["","","",""],"why":"5G đạt tới 10 Gb/s theo sách giáo khoa.","src":"sgk-khmt","cl":401},{"id":"ksm-M5","topic":"mang","level":3,"tags":["khmt12"],"type":"mcq","stem":"Dữ liệu huấn luyện của một mô hình nhận dạng tiếng nói gồm các đoạn ghi âm kèm bản chép lời đúng. Đây là dạng học máy nào?","options":["Học có giám sát, vì dữ liệu có nhãn (bản chép lời).","Mô phỏng.","Học không giám sát, vì có nhiều đoạn ghi âm.","Không phải học máy."],"key":0,"optWhy":["","","",""],"why":"Bản chép lời đóng vai trò nhãn nên đây là dạng học có giám sát.","src":"sgk-khmt","cl":402},{"id":"ksm-M6","topic":"mang","level":3,"tags":["khmt12"],"type":"mcq","stem":"Trong năm chữ V của dữ liệu lớn, chữ V nào nhấn mạnh rằng dữ liệu cần được kiểm tra vì có thể chứa nhiễu hoặc sai số?","options":["Volume (khối lượng).","Veracity (tính xác thực).","Variety (sự đa dạng).","Velocity (vận tốc)."],"key":1,"optWhy":["","","",""],"why":"Veracity: sự cần thiết phải đảm bảo tính xác thực của dữ liệu.","src":"sgk-khmt","cl":403},{"id":"ksm-M8","topic":"mang","level":3,"tags":["khmt12"],"type":"mcq","stem":"Phát biểu nào sau đây về mô phỏng và học máy là đúng?","options":["Mô phỏng tạo mô hình ảo để thử nghiệm; học máy học từ dữ liệu để dự đoán.","Mô phỏng và học máy chỉ là hai tên gọi khác nhau của cùng một kĩ thuật.","Mô phỏng luôn luôn cần có dữ liệu đã được gán nhãn từ trước để chạy.","Học máy chỉ dùng trong giáo dục còn mô phỏng chỉ dùng trong ngành y tế."],"key":0,"optWhy":["","","",""],"why":"Đây là hai kĩ thuật khác nhau; mô phỏng không đòi hỏi dữ liệu có nhãn.","src":"sgk-khmt","cl":405},{"id":"ksm-Đ6.1","topic":"mang","level":3,"tags":["khmt12"],"type":"tf","stem":"Một trường học cần thiết kế mạng gồm 3 phòng thực hành (mỗi phòng 25 máy) và 1 khu văn phòng. Nhà trường muốn quản trị đơn giản, mỗi máy dùng một tài khoản ghi sẵn trên thân máy. Các phát biểu sau về thiết kế mạng:","items":[{"t":"Dùng hub nối các máy trong cùng một phòng rồi nối hub của mỗi phòng vào một switch chung giúp xung đột tín hiệu chỉ xảy ra trong phạm vi từng phòng.","v":true,"why":"Switch không mở cổng nếu không có yêu cầu truyền thực sự giữa hai cổng nên các phòng nằm ở các miền xung đột khác nhau."},{"t":"Đặt thêm một repeater giữa các hub sẽ chia nhỏ miền xung đột hiệu quả hơn dùng switch.","v":false,"why":"Repeater không chia nhỏ vùng xung đột, còn gây trễ tín hiệu."},{"t":"Mô hình workgroup là phù hợp vì không đòi hỏi quản trị phức tạp.","v":true,"why":"Mỗi máy có tài khoản riêng, không cần Domain Controller."},{"t":"Cần chọn hệ điều hành mạng trước khi khảo sát hiện trạng và phân tích nhu cầu.","v":false,"why":"Chọn hệ điều hành mạng là bước thứ 4, sau khảo sát, thiết kế logic và thiết kế vật lí."}],"why":"","src":"sgk-khmt","optWhy":[],"cl":504},{"id":"ksm-Đ6.2","topic":"mang","level":3,"tags":["khmt12"],"type":"tf","stem":"Khi lựa chọn đường truyền cho các tình huống khác nhau, các phát biểu sau:","items":[{"t":"Cáp quang không bị ảnh hưởng bởi nhiễu điện từ và có thể truyền xa hơn cáp xoắn.","v":true,"why":"Hai ưu điểm cáp quang được nêu trong Bài 23."},{"t":"Bluetooth thường dùng để nối hai thiết bị cá nhân trong phạm vi khoảng 10 m.","v":true,"why":"Tốc độ khoảng 1 Mb/s."},{"t":"Mạng 4G có tốc độ tối đa lớn hơn mạng 5G theo số liệu của sách giáo khoa.","v":false,"why":"4G tối đa 1,5 Gb/s, 5G tối đa 10 Gb/s."},{"t":"Có thể nối trực tiếp máy tính để bàn vào switch bằng cáp quang mà không cần bộ chuyển đổi tín hiệu.","v":false,"why":"Cần bộ chuyển đổi tín hiệu quang – điện vì máy tính trong LAN dùng tín hiệu điện."}],"why":"","src":"sgk-khmt","optWhy":[],"cl":505},{"id":"ksm-Đ7.1","topic":"ai","level":3,"tags":["khmt12"],"type":"tf","stem":"Một ngân hàng xây dựng hệ thống học máy phát hiện giao dịch thẻ có dấu hiệu gian lận. Dữ liệu gồm lịch sử giao dịch của hàng triệu khách, trong đó một phần nhỏ đã được chuyên gia gán nhãn 'gian lận' hoặc 'bình thường'. Các phát biểu sau:","items":[{"t":"Có thể dùng phần dữ liệu đã gán nhãn để huấn luyện mô hình học có giám sát dự đoán giao dịch mới là gian lận hay bình thường.","v":true,"why":"Dữ liệu có nhãn là điều kiện của học có giám sát."},{"t":"Có thể dùng học không giám sát trên các giao dịch chưa gán nhãn để tìm các giao dịch có hành vi bất thường so với phần còn lại.","v":true,"why":"Sách nêu phát hiện bất thường trong giao dịch thẻ tín dụng là bài toán áp dụng học không giám sát."},{"t":"Khi mô hình đã đạt kết quả rất tốt trên dữ liệu huấn luyện thì có thể bỏ bước đánh giá trên dữ liệu kiểm thử.","v":false,"why":"Bước đánh giá trên dữ liệu kiểm thử là để biết hiệu suất dự đoán trên dữ liệu mới, không thể bỏ."},{"t":"Phần mềm mô phỏng GPlates có thể dùng để phân loại giao dịch gian lận dựa trên nhiều đặc trưng khác nhau.","v":false,"why":"GPlates mô phỏng động học địa chất, không phải công cụ học máy phân loại giao dịch."}],"why":"","src":"sgk-khmt","optWhy":[],"cl":515},{"id":"ksm-Đ7.3","topic":"ai","level":3,"tags":["khmt12"],"type":"tf","stem":"Một trung tâm đào tạo lái xe dùng cabin mô phỏng lái xe ô tô cho học viên. Các phát biểu sau:","items":[{"t":"Mô phỏng giúp học viên luyện kĩ năng trong môi trường an toàn, giảm nguy cơ tai nạn.","v":true,"why":"Lợi ích giảm thiểu rủi ro và hỗ trợ đào tạo."},{"t":"Mô phỏng cho phép lặp lại các tình huống khó hoặc nguy hiểm mà ngoài đời thực khó hoặc không thể tái tạo.","v":true,"why":"Lợi ích về khả năng tuỳ chỉnh tham số và giả lập tình huống khó."},{"t":"Kết quả huấn luyện trong cabin mô phỏng luôn thay thế hoàn toàn việc thực hành trên đường thật.","v":false,"why":"Mô phỏng hỗ trợ và bổ sung, không 'luôn thay thế hoàn toàn'; chương trình đào tạo vẫn yêu cầu thực hành thật."},{"t":"Phần mềm mô phỏng chỉ được dùng trong lĩnh vực kĩ thuật.","v":false,"why":"Sách nêu mô phỏng dùng trong kĩ thuật, y tế, giải trí, giáo dục, quân sự, nghiên cứu…"}],"why":"","src":"sgk-khmt","optWhy":[],"cl":517},{"id":"ksm-ĐM.1","topic":"mang","level":3,"tags":["khmt12"],"type":"tf","stem":"Một trường THPT thiết kế mạng cho 2 toà nhà, mỗi toà có 2 phòng máy 30 máy tính. Hai toà nhà cách nhau 150 m, cần băng thông cao và ổn định giữa hai toà. Học sinh học thực hành chia sẻ tài liệu trong phòng, ít khi trao đổi với phòng khác. Các phát biểu:","items":[{"t":"Dùng switch ở mỗi phòng rồi nối các switch vào switch tổng giúp tách miền xung đột theo từng phòng.","v":true,"why":"Switch tách các miền xung đột."},{"t":"Cáp xoắn có khoảng cách hiệu quả khoảng 100 m nên nối trực tiếp một đoạn 150 m không đảm bảo, cần repeater hoặc dùng cáp quang.","v":true,"why":"Cáp quang thường dùng để nối các toà nhà xa nhau."},{"t":"Cần dùng mô hình domain vì có hơn 100 máy tính nên bắt buộc phải có máy chủ kiểm soát miền.","v":false,"why":"Chọn mô hình theo yêu cầu quản trị, không theo số máy tính; nếu quản trị đơn giản và không cần tài khoản tập trung thì workgroup vẫn phù hợp."},{"t":"Cấu trúc phân cấp (hình sao của các hình sao) phù hợp với mạng cục bộ có nhiều máy tính như trên.","v":true,"why":"Sách nêu cấu trúc phân cấp rất thích hợp với mạng có khoảng 100 máy tính."}],"why":"","src":"sgk-khmt","optWhy":[],"cl":506},{"id":"ksm-ĐM.2","topic":"mang","level":3,"tags":["khmt12"],"type":"tf","stem":"Một nhóm học sinh xây dựng hệ thống học máy gợi ý sách cho học sinh dựa trên lịch sử mượn sách của thư viện. Các phát biểu:","items":[{"t":"Đây là một ví dụ về hệ khuyến nghị, thuộc nhóm thành tựu cá nhân hoá dịch vụ của khoa học dữ liệu.","v":true,"why":"Hệ khuyến nghị là ví dụ trong Bài 26."},{"t":"Có thể dùng học không giám sát để nhóm các học sinh có thói quen mượn sách giống nhau.","v":true,"why":"Phân cụm là ứng dụng của học không giám sát."},{"t":"Dữ liệu huấn luyện thường chiếm khoảng 70% đến 80% tập dữ liệu, phần còn lại dùng để kiểm thử.","v":true,"why":"Theo Bài 25."},{"t":"Sau khi huấn luyện xong, không cần cập nhật mô hình nữa dù thư viện mua thêm nhiều sách mới.","v":false,"why":"Học máy có thể bổ sung dữ liệu và cập nhật mô hình khi dữ liệu thay đổi theo thời gian."}],"why":"","src":"sgk-khmt","optWhy":[],"cl":507},{"id":"ai-1","topic":"ai","level":2,"tags":["ml"],"type":"mcq","stem":"Trong học máy có giám sát, dữ liệu huấn luyện khác dữ liệu không giám sát ở điểm nào?","options":["Mỗi mẫu dữ liệu có kèm nhãn (đáp án) để mô hình học theo","Không cần dữ liệu đầu vào mà chỉ cần dữ liệu đầu ra đã có sẵn","Mô hình tự sinh nhãn mà hoàn toàn không cần con người can thiệp","Chỉ áp dụng được với dữ liệu là hình ảnh hoặc dữ liệu âm thanh"],"key":0,"optWhy":["","","",""],"why":"Kiến thức nền của môn Tin học/ICT lớp 10-12 (kiểm chứng đối chiếu nội dung SGK, không chạy mã).","src":"hand","cl":457},{"id":"ai-2","topic":"ai","level":3,"tags":["ml"],"type":"mcq","stem":"Mô hình đạt độ chính xác 99% trên tập huấn luyện nhưng chỉ 62% trên tập kiểm tra. Hiện tượng này là gì?","options":["Mô hình đã hội tụ tối ưu","Quá khớp (overfitting)","Dữ liệu kiểm tra luôn khó hơn nên là bình thường","Chưa khớp (underfitting)"],"key":1,"optWhy":["","","",""],"why":"Kiến thức nền của môn Tin học/ICT lớp 10-12 (kiểm chứng đối chiếu nội dung SGK, không chạy mã).","src":"hand","cl":458},{"id":"ai-3","topic":"ai","level":3,"tags":["ml"],"type":"mcq","stem":"Trong bài toán phát hiện thư rác, 100 thư gồm 10 thư rác. Bộ lọc dự đoán toàn bộ là \"không rác\". Nhận định nào đúng?","options":["Không thể tính độ chính xác khi dữ liệu mất cân bằng như vậy","Độ chính xác chỉ là 10% nên bộ lọc này có chất lượng rất kém","Độ chính xác 100% vì bộ lọc không đoán sai thư thường nào cả","Accuracy là 90% nhưng bộ lọc vô dụng v :3,"tags":["ai-khainiem"],"type":"mcq","stem":"Nhận định nào đúng khi phân biệt “tự động hoá” và “trí tuệ nhân tạo”?","options":["Tự động hoá lặp thao tác cố định; hệ AI cần học, suy luận, nhận thức","Một hệ thống chỉ được coi là AI khi nó có hình dạng giống con robot","Mọi hệ thống tự động hoá đều là AI vì đều thay thế sức người làm việc","Hệ thống là AI khi chạy trên máy tính, bất kể nó thực hiện việc gì"],"key":0,"optWhy":[],"why":"SGK nêu rõ: các hệ thống tự động hoá như dây chuyền lắp ráp, robot cơ giới hoá chỉ thực hiện lặp đi lặp lại một vài thao tác cố định, không được coi là có ứng dụng AI.","src":"sgk","mono":false,"v2":true,"cl":470},{"id":"ai-ai-khainiem-3","topic":"ai","level":2,"tags":["ai-khainiem"],"type":"mcq","stem":"Năm nào Alan Turing đưa ra “phép thử Turing” và sự kiện nào được coi là điểm mốc ra đời thuật ngữ AI?","options":["Năm 1950; Hội thảo Dartmouth năm 1956","Năm 1950; sự ra đời của ChatGPT năm 2022","Năm 1956; Hội thảo Dartmouth năm 1950","Năm 1936; Hội thảo Dartmouth năm 1956"],"key":0,"optWhy":[],"why":"Phép thử Turing (1950) là cách đánh giá bước đầu khả năng thể hiện hành vi thông minh của máy; Hội thảo Dartmouth (1956) đánh dấu sự ra đời của thuật ngữ AI.","src":"sgk","mono":false,"v2":true,"cl":471},{"id":"ai-ai-dactrung-4","topic":"ai","level":3,"tags":["ai-dactrung"],"type":"mcq","stem":"Hệ thống chẩn đoán y tế dựa vào tri thức về triệu chứng và bệnh lí để đưa ra kết luận về tình trạng người bệnh. Đây là ví dụ của đặc trưng nào của AI?","options":["Khả năng suy luận","Khả năng nhận thức","Khả năng học","Khả năng hiểu ngôn ngữ"],"key":0,"optWhy":[],"why":"Suy luận là vận dụng logic và tri thức để ra quyết định hoặc kết luận. Nhận thức là cảm nhận môi trường qua cảm biến; hiểu ngôn ngữ là xử lí văn bản/tiếng nói; học là điều chỉnh hành vi từ dữ liệu mới.","src":"sgk","mono":false,"v2":true,"cl":472},{"id":"ai-ai-dactrung-5","topic":"ai","level":3,"tags":["ai-dactrung"],"type":"mcq","stem":"Máy tính điều khiển xe tự lái dùng radar và camera phát hiện xe xung quanh, biển báo, người đi bộ. Hoạt động đó thể hiện chủ yếu khả năng nào?","options":["Khả năng giải quyết vấn đề","Khả năng suy luận","Khả năng hiểu ngôn ngữ","Khả năng nhận thức"],"key":3,"optWhy":[],"why":"Nhận thức là khả năng cảm nhận và hiểu biết môi trường thông qua cảm biến và dữ liệu đầu vào.","src":"sgk","mono":false,"v2":true,"cl":473},{"id":"ai-ai-dactrung-6","topic":"ai","level":3,"tags":["ai-dactrung"],"type":"mcq","stem":"Hệ thống dự báo thời tiết dùng mô hình xây dựng từ dữ liệu thời tiết nhiều năm để đưa ra bản tin dự báo. Theo SGK, ví dụ này minh hoạ khả năng nào?","options":["Khả năng giải quyết vấn đề","Khả năng hiểu ngôn ngữ","Khả năng nhận thức bằng thị giác máy tính","Khả năng học qua tương tác trực tiếp với người dùng"],"key":0,"optWhy":[],"why":"SGK dùng hệ thống dự báo thời tiết làm ví dụ cho khả năng giải quyết vấn đề (tìm cách giải quyết tình huống phức tạp dựa trên thông tin và tri thức).","src":"sgk","mono":false,"v2":true,"cl":474},{"id":"ai-ai-loai-7","topic":"ai","level":2,"tags":["ai-loai"],"type":"mcq","stem":"Chương trình AI chỉ biết chơi cờ vua, hoặc chỉ nhận dạng khuôn mặt, được xếp vào loại nào?","options":["AI hẹp (yếu): thiết kế để thực hiện một nhiệm vụ cụ thể nhất định","Chưa phải AI vì chương trình đó chỉ làm được một công việc duy nhất","AI tạo sinh, vì chương trình luôn sinh ra những nước đi mới mẻ","AI tổng quát (mạnh), vì đã vượt qua con người ở nhiệm vụ cụ thể đó"],"key":0,"optWhy":[],"why":"AI hẹp làm tốt một nhiệm vụ cụ thể; AI tổng quát (mạnh) có khả năng tự học, thích nghi và làm nhiều việc như con người, hiện vẫn là mục tiêu dài hạn.","src":"sgk","mono":false,"v2":true,"cl":475},{"id":"ai-ai-loai-8","topic":"ai","level":3,"tags":["ai-loai"],"type":"mcq","stem":"Phát biểu nào về AI tổng quát (Trí tuệ nhân tạo mạnh) là đúng theo SGK?","options":["Đã được triển khai rộng rãi trong ô tô tự lái và các trợ lí ảo hiện nay","Có năng lực trí tuệ như con người, vẫn là mục tiêu dài hạn của nghiên cứu","Chính là AI tạo sinh như ChatGPT mà người dùng đang sử dụng hằng ngày","Chỉ khác AI hẹp ở chỗ nó được huấn luyện với nhiều dữ liệu hơn mà thôi"],"key":1,"optWhy":[],"why":"Các thành tựu hiện tại, kể cả AI tạo sinh, vẫn thuộc phạm vi AI hẹp; AI tổng quát chưa đạt được.","src":"sgk","mono":false,"v2":true,"cl":476},{"id":"ai-ai-tao-sinh-9","topic":"ai","level":3,"tags":["ai-tao-sinh"],"type":"mcq","stem":"AI tạo sinh (Generative AI) là hướng phát triển AI tập trung vào việc:","options":["Xây dựng mô hình tự động tạo nội dung mới như ảnh, âm thanh, văn bản","Điều khiển robot lặp lại các thao tác với độ chính xác thật cao liên tục","Mã hoá dữ liệu để bảo mật khi truyền qua mạng giữa các máy tính khác nhau","Phân loại thư điện tử thành thư rác và thư thường dựa trên nội dung thư"],"key":0,"optWhy":[],"why":"Ví dụ điển hình là ChatGPT (OpenAI), được coi là bước đột phá của năm 2022.","src":"sgk","mono":false,"v2":true,"cl":477},{"id":"ai-ai-ungdung-10","topic":"ai","level":3,"tags":["ai-ungdung"],"type":"mcq","stem":"Hệ chuyên gia ban đầu là chương trình dựa trên “luật suy diễn và tri thức của chuyên gia”. Sự phát triển của học máy đã làm hệ chuyên gia thay đổi như thế nào?","options":["Nhiều hệ chuyên gia tự học từ dữ liệu để hình thành luật và tri thức","Hệ chuyên gia đã bị thay thế hoàn toàn bằng các phần mềm bảng tính","Hệ chuyên gia hiện chỉ còn được dùng trong tự động hoá dây chuyền","Hệ chuyên gia ngày nay không còn cần đến dữ liệu để vận hành nữa"],"key":0,"optWhy":[],"why":"Theo SGK Bài 2, nhờ học máy nhiều hệ chuyên gia đã có khả năng tự học từ dữ liệu.","src":"sgk","mono":false,"v2":true,"cl":478},{"id":"ai-ai-ungdung-11","topic":"ai","level":2,"tags":["ai-ungdung"],"type":"mcq","stem":"Trong lĩnh vực giáo dục, ứng dụng AI nào sau đây phù hợp với nội dung SGK?","options":["Máy chiếu tự động tắt sau 30 phút không có ai sử dụng trong lớp","Nền tảng học thông minh theo dõi tiến trình và đề xuất nội dung phù hợp","Bảng tính tự cộng điểm của học sinh theo công thức đã nhập sẵn","Phần mềm chiếu bài giảng đã soạn theo một thứ tự cố định ban đầu"],"key":1,"optWhy":[],"why":"AI giúp cá nhân hoá học tập và hỗ trợ đánh giá kết quả học tập; các ví dụ còn lại chỉ là phần mềm/thiết bị thực hiện thao tác cố định.","src":"sgk","mono":false,"v2":true,"cl":479},{"id":"ai-ai-ungdung-12","topic":"ai","level":3,"tags":["ai-ungdung"],"type":"mcq","stem":"Việc kết hợp Internet vạn vật (IoT) với AI (AIoT) giúp các nhà khoa học trong lĩnh vực nào theo ví dụ của SGK?","options":["Tăng tốc độ đường truyền cáp quang giữa các trạm quan trắc xa xôi","Giám sát môi trường tự nhiên và theo dõi sự biến đổi của khí hậu","Mã hoá thông tin cá nhân của người dùng khi gửi qua các thiết bị","Thay thế hoàn toàn các trạm khí tượng bằng sự quan sát của con người"],"key":1,"optWhy":[],"why":"SGK nêu AIoT cho phép giám sát môi trường tự nhiên và theo dõi biến đổi khí hậu.","src":"sgk","mono":false,"v2":true,"cl":480},{"id":"ai-ai-ungdung-13","topic":"ai","level":3,"tags":["ai-ungdung"],"type":"mcq","stem":"Một công ty ngân hàng dùng AI để phân tích giao dịch, phát hiện các giao dịch bất thường cần ngăn chặn gian lận. Phát biểu nào đúng?","options":["Đây chỉ là tự động hoá việc nhập liệu nên không thể coi là AI được","Hệ thống này chắc chắn không bao giờ cảnh báo sai một giao dịch nào","Hệ thống này chỉ có thể được sử dụng trong lĩnh vực y tế mà thôi","Đây là AI trong tài chính: phân tích dữ liệu, phát hiện giao dịch gian lận"],"key":3,"optWhy":[],"why":"AI trong tài chính, ngân hàng không chỉ tự động hoá nhập hoá đơn vào CSDL mà còn phân tích dữ liệu hỗ trợ đầu tư, phát hiện và ngăn chặn gian lận.","src":"sgk","mono":false,"v2":true,"cl":481},{"id":"ai-ai-canhbao-14","topic":"ai","level":3,"tags":["ai-canhbao"],"type":"mcq","stem":"Một mô hình nhận dạng khuôn mặt hoạt động kém với một số nhóm người vì dữ liệu huấn luyện chủ yếu gồm ảnh của một nhóm khác. Đây là vấn đề gì?","options":["Lỗi đường truyền mạng khi hệ thống tải ảnh về để huấn luyện mô hình","Lỗi cú pháp trong ngôn ngữ lập trình dùng để viết chương trình huấn luyện","Hiện tượng xung đột tín hiệu (collision) trên đường truyền của mạng","Thiên lệch của dữ liệu huấn luyện làm kết quả thiếu công bằng với nhóm khác"],"key":3,"optWhy":[],"why":"Chất lượng và tính đại diện của dữ liệu huấn luyện quyết định độ công bằng của mô hình học máy.","src":"sgk","mono":false,"v2":true,"cl":482},{"id":"ai-ai-canhbao-15","topic":"ai","level":3,"tags":["ai-canhbao"],"type":"mcq","stem":"Phát biểu nào sau đây là một cảnh báo hợp lí khi phát triển và sử dụng AI?","options":["Có thể tin tuyệt đối vào mọi kết quả do hệ thống AI tạo ra cho người dùng","AI không bao giờ ảnh hưởng đến việc làm của con người trong tương lai","Cần kiểm chứng kết quả AI, bảo vệ dữ liệu cá nhân và xác định trách nhiệm","Chỉ cần quan tâm đến tốc độ xử lí, không cần quan tâm đến vấn đề đạo đức"],"key":2,"optWhy":[],"why":"AI đem lại lợi ích lớn nhưng cũng đặt ra vấn đề về quyền riêng tư, thiên lệch dữ liệu, thông tin sai lệch, trách nhiệm và tác động tới việc làm.","src":"sgk","mono":false,"v2":true,"cl":483},{"id":"ai-ml-16","topic":"ai","level":3,"tags":["ml"],"type":"mcq","stem":"Một nhóm dùng dữ liệu 10 000 ảnh đã được người gán nhãn “mèo” hoặc “chó” để huấn luyện mô hình phân loại ảnh mới. Đây là dạng học máy nào?","options":["Học bằng cách tối đa hoá phần thưởng","Học không giám sát","Học có giám sát","Học tự phát hiện cụm mà không cần nhãn"],"key":2,"optWhy":[],"why":"Dữ liệu có nhãn (đáp án) cho từng mẫu là dấu hiệu của học có giám sát.","src":"sgk","mono":false,"v2":true,"cl":484},{"id":"ai-ml-17","topic":"ai","level":3,"tags":["ml"],"type":"mcq","stem":"Công ty có hàng triệu hồ sơ khách hàng, chưa ai gán nhãn. Họ muốn mô hình tự chia khách hàng thành các nhóm có đặc điểm giống nhau để thiết kế chiến dịch. Cách tiếp cận phù hợp nhất là:","options":["Học có giám sát vì cần có đáp án trước","Không dùng học máy, chỉ dùng phép cộng thủ công","Học có giám sát vì khách hàng luôn có nhãn sẵn","Học không giám sát (phân cụm)"],"key":3,"optWhy":[],"why":"Khi không có nhãn mà muốn phát hiện cấu trúc ẩn như các nhóm tương tự, dùng học không giám sát.","src":"sgk","mono":false,"v2":true,"cl":485},{"id":"ai-ml-18","topic":"ai","level":3,"tags":["ml"],"type":"mcq","stem":"Mô hình đạt 98% độ chính xác trên dữ liệu huấn luyện nhưng chỉ 70% trên dữ liệu kiểm tra mới. Nguyên nhân thường gặp nhất là:","options":["Đường truyền mạng quá chậm trong quá trình huấn luyện mô hình học máy","Dữ liệu kiểm tra luôn luôn dễ hơn dữ liệu huấn luyện đã dùng trước đó","Mô hình quá khớp, học thuộc dữ liệu huấn luyện nên khó tổng quát hoá","Mô hình đã đạt đến mức tối ưu nên không cần phải cải thiện thêm nữa"],"key":2,"optWhy":[],"why":"Chênh lệch lớn giữa kết quả trên tập huấn luyện và tập kiểm tra là dấu hiệu của quá khớp.","src":"sgk","mono":false,"v2":true,"cl":486},{"id":"ai-khdl-19","topic":"ai","level":3,"tags":["khdl"],"type":"mcq","stem":"Trong quy trình khoa học dữ liệu, “làm sạch dữ liệu” nhằm mục đích nào?","options":["Xử lí giá trị thiếu, trùng lặp, sai định dạng để dữ liệu đủ tin cậy","Tăng dung lượng lưu trữ cho máy chủ để chứa được nhiều dữ liệu hơn","Mã hoá dữ liệu để những người bên ngoài không thể đọc được nội dung","Chuyển toàn bộ dữ liệu thành hình ảnh để việc phân tích dễ dàng hơn"],"key":0,"optWhy":[],"why":"Chất lượng dữ liệu ảnh hưởng trực tiếp tới chất lượng kết luận và mô hình.","src":"sgk","mono":false,"v2":true,"cl":487},{"id":"ai-mo-phong-20","topic":"ai","level":3,"tags":["mo-phong"],"type":"mcq","stem":"Lí do nào sau đây giải thích vì sao người ta dùng mô phỏng trên máy tính thay cho thực nghiệm thật trong nhiều bài toán?","options":["Tiết kiệm chi phí, tránh nguy hiểm, dễ lặp lại và thay đổi tham số","Mô phỏng chỉ dùng được cho các trò chơi điện tử trên máy tính mà thôi","Mô phỏng không cần phải xây dựng mô hình của hệ thống thực để chạy","Mô phỏng luôn cho kết quả chính xác tuyệt đối giống như trong thực tế"],"key":0,"optWhy":[],"why":"Mô phỏng dùng mô hình gần đúng của hệ thống thực; kết quả phụ thuộc chất lượng mô hình và tham số.","src":"sgk","mono":false,"v2":true,"cl":488},{"id":"ai-ml-tf21","topic":"ai","level":3,"tags":["ml"],"type":"tf","stem":"Một hệ thống học máy được dùng để dự đoán điểm thi dựa trên thời gian ôn tập. Dữ liệu gồm 500 học sinh với hai cột: số giờ ôn (đặc trưng) và điểm thi (nhãn). Các phát biểu:","items":[{"t":"Đây là bài toán học có giám sát vì mỗi mẫu có kèm nhãn là điểm thi.","v":true,"why":"Có nhãn cho từng mẫu."},{"t":"Nếu chỉ huấn luyện và đo kết quả trên cùng 500 mẫu thì kết quả đo được luôn phản ánh đúng chất lượng dự đoán với học sinh mới.","v":false,"why":"Cần tập kiểm tra riêng; đo trên dữ liệu đã huấn luyện dễ đánh giá quá cao (quá khớp)."},{"t":"Việc dữ liệu thiếu học sinh khá giỏi có thể làm mô hình dự đoán lệch cho nhóm đó.","v":true,"why":"Dữ liệu không đại diện gây thiên lệch."},{"t":"Vì có nhãn nên không cần làm sạch dữ liệu (giá trị thiếu, trùng lặp).","v":false,"why":"Dữ liệu có nhãn vẫn cần làm sạch."}],"why":"","src":"sgk","v2":true,"optWhy":[],"cl":518},{"id":"ai-ai-canhbao-tf22","topic":"ai","level":3,"tags":["ai-canhbao"],"type":"tf","stem":"Một trường dùng chatbot AI trả lời thắc mắc của phụ huynh. Các phát biểu:","items":[{"t":"Chatbot có thể được coi là thể hiện khả năng hiểu ngôn ngữ của AI.","v":true,"why":"Hiểu và xử lí ngôn ngữ tự nhiên là một đặc trưng của AI."},{"t":"Nếu chatbot chỉ trả lời theo kịch bản “gõ số 1 để biết học phí, gõ số 2 để biết lịch học” thì đó là AI tạo sinh.","v":false,"why":"Menu cố định là tự động hoá theo kịch bản, không tạo nội dung mới."},{"t":"Câu trả lời của chatbot AI tạo sinh luôn đúng nên nhà trường không cần kiểm duyệt.","v":false,"why":"AI tạo sinh có thể trả lời sai hoặc bịa nội dung; cần kiểm chứng."},{"t":"Việc chatbot lưu lại tin nhắn của phụ huynh đặt ra vấn đề bảo vệ dữ liệu cá nhân.","v":true,"why":"Thu thập, lưu trữ dữ liệu cá nhân phải có mục đích rõ ràng, được đồng ý và bảo mật."}],"why":"","src":"sgk","v2":true,"optWhy":[],"cl":519},{"id":"mang-tbmang-23","topic":"mang","level":2,"tags":["tbmang"],"type":"mcq","stem":"Điểm khác nhau cơ bản giữa hub và switch là gì?","options":["Hub phát tín hiệu ra mọi cổng; switch tạo kênh tạm giữa cổng gửi và nhận","Switch chọn đường đi giữa các mạng LAN khác nhau còn hub thì không","Hub chỉ dùng cho mạng không dây còn switch chỉ dùng cho mạng có dây","Hub nhanh hơn switch vì hub không phải xử lí gì đối với tín hiệu nhận"],"key":0,"optWhy":[],"why":"Hub dễ gây xung đột tín hiệu hơn; chọn đường giữa các mạng là chức năng của router.","src":"sgk","mono":false,"v2":true,"cl":406},{"id":"mang-tbmang-24","topic":"mang","level":3,"tags":["tbmang"],"type":"mcq","stem":"Một mạng gia đình có 4 thiết bị đầu cuối, yêu cầu chi phí thấp nhất. Một mạng văn phòng có hàng chục máy dùng liên tục. Theo SGK, lựa chọn nào hợp lí?","options":["Cả hai mạng đều nên dùng repeater thay cho switch để tiết kiệm chi phí","Nhà dùng hub cho rẻ; văn phòng nên dùng switch vì ít xung đột tín hiệu","Cả hai mạng đều bắt buộc phải dùng hub vì hub luôn nhanh hơn switch","Nhà bắt buộc dùng router chuyên dụng, văn phòng chỉ cần dùng hub là đủ"],"key":1,"optWhy":[],"why":"Ít thiết bị đầu cuối thì nguy cơ xung đột thấp, có thể dùng hub; LAN từ vài chục đến hàng trăm máy nên dùng switch.","src":"sgk","mono":false,"v2":true,"cl":407},{"id":"mang-tbmang-25","topic":"mang","level":3,"tags":["tbmang"],"type":"mcq","stem":"Wi-Fi được hiểu đúng nhất là gì?","options":["Giao thức quy định cách đặt địa chỉ IP cho các thiết bị trong mạng","Tên một loại cáp mạng không dây dùng để nối các máy tính với nhau","Tên gọi của loại modem quang dùng để nối mạng của nhà cung cấp","Bộ tiêu chuẩn truyền dữ liệu bằng sóng vô tuyến, thiết bị phát là AP"],"key":3,"optWhy":[],"why":"Wi-Fi viết tắt của Wireless Fidelity; bộ thu phát Wi-Fi còn gọi là WAP/AP.","src":"sgk","mono":false,"v2":true,"cl":408},{"id":"mang-tbmang-26","topic":"mang","level":3,"tags":["tbmang"],"type":"mcq","stem":"Router có cổng LAN và cổng WA cl":286},{"id":"web-html-media-15","topic":"web","level":3,"tags":["html-media"],"type":"mcq","stem":"Phát biểu nào đúng về thẻ <video> và <audio>?","options":["Cả <audio> và <video> đều có thuộc tính poster để hiển thị ảnh đại diện","Thuộc tính autoplay luôn được bảo đảm chạy trên mọi trình duyệt hiện nay","Muốn có nút điều khiển phát/dừng bắt buộc phải dùng thẻ <button> riêng","<video> có width, height, poster mà <audio> không có; có thể dùng nhiều <source>"],"key":3,"optWhy":[],"why":"controls hiện bộ điều khiển; autoplay là thuộc tính boolean nhưng nhiều trình duyệt như Chrome hạn chế tự chạy; hai định dạng video phổ biến là mp4 và webm.","src":"sgk","mono":false,"v2":true,"cl":287},{"id":"web-html-media-16","topic":"web","level":3,"tags":["html-media"],"type":"mcq","stem":"Thẻ <iframe> trong trang web dùng để làm gì?","options":["Thay thế cho thẻ <video> khi cần phát một tệp âm thanh có định dạng nhạc","Nhóm nhiều ô nhập liệu có liên quan với nhau trong một biểu mẫu web","Hiển thị một trang web hoặc tài liệu khác trong khung nằm trong trang","Tạo một tệp CSS rồi nhúng vào trang để định dạng cho toàn bộ trang"],"key":2,"optWhy":[],"why":"iframe (khung nội tuyến) dùng thuộc tính src, width, height.","src":"sgk","mono":false,"v2":true,"cl":288},{"id":"web-html-bieumau-17","topic":"web","level":3,"tags":["html-bieumau"],"type":"mcq","stem":"Cho <label for=\"hoten\">Họ tên:<\/label> <input type=\"text\" id=\"hoten\" name=\"ten\">. Khi người dùng nháy vào chữ «Họ tên:», điều gì xảy ra và vai trò của các thuộc tính là gì?","options":["Trang tải lại; for là đường dẫn tới máy chủ; name là mật khẩu người dùng","Ô nhập bị khoá lại; for quy định số kí tự; name quy định kiểu dữ liệu","Không có gì xảy ra; for và name chỉ dùng để định dạng bằng CSS cho nhãn","Con trỏ vào ô có id=\"hoten\"; for nối nhãn với id; name dùng khi gửi dữ liệu"],"key":3,"optWhy":[],"why":"Giá trị for phải trùng id của input; name dùng khi xử lí dữ liệu.","src":"sgk","mono":false,"v2":true,"cl":289},{"id":"web-html-bieumau-18","topic":"web","level":3,"tags":["html-bieumau"],"type":"mcq","stem":"Chọn cặp (kiểu input, mục đích) đúng:","options":["type=\"button\": nút gửi dữ liệu mặc định lên máy chủ; type=\"date\": chọn tệp","type=\"submit\": nhập văn bản một dòng; type=\"text\": nút gửi dữ liệu","type=\"password\": nhập mật khẩu bị che kí tự; type=\"file\": chọn tệp để tải lên","type=\"radio\": chọn nhiều giá trị cùng lúc; type=\"checkbox\": chọn đúng một giá trị"],"key":2,"optWhy":[],"why":"radio cùng name chỉ chọn một; checkbox chọn nhiều; submit gửi form về địa chỉ ở action; button cần thêm xử lí (ví dụ script).","src":"sgk","mono":false,"v2":true,"cl":290},{"id":"web-html-bieumau-19","topic":"web","level":3,"tags":["html-bieumau"],"type":"mcq","stem":"Phát biểu nào về biểu mẫu web là đúng?","options":["HTML tự xử lí và lưu dữ liệu form vào cơ sở dữ liệu mà không cần ứng dụng","Biểu mẫu chỉ gồm có hai loại phần tử là input và label, không có loại khác","Thẻ <form> không thể chứa thẻ <select> hay các phần tử lựa chọn khác","Biểu mẫu gồm phần HTML hiển thị và phần ứng dụng xử lí dữ liệu, ngoài HTML"],"key":3,"optWhy":[],"why":"Các phần tử thường dùng: input, label, select, textarea; ngoài ra có fieldset, legend, datalist.","src":"sgk","mono":false,"v2":true,"cl":291},{"id":"web-html-bieumau-20","topic":"web","level":3,"tags":["html-bieumau"],"type":"mcq","stem":"Để ô chọn quê quán hiển thị danh sách thả xuống gồm các tỉnh/thành, ta cần các thẻ nào?","options":["<input type=\"select\"> chứa nhiều thẻ <li>","<select> chứa nhiều thẻ <option>","<textarea> chứa nhiều thẻ <option>","<ul> chứa nhiều thẻ <select>"],"key":1,"optWhy":[],"why":"Mỗi cặp option định nghĩa một lựa chọn; select có thể có thuộc tính name.","src":"sgk","mono":false,"v2":true,"cl":292},{"id":"web-html-bieumau-21","topic":"web","level":3,"tags":["html-bieumau"],"type":"mcq","stem":"Cần ô nhập nhận xét dài nhiều dòng trong biểu mẫu. Phần tử nào phù hợp?","options":["<input type=\"text\">","<select>","<textarea>","<label>"],"key":2,"optWhy":[],"why":"Ô <input type=\"text\"> chỉ nhập một dòng.","src":"sgk","mono":false,"v2":true,"cl":293},{"id":"web-css-nhung-22","topic":"web","level":2,"tags":["css-nhung"],"type":"mcq","stem":"Có mấy cách nhúng CSS vào trang HTML, và cách nào giúp một tệp CSS dùng chung cho nhiều trang?","options":["Ba cách; dùng thẻ <style> ở đầu mỗi trang web để dùng chung nhiều trang","Một cách duy nhất là viết các quy tắc định dạng trong thẻ <style> của trang","Hai cách; dùng thuộc tính style trong từng thẻ để dùng chung cho nhiều trang","Ba cách (trong thẻ, <style>, tệp ngoài); tệp ngoài qua <link rel=\"stylesheet\">"],"key":3,"optWhy":[],"why":"Inline (thuộc tính style), internal (<style> trong head), external (tệp .css liên kết bằng <link>). Tệp ngoài giúp thống nhất giao diện nhiều trang và tách nội dung khỏi định dạng.","src":"sgk","mono":false,"v2":true,"cl":294},{"id":"web-css-nhung-23","topic":"web","level":3,"tags":["css-nhung"],"type":"mcq","stem":"Vai trò, ý nghĩa của CSS khi xây dựng website là gì?","options":["Lưu trữ dữ liệu mà người dùng nhập vào biểu mẫu của website trên máy chủ","Thay thế hoàn toàn HTML trong việc tạo ra nội dung của các trang web","Tách nội dung khỏi trình bày, sửa tệp CSS là đổi giao diện toàn website","Tăng tốc độ tải trang bằng cách nén toàn bộ hình ảnh của trang web"],"key":2,"optWhy":[],"why":"CSS: Cascading Style Sheets – ngôn ngữ định dạng.","src":"sgk","mono":false,"v2":true,"cl":295},{"id":"web-css-nhung-24","topic":"web","level":3,"tags":["css-nhung"],"type":"mcq","stem":"Cú pháp CSS nào đúng?","options":["h1 { color: red; text-align: center; }","<h1 color=\"red; text-align: center;\">","h1: { color: red | text-align: center }","h1 ( color = red, text-align = center )"],"key":0,"optWhy":[],"why":"Mẫu định dạng gồm bộ chọn và khối khai báo {thuộc tính: giá trị;}.","src":"sgk","mono":false,"v2":true,"cl":296},{"id":"web-css-ke-thua-25","topic":"web","level":3,"tags":["css-ke-thua"],"type":"mcq","stem":"Cho CSS: body { color: blue; } h1 { color: red; }. Một thẻ <h2> và một thẻ <p> trong body (không có CSS riêng) có màu chữ gì, và vì sao?","options":["Cả hai màu xanh dương vì kế thừa từ body; chỉ h1 màu đỏ","h2 màu đỏ, p màu xanh dương","Cả hai màu đen vì CSS chỉ áp dụng cho thẻ được chọn trực tiếp","Cả hai màu đỏ vì h1 ưu tiên cao hơn body"],"key":0,"optWhy":[],"why":"Tính kế thừa: định dạng áp dụng cho phần tử cha sẽ áp dụng cho các phần tử con, cháu (trừ khi có định dạng riêng). Thẻ h1 được chọn trực tiếp nên màu đỏ.","src":"sgk","mono":false,"v2":true,"cl":297},{"id":"web-css-ke-thua-26","topic":"web","level":3,"tags":["css-ke-thua"],"type":"mcq","stem":"Hai quy tắc CSS có CÙNG bộ chọn: h1 {color: red; text-align: center;} và sau đó h1 {text-align: left;}. Kết quả hiển thị của h1 là:","options":["Chữ màu đen và căn trái vì quy tắc thứ hai xoá hết các định dạng trước","Chữ màu đỏ và căn trái, quy tắc viết sau ghi đè thuộc tính bị trùng","Chữ màu đen và căn giữa vì quy tắc thứ nhất được ưu tiên hơn hẳn","Chữ màu đỏ và căn giữa vì quy tắc đầu tiên ghi đè quy tắc viết sau"],"key":1,"optWhy":[],"why":"Nguyên tắc thứ tự cuối cùng (cascading): cùng trọng số thì định dạng ở vị trí cuối cùng được áp dụng; thuộc tính không bị ghi đè (color) vẫn giữ.","src":"sgk","mono":false,"v2":true,"cl":298},{"id":"web-css-vanban-27","topic":"web","level":2,"tags":["css-vanban"],"type":"mcq","stem":"Thuộc tính CSS nào dùng để căn giữa nội dung văn bản trong phần tử khối, và thuộc tính nào làm đậm chữ?","options":["text-center: yes; font-bold: on","text-align: middle; text-weight: bold","align: middle; font: bold","text-align: center; font-weight: bold"],"key":3,"optWhy":[],"why":"Một số thuộc tính văn bản: font-family, font-size, font-weight, font-style, text-align, text-decoration, text-indent, line-height.","src":"sgk","mono":false,"v2":true,"cl":299},{"id":"web-css-vanban-28","topic":"web","level":3,"tags":["css-vanban"],"type":"mcq","stem":"Thuộc tính text-indent: 2em; áp dụng cho một đoạn văn có tác dụng gì?","options":["Tăng khoảng cách giữa các dòng của đoạn văn lên gấp đôi so với trước","Tăng cỡ chữ của đoạn văn lên gấp hai lần so với cỡ chữ ban đầu","Mọi dòng của đoạn văn đều thụt vào một khoảng bằng 2 pixel cố định","Dòng đầu của đoạn thụt vào một khoảng bằng độ rộng 2 kí tự (đơn vị em)"],"key":3,"optWhy":[],"why":"em là đơn vị tương đối theo cỡ chữ; line-height mới điều chỉnh khoảng cách dòng.","src":"sgk","mono":false,"v2":true,"cl":300},{"id":"web-css-mau-29","topic":"web","level":3,"tags":["css-mau"],"type":"mcq","stem":"Những cách nào dưới đây biểu diễn đúng màu đỏ trong CSS?","options":["#FF0000; rgb(0, 0, 255); hsl(240, 100%, 50%)","#F00F; rgb(0, 255, 0); red","red; #00FF00; rgb(255, 0, 0)","red; #FF0000; rgb(255, 0, 0)"],"key":3,"optWhy":[],"why":"Hệ màu CSS gồm tên màu, mã thập lục phân #RRGGBB, rgb(r,g,b) và hsl(). Xanh lá là #00FF00, xanh dương là #0000FF.","src":"sgk","mono":false,"v2":true,"cl":301},{"id":"web-css-khung-30","topic":"web","level":3,"tags":["css-khung"],"type":"mcq","stem":"Phần tử nào là phần tử KHỐI (block) và phần tử nào là phần tử nội tuyến (inline) theo mặc định?","options":["<span> và <p> là phần tử khối; <div> và <a> là phần tử nội tuyến","<p> và <a> đều là các phần tử nội tuyến theo định dạng mặc định","<div> và <p> là phần tử khối; <span> và <a> là phần tử nội tuyến","<div> và <span> đều là các phần tử khối theo định dạng mặc định"],"key":2,"optWhy":[],"why":"Phần tử khối chiếm trọn một dòng (xuống dòng trước và sau); phần tử nội tuyến chỉ chiếm vừa nội dung và nằm trên cùng dòng.","src":"sgk","mono":false,"v2":true,"cl":302},{"id":"web-css-khung-31","topic":"web","level":3,"tags":["css-khung"],"type":"mcq","stem":"Thứ tự các lớp của mô hình hộp CSS, tính từ trong ra ngoài, là:","options":["Nội dung → đệm (padding) → viền (border) → lề (margin), từ trong ra ngoài","Nội dung → lề → viền → đệm, theo thứ tự từ trong ra ngoài của hộp","Nội dung → viền → đệm → lề, theo thứ tự từ trong ra ngoài của hộp","Lề → viền → đệm → nội dung, theo thứ tự từ trong ra ngoài của hộp"],"key":0,"optWhy":[],"why":"padding là khoảng cách từ nội dung tới viền; margin là khoảng cách ngoài viền tới phần tử khác.","src":"sgk","mono":false,"v2":true,"cl":303},{"id":"web-css-khung-32","topic":"web","level":3,"tags":["css-khung"],"type":"mcq","stem":"Quy tắc nào của CSS đặt viền liền dày 2 pixel màu xanh dương cho mọi thẻ <td>?","options":["td { border-width: solid; color: 2px blue }","td: border 2px solid blue;","td { border: 2px solid blue; }","td { border = 2px blue }"],"key":2,"optWhy":[],"why":"border là thuộc tính viết tắt: độ dày, kiểu viền, màu viền.","src":"sgk","mono":false,"v2":true,"cl":304},{"id":"web-css-pseudo-33","topic":"web","level":3,"tags":["css-pseudo"],"type":"mcq","stem":"Bộ chọn nào đặt màu đỏ cho liên kết khi người dùng đưa con trỏ chuột lên và bộ chọn nào áp dụng cho liên kết đã được nháy (đã thăm)?","options":["a:active { color: red; } và a:link { ... }","a::hover { color: red; } và a::visited { ... }","a:hover { color: red; } và a:visited { ... }","a:link { color: red; } và a:hover { ... }"],"key":2,"optWhy":[],"why":"Lớp giả (pseudo-class) viết sau một dấu hai chấm “:”; phần tử giả (pseudo-element) viết sau hai dấu hai chấm “::”.","src":"sgk","mono":false,"v2":true,"cl":305},{"id":"web-css-pseudo-34","topic":"web","level":3,"tags":["css-pseudo"],"type":"mcq","stem":"Khai báo p::first-line { color: red; } có tác dụng gì?","options":["Dòng đầu của mỗi đoạn p có chữ đỏ, phụ thuộc vào độ rộng cửa sổ","Toàn bộ chữ của đoạn p đầu tiên xuất hiện trong trang sẽ có màu đỏ","Chữ cái đầu tiên của mỗi đoạn p sẽ có màu đỏ, các chữ còn lại không","Mọi liên kết nằm bên trong các đoạn p sẽ được hiển thị với màu đỏ"],"key":0,"optWhy":[],"why":"::first-line là phần tử giả (dòng đầu tiên); ::first-letter là kí tự đầu tiên.","src":"sgk","mono":false,"v2":true,"cl":306},{"id":"web-css-uutien-35","topic":"web","level":3,"tags":["css-uutien"],"type":"mcq","stem":"Theo cách tính trọng số của SGK (id = 100, class/lớp giả/thuộc tính = 10, phần tử/phần tử giả = 1; cộng các thành phần), phần tử nào khớp cả ba quy tắc sẽ có chữ màu gì? (không có !important, không có style trực tiếp)","options":["blue","Không xác định vì các quy tắc khác bộ chọn","green","red"],"key":3,"optWhy":[],"why":"Trọng số: p em = 2; .note = 10; #intro em = 101. Bộ chọn có trọng số lớn nhất được áp dụng.","src":"verified-css","mono":true,"code":"p em { color: blue; }\n.note { color: green; }\n#intro em { color: red; }","v2":true,"cl":307},{"id":"web-css-uutien-36","topic":"web","level":3,"tags":["css-uutien"],"type":"mcq","stem":"Theo cách tính trọng số của SGK (id = 100, class/lớp giả/thuộc tính = 10, phần tử/phần tử giả = 1; cộng các thành phần), phần tử nào khớp cả ba quy tắc sẽ có chữ màu gì? (không có !important, không có style trực tiếp)","options":["blue","Không xác định vì các quy tắc khác bộ chọn","green","red"],"key":3,"optWhy":[],"why":"Trọng số: div p = 2; p.note = 11; div p.note = 12. Bộ chọn có trọng số lớn nhất được áp dụng.","src":"verified-css","mono":true,"code":"div p { color: blue; }\np.note { color: green; }\ndiv p.note { color: red; }","v2":true,"cl":307},{"id":"web-css-uutien-37","topic":"web","level":3,"tags":["css-uutien"],"type":"mcq","stem":"Theo cách tính trọng số của SGK (id = 100, class/lớp giả/thuộc tính = 10, phần tử/phần tử giả = 1; cộng các thành phần), phần tử nào khớp cả ba quy tắc sẽ có chữ màu gì? (không có !important, không có style trực tiếp)","options":["blue","Không xác định vì các quy tắc khác bộ chọn","green","red"],"key":3,"optWhy":[],"why":"Trọng số: a:hover = 11; .menu a = 11; nav a:hover = 12. Bộ chọn có trọng số lớn nhất được áp dụng.","src":"verified-css","mono":true,"code":"a:hover { color: blue; }\n.menu a { color: green; }\nnav a:hover { color: red; }","v2":true,"cl":307},{"id":"web-css-uutien-38","topic":"web","level":3,"tags":["css-uutien"],"type":"mcq","stem":"Theo cách tính trọng số của SGK (id = 100, class/lớp giả/thuộc tính = 10, phần tử/phần tử giả = 1; cộng các thành phần), phần tử nào khớp cả ba quy tắc sẽ có chữ màu gì? (không có !important, không có style trực tiếp)","options":["green","red","Không xác định vì các quy tắc khác bộ chọn","blue"],"key":3,"optWhy":[],"why":"Trọng số: #main .note = 110; .note.note = 20; p#main = 101. Bộ chọn có trọng số lớn nhất được áp dụng.","src":"verified-css","mono":true,"code":"#main .note { color: blue; }\n.note.note { color: green; }\np#main { color: red; }","v2":true,"cl":307},{"id":"web-css-uutien-39","topic":"web","level":3,"tags":["css-uutien"],"type":"mcq","stem":"Theo cách tính trọng số của SGK (id = 100, class/lớp giả/thuộc tính = 10, phần tử/phần tử giả = 1; cộng các thành phần), phần tử nào khớp cả ba quy tắc sẽ có chữ màu gì? (không có !important, không có style trực tiếp)","options":["blue","Không xác định vì các quy tắc khác bộ chọn","green","red"],"key":3,"optWhy":[],"why":"Trọng số: li = 1; ul li = 2; .list li.on = 21. Bộ chọn có trọng số lớn nhất được áp dụng.","src":"verified-css","mono":true,"code":"li { color: blue; }\nul li { color: green; }\n.list li.on { color: red; }","v2":true,"cl":307},{"id":"web-website-40","topic":"web","level":2,"tags":["website"],"type":"mcq","stem":"Phần chân trang (footer) của website thường chứa nội dung nào?","options":["Toàn bộ nội dung chi tiết các bài viết","Thanh điều hướng chính và logo","Biểu mẫu đăng nhập duy nhất của trang","Thông tin bản quyền, liên hệ, liên kết phụ"],"key":3,"optWhy":[],"why":"Phần đầu: logo, tên trang, (thường có) thanh điều hướng; phần thân: nội dung chính; phần chân: bản quyền, liên hệ.","src":"sgk","mono":false,"v2":true,"cl":308},{"id":"web-website-41","topic":"web","level":3,"tags":["website"],"type":"mcq","stem":"Một nhóm làm website gồm nhiều trang, muốn phần đầu trang (logo, thanh điều hướng) giống nhau ở mọi trang và dễ sửa đổi đồng bộ. Cách làm hợp lí nhất là:","options":["Dùng chung một tệp CSS và xây dựng cùng cấu trúc phần đầu ở mỗi trang","Dùng màu khác nhau cho mỗi trang để người xem dễ phân biệt các trang","Chỉ làm đầy đủ ở trang chủ, các trang khác sẽ tự động giống như vậy","Đặt phần đầu trang (logo, điều hướng) ở cuối mỗi trang của website"],"key":0,"optWhy":[],"why":"Nhất quán về giao diện giúp người dùng quen thuộc và dễ điều hướng.","src":"sgk","mono":false,"v2":true,"cl":309},{"id":"web-website-42","topic":"web","level":3,"tags":["website"],"type":"mcq","stem":"Điều nào KHÔNG phải là lợi ích khi dùng phần mềm tạo trang web như Google Sites?","options":["Người chưa biết lập trình vẫn có thể tạo được trang web hoàn chỉnh","Giảm đáng kể thời gian và công sức mà người dùng bỏ ra để tạo trang","Bắt buộc người dùng phải biết viết HTML và CSS mới tạo được trang web","Có sẵn mẫu giao diện, thanh điều hướng, biểu mẫu để người dùng chèn vào"],"key":2,"optWhy":[],"why":"Phần mềm tạo trang web giúp thiết kế trực quan mà không nhất thiết phải biết HTML và CSS.","src":"sgk","mono":false,"v2":true,"cl":310},{"id":"web-website-43","topic":"web","level":3,"tags":["website"],"type":"mcq","stem":"Trước khi công bố (xuất bản) website, việc nào là cần thiết?","options":["Kiểm tra liên kết, hiển thị trên nhiều thiết bị, lỗi chính tả, thử biểu mẫu","Xoá tất cả liên kết hỏng rồi làm lại từ đầu mà không cần sửa từng chỗ","Chỉ cần xem thử trên một trình duyệt duy nhất của người thiết kế là đủ","Chỉ cần kiểm tra riêng trang chủ vì các trang khác sẽ tự động đúng"],"key":0,"optWhy":[],"why":"Kiểm thử website giúp tránh liên kết hỏng, lỗi hiển thị và lỗi chức năng.","src":"sgk","mono":false,"v2":true,"cl":311},{"id":"web-css-uutien-tf44","topic":"web","level":3,"tags":["css-uutien"],"type":"tf","stem":"Cho đoạn mã HTML/CSS của một trang giới thiệu CLB:","items":[{"t":"Trọng số của quy tắc nav a:hover là 12 (2 phần tử + 1 lớp giả = 2 + 10).","v":true,"why":"nav, a là 2 phần tử (2); :hover là lớp giả (10): tổng 12."},{"t":"Nếu thêm quy tắc .menu a {color: gold;} viết trước nav a:hover thì khi rê chuột lên liên kết, màu chữ là vàng
