const BANK={"q":[{"id":"sql-B2-01","topic":"csdl","level":1,"tags":["S3","S7"],"db":"thuexe","why":"Hàm tổng hợp gom nhiều dòng thành MỘT dòng kết quả. COUNT(*) đếm mọi dòng, COUNT(DISTINCT MaKT) chỉ đếm các giá trị khác nhau.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT COUNT(*), COUNT(DISTINCT MaKT), SUM(SoGio), AVG(SoGio), MIN(NgayThue), MAX(SoGio)\nFROM LuotThue;","answer":{"cols":["COUNT(*)","COUNT(DISTINCT MaKT)","SUM(SoGio)","AVG(SoGio)","MIN(NgayThue)","MAX(SoGio)"],"rows":[["12","5","42","3.5000","2025-12-20","8"]],"more":0},"ordered":false,"optWhy":[],"cl":1},{"id":"sql-B2-02","topic":"csdl","level":1,"tags":["S7"],"db":"mymusic_hsg","why":"Bảng banthuam có 10 dòng nhưng chỉ có 5 ca sĩ và 8 bản nhạc khác nhau: một ca sĩ hát nhiều bản, một bản nhạc có nhiều ca sĩ thể hiện.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT COUNT(*), COUNT(DISTINCT idCasi), COUNT(DISTINCT idBannhac)\nFROM banthuam;","answer":{"cols":["COUNT(*)","COUNT(DISTINCT idCasi)","COUNT(DISTINCT idBannhac)"],"rows":[["10","5","8"]],"more":0},"ordered":false,"optWhy":[],"cl":1},{"id":"sql-B2-03","topic":"csdl","level":2,"tags":["S3"],"db":"thuexe","why":"Điều kiện về LOẠI phương tiện nằm ở bảng PhuongTien nên phải JOIN trước, lọc bằng WHERE, rồi mới cộng SUM.","src":"verified-sql","type":"open","stem":"Viết truy vấn cho biết tổng số giờ của tất cả các lượt thuê phương tiện loại 'Xe điện'.","answer":{"cols":["SUM(l.SoGio)"],"rows":[["28"]],"more":0},"ref":"SELECT SUM(l.SoGio)\nFROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nWHERE p.LoaiPT = 'Xe điện';","alts":["SELECT SUM(LuotThue.SoGio) FROM LuotThue INNER JOIN PhuongTien ON LuotThue.MaPT = PhuongTien.MaPT WHERE PhuongTien.LoaiPT = 'Xe điện';"],"ordered":false,"optWhy":[],"cl":2},{"id":"sql-B2-04","topic":"csdl","level":2,"tags":["S3"],"db":"quanly_diem","why":"Cách 1 dùng thẳng mã môn; cách 2 JOIN với MonHoc để lọc theo tên môn. Cả hai cho cùng kết quả.","src":"verified-sql","type":"open","stem":"Viết truy vấn cho biết điểm môn Tin cao nhất của năm học '2024-2025'.","answer":{"cols":["MAX(Diem)"],"rows":[["9.50"]],"more":0},"ref":"SELECT MAX(Diem)\nFROM KetQua\nWHERE MaMon = 'TIN' AND NamHoc = '2024-2025';","alts":["SELECT MAX(k.Diem) FROM KetQua k INNER JOIN MonHoc m ON k.MaMon = m.MaMon WHERE m.TenMon = 'Tin' AND k.NamHoc = '2024-2025';"],"ordered":false,"optWhy":[],"cl":3},{"id":"sql-B2-05","topic":"csdl","level":2,"tags":["S3","S7"],"db":"thuexe","why":"Muốn cộng giá trị dùng SUM; muốn đếm số dòng mới dùng COUNT. Hàm tổng hợp đặt trong SELECT (hoặc HAVING), không đặt trong WHERE.","src":"verified-sql","type":"mcq","stem":"Cho biết TỔNG số giờ thuê của khách có mã 'K001'. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT COUNT(SoGio) FROM LuotThue WHERE MaKT = 'K001';","SELECT SUM(SoGio) FROM LuotThue WHERE MaKT = 'K001' AND SUM(SoGio) > 0;","SELECT SoGio FROM LuotThue WHERE MaKT = 'K001';","SELECT SUM(SoGio) FROM LuotThue WHERE MaKT = 'K001';"],"key":3,"optWhy":["Sai (lỗi S7). COUNT đếm số lượt thuê chứ không cộng số giờ. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu","Sai (lỗi S3). Hàm tổng hợp không được dùng trong WHERE. Chạy thật → báo lỗi - dùng hàm tổng hợp sai chỗ (hàm tổng hợp không được đặt trong WHERE)","Sai (lỗi S3). Không có hàm tổng hợp nên trả về từng lượt thuê, không cộng lại. Chạy thật → chạy được nhưng cho 4 dòng, khác kết quả yêu cầu","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu"],"cl":18},{"id":"sql-B2-06","topic":"csdl","level":2,"tags":["S7"],"db":"thuexe","why":"DISTINCT phải nằm TRONG hàm COUNT để loại trùng trước khi đếm. Đây là chỗ đề thi hay gài bẫy (ví dụ ý d của câu đúng/sai về cơ sở dữ liệu).","src":"verified-sql","type":"mcq","stem":"Có bao nhiêu khách KHÁC NHAU đã từng thuê phương tiện (một khách thuê nhiều lần chỉ tính một lần)?","codeOpts":true,"options":["SELECT COUNT(DISTINCT MaKT) FROM LuotThue;","SELECT COUNT(MaKT) FROM LuotThue;","SELECT COUNT(*) FROM LuotThue;","SELECT DISTINCT COUNT(MaKT) FROM LuotThue;"],"key":0,"optWhy":["Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S7). COUNT(MaKT) đếm cả các lần lặp, nên ra số lượt thuê. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu","Sai (lỗi S7). COUNT(*) đếm số dòng của bảng, tức số lượt thuê. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu","Sai (lỗi S7). DISTINCT đứng ngoài chỉ loại dòng trùng của KẾT QUẢ (chỉ có một dòng), không loại giá trị lặp trước khi đếm. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu"],"cl":19},{"id":"sql-B2-07","topic":"csdl","level":2,"tags":["S3","S7"],"db":"thuexe","why":"Phân biệt rõ COUNT(*), COUNT(cột), COUNT(DISTINCT cột), SUM, AVG, MIN, MAX.","src":"verified-sql","type":"tf","stem":"Cho bảng LuotThue của CSDL thuexe. Xét các phát biểu sau về hàm tổng hợp:","items":[{"t":"COUNT(*) và COUNT(MaKT) cho cùng một kết quả trên bảng LuotThue vì cột MaKT không có giá trị NULL.","v":true,"why":"Cả hai cùng bằng 12. COUNT(cột) bỏ qua giá trị NULL, còn COUNT(*) đếm mọi dòng."},{"t":"COUNT(DISTINCT MaKT) luôn luôn bằng COUNT(MaKT).","v":false,"why":"Chỉ bằng nhau khi không có khách nào thuê hai lần. Ở đây 5 khác 12."},{"t":"AVG(SoGio) cho cùng giá trị với SUM(SoGio) / COUNT(SoGio).","v":true,"why":"Trung bình cộng chính là tổng chia số phần tử."},{"t":"MAX(NgayThue) cho biết ngày thuê sớm nhất.","v":false,"why":"MAX là ngày muộn nhất; ngày sớm nhất là MIN."}],"optWhy":[],"cl":97},{"id":"sql-B2-08","topic":"csdl","level":2,"tags":["S3"],"db":"mymusic_hsg","why":"Cách 1 dùng JOIN (Bài 23 SGK). Cách 2 dùng truy vấn con (sẽ học ở buổi 6).","src":"verified-sql","type":"open","stem":"Đếm số bản nhạc của nhạc sĩ Văn Cao (viết theo tên nhạc sĩ, không viết thẳng mã).","answer":{"cols":["COUNT(*)"],"rows":[["2"]],"more":0},"ref":"SELECT COUNT(*)\nFROM bannhac b INNER JOIN nhacsi n ON b.idNhacsi = n.idNhacsi\nWHERE n.tenNhacsi = 'Văn Cao';","alts":["SELECT COUNT(*) FROM bannhac WHERE idNhacsi = (SELECT idNhacsi FROM nhacsi WHERE tenNhacsi = 'Văn Cao');"],"ordered":false,"optWhy":[],"cl":4},{"id":"sql-B3-01","topic":"csdl","level":1,"tags":["S10"],"db":"mymusic_hsg","why":"GROUP BY chia các dòng thành nhóm theo idNhacsi, mỗi nhóm cho ra đúng một dòng kết quả.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT idNhacsi, COUNT(*)\nFROM bannhac\nGROUP BY idNhacsi;","answer":{"cols":["idNhacsi","COUNT(*)"],"rows":[["1","2"],["2","2"],["3","2"],["4","2"]],"more":0},"ordered":false,"optWhy":[],"cl":1},{"id":"sql-B3-02","topic":"csdl","level":1,"tags":["S10"],"db":"thuexe","why":"Mỗi khách là một nhóm. Cột MaKT đứng trong SELECT vì nó cũng là cột nhóm; SoGio nằm trong hàm SUM.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT MaKT, SUM(SoGio)\nFROM LuotThue\nGROUP BY MaKT\nORDER BY MaKT;","answer":{"cols":["MaKT","SUM(SoGio)"],"rows":[["K001","11"],["K002","12"],["K003","7"],["K004","4"],["K005","8"]],"more":0},"ordered":true,"optWhy":[],"cl":5},{"id":"sql-B3-03","topic":"csdl","level":2,"tags":["S10"],"db":"quanly_diem","why":"Cột Lop vừa có trong SELECT vừa có trong GROUP BY.","src":"verified-sql","type":"open","stem":"Với mỗi lớp, cho biết tên lớp và số học sinh của lớp đó.","answer":{"cols":["Lop","COUNT(*)"],"rows":[["12A1","4"],["12A2","3"],["12A3","3"]],"more":0},"ref":"SELECT Lop, COUNT(*)\nFROM HocSinh\nGROUP BY Lop;","alts":["SELECT Lop, COUNT(MaHS) AS SoHS FROM HocSinh GROUP BY Lop;"],"ordered":false,"optWhy":[],"cl":6},{"id":"sql-B3-04","topic":"csdl","level":2,"tags":["S10"],"db":"thuvien","why":"Mỗi thể loại là một nhóm.","src":"verified-sql","type":"open","stem":"Với mỗi thể loại sách, cho biết thể loại và số đầu sách thuộc thể loại đó.","answer":{"cols":["TheLoai","COUNT(*)"],"rows":[["Lịch sử","1"],["Tin học","3"],["Văn học","1"]],"more":0},"ref":"SELECT TheLoai, COUNT(*)\nFROM Sach\nGROUP BY TheLoai;","alts":["SELECT TheLoai, COUNT(MaSach) AS SoDauSach FROM Sach GROUP BY TheLoai;"],"ordered":false,"optWhy":[],"cl":7},{"id":"sql-B3-05","topic":"csdl","level":2,"tags":["S10","S3"],"db":"thuexe","why":"Quy tắc: cột nào đứng trong SELECT mà không nằm trong hàm tổng hợp thì phải đứng trong GROUP BY, và ngược lại GROUP BY không nên thừa cột.","src":"verified-sql","type":"mcq","stem":"Với mỗi khách, cho biết mã khách và tổng số giờ thuê. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT MaKT, SUM(SoGio) FROM LuotThue GROUP BY SoGio;","SELECT MaKT, SUM(SoGio) FROM LuotThue GROUP BY MaKT;","SELECT MaKT, SUM(SoGio) FROM LuotThue;","SELECT MaKT, SUM(SoGio) FROM LuotThue GROUP BY MaKT, MaPT;"],"key":1,"optWhy":["Sai (lỗi S10). Nhóm theo SoGio chứ không theo khách. Chạy thật → chạy được nhưng cho 7 dòng, khác kết quả yêu cầu; khi bật ONLY_FULL_GROUP_BY thì báo lỗi","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S10). Thiếu GROUP BY: cả bảng bị gom thành một dòng, MaKT lấy từ một dòng bất kì. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu; khi bật ONLY_FULL_GROUP_BY thì báo lỗi","Sai (lỗi S10). Nhóm thêm theo MaPT nên một khách có thể xuất hiện nhiều dòng. Chạy thật → chạy được nhưng cho 10 dòng, khác kết quả yêu cầu"],"cl":20},{"id":"sql-B3-06","topic":"csdl","level":2,"tags":["S10"],"db":"quanly_diem","why":"Ở MariaDB mặc định (như trong SGK), truy vấn sai vẫn chạy và trả về giá trị bất kì cho cột thừa; ở chế độ ONLY_FULL_GROUP_BY sẽ báo lỗi. Hãy luôn viết đúng quy tắc.","src":"verified-sql","type":"mcq","stem":"Với mỗi lớp, cho biết tên lớp và số học sinh. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT Lop, COUNT(*) FROM HocSinh GROUP BY Lop;","SELECT Lop, TenHS, COUNT(*) FROM HocSinh GROUP BY Lop;","SELECT Lop, COUNT(*) FROM HocSinh GROUP BY TenHS;","SELECT Lop, COUNT(*) FROM HocSinh;"],"key":0,"optWhy":["Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S10). TenHS không thuộc GROUP BY và không nằm trong hàm tổng hợp: mỗi lớp có nhiều tên. Chạy thật → chạy được nhưng cho 3 dòng, khác kết quả yêu cầu; khi bật ONLY_FULL_GROUP_BY thì báo lỗi","Sai (lỗi S10). Nhóm theo tên học sinh nên mỗi học sinh một nhóm. Chạy thật → chạy được nhưng cho 10 dòng, khác kết quả yêu cầu; khi bật ONLY_FULL_GROUP_BY thì báo lỗi","Sai (lỗi S10). Thiếu GROUP BY. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu; khi bật ONLY_FULL_GROUP_BY thì báo lỗi"],"cl":21},{"id":"sql-B3-07","topic":"csdl","level":2,"tags":["S10"],"db":"quanly_diem","why":"Số dòng của kết quả GROUP BY bằng số tổ hợp giá trị khác nhau của các cột nhóm.","src":"verified-sql","type":"tf","stem":"Xét các phát biểu về GROUP BY trên các CSDL quanly_diem và thuexe:","items":[{"t":"Truy vấn SELECT Lop, TenHS, COUNT(*) FROM HocSinh GROUP BY Lop; báo lỗi khi bật chế độ ONLY_FULL_GROUP_BY.","v":true,"why":"Cột TenHS không thuộc GROUP BY và không nằm trong hàm tổng hợp."},{"t":"Khi nhóm theo MaKT, có thể viết SUM(SoGio) trong SELECT mà không cần đưa SoGio vào GROUP BY.","v":true,"why":"Cột nằm trong hàm tổng hợp thì không cần có trong GROUP BY."},{"t":"GROUP BY Lop trên bảng HocSinh cho 3 dòng kết quả vì có 3 lớp khác nhau.","v":true,"why":"Số dòng kết quả bằng số nhóm."},{"t":"GROUP BY MaKT, MaPT cho cùng số dòng kết quả với GROUP BY MaKT.","v":false,"why":"Nhóm theo cặp (MaKT, MaPT) cho nhiều nhóm hơn."}],"optWhy":[],"cl":98},{"id":"sql-B3-08","topic":"csdl","level":2,"tags":["S10"],"db":"quanly_diem","why":"Nhóm theo cặp (NamHoc, MaMon): mỗi cặp khác nhau là một nhóm.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT NamHoc, MaMon, COUNT(*)\nFROM KetQua\nGROUP BY NamHoc, MaMon\nORDER BY NamHoc, MaMon;","answer":{"cols":["NamHoc","MaMon","COUNT(*)"],"rows":[["2023-2024","TIN","3"],["2023-2024","TOA","1"],["2024-2025","TIN","8"],["2024-2025","TOA","2"]],"more":0},"ordered":true,"optWhy":[],"cl":1},{"id":"sql-B4-01","topic":"csdl","level":1,"tags":["S4"],"db":"thuexe","why":"HAVING lọc các NHÓM sau khi đã tính SUM. Khách có tổng dưới 8 giờ bị loại.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT MaKT, SUM(SoGio) AS Tong\nFROM LuotThue\nGROUP BY MaKT\nHAVING SUM(SoGio) >= 8\nORDER BY MaKT;","answer":{"cols":["MaKT","Tong"],"rows":[["K001","11"],["K002","12"],["K005","8"]],"more":0},"ordered":true,"optWhy":[],"cl":5},{"id":"sql-B4-02","topic":"csdl","level":2,"tags":["S4","S7"],"db":"thuexe","why":"Điều kiện trên số lượt (một giá trị tổng hợp của nhóm) phải đặt ở HAVING.","src":"verified-sql","type":"open","stem":"Cho biết mã các khách có từ 3 lượt thuê trở lên.","answer":{"cols":["MaKT"],"rows":[["K001"],["K002"]],"more":0},"ref":"SELECT MaKT\nFROM LuotThue\nGROUP BY MaKT\nHAVING COUNT(*) >= 3;","alts":["SELECT MaKT FROM LuotThue GROUP BY MaKT HAVING COUNT(MaLuot) >= 3;"],"ordered":false,"optWhy":[],"cl":8},{"id":"sql-B4-03","topic":"csdl","level":2,"tags":["S4"],"db":"quanly_diem","why":"Điều kiện năm sinh áp dụng cho từng HỌC SINH nên ở WHERE (trước khi nhóm); điều kiện 'từ 2 học sinh' áp dụng cho từng LỚP nên ở HAVING.","src":"verified-sql","type":"open","stem":"Cho biết các lớp có từ 2 học sinh trở lên sinh năm 2008.","answer":{"cols":["Lop"],"rows":[["12A1"],["12A2"]],"more":0},"ref":"SELECT Lop\nFROM HocSinh\nWHERE YEAR(NgaySinh) = 2008\nGROUP BY Lop\nHAVING COUNT(*) >= 2;","alts":["SELECT Lop FROM HocSinh WHERE NgaySinh >= '2008-01-01' AND NgaySinh < '2009-01-01' GROUP BY Lop HAVING COUNT(*) >= 2;"],"ordered":false,"optWhy":[],"cl":9},{"id":"sql-B4-04","topic":"csdl","level":2,"tags":["S4","S1"],"db":"thuvien","why":"Tổng theo độc giả chỉ có sau khi nhóm, nên điều kiện phải ở HAVING, và HAVING viết sau GROUP BY.","src":"verified-sql","type":"mcq","stem":"Cho biết mã các độc giả có TỔNG số ngày mượn sách từ 10 ngày trở lên. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT MaDG FROM MuonSach WHERE SUM(SoNgay) >= 10 GROUP BY MaDG;","SELECT MaDG FROM MuonSach GROUP BY MaDG HAVING SUM(SoNgay) >= 10;","SELECT MaDG FROM MuonSach WHERE SoNgay >= 10 GROUP BY MaDG;","SELECT MaDG FROM MuonSach HAVING SUM(SoNgay) >= 10 GROUP BY MaDG;"],"key":1,"optWhy":["Sai (lỗi S4). Hàm tổng hợp không đặt trong WHERE. Chạy thật → báo lỗi - dùng hàm tổng hợp sai chỗ (hàm tổng hợp không được đặt trong WHERE)","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S4). Lọc từng LƯỢT mượn từ 10 ngày, không phải tổng của độc giả. Chạy thật → chạy được nhưng cho 3 dòng, khác kết quả yêu cầu","Sai (lỗi S1). HAVING phải đứng sau GROUP BY. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)"],"cl":22},{"id":"sql-B4-05","topic":"csdl","level":2,"tags":["S5"],"db":"thuexe","why":"'Hoặc' trong lời đề phải đóng ngoặc lại thành một khối rồi mới AND với các điều kiện khác.","src":"verified-sql","type":"mcq","stem":"Liệt kê mã lượt thuê có số giờ từ 4 trở lên, thực hiện tại trạm 'DN01' HOẶC 'DN02', trong năm 2026.","codeOpts":true,"options":["SELECT MaLuot FROM LuotThue WHERE SoGio >= 4 AND Tram = 'DN01' OR Tram = 'DN02' AND YEAR(NgayThue) = 2026;","SELECT MaLuot FROM LuotThue WHERE SoGio >= 4 AND (Tram = 'DN01' AND Tram = 'DN02') AND YEAR(NgayThue) = 2026;","SELECT MaLuot FROM LuotThue WHERE SoGio >= 4 OR (Tram = 'DN01' OR Tram = 'DN02') AND YEAR(NgayThue) = 2026;","SELECT MaLuot FROM LuotThue WHERE SoGio >= 4 AND (Tram = 'DN01' OR Tram = 'DN02') AND YEAR(NgayThue) = 2026;"],"key":3,"optWhy":["Sai (lỗi S5). Thiếu dấu ngoặc: AND được tính trước OR nên điều kiện bị tách sai. Chạy thật → chạy được nhưng cho 4 dòng, khác kết quả yêu cầu","Sai (lỗi S5). Một lượt thuê không thể đồng thời ở hai trạm, nên kết quả rỗng. Chạy thật → chạy được nhưng cho 0 dòng, khác kết quả yêu cầu","Sai (lỗi S5). Dùng OR sai chỗ nên điều kiện SoGio >= 4 đứng một mình. Chạy thật → chạy được nhưng cho 12 dòng, khác kết quả yêu cầu","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu"],"cl":23},{"id":"sql-B4-06","topic":"csdl","level":2,"tags":["S4","S5"],"db":"quanly_diem","why":"Điều kiện lọc từng điểm (môn, năm học) ở WHERE ghép bằng AND; điều kiện trên trung bình của lớp ở HAVING.","src":"verified-sql","type":"mcq","stem":"Cho biết các lớp có điểm trung bình môn Tin trong năm học '2024-2025' từ 8,0 trở lên.","codeOpts":true,"options":["SELECT h.Lop FROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE k.MaMon = 'TIN' OR k.NamHoc = '2024-2025'\nGROUP BY h.Lop HAVING AVG(k.Diem) >= 8;","SELECT h.Lop FROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE k.MaMon = 'TIN' AND k.NamHoc = '2024-2025'\nGROUP BY h.Lop HAVING AVG(k.Diem) >= 8;","SELECT h.Lop FROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE k.MaMon = 'TIN' AND k.NamHoc = '2024-2025' AND AVG(k.Diem) >= 8\nGROUP BY h.Lop;","SELECT h.Lop FROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE k.NamHoc = '2024-2025'\nGROUP BY h.Lop HAVING AVG(k.Diem) >= 8;"],"key":1,"optWhy":["Sai (lỗi S5). OR thay cho AND làm lọt cả điểm môn khác và điểm năm khác vào phép tính trung bình. Chạy thật → chạy được nhưng cho 0 dòng, khác kết quả yêu cầu","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S4). Hàm AVG đặt trong WHERE. Chạy thật → báo lỗi - dùng hàm tổng hợp sai chỗ (hàm tổng hợp không được đặt trong WHERE)","Sai (lỗi S5). Thiếu điều kiện môn Tin nên điểm Toán bị tính vào trung bình. Chạy thật → chạy được nhưng cho 0 dòng, khác kết quả yêu cầu"],"cl":24},{"id":"sql-B4-07","topic":"csdl","level":2,"tags":["S4","S5"],"db":"thuexe","why":"Phân biệt rõ thời điểm áp dụng của WHERE (trước khi nhóm) và HAVING (sau khi nhóm), và độ ưu tiên AND trước OR.","src":"verified-sql","type":"tf","stem":"Xét các phát biểu về WHERE, HAVING và thứ tự tính điều kiện trên CSDL thuexe:","items":[{"t":"Trong HAVING có thể dùng hàm tổng hợp, ví dụ HAVING SUM(SoGio) >= 8.","v":true,"why":"HAVING sinh ra để lọc nhóm theo giá trị tổng hợp."},{"t":"Hai truy vấn: (1) SELECT MaKT, SUM(SoGio) FROM LuotThue WHERE SoGio >= 4 GROUP BY MaKT; (2) SELECT MaKT, SUM(SoGio) FROM LuotThue GROUP BY MaKT HAVING SUM(SoGio) >= 4; cho kết quả giống nhau.","v":false,"why":"(1) lọc từng lượt rồi mới cộng; (2) cộng hết rồi mới lọc. Tổng của khách khác nhau."},{"t":"Có thể dùng đồng thời WHERE và HAVING trong một truy vấn: WHERE lọc dòng trước khi nhóm, HAVING lọc nhóm sau khi nhóm.","v":true,"why":"Đúng; câu đề thi thường dùng cả hai."},{"t":"Truy vấn SELECT MaLuot FROM LuotThue WHERE Tram = 'DN02' OR Tram = 'DN01' AND SoGio >= 7; không trả về dòng nào, vì mọi dòng đều phải có SoGio >= 7.","v":false,"why":"AND được tính trước: điều kiện là Tram='DN02' HOẶC (Tram='DN01' VÀ SoGio>=7), nên lượt thuê ở DN02 vẫn được lấy."}],"optWhy":[],"cl":99},{"id":"sql-B4-08","topic":"csdl","level":2,"tags":["S4"],"db":"quanly_diem","why":"Bước 1 WHERE giữ học sinh sinh trước 2008; bước 2 nhóm theo lớp; bước 3 HAVING giữ lớp còn từ 2 học sinh; bước 4 sắp xếp.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT Lop, COUNT(*)\nFROM HocSinh\nWHERE NgaySinh < '2008-01-01'\nGROUP BY Lop\nHAVING COUNT(*) >= 2\nORDER BY Lop;","answer":{"cols":["Lop","COUNT(*)"],"rows":[["12A1","2"],["12A3","2"]],"more":0},"ordered":true,"optWhy":[],"cl":1},{"id":"sql-B5-01","topic":"csdl","level":2,"tags":["S1"],"db":"thuexe","why":"Thứ tự viết cố định: SELECT, FROM (JOIN), WHERE, GROUP BY, HAVING, ORDER BY.","src":"verified-sql","type":"mcq","stem":"Truy vấn nào cho danh sách mã khách và tổng giờ thuê, chỉ lấy khách có tổng từ 5 giờ trở lên, xếp theo tổng giờ giảm dần?","codeOpts":true,"options":["SELECT MaKT, SUM(SoGio) FROM LuotThue\nGROUP BY MaKT\nORDER BY SUM(SoGio) DESC\nHAVING SUM(SoGio) >= 5;","SELECT MaKT, SUM(SoGio) FROM LuotThue\nGROUP BY MaKT\nHAVING SUM(SoGio) >= 5\nORDER BY SUM(SoGio) DESC;","SELECT MaKT, SUM(SoGio) FROM LuotThue\nHAVING SUM(SoGio) >= 5\nGROUP BY MaKT\nORDER BY SUM(SoGio) DESC;","SELECT MaKT, SUM(SoGio) FROM LuotThue\nGROUP BY MaKT\nWHERE SUM(SoGio) >= 5\nORDER BY SUM(SoGio) DESC;"],"key":1,"optWhy":["Sai (lỗi S1). ORDER BY phải là mệnh đề cuối cùng. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S1). HAVING phải đứng sau GROUP BY. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)","Sai (lỗi S1). WHERE phải đứng trước GROUP BY, và không chứa hàm tổng hợp. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)"],"cl":25},{"id":"sql-B5-02","topic":"csdl","level":2,"tags":["S2"],"db":"thuexe","why":"Bí danh dùng được trong ORDER BY (và nhiều hệ cho dùng ở GROUP BY), nhưng không dùng được trong WHERE. Không bao giờ viết 'AS' trong ORDER BY.","src":"verified-sql","type":"mcq","stem":"Hiển thị loại phương tiện (cột tên Loai) và số lượt thuê (cột tên SoLuot), xếp giảm dần theo SoLuot. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT p.LoaiPT AS Loai, COUNT(*) AS SoLuot\nFROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nGROUP BY p.LoaiPT\nORDER BY p.SoLuot DESC;","SELECT p.LoaiPT AS Loai, COUNT(*) AS SoLuot\nFROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nWHERE SoLuot > 0\nGROUP BY p.LoaiPT\nORDER BY SoLuot DESC;","SELECT p.LoaiPT AS Loai, COUNT(*) AS SoLuot\nFROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nGROUP BY p.LoaiPT\nORDER BY SoLuot DESC;","SELECT p.LoaiPT AS Loai, COUNT(*) AS SoLuot\nFROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nGROUP BY p.LoaiPT\nORDER BY COUNT(*) AS SoLuot DESC;"],"key":2,"optWhy":["Sai (lỗi S2). Bí danh là tên cột của kết quả, không thuộc bảng p nên không viết p.SoLuot. Chạy thật → báo lỗi - tên cột hoặc bí danh không tồn tại ở vị trí đó","Sai (lỗi S2). Bí danh được đặt ở SELECT nên chưa dùng được trong WHERE. Chạy thật → báo lỗi - tên cột hoặc bí danh không tồn tại ở vị trí đó","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S2). AS chỉ dùng trong SELECT để đặt tên; không viết AS trong ORDER BY. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)"],"cl":26},{"id":"sql-B5-03","topic":"csdl","level":2,"tags":["S2","S1"],"db":"thuexe","why":"Kết quả hiển thị bằng tên bí danh Loai, SoLuot, TongGio. ORDER BY dùng bí danh để sắp xếp.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT p.LoaiPT AS Loai, COUNT(*) AS SoLuot, SUM(l.SoGio) AS TongGio\nFROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nGROUP BY p.LoaiPT\nORDER BY SoLuot DESC, Loai;","answer":{"cols":["Loai","SoLuot","TongGio"],"rows":[["Xe điện","9","28"],["Xe đạp","2","12"],["Xe máy","1","2"]],"more":0},"ordered":true,"optWhy":[],"cl":1},{"id":"sql-B5-04","topic":"csdl","level":2,"tags":["S1"],"db":"mymusic_hsg","why":"Bảng giữa banthuam chứa hai khoá ngoại nên phải JOIN lần lượt với bannhac và casi (cấu trúc đã học ở Bài 23 SGK).","src":"verified-sql","type":"open","stem":"Liệt kê tên bản nhạc và tên ca sĩ thể hiện trong các bản thu âm, sắp xếp theo tên bản nhạc rồi theo tên ca sĩ (JOIN ba bảng banthuam, bannhac, casi).","answer":{"cols":["tenBannhac","tenCasi"],"rows":[["Du kích sông Thao","Doãn Tần"],["Nhạc rừng","Quốc Hương"],["Tiến về Hà Nội","Doãn Tần"],["Tiến về Hà Nội","Quốc Hương"],["Tiếng hát giữa rừng Pắc Bó","Lê Dung"],["Tình ca","Trần Khánh"],["Trường ca Sông Lô","Lê Dung"],["Trường ca Sông Lô","Trần Khánh"],["Việt Nam quê hương tôi","Quốc Hương"],["Xa khơi","Tân Nhân"]],"more":0},"ref":"SELECT b.tenBannhac, c.tenCasi\nFROM banthuam t\n  INNER JOIN bannhac b ON t.idBannhac = b.idBannhac\n  INNER JOIN casi c ON t.idCasi = c.idCasi\nORDER BY b.tenBannhac, c.tenCasi;","alts":["SELECT bannhac.tenBannhac, casi.tenCasi FROM banthuam INNER JOIN bannhac ON banthuam.idBannhac = bannhac.idBannhac INNER JOIN casi ON banthuam.idCasi = casi.idCasi ORDER BY bannhac.tenBannhac, casi.tenCasi;"],"ordered":true,"optWhy":[],"cl":10},{"id":"sql-B5-05","topic":"csdl","level":3,"tags":["S1","S10"],"db":"mymusic_hsg","why":"Nhóm theo nhạc sĩ (đưa cả idNhacsi và tenNhacsi vào GROUP BY) để mỗi nhạc sĩ một dòng, kể cả khi có hai nhạc sĩ trùng tên.","src":"verified-sql","type":"open","stem":"Với mỗi nhạc sĩ, cho biết tên nhạc sĩ và tổng số bản thu âm của các bản nhạc do nhạc sĩ đó sáng tác (cột SoBanThuAm); sắp xếp giảm dần theo số bản thu âm, rồi theo tên nhạc sĩ.","answer":{"cols":["tenNhacsi","SoBanThuAm"],"rows":[["Văn Cao","4"],["Hoàng Việt","2"],["Nguyễn Tài Tuệ","2"],["Đỗ Nhuận","2"]],"more":0},"ref":"SELECT n.tenNhacsi, COUNT(*) AS SoBanThuAm\nFROM nhacsi n\n  INNER JOIN bannhac b ON n.idNhacsi = b.idNhacsi\n  INNER JOIN banthuam t ON b.idBannhac = t.idBannhac\nGROUP BY n.idNhacsi, n.tenNhacsi\nORDER BY SoBanThuAm DESC, n.tenNhacsi;","alts":["SELECT n.tenNhacsi, COUNT(t.idBanthuam) AS SoBanThuAm FROM nhacsi n INNER JOIN bannhac b ON n.idNhacsi = b.idNhacsi INNER JOIN banthuam t ON b.idBannhac = t.idBannhac GROUP BY n.idNhacsi, n.tenNhacsi ORDER BY SoBanThuAm DESC, n.tenNhacsi;"],"ordered":true,"optWhy":[],"cl":11},{"id":"sql-B5-06","topic":"csdl","level":1,"tags":["S4","S1"],"db":"quanly_diem","why":"MIN(NgaySinh) < '2008-01-01' nghĩa là trong lớp có ÍT NHẤT MỘT học sinh sinh trước năm 2008.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT Lop, MIN(NgaySinh)\nFROM HocSinh\nGROUP BY Lop\nHAVING MIN(NgaySinh) < '2008-01-01'\nORDER BY Lop;","answer":{"cols":["Lop","MIN(NgaySinh)"],"rows":[["12A1","2007-03-12"],["12A3","2007-02-28"]],"more":0},"ordered":true,"optWhy":[],"cl":5},{"id":"sql-B5-07","topic":"csdl","level":3,"tags":["S1"],"db":"thuvien","why":"Luồng viết: FROM + JOIN → WHERE → GROUP BY → HAVING → ORDER BY.","src":"verified-sql","type":"mcq","stem":"Cho biết tên sách và số lần được mượn trong năm 2026 (cột SoLan), xếp giảm dần theo SoLan rồi theo tên sách. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT s.TenSach, COUNT(*) AS SoLan\nFROM Sach s INNER JOIN MuonSach m ON s.MaSach = m.MaSach\nWHERE YEAR(m.NgayMuon) = 2026\nORDER BY SoLan DESC, s.TenSach\nGROUP BY s.MaSach, s.TenSach;","SELECT s.TenSach, COUNT(*) AS SoLan\nFROM Sach s\nWHERE YEAR(m.NgayMuon) = 2026\n  INNER JOIN MuonSach m ON s.MaSach = m.MaSach\nGROUP BY s.MaSach, s.TenSach\nORDER BY SoLan DESC, s.TenSach;","SELECT s.TenSach, COUNT(*) AS SoLan\nFROM Sach s INNER JOIN MuonSach m ON s.MaSach = m.MaSach\nGROUP BY s.MaSach, s.TenSach\nWHERE YEAR(m.NgayMuon) = 2026\nORDER BY SoLan DESC, s.TenSach;","SELECT s.TenSach, COUNT(*) AS SoLan\nFROM Sach s INNER JOIN MuonSach m ON s.MaSach = m.MaSach\nWHERE YEAR(m.NgayMuon) = 2026\nGROUP BY s.MaSach, s.TenSach\nORDER BY SoLan DESC, s.TenSach;"],"key":3,"optWhy":["Sai (lỗi S1). ORDER BY đặt trước GROUP BY. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)","Sai (lỗi S1). JOIN phải nằm ngay sau FROM, trước WHERE. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)","Sai (lỗi S1). WHERE đặt sau GROUP BY. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu"],"cl":27},{"id":"sql-B5-08","topic":"csdl","level":2,"tags":["S2","S1"],"db":"thuexe","why":"Thứ tự XỬ LÍ logic: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT (đặt bí danh) → ORDER BY. Vì vậy bí danh dùng được ở ORDER BY nhưng chưa dùng được ở WHERE.","src":"verified-sql","type":"tf","stem":"Xét các phát biểu về bí danh và thứ tự mệnh đề trên CSDL thuexe:","items":[{"t":"Có thể dùng bí danh cột trong ORDER BY, ví dụ: SELECT MaKT, SUM(SoGio) AS Tong FROM LuotThue GROUP BY MaKT ORDER BY Tong DESC;","v":true,"why":"Đúng, ORDER BY được xử lý sau SELECT nên đã biết bí danh."},{"t":"Có thể dùng bí danh cột ngay trong WHERE, ví dụ: SELECT SoGio AS G FROM LuotThue WHERE G >= 4;","v":false,"why":"Sai, WHERE được xử lý trước SELECT nên chưa có bí danh G."},{"t":"Mệnh đề HAVING đứng sau GROUP BY và trước ORDER BY.","v":true,"why":"Đúng; đổi chỗ thì lỗi cú pháp."},{"t":"Có thể viết bí danh ngay trong ORDER BY: ORDER BY SUM(SoGio) AS Tong DESC.","v":false,"why":"Sai, AS chỉ dùng trong SELECT."}],"optWhy":[],"cl":99},{"id":"sql-B5-09","topic":"csdl","level":1,"tags":["S4","S2"],"db":"thuvien","why":"D001 mượn nhiều nhất; D003 và D004 bằng nhau nên xếp theo MaDG.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT MaDG, COUNT(*) AS SoLan\nFROM MuonSach\nGROUP BY MaDG\nHAVING COUNT(*) >= 2\nORDER BY SoLan DESC, MaDG;","answer":{"cols":["MaDG","SoLan"],"rows":[["D001","4"],["D003","3"],["D004","3"],["D002","2"]],"more":0},"ordered":true,"optWhy":[],"cl":1},{"id":"sql-B5-10","topic":"csdl","level":2,"tags":["S2","S3"],"db":"thuvien","why":"Cả hai cách ORDER BY (bí danh hoặc viết lại biểu thức) đều đúng.","src":"verified-sql","type":"open","stem":"Hiển thị mã độc giả và tổng số ngày mượn (đặt tên cột là TongNgay), sắp xếp giảm dần theo TongNgay.","answer":{"cols":["MaDG","TongNgay"],"rows":[["D001","24"],["D003","23"],["D002","17"],["D004","12"],["D005","9"]],"more":0},"ref":"SELECT MaDG, SUM(SoNgay) AS TongNgay\nFROM MuonSach\nGROUP BY MaDG\nORDER BY TongNgay DESC;","alts":["SELECT MaDG, SUM(SoNgay) AS TongNgay FROM MuonSach GROUP BY MaDG ORDER BY SUM(SoNgay) DESC;"],"ordered":true,"optWhy":[],"cl":12},{"id":"sql-B6-01","topic":"csdl","level":1,"tags":["S6"],"db":"quanly_diem","why":"Đây là giá trị mà truy vấn con ở các câu sau sẽ tính ra: điểm trung bình môn Tin năm 2024-2025 của TOÀN trường.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT AVG(Diem)\nFROM KetQua\nWHERE MaMon = 'TIN' AND NamHoc = '2024-2025';","answer":{"cols":["AVG(Diem)"],"rows":[["7.937500"]],"more":0},"ordered":false,"optWhy":[],"cl":5},{"id":"sql-B6-02","topic":"csdl","level":2,"tags":["S6"],"db":"quanly_diem","why":"Đọc từ TRONG ra NGOÀI: truy vấn con trong cùng tìm điểm cao nhất, truy vấn con giữa tìm mã học sinh có điểm đó, truy vấn ngoài cùng lấy tên.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT TenHS\nFROM HocSinh\nWHERE MaHS = (SELECT MaHS\n               FROM KetQua\n               WHERE MaMon = 'TIN' AND NamHoc = '2024-2025'\n                 AND Diem = (SELECT MAX(Diem) FROM KetQua\n                             WHERE MaMon = 'TIN' AND NamHoc = '2024-2025'));","answer":{"cols":["TenHS"],"rows":[["Dung"]],"more":0},"ordered":false,"optWhy":[],"cl":5},{"id":"sql-B6-03","topic":"csdl","level":2,"tags":["S6"],"db":"quanly_diem","why":"Truy vấn con cho một giá trị duy nhất (AVG) nên có thể so sánh bằng toán tử >. Nhớ lặp lại ĐÚNG điều kiện môn và năm trong truy vấn con.","src":"verified-sql","type":"open","stem":"Liệt kê mã học sinh có điểm môn Tin năm học '2024-2025' cao hơn điểm trung bình môn Tin năm học đó của toàn trường.","answer":{"cols":["MaHS"],"rows":[["HS001"],["HS002"],["HS003"],["HS004"],["HS008"]],"more":0},"ref":"SELECT MaHS\nFROM KetQua\nWHERE MaMon = 'TIN' AND NamHoc = '2024-2025'\n  AND Diem > (SELECT AVG(Diem) FROM KetQua\n              WHERE MaMon = 'TIN' AND NamHoc = '2024-2025');","alts":[],"ordered":false,"optWhy":[],"cl":13},{"id":"sql-B6-04","topic":"csdl","level":3,"tags":["S6"],"db":"quanly_diem","why":"Truy vấn con phải LẶP LẠI mọi điều kiện phạm vi (lớp, môn, năm) để giá trị MAX chỉ tính trong phạm vi đề bài.","src":"verified-sql","type":"mcq","stem":"Tìm mã và tên học sinh lớp '12A1' có điểm môn 'TIN' cao nhất trong năm học '2024-2025'. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT h.MaHS, h.TenHS\nFROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE h.Lop = '12A1' AND k.MaMon = 'TIN' AND k.NamHoc = '2024-2025'\n  AND k.Diem = (SELECT MAX(k2.Diem)\n                FROM HocSinh h2 INNER JOIN KetQua k2 ON h2.MaHS = k2.MaHS\n                WHERE h2.Lop = '12A1' AND k2.MaMon = 'TIN' AND k2.NamHoc = '2024-2025');","SELECT MAX(k.Diem), h.MaHS, h.TenHS\nFROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE h.Lop = '12A1' AND k.MaMon = 'TIN' AND k.NamHoc = '2024-2025';","SELECT h.MaHS, h.TenHS\nFROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE h.Lop = '12A1' AND k.MaMon = 'TIN' AND k.NamHoc = '2024-2025'\n  AND k.Diem = MAX(k.Diem);","SELECT h.MaHS, h.TenHS\nFROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE h.Lop = '12A1' AND k.MaMon = 'TIN' AND k.NamHoc = '2024-2025'\n  AND k.Diem = (SELECT MAX(Diem) FROM KetQua\n                WHERE MaMon = 'TIN' AND NamHoc = '2024-2025');"],"key":0,"optWhy":["Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S6). Thêm một cột MAX và không đảm bảo MaHS, TenHS thuộc dòng có điểm cao nhất. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu; khi bật ONLY_FULL_GROUP_BY thì báo lỗi","Sai (lỗi S6). Hàm MAX không viết trực tiếp trong WHERE; phải dùng truy vấn con. Chạy thật → báo lỗi - dùng hàm tổng hợp sai chỗ (hàm tổng hợp không được đặt trong WHERE)","Sai (lỗi S6). Truy vấn con thiếu điều kiện lớp nên MAX là của cả trường (9,5), không có học sinh lớp 12A1 nào đạt điểm này. Chạy thật → chạy được nhưng cho 0 dòng, khác kết quả yêu cầu"],"cl":28},{"id":"sql-B6-05","topic":"csdl","level":2,"tags":["S6"],"db":"thuvien","why":"Muốn so sánh với một giá trị tổng hợp của cả bảng, hãy đặt giá trị đó vào truy vấn con trả về đúng MỘT giá trị.","src":"verified-sql","type":"mcq","stem":"Liệt kê mã các sách (mỗi sách một lần) từng được mượn với SoNgay lớn hơn số ngày mượn trung bình của tất cả các lượt mượn. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT DISTINCT MaSach FROM MuonSach\nWHERE SoNgay > (SELECT SoNgay FROM MuonSach);","SELECT DISTINCT MaSach FROM MuonSach\nWHERE SoNgay > (SELECT AVG(SoNgay) FROM MuonSach);","SELECT DISTINCT MaSach FROM MuonSach\nWHERE SoNgay > AVG(SoNgay);","SELECT DISTINCT MaSach FROM MuonSach\nWHERE SoNgay > (SELECT MAX(SoNgay) FROM MuonSach);"],"key":1,"optWhy":["Sai (lỗi S6). Truy vấn con trả về nhiều dòng nên không dùng được với toán tử >. Chạy thật → báo lỗi - truy vấn con trả về nhiều hơn một dòng nhưng được so sánh bằng toán tử =, >","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S6). Hàm tổng hợp không viết trực tiếp trong WHERE. Chạy thật → báo lỗi - dùng hàm tổng hợp sai chỗ (hàm tổng hợp không được đặt trong WHERE)","Sai (lỗi S6). Không thể lớn hơn giá trị lớn nhất; kết quả rỗng. Chạy thật → chạy được nhưng cho 0 dòng, khác kết quả yêu cầu"],"cl":29},{"id":"sql-B6-06","topic":"csdl","level":3,"tags":["S6"],"db":"mymusic_hsg","why":"Cùng một bài toán có hai cách: truy vấn con lồng nhau (IN) hoặc JOIN nhiều bảng kèm DISTINCT. IN dùng khi truy vấn con trả về nhiều giá trị.","src":"verified-sql","type":"open","stem":"Liệt kê tên các nhạc sĩ có ít nhất một bản nhạc được ca sĩ 'Quốc Hương' thể hiện (mỗi nhạc sĩ một lần).","answer":{"cols":["tenNhacsi"],"rows":[["Đỗ Nhuận"],["Văn Cao"],["Hoàng Việt"]],"more":0},"ref":"SELECT tenNhacsi\nFROM nhacsi\nWHERE idNhacsi IN (SELECT idNhacsi FROM bannhac\n                    WHERE idBannhac IN (SELECT idBannhac FROM banthuam\n                                        WHERE idCasi = (SELECT idCasi FROM casi\n                                                        WHERE tenCasi = 'Quốc Hương')));","alts":["SELECT DISTINCT n.tenNhacsi FROM nhacsi n INNER JOIN bannhac b ON n.idNhacsi = b.idNhacsi INNER JOIN banthuam t ON b.idBannhac = t.idBannhac INNER JOIN casi c ON t.idCasi = c.idCasi WHERE c.tenCasi = 'Quốc Hương';"],"ordered":false,"optWhy":[],"cl":14},{"id":"sql-B6-07","topic":"csdl","level":3,"tags":["S6"],"db":"quanly_diem","why":"Truy vấn con dùng với = hoặc > phải trả về đúng một giá trị.","src":"verified-sql","type":"tf","stem":"Xét các phát biểu về truy vấn con trên CSDL quanly_diem:","items":[{"t":"Truy vấn con (SELECT MAX(Diem) FROM KetQua WHERE ...) có thể đặt trong mệnh đề WHERE của truy vấn ngoài.","v":true,"why":"Đúng."},{"t":"Nếu truy vấn con tìm điểm cao nhất không có điều kiện về lớp thì giá trị MAX là của toàn trường.","v":true,"why":"Đúng: 9,50 (toàn trường) khác 9,00 (lớp 12A1)."},{"t":"Câu SELECT MaHS FROM KetQua WHERE Diem = (SELECT Diem FROM KetQua WHERE MaMon = 'TIN'); chạy được vì dùng dấu =.","v":false,"why":"Sai: truy vấn con trả về nhiều dòng nên báo lỗi; phải dùng IN hoặc một hàm tổng hợp."},{"t":"Câu SELECT MaHS FROM KetQua WHERE Diem = MAX(Diem); chạy được và cho học sinh có điểm cao nhất.","v":false,"why":"Sai: hàm tổng hợp không dùng được trực tiếp trong WHERE."}],"optWhy":[],"cl":100},{"id":"sql-B6-08","topic":"csdl","level":1,"tags":["S6"],"db":"quanly_diem","why":"MIN(NgaySinh) là ngày sinh sớm nhất, tức học sinh lớn tuổi nhất của lớp 12A1.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT TenHS\nFROM HocSinh\nWHERE Lop = '12A1'\n  AND NgaySinh = (SELECT MIN(NgaySinh) FROM HocSinh WHERE Lop = '12A1');","answer":{"cols":["TenHS"],"rows":[["Anh"]],"more":0},"ordered":false,"optWhy":[],"cl":5},{"id":"sql-B6-09","topic":"csdl","level":2,"tags":["S6"],"db":"thuexe","why":"Giống câu 6.04: truy vấn con phải có cùng phạm vi (cùng khách) với truy vấn ngoài.","src":"verified-sql","type":"mcq","stem":"Cho biết mã lượt thuê có SoGio lớn nhất trong các lượt thuê của chính khách 'K002'. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT MaLuot FROM LuotThue\nWHERE MaKT = 'K002'\n  AND SoGio = (SELECT MAX(SoGio) FROM LuotThue);","SELECT MaLuot FROM LuotThue\nWHERE MaKT = 'K002' AND SoGio = MAX(SoGio);","SELECT MaLuot FROM LuotThue\nWHERE MaKT = 'K002'\n  AND SoGio = (SELECT MAX(SoGio) FROM LuotThue WHERE MaKT = 'K002');","SELECT MaLuot, MAX(SoGio) FROM LuotThue\nWHERE MaKT = 'K002';"],"key":2,"optWhy":["Sai (lỗi S6). Truy vấn con thiếu MaKT nên MAX là của mọi khách (8 giờ), không lượt nào của K002 đạt. Chạy thật → chạy được nhưng cho 0 dòng, khác kết quả yêu cầu","Sai (lỗi S6). MAX không dùng trực tiếp trong WHERE. Chạy thật → báo lỗi - dùng hàm tổng hợp sai chỗ (hàm tổng hợp không được đặt trong WHERE)","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S6). Thêm cột MAX, và MaLuot không đảm bảo thuộc dòng có SoGio lớn nhất. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu; khi bật ONLY_FULL_GROUP_BY thì báo lỗi"],"cl":30},{"id":"sql-B6-10","topic":"csdl","level":3,"tags":["S6","S4"],"db":"thuexe","why":"Cách 1 dùng truy vấn con trong FROM (bảng tạm t) và đúng cả khi có nhiều khách đồng hạng; cách 2 dùng LIMIT 1 ngắn hơn nhưng chỉ lấy một khách khi có đồng hạng.","src":"verified-sql","type":"open","stem":"(Nâng cao) Cho biết mã khách có TỔNG số giờ thuê lớn nhất.","answer":{"cols":["MaKT"],"rows":[["K002"]],"more":0},"ref":"SELECT MaKT\nFROM LuotThue\nGROUP BY MaKT\nHAVING SUM(SoGio) = (SELECT MAX(t.Tong)\n                     FROM (SELECT SUM(SoGio) AS Tong\n                           FROM LuotThue\n                           GROUP BY MaKT) t);","alts":["SELECT MaKT FROM LuotThue GROUP BY MaKT ORDER BY SUM(SoGio) DESC LIMIT 1;"],"ordered":false,"optWhy":[],"cl":15},{"id":"sql-B7-01","topic":"csdl","level":1,"tags":["S5"],"db":"thuexe","why":"YEAR() và MONTH() tách năm, tháng từ giá trị kiểu DATE. BETWEEN 2 AND 4 gồm cả hai đầu mút.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT MaLuot, NgayThue\nFROM LuotThue\nWHERE YEAR(NgayThue) = 2026\n  AND MONTH(NgayThue) BETWEEN 2 AND 4\nORDER BY MaLuot;","answer":{"cols":["MaLuot","NgayThue"],"rows":[["2","2026-02-10"],["3","2026-02-12"],["4","2026-03-01"],["5","2026-03-03"],["6","2026-03-15"],["8","2026-04-02"]],"more":0},"ordered":true,"optWhy":[],"cl":5},{"id":"sql-B7-02","topic":"csdl","level":2,"tags":["S8"],"db":"thuexe","why":"Một trường chỉ gồm chữ số nhưng KHÔNG dùng để tính toán (số điện thoại, mã vạch, mã số) nên khai báo kiểu xâu ký tự. Kiểu số sẽ làm mất số 0 đứng đầu.","src":"verified-sql","type":"mcq","stem":"Trường SDT của bảng KhachThue lưu số điện thoại như '0905111222'. Phát biểu nào đúng về việc chọn kiểu dữ liệu cho trường này?","options":["SDT nên dùng kiểu DATE vì số điện thoại là một dãy số cố định.","SDT nên dùng kiểu INT vì số điện thoại chỉ gồm các chữ số.","SDT nên dùng kiểu BOOLEAN để tiết kiệm bộ nhớ khi lưu trữ.","SDT nên dùng kiểu CHAR(10) để giữ số 0 đầu và không cần tính toán."],"key":3,"optWhy":["Sai (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi).","Đúng (đã kiểm chứng bằng thực thi)."],"cl":31},{"id":"sql-B7-03","topic":"csdl","level":2,"tags":["S8"],"db":"quanly_diem","why":"Kiểu INT làm tròn mất phần thập phân (8,75 thành 9). Kiểu xâu sắp xếp theo thứ tự chữ cái nên '10.00' đứng trước '9.50'.","src":"verified-sql","type":"mcq","stem":"Trường Diem lưu điểm như 8,75 hoặc 10,00. Phát biểu nào đúng về việc chọn kiểu dữ liệu cho trường này?","options":["Diem nên dùng kiểu INT vì điểm luôn là một số tự nhiên.","Diem nên dùng kiểu DECIMAL(4,2) để giữ phần thập phân và tính trung bình.","Diem nên dùng kiểu DATE vì điểm gắn với thời điểm của kì thi.","Diem nên dùng kiểu CHAR(5) vì sắp xếp theo chuỗi luôn đúng thứ tự số."],"key":1,"optWhy":["Sai (đã kiểm chứng bằng thực thi).","Đúng (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi)."],"cl":32},{"id":"sql-B7-04","topic":"csdl","level":2,"tags":["S9"],"db":"thuvien","why":"Khoá chính phải xác định DUY NHẤT một bản ghi. Trong bảng có hai độc giả mượn cùng một sách nhiều lần (ví dụ D004 mượn S002 ba lần), nên cặp (MaDG, MaSach) không làm khoá chính được. Một ví dụ phản chứng là đủ để bác bỏ.","src":"verified-sql","type":"mcq","stem":"Trong bảng MuonSach (MaMuon, MaDG, MaSach, NgayMuon, SoNgay), phát biểu nào sau đây về KHOÁ CHÍNH là đúng?","options":["Cặp (MaDG, MaSach) làm khoá chính được vì mỗi độc giả chỉ mượn mỗi cuốn sách một lần.","SoNgay làm khoá chính vì đây là cột số.","MaDG làm khoá chính vì mỗi độc giả có một mã.","MaMuon làm khoá chính vì mỗi giá trị MaMuon xác định duy nhất một lượt mượn."],"key":3,"optWhy":["Sai (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi).","Đúng (đã kiểm chứng bằng thực thi)."],"cl":33},{"id":"sql-B7-05","topic":"csdl","level":2,"tags":["S9"],"db":"thuexe","why":"Khoá ngoại là trường (hoặc nhóm trường) tham chiếu tới khoá chính của bảng khác. Ở đây MaKT tham chiếu KhachThue và MaPT tham chiếu PhuongTien.","src":"verified-sql","type":"mcq","stem":"Bảng LuotThue(MaLuot, MaKT, MaPT, Tram, SoGio, NgayThue) tham chiếu tới KhachThue và PhuongTien. Phát biểu nào đúng về KHOÁ NGOÀI của LuotThue?","options":["MaKT và MaPT là các khoá ngoại.","Tram là khoá ngoại.","MaLuot là khoá ngoại.","SoGio và NgayThue là các khoá ngoại."],"key":0,"optWhy":["Đúng (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi).","Sai (đã kiểm chứng bằng thực thi)."],"cl":34},{"id":"sql-B7-06","topic":"csdl","level":2,"tags":["S9"],"db":"thuexe","why":"Hệ QTCSDL chỉ ngăn được những lỗi theo logic đã khai báo (khoá chính, khoá ngoại); những lỗi khác như gõ sai tên thì không (Bài 22 SGK).","src":"verified-sql","type":"tf","stem":"Xét các phát biểu về ràng buộc khoá trên CSDL thuexe (đã khai báo khoá chính và khoá ngoại):","items":[{"t":"Việc thêm một lượt thuê với MaKT = 'K999' (chưa có trong KhachThue) sẽ bị hệ QTCSDL từ chối.","v":true,"why":"Đúng, vi phạm khoá ngoại (như Hình 22.6 SGK)."},{"t":"Có thể xoá khách 'K001' khỏi KhachThue dù K001 còn các lượt thuê trong LuotThue.","v":false,"why":"Sai, bị chặn vì còn dòng tham chiếu."},{"t":"Có thể xoá khách 'K006' vì khách này chưa có lượt thuê nào.","v":true,"why":"Đúng, không còn dòng nào tham chiếu tới K006."},{"t":"Có thể thêm một lượt thuê thứ hai có MaLuot = 1.","v":false,"why":"Sai, trùng giá trị khoá chính."}],"optWhy":[],"cl":101},{"id":"sql-B7-07","topic":"csdl","level":2,"tags":["S5"],"db":"thuvien","why":"Ba điều kiện (hai thể loại và một mốc năm) phải được nhóm đúng: (A hoặc B) VÀ C.","src":"verified-sql","type":"mcq","stem":"Liệt kê mã các sách thuộc thể loại 'Tin học' HOẶC 'Văn học' và xuất bản từ năm 2020 trở đi. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT MaSach FROM Sach\nWHERE TheLoai = 'Tin học' OR TheLoai = 'Văn học' AND NamXB >= 2020;","SELECT MaSach FROM Sach\nWHERE (TheLoai = 'Tin học' OR TheLoai = 'Văn học') AND NamXB >= 2020;","SELECT MaSach FROM Sach\nWHERE (TheLoai = 'Tin học' AND TheLoai = 'Văn học') AND NamXB >= 2020;","SELECT MaSach FROM Sach\nWHERE TheLoai IN ('Tin học', 'Văn học') OR NamXB >= 2020;"],"key":1,"optWhy":["Sai (lỗi S5). Thiếu ngoặc: AND tính trước nên điều kiện năm chỉ áp dụng cho Văn học; mọi sách Tin học đều được lấy. Chạy thật → chạy được nhưng cho 3 dòng, khác kết quả yêu cầu","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S5). Một sách không thể thuộc hai thể loại cùng lúc; kết quả rỗng. Chạy thật → chạy được nhưng cho 0 dòng, khác kết quả yêu cầu","Sai (lỗi S5). Dùng OR với năm nên sách thuộc thể loại khác nhưng mới xuất bản cũng lọt vào. Chạy thật → chạy được nhưng cho 5 dòng, khác kết quả yêu cầu"],"cl":35},{"id":"sql-B7-08","topic":"csdl","level":2,"tags":["S5","S7"],"db":"thuvien","why":"Ba cách viết tương đương. Với cách có OR, bắt buộc phải đóng ngoặc quanh hai tháng.","src":"verified-sql","type":"open","stem":"Cho biết mã các độc giả đã mượn sách trong tháng 2 hoặc tháng 3 của năm 2026 (mỗi độc giả một lần).","answer":{"cols":["MaDG"],"rows":[["D001"],["D002"],["D003"]],"more":0},"ref":"SELECT DISTINCT MaDG\nFROM MuonSach\nWHERE YEAR(NgayMuon) = 2026 AND MONTH(NgayMuon) IN (2, 3);","alts":["SELECT DISTINCT MaDG FROM MuonSach WHERE YEAR(NgayMuon) = 2026 AND (MONTH(NgayMuon) = 2 OR MONTH(NgayMuon) = 3);","SELECT DISTINCT MaDG FROM MuonSach WHERE NgayMuon BETWEEN '2026-02-01' AND '2026-03-31';"],"ordered":false,"optWhy":[],"cl":16},{"id":"sql-B8-01","topic":"csdl","level":3,"tags":["S1","S4","S5"],"db":"thuexe","why":"Ba điều kiện lọc từng lượt thuê nối bằng AND ở WHERE; điều kiện 'từ 6 giờ trở lên' trên tổng của khách ở HAVING. Chú ý >= (từ ... trở lên) khác > (lớn hơn).","src":"verified-sql","type":"mcq","stem":"Liệt kê mã khách, tên khách và tổng số giờ thuê (TongGio) phương tiện loại 'Xe điện' tại trạm 'DN01' trong năm 2026, chỉ lấy khách có tổng từ 6 giờ trở lên. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT k.MaKT, k.TenKT, SUM(l.SoGio) AS TongGio\nFROM KhachThue k INNER JOIN LuotThue l ON k.MaKT = l.MaKT\n  INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nWHERE l.Tram = 'DN01' OR p.LoaiPT = 'Xe điện' OR YEAR(l.NgayThue) = 2026\nGROUP BY k.MaKT, k.TenKT\nHAVING SUM(l.SoGio) >= 6;","SELECT k.MaKT, k.TenKT, SUM(l.SoGio) AS TongGio\nFROM KhachThue k INNER JOIN LuotThue l ON k.MaKT = l.MaKT\n  INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nWHERE l.Tram = 'DN01' AND p.LoaiPT = 'Xe điện' AND YEAR(l.NgayThue) = 2026\nGROUP BY k.MaKT, k.TenKT\nHAVING SUM(l.SoGio) >= 6;","SELECT k.MaKT, k.TenKT, SUM(l.SoGio) AS TongGio\nFROM KhachThue k INNER JOIN LuotThue l ON k.MaKT = l.MaKT\n  INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nWHERE l.Tram = 'DN01' AND p.LoaiPT = 'Xe điện' AND YEAR(l.NgayThue) = 2026\nGROUP BY k.MaKT, k.TenKT\nHAVING SUM(l.SoGio) > 6;","SELECT k.MaKT, k.TenKT, SUM(l.SoGio) AS TongGio\nFROM KhachThue k INNER JOIN LuotThue l ON k.MaKT = l.MaKT\n  INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nWHERE l.Tram = 'DN01' AND p.LoaiPT = 'Xe điện' AND YEAR(l.NgayThue) = 2026\nGROUP BY k.MaKT, k.TenKT\nSUM(l.SoGio) >= 6;"],"key":1,"optWhy":["Sai (lỗi S5). Dùng OR thay cho AND nên lọt vào cả các lượt thuê không thoả đủ ba điều kiện. Chạy thật → chạy được nhưng cho 4 dòng, khác kết quả yêu cầu","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S4). Dùng > thay cho >= nên bỏ sót khách có tổng đúng bằng 6. Chạy thật → chạy được nhưng cho 1 dòng, khác kết quả yêu cầu","Sai (lỗi S1). Thiếu từ khoá HAVING trước điều kiện tổng hợp. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)"],"cl":36},{"id":"sql-B8-02","topic":"csdl","level":3,"tags":["S1","S2","S4"],"db":"quanly_diem","why":"'Có học sinh sinh trước 2008' tương đương MIN(NgaySinh) < '2008-01-01'. Dạng câu này gài bẫy thứ tự mệnh đề và bí danh.","src":"verified-sql","type":"mcq","stem":"Liệt kê các lớp có học sinh sinh trước năm 2008, sắp xếp theo điểm trung bình môn Tin (năm học '2024-2025') của lớp theo thứ tự TĂNG dần. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT h.Lop FROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE k.MaMon = 'TIN' AND k.NamHoc = '2024-2025'\nGROUP BY h.Lop\nHAVING MIN(h.NgaySinh) < '2008-01-01'\nORDER BY AVG(k.Diem) ASC;","SELECT h.Lop FROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE k.MaMon = 'TIN' AND k.NamHoc = '2024-2025'\nGROUP BY h.Lop\nORDER BY AVG(k.Diem) ASC\nHAVING MIN(h.NgaySinh) < '2008-01-01';","SELECT h.Lop FROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE k.MaMon = 'TIN' AND k.NamHoc = '2024-2025'\nGROUP BY h.Lop\nHAVING MIN(h.NgaySinh) < '2008-01-01'\nORDER BY AVG(k.Diem) AS DiemTBLop ASC;","SELECT h.Lop FROM HocSinh h INNER JOIN KetQua k ON h.MaHS = k.MaHS\nWHERE k.MaMon = 'TIN' AND k.NamHoc = '2024-2025'\nHAVING MIN(h.NgaySinh) < '2008-01-01'\nGROUP BY h.Lop\nORDER BY AVG(k.Diem) ASC;"],"key":0,"optWhy":["Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S1). ORDER BY đứng trước HAVING. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)","Sai (lỗi S2). Không viết AS trong ORDER BY. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)","Sai (lỗi S1). HAVING đứng trước GROUP BY. Chạy thật → báo lỗi - lỗi cú pháp (sai thứ tự mệnh đề hoặc sai cách viết)"],"cl":37},{"id":"sql-B8-03","topic":"csdl","level":3,"tags":["S7","S4"],"db":"thuvien","why":"'Độc giả KHÁC NHAU' là dấu hiệu của COUNT(DISTINCT ...). Sách S004 được mượn 2 lần nhưng chỉ bởi một độc giả nên COUNT(MaDG) cho kết quả sai.","src":"verified-sql","type":"mcq","stem":"Liệt kê mã các sách đã được từ 2 độc giả KHÁC NHAU trở lên mượn. Truy vấn nào đúng?","codeOpts":true,"options":["SELECT MaSach FROM MuonSach\nGROUP BY MaSach\nHAVING COUNT(MaDG) >= 2;","SELECT MaSach FROM MuonSach\nWHERE COUNT(DISTINCT MaDG) >= 2\nGROUP BY MaSach;","SELECT MaSach FROM MuonSach\nGROUP BY MaSach\nHAVING COUNT(DISTINCT MaDG) >= 2;","SELECT MaSach FROM MuonSach\nGROUP BY MaSach\nHAVING COUNT(DISTINCT MaSach) >= 2;"],"key":2,"optWhy":["Sai (lỗi S7). COUNT(MaDG) đếm số lượt mượn, kể cả cùng một độc giả mượn nhiều lần. Chạy thật → chạy được nhưng cho 5 dòng, khác kết quả yêu cầu","Sai (lỗi S4). Hàm tổng hợp đặt trong WHERE. Chạy thật → báo lỗi - dùng hàm tổng hợp sai chỗ (hàm tổng hợp không được đặt trong WHERE)","Đúng. ĐÚNG: chạy được, cho đúng kết quả yêu cầu","Sai (lỗi S7). Mỗi nhóm chỉ có một MaSach khác nhau nên đếm MaSach luôn ra 1. Chạy thật → chạy được nhưng cho 0 dòng, khác kết quả yêu cầu"],"cl":38},{"id":"sql-B8-04","topic":"csdl","level":3,"tags":["S10"],"db":"thuexe","why":"Một số hệ (theo tài liệu của MySQL từ bản 5.7.5) cho phép bỏ cột phụ thuộc hàm vào khoá chính khỏi GROUP BY; MariaDB thì không. Điểm này chưa được chạy thử trên MySQL ở đây, nên quy tắc an toàn là LUÔN đưa mọi cột không tổng hợp vào GROUP BY.","src":"verified-sql","type":"tf","stem":"Xét truy vấn: SELECT k.MaKT, k.TenKT, SUM(l.SoGio) FROM KhachThue k INNER JOIN LuotThue l ON k.MaKT = l.MaKT GROUP BY k.MaKT;  (MaKT là khoá chính của KhachThue). Phát biểu nào đúng?","items":[{"t":"Truy vấn chạy được trên MariaDB ở cấu hình mặc định (như trong SGK).","v":true,"why":"Đã kiểm chứng trên MariaDB 10.11."},{"t":"Truy vấn báo lỗi trên MariaDB khi bật chế độ ONLY_FULL_GROUP_BY.","v":true,"why":"Đã kiểm chứng trên MariaDB 10.11."},{"t":"Viết GROUP BY k.MaKT, k.TenKT thì truy vấn chạy được ở cả hai chế độ.","v":true,"why":"Đây là cách viết an toàn trên mọi hệ."},{"t":"Vì MaKT là khoá chính nên MỌI hệ QTCSDL đều chấp nhận truy vấn gốc.","v":false,"why":"Sai: chỉ cần MariaDB (bản SGK dùng) từ chối khi bật ONLY_FULL_GROUP_BY là đủ để phát biểu 'mọi hệ' không đúng."}],"optWhy":[],"cl":102},{"id":"sql-B8-05","topic":"csdl","level":3,"tags":["S9","S7","S3"],"db":"thuvien","why":"Dạng đúng/sai có 3-4 bảng, mỗi ý kiểm tra một kĩ năng độc lập. Hãy xét từng ý riêng, đừng để ý trước ảnh hưởng ý sau.","src":"verified-sql","type":"tf","stem":"Cho CSDL thuvien gồm DocGia(MaDG, TenDG, Lop, SDT), Sach(MaSach, TenSach, TheLoai, NamXB), MuonSach(MaMuon, MaDG, MaSach, NgayMuon, SoNgay). Xét các phát biểu:","items":[{"t":"Từ bảng MuonSach có thể biết mã sách mà độc giả 'D001' đã mượn, nhưng không biết tên sách nếu không liên kết thêm với bảng Sach.","v":true,"why":"Đúng: MuonSach chỉ chứa MaSach (khoá ngoại)."},{"t":"Trong bảng MuonSach, cặp (MaDG, MaSach) có thể dùng làm khoá chính vì mỗi độc giả chỉ mượn mỗi sách một lần.","v":false,"why":"Sai: D004 mượn S002 ba lần."},{"t":"Câu lệnh SELECT MAX(NgayMuon) FROM MuonSach WHERE MaDG = 'D001'; cho ngày mượn gần nhất của độc giả D001.","v":true,"why":"Đúng: MAX của ngày là ngày muộn nhất."},{"t":"Câu lệnh SELECT MaSach FROM MuonSach GROUP BY MaSach HAVING COUNT(MaDG) >= 2; liệt kê các sách được từ 2 độc giả khác nhau mượn.","v":false,"why":"Sai: COUNT(MaDG) đếm cả lần lặp; S004 được mượn 2 lần chỉ bởi D003."}],"optWhy":[],"cl":103},{"id":"sql-B8-06","topic":"csdl","level":3,"tags":["S7","S4","S1"],"db":"thuexe","why":"Kết hợp COUNT(DISTINCT), JOIN, GROUP BY, HAVING và ORDER BY. Cách alt dùng bí danh trong HAVING chạy được ở MariaDB/MySQL nhưng không phải chuẩn SQL nên không khuyến khích.","src":"verified-sql","type":"open","stem":"Cho biết các loại phương tiện đã được từ 3 khách KHÁC NHAU trở lên thuê. Hiển thị loại phương tiện và số khách (cột SoKhach), sắp xếp giảm dần theo SoKhach.","answer":{"cols":["LoaiPT","SoKhach"],"rows":[["Xe điện","4"]],"more":0},"ref":"SELECT p.LoaiPT, COUNT(DISTINCT l.MaKT) AS SoKhach\nFROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nGROUP BY p.LoaiPT\nHAVING COUNT(DISTINCT l.MaKT) >= 3\nORDER BY SoKhach DESC;","alts":["SELECT p.LoaiPT, COUNT(DISTINCT l.MaKT) AS SoKhach FROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT GROUP BY p.LoaiPT HAVING SoKhach >= 3 ORDER BY SoKhach DESC;"],"ordered":true,"optWhy":[],"cl":17},{"id":"sql-B8-07","topic":"csdl","level":2,"tags":["S8"],"db":"quanly_diem","why":"MaHS có giá trị 'HS001' chứa chữ cái nên là xâu ký tự. Với dạng câu 'phát biểu SAI', hãy gạch chân từ SAI và kiểm từng phương án.","src":"verified-sql","type":"mcq","stem":"Bảng KetQua(MaKQ, MaHS, MaMon, Diem, NamHoc) lưu các giá trị như (1, 'HS001', 'TIN', 9.00, '2024-2025'). Phát biểu nào về kiểu dữ liệu các trường là SAI?","options":["Trường MaHS có kiểu số nguyên.","Trường Diem có kiểu số thập phân.","Trường NamHoc có kiểu xâu ký tự.","Trường MaKQ có kiểu số nguyên."],"key":0,"optWhy":["Sai (đã kiểm chứng bằng thực thi).","Đúng (đã kiểm chứng bằng thực thi).","Đúng (đã kiểm chứng bằng thực thi).","Đúng (đã kiểm chứng bằng thực thi)."],"cl":39},{"id":"sql-B8-08","topic":"csdl","level":3,"tags":["S1","S2","S4","S7"],"db":"thuexe","why":"Quy trình chạy tay: (1) JOIN; (2) WHERE giữ lượt thuê năm 2026; (3) nhóm theo loại; (4) HAVING bỏ nhóm dưới 10 giờ; (5) đặt bí danh; (6) sắp xếp.","src":"verified-sql","type":"open","stem":"Không chạy máy, hãy dự đoán kết quả của truy vấn sau, rồi chạy kiểm tra.","code":"SELECT p.LoaiPT AS Loai, COUNT(*) AS SoLuot, SUM(l.SoGio) AS TongGio\nFROM LuotThue l INNER JOIN PhuongTien p ON l.MaPT = p.MaPT\nWHERE YEAR(l.NgayThue) = 2026\nGROUP BY p.LoaiPT\nHAVING SUM(l.SoGio) >= 10\nORDER BY TongGio DESC;","answer":{"cols":["Loai","SoLuot","TongGio"],"rows":[["Xe điện","8","23"],["Xe đạp","2","12"]],"more":0},"ordered":true,"optWhy":[],"cl":1},{"id":"sql-DA-01","topic":"csdl","level":2,"tags":["S1"],"db":"thuexe","why":"","src":"verified-sql","type":"mcq","stem":"Tổng giờ thuê của từng khách, chỉ lấy khách từ 5 giờ trở lên
